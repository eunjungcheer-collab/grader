  <h1>📚 교재 만들기</h1>

      <div id="saved-list" style="margin-top:8px;"></div>
    </details>

  <div class="card">
    <label>교재 PDF (문제편 + 정답편이 한 파일, 목차에 쪽수가 있는 교재)</label>
    <input type="file" id="book-file" accept="application/pdf">
    <label class="field-label-spaced">교재 이름 <span class="muted" style="font-weight:400;">(시험 이름·문제은행 배지·교재별 선택에 쓰여요. 예: 중2 내신대비교재 / 중1 핵심문제 교재)</span></label>
    <input type="text" id="book-name" placeholder="PDF 파일 이름이 자동으로 들어가요 — 원하면 고치세요">

    <button type="button" class="btn primary" id="read-btn" style="width:100%; margin-top:14px;" disabled>1단계 · 목차와 정답 읽기</button>

  <div id="step2" style="display:none;">
    <h2>2단계 · 확인하고 고치기</h2>
    <p class="hint">정답 칸: <b>숫자</b>는 객관식 정답, <b>-</b> 는 주관식(서술형 — 자동 채점 안 함), <b>?</b> 는 못 읽은 것이에요. 틀린 게 보이면 칸에서 바로 고치세요. 번호 순서대로 띄어쓰기로 구분돼 있어요.</p>

      <table class="bk-table" id="bk-table"></table>
    </div>
    <div class="card" style="margin-top:12px;">
      <label>QR 크기 / 위치</label>
      <div style="display:flex; gap:8px; align-items:center;">
        <select id="qr-size" style="width:auto;"><option value="40">작게 (40)</option><option value="46" selected>보통 (46)</option><option value="56">크게 (56)</option></select>
        <select id="qr-corner" style="width:auto;"><option value="top-right" selected>맨 위 오른쪽</option><option value="top-left">맨 위 왼쪽</option></select>
      </div>
      <label class="field-label-spaced"><input type="checkbox" id="to-bank" checked autocomplete="off"> 문제도 <b>문제은행에 「내신교재」 문제로 저장</b> (오답노트·유사오답이 일반 시험지처럼 돼요. 시간이 더 걸려요)</label>
      <label class="field-label-spaced"><input type="checkbox" id="stu-ver" checked> <b>학생용 합본</b>도 따로 만들기 — 끄면 <b>강사용 전체 합본</b> 한 파일만 만들어요</label>

      <select id="teacher-mode" style="width:100%;">
        <option value="expl" selected>정답 동그라미 + 문제 바로 아래 해설 (다른 시험지 강사용 해설서처럼 · 시간이 더 걸려요)</option>
        <option value="circle">교재 원본 쪽에 정답 동그라미만 (해설은 뒤쪽 정답·해설 쪽 그대로 · 빨라요)</option>
        <option value="none">동그라미·해설 없이 교재 원본 그대로 + QR (가장 빨라요)</option>
      </select>
      <label class="field-label-spaced"><input type="checkbox" id="new-cover"> <b>표지를 새로 만들기</b> — 체크하면 교재의 첫 쪽(표지)을 학년 색깔의 새 표지로 바꿔요. 체크 안 하면 교재 표지를 그대로 써요</label>
      <div class="field-label-spaced" id="cover-design-box" style="display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap">
        <div style="min-width:260px"><b>표지 도안·색</b> — 새 표지를 만들 때 쓰는 배경 무늬와 색이에요. '자동'은 학년·교재 종류에 맞춰 골라요.<br>
          <div style="margin-top:6px">도안 <select id="cover-design"><option value="auto">자동 (학년·종류에 맞춰)</option><option value="mol">분자 · 플라스크</option><option value="atom">원자</option><option value="dna">DNA</option><option value="hex">육각 격자</option><option value="tubes">시험관</option><option value="circuit">전기 회로</option><option value="planet">행성</option><option value="ripple">물결 · 별자리</option><option value="star">별자리</option></select></div>
          <div style="margin-top:6px">색 <select id="cover-color"><option value="">자동 (학년색)</option><option value="pink">분홍</option><option value="blue">파랑</option><option value="purple">보라</option><option value="teal">청록</option><option value="orange">주황</option><option value="green">초록</option><option value="navy">남색</option><option value="red">빨강</option></select></div>
          <div style="margin-top:10px"><b>목차 칸</b> <span class="muted">(표지 밖으로 넘치지 않는 범위에서만 커져요)</span><br>
            글자 크기 <input type="range" id="cv-cfs" min="60" max="150" value="100" style="width:140px"> <span id="cv-cfsv">100</span>% · 줄 간격 <input type="range" id="cv-crow" min="60" max="160" value="100" style="width:140px"> <span id="cv-crowv">100</span>%<br>
            열 <select id="cv-ccols"><option value="0">자동</option><option value="1">1열</option><option value="2">2열</option></select> · 칸 위치 <input type="range" id="cv-cdy" min="-60" max="60" value="0" style="width:120px"> <button type="button" class="btn" id="cv-creset" style="padding:3px 10px">기본값</button></div>
          <div style="margin-top:10px"><b>로고</b> <span class="muted">(표지 아래쪽)</span><br>
            로고 글자 <input type="text" id="cv-lmain" style="max-width:150px"> 오른쪽 칩 <input type="text" id="cv-lchip" style="max-width:110px" placeholder="비우면 학년 자동"><br>
            작은 글자 <input type="text" id="cv-lsub" style="max-width:260px"><br>
            <button type="button" class="btn" id="cv-lsave" style="padding:3px 10px">💾 이 로고 저장</button> <button type="button" class="btn" id="cv-lreset" style="padding:3px 10px">↩ 원래 로고로</button> <span class="muted" id="cv-lmsg"></span></div>
          <div style="margin-top:10px"><button type="button" id="cover-confirm" class="btn" style="padding:7px 14px">✔ 이 표지로 확정</button> <span id="cover-confirm-msg" class="muted" style="margin-left:6px">아직 확정 전이에요 (오른쪽 미리보기를 보고 눌러 주세요)</span></div>
        </div>
        <canvas id="cover-preview" width="260" height="368" style="border:1px solid #d6dbe6;border-radius:10px;box-shadow:0 2px 10px rgba(20,30,60,.12)"></canvas>
      </div>
      <label class="field-label-spaced"><input type="checkbox" id="new-toc"> <b>목차를 새로 만들기</b> — 체크하면 교재에 있던 목차 쪽을 지우고 새 목차(눌러서 이동)를 넣어요. 체크 안 하면 교재 목차를 그대로 써요(목차가 없는 교재는 자동으로 만들어요)</label>
      <label class="field-label-spaced"><input type="checkbox" id="multi-qr" checked> 목차 쪽에 「여러 단원 한꺼번에 채점」 QR도 찍기</label>
      <button type="button" class="btn primary" id="go-btn" style="width:100%; margin-top:14px;">3단계 · 등록하고 교재 만들기</button>
      <p class="hint" id="go-msg" style="margin:8px 0 0;"></p>
      <div id="dl-box" style="margin-top:10px;"></div>
      <p class="hint" id="sync-msg" style="margin:4px 0 0;"></p>
    </div>
  </div>
</template>

<script>
requireLogin();
renderHeader({ wide: true, wider: true });
setupPdfJs();
const $ = id => document.getElementById(id);
const isEssay = s => /서술|논술/.test(String(s.name || '') + ' ' + String(s.tag || ''));

let bookFile = null, bookDoc = null, bookFileName = '', sections = [], tocPage = 0, bookId = '';

$('book-file').addEventListener('change', () => {
  const f = $('book-file').files[0];
  $('read-btn').disabled = !f;
  if (f) { const nameEl = $('book-name'), stem = f.name.replace(/\.pdf$/i, '').trim(); if (!nameEl.value.trim() || nameEl.value === nameEl.dataset.auto) { nameEl.value = stem; nameEl.dataset.auto = stem; nameEl.dispatchEvent(new Event('input')); } }   // 교재 이름은 PDF 파일 이름으로 시작하고, 직접 고치면 그 이름을 쓴다
});

function hash36(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; return h.toString(36); }
const secTitle = s => ($('book-name').value.trim() ? $('book-name').value.trim() + ' ' : '') + s.name + (s.tag ? ' ' + s.tag + '공략' : '');

let genToc = false;
// 교재에 원래 찍혀 있는 쪽 번호(「- 12 -」 같은 가장자리의 숫자)의 위치를 쪽마다 찾는다 — 지우고 새 번호로 다시 쓰려고
async function detectPageNumBoxes(doc, onProgress) {
  const out = {};
  for (let p = 1; p <= doc.numPages; p++) {
    if (onProgress && p % 20 === 0) onProgress(p, doc.numPages);
    try {
      const pg = await doc.getPage(p), H = pg.getViewport({ scale: 1 }).height, tc = await pg.getTextContent();
      const its = tc.items.filter(it => String(it.str).trim()).map(it => ({ s: String(it.str).trim(), x: it.transform[4], y: it.transform[5], w: it.width, h: Math.max(it.height || 0, 7) }));
      const edge = it => it.y < H * 0.075 || it.y > H * 0.93;
      const boxes = [];
      its.forEach(it => {
        if (!edge(it) || !/^[-–—]?\s*\d{1,4}\s*[-–—]?$/.test(it.s)) return;
        let x0 = it.x, x1 = it.x + it.w, dash = /[-–—]/.test(it.s);
        its.forEach(o => { if (o !== it && /^[-–—]$/.test(o.s) && Math.abs(o.y - it.y) < 3 && Math.abs(o.x - it.x) < 28 && Math.abs(o.x + o.w - it.x) < 28) { x0 = Math.min(x0, o.x); x1 = Math.max(x1, o.x + o.w); dash = true; } });
        boxes.push({ x0: x0, x1: x1, y0: it.y - 1.5, y1: it.y + Math.max(it.h * 0.78, 6.5), dash: dash });
      });
      if (boxes.length) out[p - 1] = boxes.slice(0, 2);
    } catch (e) {}
  }
  return out;
}
// PDF 안에서 누르면 다른 쪽으로 가는 링크 (rect = [왼쪽, 아래, 오른쪽, 위], PDF 좌표)
function addPageLink(pdf, fromIdx, rect, toIdx) {
  if (toIdx == null || toIdx < 0 || toIdx >= pdf.getPageCount() || fromIdx < 0 || fromIdx >= pdf.getPageCount()) return;
  const target = pdf.getPage(toIdx), page = pdf.getPage(fromIdx);
  const annot = pdf.context.obj({ Type: 'Annot', Subtype: 'Link', Rect: rect, Border: [0, 0, 0], Dest: [target.ref, PDFLib.PDFName.of('Fit')] });
  page.node.addAnnot(pdf.context.register(annot));
}
// 목차가 없는 교재: 표지 바로 뒤(표지가 없으면 맨 앞)에 목차 쪽을 새로 만들어 끼운다 (단원 이름 · 문제 쪽 · 정답 쪽). 끼운 쪽 수를 돌려준다.
// at = 목차를 끼울 자리(0이면 맨 앞, 1이면 표지 뒤). 끼운 자리 뒤의 쪽 번호만 nIns만큼 밀린다.
// 학년별 색깔의 새 표지 (한 쪽, 그림으로 만들어 첫 쪽에 올린다)

// 표지 도안 미리보기와 최종 확정
let coverConfirmed = false;
function setCoverConfirmed(v) {
  coverConfirmed = v; const m = $('cover-confirm-msg'), b = $('cover-confirm');
  if (m) m.textContent = v ? '✅ 확정됐어요: ' + $('cover-design').selectedOptions[0].textContent + ' · ' + $('cover-color').selectedOptions[0].textContent : '아직 확정 전이에요 (오른쪽 미리보기를 보고 눌러 주세요)';
  if (b) b.textContent = v ? '✔ 확정됨 (바꾸면 다시 확정해야 해요)' : '✔ 이 표지로 확정';
}
function coverOpts() {
  const g = id => $(id) ? $(id).value : '';
  return { fs: (+g('cv-cfs') || 100) / 100, row: (+g('cv-crow') || 100) / 100, cols: +g('cv-ccols') || 0, dy: +g('cv-cdy') || 0, logo: { main: g('cv-lmain'), sub: g('cv-lsub'), chip: g('cv-lchip') } };
}
function drawCoverPreview() {
  try {
    const cvp = $('cover-preview'); if (!cvp) return;
    const nm = ($('book-name').value || '').trim() || (typeof bookFileName === 'string' ? bookFileName : '') || '중1 과학';
    const realSecs = (typeof sections !== 'undefined' && sections.length) ? sections.slice().sort((a, b) => a.order - b.order) : null;
    const big = coverCanvas(nm, realSecs || [{ name: '단원', unit: 'IV', unitName: '단원 이름', order: 0 }, { name: '단원', unit: 'V', unitName: '단원 이름', order: 1 }], 595, 842, $('cover-design').value, $('cover-color').value, coverOpts());
    const c = cvp.getContext('2d'); c.clearRect(0, 0, cvp.width, cvp.height); c.drawImage(big, 0, 0, cvp.width, cvp.height);
  } catch (e) {}
}
document.addEventListener('DOMContentLoaded', () => {
  const LOGO0 = { main: '이은정 과학', sub: 'MIDDLE SCHOOL SCIENCE · EXAM PREP', chip: '' };
  const setLogo = l => { $('cv-lmain').value = l.main; $('cv-lsub').value = l.sub; $('cv-lchip').value = l.chip || ''; };
  setLogo(Object.assign({}, LOGO0, savedCoverLogo() || {}));
  $('cv-lsave').addEventListener('click', () => { try { localStorage.setItem('cover_logo', JSON.stringify({ main: $('cv-lmain').value, sub: $('cv-lsub').value, chip: $('cv-lchip').value })); $('cv-lmsg').textContent = '✅ 저장했어요 (다음 표지에도 쓰여요)'; } catch (e) { $('cv-lmsg').textContent = '저장하지 못했어요'; } });
  $('cv-lreset').addEventListener('click', () => { try { localStorage.removeItem('cover_logo'); } catch (e) {} setLogo(LOGO0); drawCoverPreview(); setCoverConfirmed(false); $('cv-lmsg').textContent = '↩ 원래 로고로 되돌렸어요'; });
  $('cv-creset').addEventListener('click', () => { $('cv-cfs').value = 100; $('cv-crow').value = 100; $('cv-cdy').value = 0; $('cv-ccols').value = '0'; $('cv-cfsv').textContent = 100; $('cv-crowv').textContent = 100; drawCoverPreview(); setCoverConfirmed(false); });
  ['cv-cfs', 'cv-crow'].forEach(id => $(id).addEventListener('input', () => { $(id + 'v').textContent = $(id).value; }));
  ['cover-design', 'cover-color', 'book-name', 'cv-cfs', 'cv-crow', 'cv-cdy', 'cv-ccols', 'cv-lmain', 'cv-lsub', 'cv-lchip'].forEach(id => { const e = $(id); if (!e) return; const f = () => { drawCoverPreview(); setCoverConfirmed(false); }; e.addEventListener('input', f); e.addEventListener('change', f); });
  const nc = $('new-cover'); if (nc) nc.addEventListener('change', drawCoverPreview);
  const cb = $('cover-confirm'); if (cb) cb.addEventListener('click', () => { drawCoverPreview(); setCoverConfirmed(true); });
  drawCoverPreview();
});

function gradeMain(bookName) {
  if ($('new-cover') && $('new-cover').checked && $('cover-color') && COVER_COLORS[$('cover-color').value]) return COVER_COLORS[$('cover-color').value][0];
  return /중\s*1/.test(bookName) ? '#E4566D' : /중\s*2/.test(bookName) ? '#2F7BC0' : /중\s*3/.test(bookName) ? '#7A55C2' : /고\s*1|공통|통합/.test(bookName) ? '#139186' : '#0B1F5C';
}
async function insertGeneratedToc(pdf, secs, bookName, pos, withAns, at, posEnd) {
  posEnd = posEnd || ((sec, which) => pos(sec[which]));
  at = at || 0;
  const ref = pdf.getPage(0).getSize(), W = ref.width, H = ref.height;
  const main = gradeMain(bookName);
  // 단원별로 묶는다 (교재 목차와 같은 모양: 단원 띠 + 소단원 줄)
  const groups = []; let lastU = null; const uinfo = unitInfoFor(secs);
  secs.slice().sort((a, b) => a.order - b.order).forEach(sec => {
    const ui = uinfo(sec), ukey = ui.no + '|' + ui.name;

// 교재 전체에서 번호를 이어서 매긴 경우(예: 이 단원이 289번부터) 문항 번호에서 시작 번호를 빼서 1번부터로 맞춘다
let bookRows = [];
function unbase(scan, s) { const b = s.base || 0; if (!b || !scan || !scan.questions) return; scan.questions.forEach(q => { if (q.origNum === undefined) q.origNum = q.num; q.num -= b; }); }
// 정답 쪽을 읽은 줄들(rows)을 「번호가 다시 1번 근처로 돌아가는 곳」마다 끊어 덩어리로 만들고, 덩어리 수가 단원 수와 맞으면 순서대로 단원에 붙인다.
// 목차에 적힌 정답 쪽 번호가 한 쪽 어긋나 있어도 번호의 흐름으로 단원을 찾는다. 맞지 않으면 null(목차 쪽 번호대로).
function assignAnswerBlocks(rows, secs) {
  if (!rows.length || !secs.length) return null;
  const sorted = rows.map((r, i) => ({ r: r, i: i })).sort((a, b) => a.r.p - b.r.p || a.i - b.i).map(x => x.r);
  const blocks = []; let cur = null, prev = 0;
  sorted.forEach(r => {
    if (!cur || (r.n <= 3 && prev > r.n + 4) || r.n < prev - 8) { cur = []; blocks.push(cur); }
    cur.push(r); prev = r.n;
  });
  if (blocks.length < secs.length) return null;
  const off = blocks.length - secs.length, out = [];
  for (let i = 0; i < secs.length; i++) {
    const b = blocks[off + i], pmin = Math.min.apply(null, b.map(r => r.p)), pmax = Math.max.apply(null, b.map(r => r.p));
    if (pmax < secs[i].aa - 5 || pmin > secs[i].ab + 5) return null;       // 목차의 쪽 번호와 너무 멀면 믿지 않는다
    out.push(b);
  }
  return out;
}

  let lastUnit = 0;

    if (s.unit !== lastUnit) { lastUnit = s.unit; html += '<tr class="bk-unit"><td colspan="7">' + s.unit + '단원 ' + escapeHtml(s.unitName) + '</td></tr>'; }
    html += '<tr data-i="' + i + '"><td><input type="checkbox" class="bk-on" ' + (s.on || isEssay(s) ? 'checked' : '') + (isEssay(s) ? ' disabled title="서술형은 항상 포함돼요(강사용에 해설만 붙음)"' : '') + '></td>' +
      '<td>' + escapeHtml(secTitle(s)) + '</td><td>' + s.qa + '~' + s.qb + '</td><td>' + s.aa + '~' + s.ab + '</td><td class="bk-n">' + s.answers.length + '</td>' +
      '<td><div class="bk-grid">' + s.answers.map((a, k) => '<label class="bk-c"><span>' + (k + 1) + '</span><input type="text" data-k="' + k + '" value="' + escapeHtml(a) + '" maxlength="5"></label>').join('') + '</div></td><td class="bk-st"></td></tr>';
  });
  $('bk-table').innerHTML = html;
  $('bk-table').querySelectorAll('tr[data-i]').forEach(tr => {
    const s = sections[+tr.dataset.i];
    tr.querySelector('.bk-on').addEventListener('change', e => { s.on = e.target.checked; });

      if ($('new-cover').checked) {      // 교재에 표지가 없으면(첫 쪽이 바로 문제) 맨 앞에 표지 쪽을 하나 끼워 둔다 (아래에서 새 표지로 채운다)
        const fq = Math.min.apply(null, chosen.map(s => s.qa - 1)), at0 = kept.indexOf(fq);
        if (at0 === 0) { const sz = doc.getPage(0).getSize(); doc.insertPage(0, [sz.width, sz.height]); kept.unshift(-1); }
      }
      if (withAns) {
        // 문제 쪽을 새로 짠 강사용 해설서 쪽으로 바꿔 끼운다 (kept: 원래 쪽 번호, 새 쪽은 1e6+원래 첫 쪽 / -1)
        const reps = chosen.filter(s => teacherSec[s.order]).sort((a, b) => b.qa - a.qa);
        for (const s of reps) {
          const t = teacherSec[s.order].doc, n = t.getPageCount(), at = kept.indexOf(s.qa - 1);
          if (at < 0) continue;
          const cnt = s.qb - s.qa + 1, copied = await doc.copyPages(t, t.getPageIndices());
          copied.forEach((pg, k) => doc.insertPage(at + k, pg));
          for (let k = 0; k < cnt; k++) doc.removePage(at + n);
          kept.splice(at, cnt, ...copied.map((_, k) => k === 0 ? 1e6 + s.qa - 1 : -1));
          if (ids[s.order]) await stampQrOnPage(doc, at, studentLinkFor(ids[s.order]), { size: size, corner: corner, margin: 8, caption: 'QR코드로 답안 입력하세요' });
        }
      }
      const white = PDFLib.rgb(1, 1, 1);
      const coverOrig = Math.min.apply(null, chosen.map(s => s.qa)) > 1;     // 교재의 첫 쪽이 문제가 아니면 표지다: 표지는 그대로 둔다(쪽 번호로 착각해 'SCIENCE 1'의 1을 지우면 안 된다)
      kept.forEach((orig, j) => { if (coverOrig && orig === 0) return; const pgj = doc.getPage(j); (numBoxes[orig] || []).forEach(bx => pgj.drawRectangle({ x: bx.x0 - 2, y: bx.y0, width: bx.x1 - bx.x0 + 4, height: bx.y1 - bx.y0, color: white, borderWidth: 0 })); });
      if (withAns) kept.forEach((orig, j) => { const pgj = doc.getPage(j), H = pgj.getHeight(); (circles[orig] || []).forEach(c => pgj.drawEllipse({ x: c.x, y: H - c.y, xScale: c.rx, yScale: c.ry, borderColor: PDFLib.rgb(0.76, 0.22, 0.17), borderWidth: 1.5 })); });
      const posOf = p => { let i = kept.indexOf(p - 1); if (i < 0) i = kept.indexOf(1e6 + p - 1); return i + 1; };
      let nIns = 0;
      // 표지가 있으면(첫 단원이 1쪽부터 시작하지 않으면) 목차는 표지 바로 뒤에, 없으면 맨 앞에
      const firstQ = Math.min.apply(null, chosen.map(s => posOf(s.qa)).filter(n => n > 0));
      const tocAt = (isFinite(firstQ) && firstQ > 1) ? 1 : 0;
      if (useGen) {
        const posEnd = (sec, which) => {      // 구간 끝 쪽: 강사용 해설서로 바꿔 끼운 구간은 시작 쪽 + (바꿔 끼운 쪽 수 - 1)
          const p = sec[which]; let i = kept.indexOf(p - 1); if (i >= 0) return i + 1;
          const st = sec.qa, i0 = kept.indexOf(1e6 + st - 1); if (i0 < 0) return 0;
          let e = i0; while (kept[e + 1] === -1) e++; return e + 1;
        };
        nIns = await insertGeneratedToc(doc, sections, bookNm, posOf, true, tocAt, posEnd);
      }
      if (!useGen) {
        // 교재에 원래 있던 목차: 각 줄(단원·문제 쪽)을 누르면 문제 첫 쪽, 정답 쪽 숫자를 누르면 정답 첫 쪽으로
        sections.forEach(s => {
          const L = s.tocLink; if (!L) return;
          const from = kept.indexOf(L.page - 1); if (from < 0) return;
          const q = posOf(s.qa) - 1, a = posOf(s.aa) - 1;
          if (L.ansX && a >= 0) { addPageLink(doc, from, [L.x0, L.y0, L.ansX, L.y1], q); addPageLink(doc, from, [L.ansX, L.y0, L.x1, L.y1], a); }
          else addPageLink(doc, from, [L.x0, L.y0, L.x1, L.y1], q);
        });
      }
      if ($('multi-qr').checked && (tocPage || useGen)) {
        const base = location.origin + location.pathname.replace(/[^/]*$/, '');
        const ti = useGen ? tocAt : kept.indexOf(tocPage - 1);
        if (ti >= 0) await stampQrOnPage(doc, ti, base + 'student_multi.html?book=' + bookId, { size: 56, corner: 'top-right', margin: 8, caption: '여러 단원 한꺼번에 채점 → QR' });
      }
      let coverDone = false;
      if ($('new-cover').checked && isFinite(firstQ) && firstQ > 1) {        // 첫 쪽(표지)을 새 표지로 바꾼다 (쪽 수는 그대로)
        try {
          const ref = doc.getPage(0).getSize(), cvs = coverCanvas(bookNm, sections.slice().sort((a, b) => a.order - b.order), ref.width, ref.height, $('cover-design').value, $('cover-color').value, coverOpts());
          const png = await doc.embedPng(cvs.toDataURL('image/png')), np = doc.insertPage(0, [ref.width, ref.height]);
          np.drawImage(png, { x: 0, y: 0, width: ref.width, height: ref.height }); doc.removePage(1); coverDone = true; window._lastCoverPng = cvs.toDataURL('image/png');
        } catch (e) { console.warn('cover', e); }
      }
      // 표지에 '강사용' / '학생용' 표시를 찍는다 (기존 표지든 새 표지든)
      {   // 표지가 없는 교재도 첫 쪽에 찍는다
        try {
          const lab = withAns ? '강사용' : '학생용', col = withAns ? '#c8102e' : '#1f4e9c';
          const cv = document.createElement('canvas'); cv.width = 440; cv.height = 150;
          const cx2 = cv.getContext('2d');
          cx2.fillStyle = '#ffffff'; cx2.strokeStyle = col; cx2.lineWidth = 10;
          const rr = (x, y, w, h, r) => { cx2.beginPath(); cx2.moveTo(x + r, y); cx2.arcTo(x + w, y, x + w, y + h, r); cx2.arcTo(x + w, y + h, x, y + h, r); cx2.arcTo(x, y + h, x, y, r); cx2.arcTo(x, y, x + w, y, r); cx2.closePath(); };
          rr(8, 8, 424, 134, 36); cx2.fill(); cx2.stroke();
          cx2.fillStyle = col; cx2.font = 'bold 84px "Noto Sans CJK KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif'; cx2.textAlign = 'center'; cx2.textBaseline = 'middle';
          cx2.fillText(lab, 220, 80);
          const pg0 = doc.getPage(0), sz = pg0.getSize(), w = Math.min(150, sz.width * 0.28), h = w * 150 / 440;
          const bimg = await doc.embedPng(cv.toDataURL('image/png'));
          // 학생용/강사용 표시: 모든 교재에서 표지 제목(「중1」「중2 과학」…) 바로 오른쪽, 제목 글자 높이에 맞춰 단다. 제목 자리를 못 찾으면 왼쪽 위 모서리에 작게
          let spot = null;
          try {
            if (coverDone && window._coverTitle) { const T = window._coverTitle; spot = { x: T.right + 16, cy: sz.height - T.baseline + T.size * 0.33 }; }
            else if (!coverDone) {
              const tp = await bookDoc.getPage(1), tc = await tp.getTextContent();
              const its = tc.items.filter(it => (it.str || '').trim() && (it.height || 0) >= 30), hmax = Math.max.apply(null, its.map(it => it.height).concat([0]));      // 표지에서 가장 큰 글자 줄 = 제목(「중1」「중2 과학」)
              const row = its.filter(it => it.height >= hmax * 0.9);
              const cand = row.length ? { transform: [0, 0, 0, 0, Math.max.apply(null, row.map(it => it.transform[4] + it.width)) - 0, row[0].transform[5]], width: 0, height: row[0].height } : null;
              if (cand) spot = { x: cand.transform[4] + cand.width + 16, cy: cand.transform[5] + cand.height * 0.33 };
              else { const ps = await BankCore.coverTitleSpotByPixels(bookDoc); if (ps) spot = { x: ps.right + 16, cy: ps.cy }; }      // 제목이 그림인 표지: 화면 그림에서 제목 위치를 찾는다
            }
          } catch (e) { spot = null; }
          if (spot && spot.x + w <= sz.width - 12) { pg0.drawImage(bimg, { x: spot.x, y: spot.cy - h / 2, width: w, height: h }); window._lastSpot = { x: spot.x, top: sz.height - (spot.cy + h / 2), wd: w, pw: sz.width, ph: sz.height, auto: { x: spot.x, cy: sz.height - spot.cy } }; }
          else { const w2 = Math.min(104, sz.width * 0.19), h2 = w2 * 150 / 440; pg0.drawImage(bimg, { x: 20, y: sz.height - 12 - h2, width: w2, height: h2 }); window._lastSpot = { x: 20, top: 12, wd: w2, pw: sz.width, ph: sz.height, auto: null }; }
        } catch (e) { console.warn('cover label', e); }
      }
      const font = await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);
      doc.getPages().forEach((pgj, j) => {
        if (coverDone && j === 0) return;
        const orig = j < tocAt ? kept[j] : (j - nIns >= tocAt ? kept[j - nIns] : -1), bx = (numBoxes[orig] || [])[0];
        if (coverOrig && orig === 0) return;      // 기존 표지에는 쪽 번호를 쓰지 않는다
        const t = (bx && bx.dash ? '- ' + (j + 1) + ' -' : String(j + 1)), fs = 9.5, tw = font.widthOfTextAtSize(t, fs);
        const cx = bx ? (bx.x0 + bx.x1) / 2 : pgj.getWidth() / 2, y = bx ? bx.y0 + 1 : 16;
        pgj.drawText(t, { x: cx - tw / 2, y: y, size: fs, font: font, color: PDFLib.rgb(0.1, 0.1, 0.1) });
      });
      return await doc.save();
    };
    const dl = (bytes, name) => { const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' })); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000); };
    const wantStu = $('stu-ver').checked;
    msg('강사용 전체 합본을 만드는 중...');
    let teacherBytes = await makeVersion(true);
    const teacherBlob = new Blob([teacherBytes], { type: 'application/pdf' }); teacherBytes = null;
    let stuBytes = null;
    if (wantStu) { msg('학생용 합본을 만드는 중...'); stuBytes = await makeVersion(false); }
    const saveKey = 'm' + Date.now();
    // 나중에 표지만 고칠 수 있게, 배지를 찍기 전의 깨끗한 표지 그림과 배지 위치·단원 정보를 같이 저장해 둔다
    let cover = null;
    try {
      const sp = window._lastSpot; let png = window._lastCoverPng || null;
      if (!png && bookDoc) { const pg = await bookDoc.getPage(1), vp = pg.getViewport({ scale: 3 }), c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height); const cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height); await pg.render({ canvasContext: cx, viewport: vp }).promise; png = c.toDataURL('image/png'); }
      if (png && sp) cover = { opts: coverOpts(), png: png, pw: sp.pw, ph: sp.ph, spot: { x: sp.x, top: sp.top, wd: sp.wd }, auto: sp.auto, bookName: bookName, secs: sections.slice().sort((a, b) => a.order - b.order).map(x => ({ name: x.name, tag: x.tag, unit: x.unit, unitName: x.unitName, order: x.order, qa: x.qa, qb: x.qb, aa: x.aa, ab: x.ab })) };
    } catch (e) { console.warn('cover save', e); }
    const rec = { id: saveKey, name: stem, date: new Date().toISOString(), teacher: teacherBlob, student: stuBytes ? new Blob([stuBytes], { type: 'application/pdf' }) : null, cover: cover };
    let savedOk = true; try { await mergeDbPut(rec); } catch (e) { savedOk = false; }
    showDownloads(rec);
    renderSaved();
    syncToServer(rec);
    const base2 = location.origin + location.pathname.replace(/[^/]*$/, '');
    pdone = true; pfill.style.width = '100%';
    $('go-msg').innerHTML = '✅ 완료! 새로 등록 ' + made + '개' + (bankQ ? ' · 문제은행에 내신교재 문제 ' + bankQ + '개 저장' : '') + (refilled ? ' · 빠졌던 문제 ' + refilled + '개 다시 채움' : '') + (reused ? ' · 이미 있던 시험 ' + reused + '개' : '') + '. ' + (savedOk ? '합본 PDF는 아래 버튼으로 내려받아요(이 기기에 저장돼 나중에도 받을 수 있어요).' : '합본 PDF는 아래 버튼으로 내려받아요. (이 기기에는 저장하지 못했어요)') + '<br>여러 단원 한꺼번에 채점 주소: <a href="student_multi.html?book=' + bookId + '" target="_blank">' + base2 + 'student_multi.html?book=' + bookId + '</a><br>등록된 시험은 <a href="teacher_list.html" target="_blank">시험지 목록</a>에서 볼 수 있어요.' + (teacherSkip.length ? '<br><b style="color:#C1392B;">강사용에 정답·해설을 못 붙인 단원(문항 번호와 정답이 안 맞음): ' + teacherSkip.map(escapeHtml).join(' / ') + '</b>' : '') + (linkWarn ? '<br><b style="color:#C1392B;">이미 있던 시험을 이 교재 QR에 연결하지 못했어요(' + escapeHtml(linkWarn) + '). Apps Script를 새 버전으로 다시 배포했는지 확인해 주세요.</b>' : '') + (bankWarn.length ? '<br><b style="color:#C1392B;">문제은행에는 못 넣은 단원(문항 수가 정답과 안 맞음): ' + bankWarn.map(escapeHtml).join(' / ') + '</b> — 시험(QR 채점)은 정상 등록됐어요.' : '');
  } catch (e) {
    err.innerHTML = '<div class="banner error">' + escapeHtml(e.message) + '</div>';
    pdone = true; pbar.style.display = 'none'; $('go-msg').textContent = '';
  }
  clearInterval(ptick); pdone = true;
  $('go-btn').disabled = false;
});
(function () { const f = () => { const c = document.getElementById('to-bank'); if (c) c.checked = true; }; f(); window.addEventListener('pageshow', f); })();
</script>
