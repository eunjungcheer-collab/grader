<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0B1F5C">
<title>시험 예약·알림 - 자동 채점 시스템</title>
<link rel="stylesheet" href="css/style.css?v=202611132121">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<style>#as-exam,#as-names,#st-email{display:block; width:100%; max-width:100%; box-sizing:border-box; margin-top:4px;} #as-names{resize:vertical;}</style>
<template id="page-content">
  <span class="backlink"><a href="index.html">← 홈으로</a></span>
  <h1>⏰ 시험 예약·알림</h1>
  <p class="muted">학생에게 시험을 <b>언제까지</b> 내라고 예약해 두면, 학생이 제출할 때와 기한이 지났는데 안 냈을 때 알려 드려요.</p>

  <div class="card" id="al-box"><b>🔔 알림</b><div id="al-body" class="hint" style="margin-top:8px;">불러오는 중...</div></div>

  <div class="card" id="assign">
    <b>➕ 시험 예약하기</b>
    <label style="display:block; margin-top:8px;">시험지 <select id="as-exam"><option value="">불러오는 중...</option></select></label>
    <div style="margin-top:10px;"><b style="font-size:14px;">학생 선택</b> <span class="hint" style="margin:0;">(반 이름을 누르면 반 전체, 학생 이름을 누르면 한 명씩 골라져요)</span>
      <div id="as-rosters" style="display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;"><span class="hint">불러오는 중...</span></div>
      <details id="ro-wrap" style="margin-top:8px;"><summary style="cursor:pointer; font-size:13px; color:#1F3A6B;">👥 반 명단 만들기·고치기 (알림장 학생은 자동으로 들어와요)</summary>
        <div id="ro-edit" style="margin-top:8px;"></div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;"><button type="button" class="btn outline" id="ro-add" style="padding:6px 12px;">+ 반 추가</button><button type="button" class="btn primary" id="ro-save" style="padding:6px 14px;">명단 저장</button></div>
        <div id="ro-msg" class="hint" style="margin-top:4px;"></div>
      </details></div>
    <label style="display:block; margin-top:8px;">추가로 예약할 학생 이름 <span class="hint" style="margin:0;">(눌러서 고르는 대신 직접 적어도 돼요. 여러 명이면 줄을 바꾸거나 쉼표로 나눠 적으세요)</span>
      <textarea id="as-names" rows="3" placeholder="윤태현&#10;김철수"></textarea></label>
    <div class="hint" style="margin:4px 0 0;">학생이 시험 화면에서 적는 이름과 <b>똑같이</b> 적어야 제출로 인식돼요. (띄어쓰기는 달라도 돼요)</div>
    <div style="margin-top:8px;"><b style="font-size:14px;">제출 기한</b>
      <div style="display:flex; gap:8px; margin-top:4px;"><input type="date" id="as-date" style="flex:1 1 50%; min-width:0; box-sizing:border-box;"><input type="text" id="as-time" placeholder="🕒 시간 고르기" style="flex:1 1 50%; min-width:0; box-sizing:border-box;"></div></div>
    <div id="as-dl-txt" class="hint" style="margin:2px 0 0;"></div>
    <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;" id="as-quick"></div>
    <button type="button" class="btn primary" id="as-go" style="width:100%; margin-top:10px;">예약하기</button>
    <div id="as-msg" class="hint" style="margin-top:6px;"></div>
  </div>

  <div class="card"><b>📋 학생에게 등록한 시험 목록</b> <span class="hint" style="margin:0;">(학생 앱에도 똑같이 보여요)</span><input type="text" id="as-q" placeholder="학생 이름·시험 이름으로 찾기" style="margin-top:8px;"><div id="as-list" style="margin-top:8px;"></div></div>

  <div class="card">
    <b>⚙️ 알림 설정</b>
    <label style="display:block; margin-top:8px;">알림 받을 이메일 <input type="email" id="st-email" placeholder="example@naver.com"></label>
    <label style="display:block; font-weight:400; margin-top:6px;"><input type="checkbox" id="st-sub"> 학생이 제출할 때마다 메일 받기</label>
    <label style="display:block; font-weight:400; margin-top:4px;"><input type="checkbox" id="st-miss"> 기한이 지났는데 안 낸 학생이 있으면 메일 받기</label>
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;"><button type="button" class="btn primary" id="st-save">저장</button><button type="button" class="btn outline" id="st-test">테스트 메일 보내기</button><button type="button" class="btn outline" id="st-resend">미제출 메일 다시 보내기</button></div>
    <div id="st-miss-res" class="hint" style="margin-top:6px;"></div>
    <div id="st-msg" class="hint" style="margin-top:6px;"></div>
    <div id="st-trig" class="hint" style="margin-top:10px;"></div>
    <div id="st-bk" class="hint" style="margin-top:6px;"></div>
    <div style="margin-top:14px; border-top:1px solid var(--line); padding-top:10px;"><b>💬 카톡 안내 문구</b>
      <div class="hint" style="margin:4px 0;">미제출 학생 옆 「카톡 문구 복사」를 누르면 이 문구가 복사돼요. <b>{이름}</b> <b>{시험}</b> <b>{기한}</b>은 학생마다 자동으로 바뀌어요.</div>
      <textarea id="kt-tpl" rows="4" style="display:block; width:100%; box-sizing:border-box;"></textarea>
      <div style="display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;"><button type="button" class="btn primary" id="kt-save" style="padding:6px 14px;">문구 저장</button><button type="button" class="btn outline" id="kt-reset" style="padding:6px 14px;">기본 문구로</button></div>
      <div id="kt-msg" class="hint" style="margin-top:4px;"></div></div>
    <div class="hint" style="margin-top:6px;">※ 구글 계정은 하루에 보낼 수 있는 메일 수가 정해져 있어요(보통 100통). 학생이 아주 많이 제출하는 날은 일부 메일이 안 갈 수 있어요. 앱 안 알림은 그대로 보여요.</div>
  </div>
</template>
<script src="js/config.js?v=202611132121"></script>
<script src="js/api.js?v=202611132121"></script>
<script src="js/common.js?v=202611132121"></script>
<script src="js/clockpicker.js?v=202611132121"></script>
<script>
requireLogin();
renderHeader({});
const $ = id => document.getElementById(id);
const pw = () => getTeacherPassword();
const e = escapeHtml;
const SEEN = 'alertSeen';
const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
function fmt(iso) { const d = new Date(iso); if (isNaN(d)) return String(iso); const p = n => String(n).padStart(2, '0'); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + DAYS[d.getDay()] + ') ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
const KT_KEY = 'kakaoTpl', KT_DEF = '{이름} 학생, 「{시험}」 제출 기한({기한})이 지났어요. 아직 제출하지 못했다면 시험지의 QR로 지금 제출하고, 카카오톡으로 알려 주세요.';
function ktTpl() { try { return localStorage.getItem(KT_KEY) || KT_DEF; } catch (x) { return KT_DEF; } }
function kakaoText(name, title, deadline) { return ktTpl().split('{이름}').join(name).split('{시험}').join(title).split('{기한}').join(fmt(deadline)); }
function copy(text, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = '✅ 복사됨'; setTimeout(() => { btn.textContent = o; }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => { prompt('아래 문구를 복사하세요', text); });
  else prompt('아래 문구를 복사하세요', text);
}
let ALERT_NOW = '';
async function loadAlerts() {
  const body = $('al-body');
  let since = ''; try { since = localStorage.getItem(SEEN) || ''; } catch (x) {}
  try {
    await callApiSWR('listAlerts', { password: pw(), since: since }, r => {
    if (!r.ok) throw new Error(r.error || '알림을 불러오지 못했어요');
    ALERT_NOW = r.now;
    setAppBadgeCount(r.missed.length);
    let h = '';
    if (r.missed.length) {
      h += '<div style="color:#C1392B; font-weight:700; margin-bottom:4px;">⚠️ 기한 안에 제출하지 않은 학생 ' + r.missed.length + '명</div>';
      h += '<button type="button" class="btn primary" id="al-nudge" style="margin:4px 0 6px;padding:7px 14px;">🔔 미제출 학생 ' + r.missed.length + '명에게 독촉 알림 보내기</button>';
      h += r.missed.map(m => '<div style="border-top:1px solid var(--line); padding:8px 0;"><b>' + e(m.studentName) + '</b> — ' + e(m.examTitle) + ' <span class="hint" style="margin:0;">(기한 ' + fmt(m.deadline) + ')</span><div style="display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;"><button type="button" class="btn outline al-copy" data-t="' + e(kakaoText(m.studentName, m.examTitle, m.deadline)) + '" style="padding:5px 10px;">💬 카톡 문구 복사</button></div></div>').join('');
    } else h += '<div>기한이 지났는데 안 낸 학생은 없어요.</div>';
    h += '<div style="font-weight:700; margin:12px 0 4px;">📥 새로 제출한 기록 ' + r.recent.length + '건' + (since ? '' : ' <span class="hint" style="margin:0;">(최근 기록)</span>') + '</div>';
    h += r.recent.length ? r.recent.map(s => '<div style="border-top:1px solid var(--line); padding:6px 0;"><b>' + e(s.studentName) + '</b> — ' + e(s.examTitle) + ' · ' + s.score100 + '점 <span class="hint" style="margin:0;">(' + fmt(s.submittedAt) + ')</span></div>').join('') : '<div class="hint">새로 제출한 기록이 없어요.</div>';
    h += '<button type="button" class="btn outline" id="al-seen" style="margin-top:10px;">확인했어요 (새 제출 목록 비우기)</button>';
    body.innerHTML = h;
    body.querySelectorAll('.al-copy').forEach(b => b.addEventListener('click', () => copy(b.dataset.t, b)));
    const ng = $('al-nudge'); if (ng) ng.addEventListener('click', async () => {
      if (!confirm('기한이 지났는데 안 낸 학생 전체에게 "아직 제출하지 않은 시험이 있어요" 알림을 보낼까요?')) return;
      ng.disabled = true; ng.textContent = '보내는 중...';
      try { const x = await callApi('nudgeMissing', { password: pw() }); if (!x.ok) throw new Error(x.error || '실패'); alert('미제출 ' + x.targets + '명 중 ' + x.sent + '명에게 알림을 보냈어요.' + (x.sent < x.targets ? '\n(나머지는 앱에 가입하지 않았거나 알림을 켜지 않은 학생이에요)' : '')); }
      catch (err) { alert('알림을 보내지 못했어요: ' + err.message + (/unknown/.test(err.message) ? ' (Apps Script를 새 버전으로 배포했는지 확인하세요)' : '')); }
      ng.disabled = false; ng.textContent = '🔔 다시 독촉 알림 보내기';
    });
    $('al-seen').addEventListener('click', () => { try { localStorage.setItem(SEEN, ALERT_NOW || new Date().toISOString()); } catch (x) {} loadAlerts(); });
  });
  } catch (err) { body.innerHTML = '<span style="color:#C1392B;">' + e(err.message) + '</span>'; }
}
const STAT = { wait: ['⏳ 대기', '#475569'], done: ['✅ 제출', '#145A32'], late: ['🕒 늦게 제출', '#9A5B00'], missed: ['⚠️ 미제출', '#C1392B'] };
let ASG = [], asT = null;
$('as-q').addEventListener('input', () => { clearTimeout(asT); asT = setTimeout(loadAssign, 250); });
async function loadAssign() {
  try {
    await callApiSWR('listAssignments', { password: pw() }, r => {
    if (!r.ok) throw new Error(r.error || '목록을 불러오지 못했어요');
    ASG = r.assignments; const qv = ($('as-q').value || '').replace(/\s+/g, '').toLowerCase();
    const L = ASG.filter(a => !qv || (a.studentName + a.examTitle).replace(/\s+/g, '').toLowerCase().includes(qv));
    $('as-list').innerHTML = L.length ? L.map(a => { const st = STAT[a.status] || STAT.wait;
      return '<div style="border-top:1px solid var(--line); padding:8px 0; display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap;"><div><b>' + e(a.studentName) + '</b> — ' + e(a.examTitle) + '<div class="hint" style="margin:2px 0 0;">기한 ' + fmt(a.deadline) + (a.submittedAt ? ' · 제출 ' + fmt(a.submittedAt) : '') + '</div></div><div style="display:flex; gap:6px; align-items:center;"><span style="font-weight:700; color:' + st[1] + ';">' + st[0] + '</span>' + (a.status === 'missed' || a.status === 'wait' ? '' : '') + '<button type="button" class="btn outline as-del" data-id="' + e(a.id) + '" style="padding:4px 10px; color:#C1392B;">삭제</button></div></div>'; }).join('') : '<div class="hint">예약한 시험이 없어요.</div>';
    $('as-list').querySelectorAll('.as-del').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('이 예약을 삭제할까요? (제출 기록은 지워지지 않아요)')) return;
      b.disabled = true; await callApi('deleteAssignment', { password: pw(), id: b.dataset.id }); loadAssign(); loadAlerts();
    }));
  });
  } catch (err) { $('as-list').innerHTML = '<span style="color:#C1392B;">' + e(err.message) + '</span>'; }
}
async function loadExams() {
  try {
    await callApiSWR('listExams', { password: pw() }, r => {
    if (!r.ok) throw new Error(r.error);
    $('as-exam').innerHTML = '<option value="">시험지를 고르세요</option>' + (r.exams || []).map(x => '<option value="' + e(x.id) + '">' + e(x.title) + '</option>').join('');
    const q = new URLSearchParams(location.search).get('exam'); if (q) $('as-exam').value = q;
  });
  } catch (err) { $('as-exam').innerHTML = '<option value="">시험지를 불러오지 못했어요</option>'; }
}
// 기한 빠른 선택 + 요일 표시
function pad(n) { return String(n).padStart(2, '0'); }
function dlValue() { const d = $('as-date').value, t = $('as-time').getTime(); return d && t ? d + 'T' + t : ''; }
function showDl() { const v = dlValue(); $('as-dl-txt').textContent = v ? '→ ' + fmt(new Date(v).toISOString()) + ' 까지' : ''; }
ClockPicker.attach($('as-time'), { onChange: showDl });
(function quick() {
  const box = $('as-quick'), mk = (label, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn outline'; b.style.padding = '4px 10px'; b.textContent = label; b.addEventListener('click', () => { const d = fn(); $('as-date').value = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); $('as-time').setValue(pad(d.getHours()) + ':' + pad(d.getMinutes())); showDl(); }); box.appendChild(b); };
  mk('오늘 밤 11:59', () => { const d = new Date(); d.setHours(23, 59, 0, 0); return d; });
  mk('내일 저녁 6시', () => { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(18, 0, 0, 0); return d; });
  mk('일주일 뒤 저녁 6시', () => { const d = new Date(); d.setDate(d.getDate() + 7); d.setHours(18, 0, 0, 0); return d; });
})();
$('as-date').addEventListener('input', showDl);

// ── 반 명단 ──
let ROSTERS = [];
const splitNames = t => String(t || '').split(/[\n,，、]+/).map(s => s.trim()).filter(Boolean);
const SEL = {};          // 고른 학생: 이름(공백 뺀 것) → 이름
const nk = n => String(n).replace(/\s+/g, '').toLowerCase();
function drawRosterChips() {
  const box = $('as-rosters');
  if (!ROSTERS.length) { box.innerHTML = '<span class="hint">아직 반 명단이 없어요. 아래 「반 명단 만들기」에서 만드세요.</span>'; return; }
  const chip = 'display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--line); border-radius:999px; padding:5px 11px; font-weight:400; cursor:pointer; font-size:13px; background:#fff;';
  box.style.display = 'block';
  box.innerHTML = ROSTERS.map((r, i) => {
    const all = r.students.length && r.students.every(n => SEL[nk(n)]);
    return '<div style="border:1px solid var(--line); border-radius:10px; padding:8px; margin-bottom:8px;"><label style="' + chip + ' background:' + (all ? '#D6E0F2' : '#fff') + '; font-weight:700;"><input type="checkbox" class="ro-chk" data-i="' + i + '" ' + (all ? 'checked' : '') + ' style="width:auto; margin:0;"> ' + e(r.name) + ' 전체 <span class="hint" style="margin:0;">' + r.students.length + '명</span></label>' +
      '<div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;">' + r.students.map(n => '<label style="' + chip + (SEL[nk(n)] ? ' background:#D6E0F2; border-color:#6B8FC4;' : '') + '"><input type="checkbox" class="st-chk" data-n="' + e(n) + '" ' + (SEL[nk(n)] ? 'checked' : '') + ' style="width:auto; margin:0;"> ' + e(n) + '</label>').join('') + '</div></div>';
  }).join('') + '<div class="hint" id="as-selcount" style="margin-top:2px;"></div>';
  box.querySelectorAll('.ro-chk').forEach(c => c.addEventListener('change', () => { (ROSTERS[+c.dataset.i].students || []).forEach(n => { if (c.checked) SEL[nk(n)] = n; else delete SEL[nk(n)]; }); drawRosterChips(); }));
  box.querySelectorAll('.st-chk').forEach(c => c.addEventListener('change', () => { const n = c.dataset.n; if (c.checked) SEL[nk(n)] = n; else delete SEL[nk(n)]; drawRosterChips(); }));
  const cnt = Object.keys(SEL).length; $('as-selcount').textContent = cnt ? '✔ 선택한 학생 ' + cnt + '명' : '반 이름이나 학생 이름을 눌러 고르세요. 한 명만 골라도 돼요.';
}
function drawRosterEditor() {
  $('ro-edit').innerHTML = ROSTERS.map((r, i) => r.auto ? '' : '<div style="border:1px solid var(--line); border-radius:10px; padding:8px; margin-bottom:8px;"><div style="display:flex; gap:6px;"><input type="text" class="ro-name" data-i="' + i + '" value="' + e(r.name) + '" placeholder="반 이름 (예: 중1 A반)" style="flex:1; min-width:0; box-sizing:border-box;"><button type="button" class="btn outline ro-del" data-i="' + i + '" style="padding:4px 10px; color:#C1392B;">삭제</button></div><textarea class="ro-stu" data-i="' + i + '" rows="3" placeholder="학생 이름 (줄을 바꾸거나 쉼표로 나눠 적으세요)" style="display:block; width:100%; box-sizing:border-box; margin-top:6px;">' + e(r.students.join('\n')) + '</textarea></div>').join('') || '<div class="hint">「+ 반 추가」를 눌러 반을 만드세요.</div>';
  $('ro-edit').querySelectorAll('.ro-del').forEach(b => b.addEventListener('click', () => { if (!confirm('이 반 명단을 지울까요? (예약·제출 기록은 지워지지 않아요)')) return; readRosterEditor(); ROSTERS.splice(+b.dataset.i, 1); drawRosterEditor(); }));
}
function readRosterEditor() {
  $('ro-edit').querySelectorAll('.ro-name').forEach(inp => { const r = ROSTERS[+inp.dataset.i]; if (r) r.name = inp.value.trim(); });
  $('ro-edit').querySelectorAll('.ro-stu').forEach(t => { const r = ROSTERS[+t.dataset.i]; if (r) r.students = splitNames(t.value); });
}
async function loadRosters() {
  try { const r = await callApi('getRosters', { password: pw() }); if (!r.ok) throw new Error(r.error); ROSTERS = r.rosters || []; }
  catch (err) { ROSTERS = []; $('as-rosters').innerHTML = '<span class="hint" style="color:#C1392B;">반 명단을 불러오지 못했어요 (Apps Script를 새 버전으로 배포했는지 확인하세요)</span>'; drawRosterEditor(); return; }
  drawRosterChips(); drawRosterEditor();
  try {      // 알림장 학생 명단은 느려서 화면을 먼저 보여 준 뒤 따로 불러온다
    const n = await callApi('noticeRoster', { password: pw() });
    if (n.ok && n.roster) { ROSTERS = [n.roster].concat(ROSTERS.filter(x => !x.auto)); drawRosterChips(); drawRosterEditor(); }
    else if (n.noticeError) $('ro-msg').innerHTML = '<span style="color:#B45309;">' + e(n.noticeError) + '</span>';
  } catch (err) {}
}
$('ro-add').addEventListener('click', () => { readRosterEditor(); ROSTERS.push({ name: '', students: [] }); drawRosterEditor(); });
$('ro-save').addEventListener('click', async () => {
  readRosterEditor(); const msg = $('ro-msg'); msg.textContent = '저장 중...';
  const list = ROSTERS.filter(r => r.name && !r.auto);
  try { const r = await callApi('setRosters', { password: pw(), rosters: list }); if (!r.ok) throw new Error(r.error || '저장하지 못했어요'); msg.textContent = '✅ 저장했어요'; ROSTERS = ROSTERS.filter(r => r.auto).concat(list); drawRosterChips(); drawRosterEditor(); }
  catch (err) { msg.innerHTML = '<span style="color:#C1392B;">⚠️ ' + e(err.message) + '</span>'; }
});
$('as-go').addEventListener('click', async () => {
  const msg = $('as-msg'), ex = $('as-exam').value, dl = dlValue();
  const picked = Object.keys(SEL).map(k => SEL[k]);
  const names = picked.concat(splitNames($('as-names').value)).filter((n, i, arr) => arr.findIndex(m => m.replace(/\s+/g, '') === n.replace(/\s+/g, '')) === i);
  if (!ex) { msg.textContent = '⚠️ 시험지를 고르세요'; return; }
  if (!names.length) { msg.textContent = '⚠️ 반을 고르거나 학생 이름을 적어 주세요'; return; }
  if (!dl) { msg.textContent = '⚠️ 제출 기한의 날짜와 시간을 모두 고르세요'; return; }
  if (new Date(dl).getTime() < Date.now() && !confirm('기한이 이미 지난 시간이에요. 그래도 예약할까요?')) return;
  $('as-go').disabled = true; msg.textContent = '예약하는 중...';
  try {
    const r = await callApi('createAssignments', { password: pw(), examId: ex, students: names, deadline: new Date(dl).toISOString() });
    if (!r.ok) throw new Error(r.error || '예약하지 못했어요');
    msg.textContent = '✅ ' + r.added + '명을 예약했어요' + (r.skipped ? ' (이미 예약된 ' + r.skipped + '명은 건너뛰었어요)' : '');
    $('as-names').value = ''; loadAssign(); loadAlerts();
  } catch (err) { msg.innerHTML = '<span style="color:#C1392B;">⚠️ ' + e(err.message) + '</span>'; }
  $('as-go').disabled = false;
});
async function loadSettings() {
  try {
    const r = await callApi('getAlertSettings', { password: pw() });
    if (!r.ok) throw new Error(r.error);
    $('st-email').value = r.email || ''; $('st-sub').checked = !!r.notifySubmit; $('st-miss').checked = !!r.notifyMiss;
    $('st-trig').innerHTML = r.triggerOn ? '✅ 기한 자동 확인이 켜져 있어요 (10분마다).' : '⚠️ 기한 자동 확인이 꺼져 있어요. 꺼져 있으면 <b>이 화면을 열 때만</b> 미제출이 반영돼요. <button type="button" class="btn outline" id="st-trigbtn" style="padding:4px 10px;">자동 확인 켜기</button>';
    $('st-bk').innerHTML = r.backupOn ? '✅ 매주 일요일 새벽에 시트를 자동으로 백업해요 (최근 8개 보관, 드라이브의 「자동채점 백업」 폴더).' : '⚠️ 자동 백업이 꺼져 있어요. <button type="button" class="btn outline" id="st-bkbtn" style="padding:4px 10px;">자동 백업 켜기</button>';
    const bb = $('st-bkbtn'); if (bb) bb.addEventListener('click', async () => { bb.disabled = true; const x = await callApi('installBackup', { password: pw() }); if (!x.ok) $('st-bk').innerHTML = '<span style="color:#C1392B;">' + e(x.error) + '</span>'; else loadSettings(); });
    const lm = r.lastMissMail;
    $('st-miss-res').innerHTML = lm ? ((lm.ok ? '✅ 최근 미제출 메일: ' + lm.n + '명 분을 보냈어요' : '⚠️ 최근 미제출 메일을 <b>보내지 못했어요</b>' + (lm.err ? ' (' + e(lm.err) + ')' : '')) + ' · ' + new Date(lm.at).toLocaleString('ko-KR')) : '아직 미제출 메일을 보낸 기록이 없어요.';
    const tb = $('st-trigbtn'); if (tb) tb.addEventListener('click', async () => { tb.disabled = true; const x = await callApi('installAlertTrigger', { password: pw() }); if (!x.ok) $('st-trig').innerHTML = '<span style="color:#C1392B;">' + e(x.error) + '<br>Apps Script 편집기에서 setupAlerts 함수를 한 번 실행해 권한을 허용한 뒤 다시 눌러 주세요.</span>'; else loadSettings(); });
  } catch (err) { $('st-msg').innerHTML = '<span style="color:#C1392B;">설정을 불러오지 못했어요: ' + e(err.message) + ' (Apps Script를 새 버전으로 배포했는지 확인하세요)</span>'; }
}
async function saveSettings(test) {
  const msg = $('st-msg'); msg.textContent = test ? '테스트 메일을 보내는 중...' : '저장 중...';
  try {
    const r = await callApi('setAlertSettings', { password: pw(), email: $('st-email').value.trim(), notifySubmit: $('st-sub').checked, notifyMiss: $('st-miss').checked, test: !!test });
    if (!r.ok) throw new Error(r.error || '저장하지 못했어요');
    msg.textContent = test ? (r.testSent ? '✅ 테스트 메일을 보냈어요. 메일함(스팸함도)을 확인하세요.' : '⚠️ 메일을 보내지 못했어요. ' + (r.testError ? '(' + r.testError + ') ' : '') + '아래 안내대로 권한을 허용했는지 확인하세요.') : '✅ 저장했어요';
  } catch (err) { msg.innerHTML = '<span style="color:#C1392B;">⚠️ ' + e(err.message) + '</span>'; }
}
$('st-save').addEventListener('click', () => saveSettings(false));
$('st-test').addEventListener('click', () => saveSettings(true));
$('st-resend').addEventListener('click', async () => {
  const msg = $('st-msg'); msg.textContent = '미제출 메일을 보내는 중...';
  try { await saveSettings(false); msg.textContent = '미제출 메일을 보내는 중...';
    const r = await callApi('resendMissMail', { password: pw() });
    if (!r.ok) throw new Error(r.error || '보내지 못했어요');
    msg.innerHTML = r.sent ? '✅ 미제출 ' + r.n + '명 분 메일을 보냈어요. 메일함(스팸함도)을 확인하세요.' : '⚠️ ' + e(r.error || '메일을 보내지 못했어요');
    loadSettings();
  } catch (err) { msg.innerHTML = '<span style="color:#C1392B;">⚠️ ' + e(err.message) + '</span>'; }
});
$('kt-tpl').value = ktTpl();
$('kt-save').addEventListener('click', () => { try { localStorage.setItem(KT_KEY, $('kt-tpl').value.trim() || KT_DEF); $('kt-msg').textContent = '✅ 저장했어요 (이 컴퓨터·브라우저에 저장돼요)'; loadAlerts(); } catch (x) { $('kt-msg').textContent = '⚠️ 저장하지 못했어요'; } });
$('kt-reset').addEventListener('click', () => { $('kt-tpl').value = KT_DEF; try { localStorage.removeItem(KT_KEY); } catch (x) {} $('kt-msg').textContent = '기본 문구로 되돌렸어요'; loadAlerts(); });
loadExams(); loadRosters(); loadAlerts(); loadAssign(); loadSettings();
</script>
</body>
</html>
