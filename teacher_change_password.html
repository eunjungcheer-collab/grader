<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0B1F5C">
<title>비밀번호 변경 - 자동 채점 시스템</title>
<link rel="stylesheet" href="css/style.css?v=202611011600">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#95D1DB">
</head>
<body>
<template id="page-content">
  <span class="backlink"><a href="index.html">← 홈으로</a></span>
  <h1>비밀번호 변경</h1>
  <div id="error-banner"></div>
  <form id="pw-form" class="card">
    <label>현재 비밀번호</label>
    <input type="password" id="old-pw" required>
    <label class="field-label-spaced">새 비밀번호</label>
    <input type="password" id="new-pw" required>
    <button type="submit" class="btn primary" style="width:100%; margin-top:16px;">변경하기</button>
  </form>
</template>

<script src="js/config.js?v=202611011600"></script>
<script src="js/api.js?v=202611011600"></script>
<script src="js/common.js?v=202611011600"></script>
<script>
requireLogin();
renderHeader();

document.getElementById('pw-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  const oldPw = document.getElementById('old-pw').value;
  const newPw = document.getElementById('new-pw').value;
  const errorBox = document.getElementById('error-banner');
  try {
    const res = await callApi('changePassword', { oldPassword: oldPw, newPassword: newPw });
    if (res.ok) {
      sessionStorage.setItem('teacher_pw', newPw);
      alert('비밀번호가 변경됐어요.');
      location.href = 'index.html';
    } else {
      errorBox.innerHTML = '<div class="banner error">' + res.error + '</div>';
    }
  } catch (err) {
    errorBox.innerHTML = '<div class="banner error">서버에 연결할 수 없어요.</div>';
  }
});
</script>
</body>
</html>
