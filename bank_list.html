<body>
<template id="page-content">
  <span class="backlink"><a href="index.html">← 홈으로</a></span>
  <h1>문제은행</h1>
  <p class="muted"><span id="total-text">불러오는 중...</span> <a href="#" id="reload-bank" style="margin-left:8px;">↻ 새로 불러오기</a></p>
  <div id="fix-units" class="banner" style="display:none; margin:8px 0;"></div>
  <div class="actions">
    <a class="btn primary" href="bank_upload.html">📄 PDF에서 문항 가져오기</a>
    <a class="btn outline" href="bank_compose.html">🧩 시험 조합하기</a>
  </div>
  <div class="search-bar">
    <input type="text" id="q" placeholder="단원·학교·문항 내용으로 검색">
  </div>
  <div id="bulk-bar" class="bulk-bar">
    <label class="bank-include-label" style="margin:0;"><input type="checkbox" id="select-all-page"> 이 페이지 전체 선택</label>
    <button type="button" class="btn ghost" id="select-all-filtered" style="padding:8px 12px;">검색·필터된 전체 선택</button>
    <span class="hint" id="select-count" style="margin:0;">0개 선택</span>
    <button type="button" class="btn outline" id="bulk-classify-btn" style="padding:8px 14px;" disabled>📚 선택한 문항 분류 바꾸기</button>
    <button type="button" class="btn outline" id="fixans-btn" style="padding:8px 14px;">🔧 서술형으로 잘못 저장된 객관식 고치기</button>
    <button type="button" class="btn outline" id="dup-btn" style="padding:8px 14px;">🧹 중복 문항 정리</button>
    <button type="button" class="btn danger" id="bulk-delete-btn" style="padding:8px 14px;" disabled>선택 삭제</button>
  </div>
  <div id="fixans-box" class="card" style="display:none; padding:12px 14px;"></div>
  <div id="dup-box" class="card" style="display:none; padding:12px 14px;"></div>
  <div id="bulk-classify" class="card" style="display:none; padding:12px 14px;">
    <b id="bc-title">선택한 문항의 분류</b>
    <p class="hint" style="margin:2px 0 8px;">바꾸고 싶은 칸만 채우세요. 비워둔 칸은 그대로 둬요.</p>
    <div class="cls-form">
      <div class="cls-field"><label>학년</label><select id="bc-grade"><option value="">(바꾸지 않음)</option><option value="__clear__">(학년 비우기)</option></select></div>
      <div class="cls-field cls-wide"><label>단원</label><input type="text" id="bc-unit" list="dl-units" placeholder="예: 1. 물질의 특성"></div>
      <div class="cls-field cls-wide"><label>소단원 (선택한 문항이 같은 단원일 때)</label><select id="bc-sub"><option value="">(바꾸지 않음)</option></select></div>
      <div class="cls-field"><label>구분</label><select id="bc-kind"><option value="">(바꾸지 않음)</option><option value="일반">일반 문제</option><option value="기출">기출문제</option><option value="교재">내신교재</option></select></div>
      <div class="cls-field"><label>출제년도 (기출)</label><input type="text" id="bc-year" inputmode="numeric" maxlength="4" placeholder="예: 2025" style="max-width:90px;"></div>
      <div class="cls-field cls-wide"><label>학교·시험 이름 (기출)</label><input type="text" id="bc-school" list="dl-schools" placeholder="예: ○○중 2025 1학기 중간"></div>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px;">
      <button type="button" class="btn primary" id="bc-apply" style="padding:8px 14px;">선택한 문항에 적용</button>
      <button type="button" class="btn ghost" id="bc-cancel" style="padding:8px 14px;">닫기</button>
      <span class="hint" id="bc-msg" style="margin:0;"></span>
    </div>
  </div>
  <div class="quick-filters"><span class="muted chip-label">빠른 필터</span><label><input type="checkbox" id="only-noans"> 정답 비어있음</label><label><input type="checkbox" id="only-nounit"> 단원 미지정</label><label title="학교 시험지는 보통 60문항을 넘지 않아요. 문항 번호가 큰 문제는 조합해서 만든 시험지를 다시 올려서 생긴 중복일 수 있어요"><input type="checkbox" id="only-bignum"> 번호 60 초과</label><label><input type="checkbox" id="only-nosub"> 소단원 비어있음</label><label><input type="checkbox" id="only-auto"> 🤖 자동 분류(확인 전)</label></div>
  <details class="tools-box"><summary>🛠 정리 · 자동 채우기 도구 <span class="hint" style="margin:0;">(필요할 때만 펼치세요)</span></summary>
    <div class="tools-body">
  <div style="margin:8px 0;"><button type="button" class="btn outline" id="dedupe" style="padding:8px 14px;">🧹 중복 문항 정리 (같은 PDF를 여러 번 올린 경우)</button> <span class="hint" id="dedupe-msg"></span></div>
  <div style="margin:8px 0;"><button type="button" class="btn outline" id="health-btn" style="padding:8px 14px;">🩺 문제은행 건강검진 (교재별 점검)</button> <span class="hint" id="health-msg"></span><div id="health-out" style="margin-top:8px; font-size:13px;"></div></div>
  <div style="margin:8px 0;"><button type="button" class="btn outline" id="book-tidy" style="padding:8px 14px;">📚 교재 문항 정리 (중복 지우기 + 단원 바로잡기)</button> <span class="hint" id="book-tidy-msg"></span></div>
  <div style="margin:8px 0;"><button type="button" class="btn outline" id="fix-class" style="padding:8px 14px;">🔧 학년·단원 바로잡기 (파일 이름·단원 이름 기준)</button> <span class="hint" id="fix-class-msg"></span>
    <div class="hint" style="margin:2px 0 0;">선택한 문항이 있으면 그것만, 없으면 전체를 점검해요. 파일 이름의 학년(중1…)과 단원 이름(예: 물리변화와 화학변화 → 중3)을 목차와 맞춰 학년을 고치고, 단원 이름을 목차 이름(예: 4단원 물질의 상태 변화)으로 통일해요.</div></div>
  <div style="margin:8px 0;"><button type="button" class="btn outline" id="auto-grade" style="padding:8px 14px;">🤖 학년·단원 자동 채우기 (분류 안 된 문항)</button> <span class="hint" id="auto-grade-msg"></span></div>
  <details style="margin:8px 0;"><summary style="cursor:pointer;">📚 과학 목차 등록 (단원 추정의 기준)</summary>
    <p class="hint">학년 줄은 <b>[중1]</b>처럼, 그 아래에 단원을 한 줄씩 적어요. 단원 뒤에 <b>:</b>를 쓰고 키워드를 적으면 더 정확해져요.<br>예) 물질의 상태 변화: 융해, 응고, 기화, 액화, 승화, 끓는점</p>
    <textarea id="toc-text" rows="10" style="width:100%;" placeholder="[중2]&#10;지권의 변화: 암석, 광물, 화성암, 퇴적암, 변성암&#10;  01 지권의 구성: 광물, 지각, 맨틀   ← 두 칸 들여쓰면 소단원이에요&#10;  02 암석의 종류와 순환: 화성암, 퇴적암, 변성암&#10;[중3]&#10;..."></textarea>
    <button type="button" class="btn outline" id="toc-save" style="padding:6px 12px;">목차 저장</button> <span class="hint" id="toc-msg"></span>
  </details>
  <div style="margin:8px 0;"><button type="button" class="btn outline" id="auto-unit" style="padding:8px 14px;">🤖 문제 내용으로 단원 추정 (단원 미지정 문항)</button>
    <label class="bank-include-label" style="margin:0 8px; font-size:12px; display:inline-flex;"><input type="checkbox" id="auto-unit-low"> 확신이 낮은 것도</label>
    <span class="hint" id="auto-unit-msg"></span></div>
  <div style="margin:8px 0;"><button type="button" class="btn outline" id="auto-sub" style="padding:8px 14px;">🤖 소단원 자동 채우기 (소단원이 비어 있는 문항)</button>
    <span class="hint" id="auto-sub-msg"></span></div>
  <div style="margin:8px 0;"><button type="button" class="btn outline" id="auto-classify" style="padding:8px 14px;">🤖 난이도 미정 문항 자동 분류 (문제집별 상대평가)</button> <span class="hint" id="auto-msg"></span></div>
    </div>
  </details>
  <div id="diff-chips" style="display:flex; flex-wrap:wrap; gap:6px; margin:6px 0;"></div>
  <div id="kind-chips2" class="chip-row"></div>
  <div id="book-chips2" class="chip-row"></div>
  <div id="grade-chips" class="chip-row"></div>
  <div id="unit-chips" class="chip-row"></div>
  <p class="hint">💡 문항 밑의 붉은 점선 칸이 저장된 해설의 맨 윗부분이에요(정답 표시가 보여요). 클릭하면 해설 전체가 펼쳐져요. 정답칸에 숫자를 치면 자동 저장되고 다음 문항으로 넘어가요.</p>
  <div id="list" class="qcard-grid"></div>
  <div id="save-status" class="save-status" style="display:none;"></div>
  <div id="pager" class="sort-bar" style="justify-content:center;"></div>
</template>

<script src="js/config.js?v=202611252235"></script>
<script src="js/api.js?v=202611252235"></script>
<script src="js/common.js?v=202611252235"></script>
<script src="js/bankcore.js?v=202611252235"></script>
<script src="js/pdfui.js?v=202611252235"></script>
<script>
requireLogin();
renderHeader({ wide: true });
const $ = id => document.getElementById(id);
const PER_PAGE = 12;
let bookFilter = '';
let all = [], unitFilter = '', gradeFilter = '', kindFilter = '', diffFilter = '', page = 1;
const selected = new Set();
const dKey = q => q.difficulty || '미정';

async function load() {
  try {
    const res = await callApi('listQuestions', { password: getTeacherPassword() });
    if (!res.ok) { $('total-text').textContent = res.error; return; }
    all = res.questions.slice().reverse();
    try { await ensureToc(); } catch (e) {}
    render(); showFixUnits();
  } catch (e) { $('total-text').textContent = '서버에 연결할 수 없어요.'; }
}
// 단원 이름이 「2-2-1.물질의 …」처럼 파일 이름 모양으로 들어간 문항을 찾아, 맨 앞 숫자(대단원)의 단원으로 바로잡는다
const FILE_UNIT_RE = /^\s*(\d{1,2})\s*-\s*\d{1,2}(?:\s*-\s*\d{1,2})?\s*[.．]/;
function fixUnitTargets() {
  const out = [];
  (all || []).forEach(q => {
    if (q.kind === '기출') return;
    const m = FILE_UNIT_RE.exec(String(q.unit || '')); if (!m) return;
    const t = tocUnitByNo(_tocParsed, q.grade, parseInt(m[1], 10));
    if (t && t.unit !== q.unit) out.push({ q: q, t: t });
  });
  return out;
}
function showFixUnits() {
  const box = $('fix-units'), list = fixUnitTargets();
  if (!list.length) { box.style.display = 'none'; return; }
  const names = Array.from(new Set(list.map(x => String(x.q.unit).slice(0, 24) + ' → ' + x.t.unit))).slice(0, 6);
  box.style.display = 'block';
  box.innerHTML = '🧹 단원 이름이 파일 이름처럼 들어간 문항 <b>' + list.length + '개</b>가 있어요. 맨 앞 숫자의 단원으로 정리할까요?<div class="hint" style="margin:4px 0;">' + names.map(escapeHtml).join('<br>') + '</div><button type="button" class="btn primary" id="fix-units-go" style="padding:7px 14px;">단원으로 정리하기</button> <span class="hint" id="fix-units-msg" style="margin:0;"></span>';
  $('fix-units-go').addEventListener('click', async () => {
    const b = $('fix-units-go'); b.disabled = true; $('fix-units-msg').textContent = '저장 중...';
    try {
      const ups = list.map(x => ({ id: x.q.id, unit: x.t.unit, grade: x.t.grade }));
      for (let i = 0; i < ups.length; i += 40) { const r = await callApi('updateQuestions', { password: getTeacherPassword(), updates: ups.slice(i, i + 40) }); if (!r.ok) throw new Error(r.error || '저장 실패'); }
      list.forEach(x => { x.q.unit = x.t.unit; x.q.grade = x.t.grade; });
      render(); showFixUnits(); alert('정리했어요: ' + list.length + '개 문항');
    } catch (e) { $('fix-units-msg').textContent = '⚠️ ' + e.message; b.disabled = false; }
  });
}


// ───────── 저장 대기열 ─────────
// 정답·난이도를 바꿀 때마다 서버(구글시트)를 부르고 기다리면 한 칸마다 1~3초씩 멈춰요.
// 그래서 화면은 바로 다음으로 넘어가고, 바뀐 것들을 모아서 뒤에서 한 번에 저장해요.
const pending = {};            // id -> {answer?, difficulty?}
let flushTimer = null, inflight = 0, lastFail = false;
const pendingCount = () => Object.keys(pending).length;
function paintStatus() {
  const el = $('save-status'), n = pendingCount() + inflight;
  if (lastFail) { el.style.display = 'block'; el.className = 'save-status fail'; el.textContent = '⚠️ 저장이 안 됐어요. 다시 시도하는 중... (' + n + '건)'; }
  else if (n) { el.style.display = 'block'; el.className = 'save-status'; el.textContent = '💾 저장 중... ' + n + '건'; }
  else { el.style.display = 'block'; el.className = 'save-status ok'; el.textContent = '✓ 모두 저장됨'; setTimeout(() => { if (!pendingCount() && !inflight) el.style.display = 'none'; }, 2500); }
}
function markCard(id, text) {
  const el = document.querySelector('.qcard[data-id="' + id + '"] .saved-flash');
  if (el) el.textContent = text;
}
function queueUpdate(id, patch) {
  pending[id] = Object.assign(pending[id] || {}, patch);
  markCard(id, '저장 대기…');
  paintStatus();
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 600);            // 입력이 0.6초 멈추면 모아서 보냄
}
async function flush() {
  clearTimeout(flushTimer);
  if (inflight) { flushTimer = setTimeout(flush, 300); return; }     // 한 번에 하나씩만 보내서 순서가 꼬이지 않게
  const ids = Object.keys(pending);
  if (!ids.length) return;
  const updates = ids.map(id => Object.assign({ id: id }, pending[id]));
  ids.forEach(id => delete pending[id]);
  inflight = updates.length;
  paintStatus();
  try {
    const r = await callApi('updateQuestions', { password: getTeacherPassword(), updates: updates });
    if (!r.ok) throw new Error(r.error || '저장 실패');
    lastFail = false;
    updates.forEach(u => markCard(u.id, '저장됨 ✓'));
  } catch (e) {
    lastFail = true;
    updates.forEach(u => { const p = Object.assign({}, u); delete p.id; pending[u.id] = Object.assign(p, pending[u.id] || {}); markCard(u.id, '저장 실패…'); });
    flushTimer = setTimeout(flush, 3000);
  }
  inflight = 0;
  paintStatus();
  if (pendingCount() && !lastFail) flushTimer = setTimeout(flush, 300);
}
window.addEventListener('beforeunload', e => { if (pendingCount() || inflight) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.hidden && pendingCount()) flush(); });

const gradeOf = x => x.grade || '__none__';
function filtered() {
  const toks = $('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean).map(t => t.replace(/\s+/g, ''));
  const fields = x => [x.unit, x.sub, x.grade, x.school, x.year, x.source, x.kind, x.textPreview].map(v => String(v || '').toLowerCase().replace(/\s+/g, ''));      // 칸마다 따로 비교 (칸이 이어져 엉뚱하게 맞지 않게), 시험지 이름·소단원·연도도 검색
  const onlyNo = $('only-noans').checked, onlyNoSub = $('only-nosub').checked, onlyNoUnit = $('only-nounit').checked, onlyAuto = $('only-auto').checked, onlyBig = $('only-bignum').checked;
  return all.filter(x => (!kindFilter || x.kind === kindFilter) && (!bookFilter || (isBookQ(x) && bookNameOf(x) === bookFilter)) && (!gradeFilter || gradeOf(x) === gradeFilter) && (!unitFilter || unitKey(x) === unitFilter) && (!diffFilter || dKey(x) === diffFilter) &&
    (!onlyNo || !String(x.answer).trim()) && (!onlyNoSub || !x.sub) && (!onlyNoUnit || !x.unit || x.unit === '(단원 미지정)') && (!onlyAuto || x.auto) && (!onlyBig || Number(x.num) > 60) &&
    (!toks.length || toks.every(t => fields(x).some(v => v.includes(t)))));
}

function render() {
  const noAnsTotal = all.filter(x => !String(x.answer).trim()).length;
  $('total-text').textContent = '총 ' + all.length + '문항이 저장되어 있어요.' + (noAnsTotal ? ' (정답이 비어있는 문항 ' + noAnsTotal + '개)' : '');
  // 구분 → 학년 → 단원 순으로 좁혀 간다 (앞 칸을 고르면 뒤 칸 목록이 거기에 맞게 줄어든다)
  const chip = (cls, label, on, data) => '<button class="sort-btn ' + (on ? 'active' : '') + '" ' + data + '>' + escapeHtml(label) + '</button>';
  const nPast = all.filter(isPastExam).length, nBook = all.filter(isBookQ).length;
  $('kind-chips2').innerHTML = '<span class="muted chip-label">구분</span>' +
    chip('', '전체 (' + all.length + ')', !kindFilter, 'data-k=""') + chip('', '일반 문제 (' + (all.length - nPast - nBook) + ')', kindFilter === '일반', 'data-k="일반"') + chip('', '기출문제 (' + nPast + ')', kindFilter === '기출', 'data-k="기출"') + (nBook ? chip('', '내신교재 (' + nBook + ')', kindFilter === '교재', 'data-k="교재"') : '');
  $('kind-chips2').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { kindFilter = b.dataset.k; gradeFilter = ''; unitFilter = ''; page = 1; render(); }));
  const bc = {}; all.filter(isBookQ).forEach(x => { const k = bookNameOf(x); bc[k] = (bc[k] || 0) + 1; });
  const bnames = Object.keys(bc).sort(naturalCompare);
  if (bookFilter && !bc[bookFilter]) bookFilter = '';
  $('book-chips2').innerHTML = (bnames.length && kindFilter !== '일반' && kindFilter !== '기출') ? '<span class="muted chip-label">📚 교재</span>' + chip('', '전체', !bookFilter, 'data-b=""') + bnames.map(n => chip('', n + ' (' + bc[n] + ')', bookFilter === n, 'data-b="' + escapeHtml(n) + '"')).join('') : '';
  if (bookFilter && $('book-chips2').innerHTML) { const rb = document.createElement('button'); rb.className = 'sort-btn'; rb.id = 'bl-ren'; rb.textContent = '✏️ 교재 이름 바꾸기'; $('book-chips2').appendChild(rb); rb.addEventListener('click', async () => { if (await renameBookFlow(bookFilter)) location.reload(); }); }
  if (bookFilter && $('book-chips2').innerHTML) {
    const db = document.createElement('button'); db.className = 'sort-btn'; db.id = 'bl-del'; db.textContent = '🗑 이 교재 문항 모두 삭제'; db.style.color = '#b91c1c'; $('book-chips2').appendChild(db);
    db.addEventListener('click', async () => {
      const nm = bookFilter, ids = all.filter(x => isBookQ(x) && bookNameOf(x) === nm).map(x => x.id);
      if (!ids.length) return;
      if (!confirm('"' + nm + '" 교재의 문제은행 문항 ' + ids.length + '개를 모두 삭제합니다.\n(이 교재로 등록된 시험지가 있으면 그 시험지의 PDF 내려받기·오답노트가 깨져요. 되돌릴 수 없어요.)\n계속할까요?')) return;

  const cards = Array.from($('list').querySelectorAll('.qcard'));

function updateBulkBar() {
  const onPage = Array.from(document.querySelectorAll('.qsel'));
  const checkedOnPage = onPage.filter(cb => selected.has(cb.dataset.id));
  $('select-all-page').checked = onPage.length > 0 && checkedOnPage.length === onPage.length;
  $('select-count').textContent = selected.size + '개 선택';
  $('bulk-delete-btn').disabled = selected.size === 0;
  $('bulk-classify-btn').disabled = selected.size === 0;
  $('bc-title').textContent = '선택한 ' + selected.size + '개 문항의 분류';
  // 소단원 칸: 선택한 문항이 모두 같은 학년·단원일 때만 그 단원의 소단원 목록을 보여준다
  const sel = $('bc-sub'), cur = sel.value, picked = all.filter(x => selected.has(x.id));
  const keys = new Set(picked.map(x => (x.grade || '') + '|' + x.unit));
  let ent = null;
  if (picked.length && keys.size === 1) ent = tocEntryFor(picked[0].grade, picked[0].unit);
  const subs = (ent && ent.subs) || [];
  sel.innerHTML = '<option value="">(바꾸지 않음)</option>' + (subs.length ? '<option value="__clear__">(소단원 비우기)</option>' + subs.map(sb => '<option value="' + escapeHtml(sb.name) + '">' + escapeHtml(sb.name) + '</option>').join('') : '');
  sel.disabled = !subs.length;
  sel.title = subs.length ? '' : (picked.length ? '같은 단원의 문항만 선택했을 때 고를 수 있어요 (소단원이 있는 단원만)' : '');
  if (subs.some(sb => sb.name === cur)) sel.value = cur;
}
$('select-all-filtered').addEventListener('click', () => {

  $('select-all-filtered').textContent = allIn ? '검색·필터된 전체 선택' : '검색·필터된 ' + list.length + '개 선택 해제';

});
$('select-all-page').addEventListener('change', () => {

$('bulk-delete-btn').addEventListener('click', async () => {
  const ids = Array.from(selected);
  if (!ids.length) return;
  if (!confirm(ids.length + '개 문항을 한꺼번에 삭제할까요? 되돌릴 수 없어요.' + (ids.length > 50 ? '\n\n(' + ids.length + '개는 많아요. 정말 맞는지 한 번 더 확인하세요.)' : ''))) return;
  $('bulk-delete-btn').disabled = true;
  $('bulk-delete-btn').textContent = '삭제 중... 0/' + ids.length + ' (창을 닫지 마세요)'; busyStart();
  try {
    let done = 0;
    try {
      for (let i = 0; i < ids.length; i += 80) {          // 많이 지울 때 서버 시간 제한에 걸리지 않게 나눠서 지운다
        const chunk = ids.slice(i, i + 80);
        const res = await callApi('deleteQuestions', { password: getTeacherPassword(), ids: chunk });
        if (!res.ok) throw new Error(res.error || '삭제 실패');
        const gone = new Set(chunk); all = all.filter(x => !gone.has(x.id)); chunk.forEach(id => selected.delete(id));
        done += chunk.length; $('bulk-delete-btn').textContent = '삭제 중... ' + done + '/' + ids.length;
      }
    } finally { render(); }
  } catch (e) { alert('삭제 중 오류: ' + e.message); }
  busyEnd(); $('bulk-delete-btn').textContent = '선택 삭제'; $('bulk-delete-btn').disabled = false;
});

      };
      const bindManual = () => { box.querySelectorAll('.mx-go').forEach(btn => btn.addEventListener('click', async () => {
        const i = Number(btn.getAttribute('data-k')), key = Object.keys(restBy).sort((a, b) => restBy[b].length - restBy[a].length)[i], sel = box.querySelector('.mx-sel[data-k="' + i + '"]'), mm = box.querySelector('.mx-msg[data-k="' + i + '"]');
        const picked = exams.filter(e => nz(e.title) === nz(sel.value)); if (picked.length !== 1) { mm.textContent = picked.length ? '같은 이름의 시험지가 여러 개예요. 이름을 더 정확히 입력하세요.' : '목록에 있는 시험지 이름을 입력해서 고르세요.'; return; }
        const exId = picked[0].id;
        btn.disabled = true; mm.textContent = '정답표 불러오는 중...';
        try {
          const d = await callApi('getExamDetail', { password: getTeacherPassword(), id: exId }); if (!d || !d.ok) throw new Error('정답표를 불러오지 못했어요');
          const ups = restBy[key].map(q => ({ q: q, a: d.answers && d.answers[Number(q.num) - 1] })).filter(x => okAns(x.a));
          if (!ups.length) { mm.textContent = '이 시험지 정답표에는 맞출 객관식 정답이 없어요.'; btn.disabled = false; return; }
          if (!confirm('「' + key + '」 문항 ' + ups.length + '개의 정답을 선택한 시험지 정답표로 맞출까요?\n(문항 번호와 정답표 번호가 같다고 보고 맞춰요)')) { mm.textContent = ''; btn.disabled = false; return; }
          for (let j = 0; j < ups.length; j += 40) { const r = await callApi('updateQuestions', { password: getTeacherPassword(), updates: ups.slice(j, j + 40).map(x => ({ id: x.q.id, answer: x.a })) }); if (!r.ok) throw new Error(r.error || '고치지 못했어요'); }
          ups.forEach(x => { x.q.answer = x.a; }); render(); mm.textContent = '✅ ' + ups.length + '개 맞췄어요.';
        } catch (e) { mm.textContent = '⚠️ ' + (e.message || e); btn.disabled = false; }
      })); };
      if (!fixes.length) { box.innerHTML = '<b>자동으로 고칠 문항은 없어요.</b> <span class="hint">정답이 「-」인 문항 ' + cand.length + '개를 시험지 정답표에서 찾아봤지만 자동으로 짝지어지는 게 없었어요.</span> <button type="button" class="btn ghost" id="fixans-close">닫기</button>' + manualHtml(); document.getElementById('fixans-close').onclick = () => { box.style.display = 'none'; }; bindManual(); return; }
      if (false) { box.innerHTML = '<b>고칠 문항이 없어요.</b> <span class="hint">정답이 「-」인 문항 ' + cand.length + '개를 시험지 정답표에서 찾아봤지만, 객관식 정답(①~⑤)으로 확인되는 문항이 없었어요.</span> <button type="button" class="btn ghost" id="fixans-close">닫기</button>'; document.getElementById('fixans-close').onclick = () => { box.style.display = 'none'; }; return; }
      box.innerHTML = '<b>🔧 서술형(-)으로 저장돼 있지만 시험지 정답표에는 객관식 정답이 있는 문항 ' + fixes.length + '개를 찾았어요</b> <span class="hint">(정답이 「-」인 문항 ' + cand.length + '개 중)</span>'
        + '<div style="max-height:200px;overflow:auto;font-size:13px;border:1px solid #E5E7EB;border-radius:8px;padding:6px 10px;margin:6px 0;">' + Object.keys(bySrc).map(k => escapeHtml(k) + ': ' + bySrc[k] + '개').join('<br>') + '</div>'
        + '<p style="margin:6px 0 0;"><button type="button" class="btn primary" id="fixans-go">' + fixes.length + '개 정답 고치기</button> <button type="button" class="btn ghost" id="fixans-close">닫기</button> <span id="fixans-msg2" class="hint"></span></p>' + manualHtml();
      bindManual();
      document.getElementById('fixans-close').onclick = () => { box.style.display = 'none'; };
      document.getElementById('fixans-go').onclick = async () => {
        const go = document.getElementById('fixans-go'), m2 = document.getElementById('fixans-msg2'); go.disabled = true;
        try {
          for (let i = 0; i < fixes.length; i += 40) { m2.textContent = '고치는 중... ' + Math.min(i + 40, fixes.length) + '/' + fixes.length; const r = await callApi('updateQuestions', { password: getTeacherPassword(), updates: fixes.slice(i, i + 40).map(f => ({ id: f.id, answer: f.answer })) }); if (!r.ok) throw new Error(r.error || '고치지 못했어요'); }
          fixes.forEach(f => { f.q.answer = f.answer; }); render();
          box.innerHTML = '<b>✅ ' + fixes.length + '개 문항의 정답을 고쳤어요.</b> <button type="button" class="btn ghost" id="fixans-close">닫기</button>'; document.getElementById('fixans-close').onclick = () => { box.style.display = 'none'; };
        } catch (e) { m2.textContent = '⚠️ ' + (e.message || e); go.disabled = false; }
      };
    } catch (e) { box.innerHTML = '<b>⚠️ ' + escapeHtml(e.message || String(e)) + '</b> <button type="button" class="btn ghost" id="fixans-close">닫기</button>'; document.getElementById('fixans-close').onclick = () => { box.style.display = 'none'; }; }
  });
})();
</script>
</body>
