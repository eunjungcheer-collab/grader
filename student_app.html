<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F5C">
<title>자동채점 (학생용)</title>
<link rel="manifest" href="student_manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/stu-favicon-32.png">
<link rel="apple-touch-icon" href="icons/stu-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="자동채점 (학생용)">
<style>
:root{--ink:#1F2937;--muted:#6B7280;--red:#C1392B;--point:#0B1F5C;--soft:#E8EBF5;--line:#E5E1D6;--bg:#F7F5EF;--white:#fff;--ok:#1a7a4a;--warn:#B45309;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));}
.top{position:sticky;top:0;z-index:20;background:var(--point);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;justify-content:space-between;}
.top b{font-size:17px;}.top small{opacity:.75;font-size:11px;margin-left:6px;}
.top a{color:#fff;opacity:.85;font-size:13px;text-decoration:none;}
main{padding:16px 16px 0;}
h2{font-size:16px;margin:22px 0 10px;}
.card{background:var(--white);border:1.5px solid var(--ink);border-radius:14px;padding:16px;margin:12px 0;box-shadow:3px 3px 0 var(--line);}
.muted{color:var(--muted);font-size:13.5px;line-height:1.6;}
.hint{color:var(--muted);font-size:12.5px;margin:4px 0;}
label{display:block;font-weight:700;font-size:13px;color:var(--muted);margin:14px 0 6px;}
input[type=text],input[type=password],input[type=tel],input[type=search]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:14px;font-size:17px;background:#fff;color:var(--ink);}
input:focus{outline:2px solid var(--point);border-color:var(--point);}
.pin{letter-spacing:10px;text-align:center;font-size:24px!important;}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:15px;border-radius:12px;border:1.5px solid var(--point);background:var(--point);color:#fff;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none;}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:9px;display:inline-flex;}
.btn.outline{background:transparent;color:var(--point);}
.btn:disabled{opacity:.5;}
.err{color:var(--red);font-size:13.5px;margin-top:10px;min-height:18px;}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1.5px solid var(--ink);display:flex;padding-bottom:env(safe-area-inset-bottom);}
.tabs button{flex:1;border:0;background:none;padding:10px 2px 9px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative;cursor:pointer;}
.tabs button .ic{display:block;font-size:21px;line-height:1.2;}
.tabs button.on{color:var(--point);}
.tabs .bd{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;padding:0 5px;}
.wide{max-width:560px;margin:0 auto;}
.banner{border:1.5px solid var(--red);background:#FBEAE7;color:#8F2A1F;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.5;margin:6px 0 4px;}
.banner.ok{border-color:var(--ok);background:#e8f5ee;color:#145a32;}
.ex{display:block;background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:14px 16px;margin:10px 0;text-decoration:none;color:var(--ink);}
.ex .t{font-weight:800;font-size:15.5px;line-height:1.4;}
.ex .m{font-size:12.5px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:800;background:var(--soft);color:var(--point);}
.chip.red{background:#FBEAE7;color:var(--red);}.chip.green{background:#e8f5ee;color:var(--ok);}.chip.amber{background:#FFF4E0;color:var(--warn);}
.ex.late{border-color:var(--red);}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.score{font-weight:900;font-size:18px;color:var(--point);}
.q{background:#fff;border:1.5px solid var(--ink);border-radius:14px;margin:14px 0;overflow:hidden;}
.q .qh{padding:10px 14px;background:var(--soft);font-weight:800;display:flex;justify-content:space-between;}
.q img{display:block;width:100%;background:#fff;}
.q .qb{padding:12px 14px;}
.opts{display:flex;gap:8px;margin:8px 0;}
.opts button{flex:1;height:48px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:17px;font-weight:800;color:var(--muted);cursor:pointer;}
.opts button.sel{background:var(--point);color:#fff;border-color:var(--point);}
.opts button.good{background:var(--ok);color:#fff;border-color:var(--ok);}
.opts button.bad{background:var(--red);color:#fff;border-color:var(--red);}
.res{font-weight:800;margin-top:6px;min-height:22px;}
select{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:#fff;}
svg text{font-family:inherit;}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--ink);border-radius:16px;padding:18px 16px;margin:12px 0;box-shadow:3px 3px 0 var(--line);cursor:pointer;font-family:inherit;color:var(--ink);}
.big .bi{font-size:34px;line-height:1;}
.big .bt{font-weight:900;font-size:18px;}
.big .bs{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45;}
.big .bn{margin-left:auto;min-width:28px;height:28px;border-radius:14px;background:var(--red);color:#fff;font-weight:900;font-size:14px;line-height:28px;text-align:center;padding:0 8px;}
.big.main{border-color:var(--point);background:var(--soft);}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:7px;}
.pbar i{display:block;height:100%;background:var(--ok);transition:width .5s;}
.q.solved{border-color:var(--ok);}
.q.solved .qh{background:#e8f5ee;}
.q.due{border-color:var(--red);}
.q.due .qh{background:#fdecea;}
.q.mast{border-color:#b8860b;}
.q.mast .qh{background:#fff7dc;}
.streak{display:inline-block;background:#fff3e0;border:1.5px solid #f59e0b;color:#b45309;border-radius:99px;padding:3px 11px;font-weight:900;font-size:13px;margin:2px 6px 2px 0;}
#praise{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-weight:800;font-size:14px;z-index:99;max-width:90%;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.3);}
.hide{display:none!important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><b>📝 자동채점 (학생용)</b><small id="ver"></small></div><a href="#" id="logout" class="hide"><span id="who"></span> 로그아웃</a></div>

  <!-- 로그인 -->
  <main id="v-login">
    <h2 style="margin-top:6px;font-size:22px;">안녕하세요 👋</h2>
    <p class="muted">이름과 숫자 4자리를 한 번에 넣고 「들어가기」를 눌러요. <b>처음이면</b> 원하는 숫자 4자리를 넣으면 돼요.</p>
    <div class="card">
      <label for="lg-name" style="margin-top:0;">이름</label>
      <input type="text" id="lg-name" autocomplete="off" placeholder="예: 홍길동">
      <div id="lg-pinbox">
        <label for="lg-pin" id="lg-pinlabel">비밀 숫자 4자리</label>
        <input type="password" id="lg-pin" class="pin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
        <div id="lg-pin2box" class="hide">
          <label for="lg-pin2" id="lg-pin2label">처음이에요! 같은 숫자를 한 번 더</label>
          <input type="password" id="lg-pin2" class="pin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
        </div>
      </div>
      <label style="display:flex;gap:8px;align-items:center;font-weight:600;margin-top:16px;"><input type="checkbox" id="lg-keep" checked> 이 기기에서 로그인 유지</label>
      <div class="hint">친구와 같이 쓰는 기기라면 체크를 풀어 주세요.</div>
      <button class="btn" id="lg-go" style="margin-top:14px;">들어가기</button>
      <div class="err" id="lg-err"></div>
    </div>
  </main>

  <!-- 홈 -->
  <main id="v-home" class="hide">
    <div id="pend"></div>
    <section id="t-home"></section>
    <section id="t-mine" class="hide"></section>
    <section id="t-list" class="hide"></section>
    <section id="t-rec" class="hide"></section>
    <section id="t-wrong" class="hide"></section>
  </main>
</div>

<nav class="tabs hide" id="tabs">
  <button data-t="home" class="on"><span class="ic">🏠</span>홈</button>
  <button data-t="mine"><span class="ic">📝</span>시험 보기<span class="bd hide" id="bd-mine"></span></button>
  <button data-t="rec"><span class="ic">📈</span>결과 보기</button>
  <button data-t="wrong"><span class="ic">🔁</span>다시 풀기</button>
</nav>

<script src="js/config.js?v=202611051200"></script>
<script src="js/api.js?v=202611051200"></script>
<script src="js/common.js?v=202611051200"></script>
<script>
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
$('ver').textContent = 'v' + window.APP_BUILD;
const DAYS = ['일', '월', '화', '수', '목', '금', '토'], pad = n => String(n).padStart(2, '0');
const fmtT = iso => { const d = new Date(iso); if (isNaN(d)) return ''; return (d.getMonth() + 1) + '/' + d.getDate() + '(' + DAYS[d.getDay()] + ') ' + (d.getHours() < 12 ? '오전 ' : '오후 ') + ((d.getHours() % 12) || 12) + ':' + pad(d.getMinutes()); };
const fmtD = iso => { const d = new Date(iso); return isNaN(d) ? '' : (d.getMonth() + 1) + '/' + d.getDate(); };
const thumb = (id, w) => 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + (w || 800);

// ── 로그인 정보 보관 (유지 체크 시 이 기기에 저장, 아니면 이 탭에서만) ──
const KEY = 'stu_login';
function loadLogin() { try { const a = localStorage.getItem(KEY) || sessionStorage.getItem(KEY); return a ? JSON.parse(a) : null; } catch (e) { return null; } }
function saveLogin(name, pin, keep) { try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); (keep ? localStorage : sessionStorage).setItem(KEY, JSON.stringify({ name: name, pin: pin })); } catch (e) {} }
function clearLogin() { try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch (e) {} }
let ME = null, DATA = null;

// ── 로그인 화면 (이름 + 숫자를 한 화면에서) ──
let REG = false;
$('lg-go').addEventListener('click', loginStep);
['lg-name', 'lg-pin', 'lg-pin2'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') loginStep(); }));
$('lg-name').addEventListener('input', () => { if (REG) { REG = false; $('lg-pin2box').classList.add('hide'); $('lg-go').textContent = '들어가기'; } });
async function loginStep() {
  const err = $('lg-err'); err.textContent = ''; err.style.color = '';
  let name = $('lg-name').value.trim(), pin = $('lg-pin').value.trim(); const btn = $('lg-go');
  const m = name.match(/^(.*\D)\s*(\d{4})$/);       // 이름 칸에 "송다솔1234"처럼 같이 적어도 나눠 준다
  if (m) { name = m[1].trim(); $('lg-name').value = name; if (!pin) { pin = m[2]; $('lg-pin').value = pin; } }
  if (!name) { err.textContent = '이름을 입력해 주세요.'; return; }
  if (!/^\d{4}$/.test(pin)) { err.textContent = '숫자 4자리를 입력해 주세요.'; return; }
  btn.disabled = true; const label = btn.textContent; btn.textContent = '확인 중...';
  try {
    if (REG) {
      if (pin !== $('lg-pin2').value.trim()) throw new Error('두 번 입력한 숫자가 달라요.');
      const r = await callApi('stuRegister', { name: name, pin: pin });
      if (!r.ok) throw new Error(r.error);
      REG = false; $('lg-pin2box').classList.add('hide'); $('lg-pin').value = ''; $('lg-pin2').value = '';
      err.style.color = '#145a32'; err.textContent = '✅ 가입 신청을 했어요! 선생님이 승인하면 이 이름과 숫자로 들어올 수 있어요.';
      btn.textContent = '들어가기'; btn.disabled = false; return;
    }
    const r = await callApi('stuHome', { name: name, pin: pin, login: true });      // 로그인과 화면 데이터를 한 번에 받는다
    if (r.ok) { saveLogin(name, pin, $('lg-keep').checked); ME = { name: name, pin: pin }; DATA = r; ME.display = r.display; await enterHome(true); btn.textContent = '들어가기'; btn.disabled = false; return; }
    if (r.notRegistered) {
      REG = true; $('lg-pin2box').classList.remove('hide'); $('lg-pin2').focus();
      err.style.color = '#8F2A1F'; err.textContent = '처음이네요! 같은 숫자를 한 번 더 넣고 「가입 신청」을 눌러 주세요. (선생님이 승인하면 들어올 수 있어요)';
      btn.textContent = '가입 신청'; btn.disabled = false; return;
    }
    throw new Error(r.error || '로그인하지 못했어요.');
  } catch (e) { err.textContent = e.message || '연결하지 못했어요.'; btn.textContent = REG ? '가입 신청' : label; }
  btn.disabled = false;
}
$('logout').addEventListener('click', e => { e.preventDefault(); clearLogin(); try { sessionStorage.removeItem('stu_name'); } catch (x) {} setAppBadgeCount(0); location.reload(); });

// ── 홈 ──
function cacheKey() { return 'stu_cache_' + String(ME.name).replace(/\s+/g, ''); }
function saveCache() { try { localStorage.setItem(cacheKey(), JSON.stringify(DATA)); } catch (e) {} }
function loadCache() { try { const c = localStorage.getItem(cacheKey()); return c ? JSON.parse(c) : null; } catch (e) { return null; } }
function applyData() {
  ME.display = DATA.display; $('who').textContent = DATA.display + ' 학생';
  setAppBadgeCount(DATA.pendingCount);                 // 홈 화면 아이콘 배지 = 아직 안 낸 시험 수
  drawBadge(); drawHome(); drawMine(); drawRec(); drawWrongPicker(); updPickerLabels();
  if (!window._pc) { window._pc = 1; pushCard(); } else if (PUSHSTATE !== 'on') pushCard();
}
async function enterHome(fresh) {
  $('v-login').classList.add('hide'); $('v-home').classList.remove('hide'); $('tabs').classList.remove('hide'); $('logout').classList.remove('hide');
  try { sessionStorage.setItem('stu_name', ME.name); } catch (e) {}
  if (fresh && DATA) { saveCache(); applyData(); loadWeak(); }
  else { const c = loadCache(); if (c) { DATA = c; applyData(); } else $('t-home').innerHTML = '<div class="card muted">불러오는 중...</div>'; await refresh(); }
  if (location.hash === '#wrong') goTab('wrong'); else if (location.hash === '#mine') goTab('mine');
}
async function refresh() {
  try {
    const r = await callApi('stuHome', { name: ME.name, pin: ME.pin });
    if (!r.ok) {
      if (/맞지 않|가입하지/.test(r.error || '')) { clearLogin(); location.reload(); return; }
      $('pend').innerHTML = '<div class="banner">' + esc(r.error || '불러오지 못했어요') + '</div>'; return;
    }
    const oldWeak = DATA && DATA.weak; DATA = r; if (oldWeak) DATA.weak = oldWeak;
    saveCache(); applyData(); loadWeak();
  } catch (e) { if (!DATA) $('pend').innerHTML = '<div class="banner">서버에 연결하지 못했어요. 인터넷을 확인해 주세요.</div>'; }
}
async function loadWeak() {       // 반복 오답 안내는 느린 계산이라 화면을 먼저 보여 준 뒤 따로 불러온다
  try { const r = await callApi('stuWeak', { name: ME.name, pin: ME.pin }); if (r.ok && DATA) { DATA.weak = r.weak; DATA.review = r.review; saveCache(); drawHome(); updPickerLabels(); } } catch (e) {}
}
function drawBadge() {
  const n = DATA.pendingCount, b = $('bd-mine');
  b.textContent = n; b.classList.toggle('hide', !n);
  const over = DATA.assignments.filter(a => a.status === 'missed').length;
  $('pend').innerHTML = n ? '<div class="banner"><b>' + esc(DATA.display) + '</b>님, 아직 제출하지 않은 시험이 <b>' + n + '개</b> 있어요' + (over ? ' (기한이 지난 것 ' + over + '개 포함)' : '') + '. 「시험 보기」에서 지금 바로 제출해요!</div>' : '<div class="banner ok">🎉 제출할 시험이 없어요. 잘하고 있어요!</div>';
}
function examHref(id) { return 'student_exam.html?id=' + encodeURIComponent(id) + '&app=1'; }
function left(deadline) {
  const ms = new Date(deadline) - new Date(DATA.now), h = ms / 36e5;
  if (ms < 0) return ['기한 지남', 'red'];
  if (h < 24) return [Math.max(1, Math.ceil(h)) + '시간 남음', 'red'];
  return ['D-' + Math.ceil(h / 24), h < 72 ? 'amber' : ''];
}
function drawMine() {
  const pend = DATA.assignments.filter(a => a.status === 'wait' || a.status === 'missed');
  const asgDone = DATA.assignments.filter(a => a.status === 'done' || a.status === 'late');
  const inAsg = {}; DATA.assignments.forEach(a => { inAsg[a.examId] = 1; });
  const selfSeen = {}, self = [];
  DATA.records.forEach(r => { if (!inAsg[r.examId] && !selfSeen[r.examId]) { selfSeen[r.examId] = 1; self.push(r); } });
  let h = '<h2 style="margin-top:6px;">⏰ 제출해야 할 시험</h2>';
  h += pend.length ? pend.map(a => { const l = left(a.deadline); return '<a class="ex' + (a.status === 'missed' ? ' late' : '') + '" href="' + examHref(a.examId) + '"><div class="row"><div class="t">' + esc(a.title) + '</div><span class="chip ' + l[1] + '">' + l[0] + '</span></div><div class="m">제출 기한 ' + fmtT(a.deadline) + '까지 · <b style="color:var(--point);">시험 보러 가기 ›</b></div></a>'; }).join('') : '<div class="card muted">선생님이 내 이름으로 등록한 시험 중 아직 안 낸 시험이 없어요.</div>';
  const doneRows = asgDone.slice().reverse().map(a => '<div class="ex" style="opacity:.9;"><div class="row"><div class="t" style="font-size:14.5px;">' + esc(a.title) + '</div><span class="chip ' + (a.status === 'late' ? 'amber' : 'green') + '">' + (a.status === 'late' ? '늦게 제출' : '제출함') + '</span></div><div class="m"><span>선생님이 등록한 시험</span></div></div>').join('');
  if (doneRows) h += '<h2>✅ 제출 완료</h2>' + doneRows;
  if (self.length) h += '<h2>📷 QR로 직접 푼 시험</h2>' + self.slice(0, 30).map(r => '<div class="ex" style="opacity:.9;"><div class="row"><div class="t" style="font-size:14.5px;">' + esc(r.title) + '</div><span class="chip green">' + esc(r.score100) + '점</span></div><div class="m"><span>' + fmtD(r.submittedAt) + ' 제출</span></div></div>').join('');
  $('t-mine').innerHTML = h;
}
let LQ = '';
function drawList() {
  const box = $('t-list');
  if (!box.dataset.init) { box.dataset.init = 1; box.innerHTML = '<h2>📚 시험 목록</h2><input type="search" id="lq" placeholder="시험 이름 검색 (예: 대기, 태양계)"><div id="lbody"></div>'; $('lq').addEventListener('input', e => { LQ = e.target.value.trim(); drawListBody(); }); }
  drawListBody();
}
function drawListBody() {
  const q = LQ.replace(/\s+/g, '').toLowerCase();
  const arr = DATA.exams.filter(e => !q || e.title.replace(/\s+/g, '').toLowerCase().includes(q));

      box.innerHTML = '<b>🔔 알림 켜기</b><div class="hint" style="margin:6px 0 10px;">제출 기한이 다가오거나 새 시험이 예약되면 앱이 닫혀 있어도 폰으로 알려 줘요.</div><button class="btn" id="pushbtn">알림 받기</button><div class="err" id="pusherr"></div>';
      $('t-home').appendChild(box);
      $('pushbtn').addEventListener('click', async () => { const b = $('pushbtn'); b.disabled = true; try { const r = await setupPush(true); if (r === 'on') box.innerHTML = '<b>✅ 알림을 켰어요!</b>'; else { $('pusherr').textContent = r === 'denied' ? '알림이 막혀 있어요. 폰 설정에서 이 앱의 알림을 허용해 주세요.' : '알림을 켜지 못했어요. 홈 화면에 추가한 앱에서 다시 해 보세요.'; b.disabled = false; } } catch (e) { $('pusherr').textContent = '알림을 켜지 못했어요: ' + (e.message || e); b.disabled = false; } });
    } else if (st === 'unsupported') {
      box.innerHTML = '<b>🔔 알림</b><div class="hint" style="margin-top:6px;">이 브라우저에서는 푸시 알림을 쓸 수 없어요. 아이폰은 사파리에서 「홈 화면에 추가」한 뒤 그 앱으로 열어 주세요.</div>';
      $('t-home').appendChild(box);
    }
  } catch (e) {}
}
// 아이폰은 배지를 쓰려면 알림 허용이 한 번 필요해요
function askBadge() {
  try {
    if ('Notification' in window && Notification.permission === 'default' && navigator.setAppBadge) {
      const d = document.createElement('div'); d.className = 'hint'; d.style.cssText = 'text-align:center;margin:10px 0;';
      d.innerHTML = '📲 홈 화면 아이콘에 안 낸 시험 숫자를 띄우려면 <a href="#" id="bk">여기를 눌러 허용</a>해 주세요.';
      $('v-home').appendChild(d);
      $('bk').addEventListener('click', e => { e.preventDefault(); Notification.requestPermission().then(() => { d.remove(); if (DATA) setAppBadgeCount(DATA.pendingCount); }); });
    }
  } catch (e) {}
}
(async function init() {
  const s = loadLogin();
  if (s && s.name && s.pin) {
    ME = { name: s.name, pin: s.pin };
    try { await enterHome(false); askBadge(); return; } catch (e) {}
  }
  ME = null; $('lg-name').focus();
})();
</script>
