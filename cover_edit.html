<script>

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mergeDb = () => new Promise((res, rej) => { const rq = indexedDB.open('qr_merges_db', 1); rq.onupgradeneeded = () => rq.result.createObjectStore('m', { keyPath: 'id' }); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });
const mergeDbOp = async (mode, fn) => { const db = await mergeDb(); return new Promise((res, rej) => { const tx = db.transaction('m', mode), st = tx.objectStore('m'), rq = fn(st); tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); };
const mergeDbPut = rec => mergeDbOp('readwrite', st => st.put(rec));
const mergeDbAll = () => mergeDbOp('readonly', st => st.getAll());
const blobDl = (blob, name) => { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000); };

function badgeCanvas(lab, col) {
  const cv = document.createElement('canvas'); cv.width = 440; cv.height = 150; const c = cv.getContext('2d');
  c.fillStyle = '#ffffff'; c.strokeStyle = col; c.lineWidth = 10;
  c.beginPath(); const x = 8, y = 8, w = 424, h = 134, r = 36; c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = col; c.font = 'bold 84px "Noto Sans CJK KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(lab, 220, 80);
  return cv;
}
const BD = { t: null, s: null };
let REC = null, COV = null /* { canvas: 표지 그림, pw, ph } */, ST = { x: 20, top: 20, wd: 150 }, KIND = 't', AUTO = null /* 제목 오른쪽 자리 */;

const u8ToB64 = u8 => { let bin = ''; for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(bin); };
async function serverUploadRaw(rec, kind, blob, onProg, legacy, gen) {
  // 큰 파일 방식(드라이브 이어 올리기)은 조각이 256KB의 배수여야 해서 768KB로 자른다. 서버가 아직 옛 버전이면 예전 방식(조각 모아 합치기)으로 다시 시도한다.
  const CH = legacy ? 900000 : 786432, total = Math.max(1, Math.ceil(blob.size / CH));
  for (let i = 0; i < total; i++) {
    if (gen !== undefined && gen !== UPGEN) throw new Error('올리기를 중단했어요. (서버에 남은 조각은 🧹 정리로 지울 수 있어요)');
    let r = null;
    for (let at = 0; at < 4; at++) {
      try { r = await callApi('mergeUpload', { password: getTeacherPassword(), id: rec.id, kind: kind, name: rec.name, idx: i, total: total, start: i * CH, totalBytes: legacy ? 0 : blob.size, mode: legacy ? 'legacy' : '', data: u8ToB64(new Uint8Array(await blob.slice(i * CH, (i + 1) * CH).arrayBuffer())) }); } catch (e) { if (at === 3) throw e; await new Promise(res => setTimeout(res, 1500 * (at + 1))); continue; }
      // 드라이브의 일시적인 서비스 오류는 잠깐 쉬고 같은 조각을 다시 보낸다
      if (r && r.ok === false && /서비스 오류|Service error|Service invoked too many/i.test(String(r.error || '')) && !/RESUMABLE_FAIL/.test(String(r.error)) && at < 3) { await new Promise(res => setTimeout(res, 2500 * (at + 1))); continue; }
      break;
    }
    if (!legacy && i === 0 && r && !r.ok && /RESUMABLE_FAIL/.test(String(r.error || ''))) return serverUploadRaw(rec, kind, blob, onProg, true, gen);
    if (!r || !r.ok) throw new Error((r && r.error) || '서버 보관 실패');
    if (i === total - 1 && r.size != null && r.size !== blob.size) throw new Error('서버에 올라간 파일 크기(' + r.size + ')가 원본(' + blob.size + ')과 달라요. 다시 올려 주세요.');
    if (onProg) onProg(i + 1, total);
  }
}
// 같은 파일을 동시에 두 번 올리면 서로 조각이 섞여 둘 다 깨진다 → 올리는 중이면 다시 시작하지 못하게 막는다
const UPLOADING = new Set(); let UPQ = Promise.resolve(), UPGEN = 0;
const UPJOBS = {}; let UPT0 = 0, UPB0 = 0;      // 올리기 진행(바이트 기준): 대기 중인 파일 포함 전체 진행률·예상 시간 계산용
function upStats() {
  let tot = 0, done = 0; Object.values(UPJOBS).forEach(j => { tot += j.size; done += j.size * j.frac; });
  const el = (Date.now() - UPT0) / 1000, sent = done - UPB0; let eta = '';
  if (sent > 1e6 && el > 5) { const sec = Math.round((tot - done) / (sent / el)); eta = ' · 약 ' + (sec >= 60 ? Math.floor(sec / 60) + '분 ' + (sec % 60) + '초' : sec + '초') + ' 남음(대략)'; }
  return { pct: tot ? Math.min(99, Math.floor(done / tot * 100)) : 0, eta: eta };
}
function upBar() {
  let el = document.getElementById('up-bar');
  if (!UPLOADING.size) { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement('div'); el.id = 'up-bar';
    el.style.cssText = 'position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#1c2333;color:#fff;padding:10px 14px;border-radius:12px;z-index:99999;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.3);width:min(560px,94vw);box-sizing:border-box;';
    el.innerHTML = '<div style="display:flex;gap:10px;align-items:center;justify-content:space-between;"><span id="up-msg"></span><button type="button" id="up-stop" style="background:#C1392B;color:#fff;border:0;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;white-space:nowrap;">⛔ 모두 중단</button></div><div style="height:12px;background:#3a4258;border-radius:8px;overflow:hidden;margin-top:8px;"><div id="up-fill" style="height:100%;width:0;background:#4cc38a;transition:width .5s linear;"></div></div><div id="up-list" style="margin-top:8px;font-size:13px;line-height:1.7;max-height:30vh;overflow:auto;"></div>';
    document.body.appendChild(el);
    el.querySelector('#up-stop').onclick = () => { UPGEN++; upBar._stopping = true; document.getElementById('up-msg').textContent = '중단하는 중... (지금 보내던 조각까지만 보내고 멈춰요)'; };
  }
  const st = upStats(); document.getElementById('up-fill').style.width = st.pct + '%';
  document.getElementById('up-list').onpointerdown = e => { const b = e.target.closest('.up-one'); if (b && UPJOBS[b.dataset.k]) { UPJOBS[b.dataset.k].cancel = true; upBar(); } };
  document.getElementById('up-list').innerHTML = Object.values(UPJOBS).map(j => '<div>' + (j.cancel ? '🚫 중단하는 중' : j.running ? '⬆️ <b>올리는 중 ' + Math.floor(j.frac * 100) + '%</b>' : '⏳ 대기') + ' · ' + String(j.label).replace(/[<>&]/g, '') + ' (' + (j.size / 1048576).toFixed(0) + 'MB) ' + (j.cancel ? '' : '<button type="button" class="up-one" data-k="' + j.k + '" style="background:#3a4258;color:#fff;border:0;border-radius:6px;padding:2px 8px;cursor:pointer;">✕ 이 파일 중단</button>') + '</div>').join('');
  if (!upBar._stopping) document.getElementById('up-msg').textContent = '서버에 올리는 중 ' + st.pct + '%' + st.eta + ' · 대기 포함 ' + UPLOADING.size + '개';
}
setInterval(() => { if (UPLOADING.size) upBar(); }, 1000);
// 여러 개를 눌러도 한 번에 하나씩 차례로 올린다(동시에 올리면 서로 느려지고 끊김). 같은 파일 중복 시작은 막고, 모두 중단도 가능.
async function serverUpload(rec, kind, blob, onProg) {
  const k = rec.id + '|' + kind; if (UPLOADING.has(k)) throw new Error('같은 파일을 이미 올리는 중이에요. 끝날 때까지 기다려 주세요.');
  if (!UPLOADING.size) { for (const x in UPJOBS) delete UPJOBS[x]; UPT0 = Date.now(); UPB0 = 0; }
  UPJOBS[k] = { k: k, cancel: false, size: blob.size, frac: 0, running: false, label: (rec.name || '') + ' · ' + (/_orig$/.test(rec.id) ? '원본' : kind === 'student' ? '학생용' : '강사용') }; UPLOADING.add(k); upBar(); const gen = UPGEN;
  const prog = (i, n) => { if (UPJOBS[k] && UPJOBS[k].cancel) throw new Error('이 파일 올리기를 중단했어요. (서버에 남은 조각은 🧹 정리로 지울 수 있어요)'); UPJOBS[k].frac = n ? i / n : 1; upBar(); if (onProg) onProg(i, n); };
  const run = UPQ.then(() => { if (UPJOBS[k] && UPJOBS[k].cancel) throw new Error('이 파일 올리기를 중단했어요.'); if (UPJOBS[k]) { UPJOBS[k].running = true; upBar(); } return serverUploadRaw(rec, kind, blob, prog, false, gen); });
  UPQ = run.catch(() => {});
  try { return await run; } finally { UPLOADING.delete(k); if (!UPLOADING.size) { for (const x in UPJOBS) delete UPJOBS[x]; upBar._stopping = false; } upBar(); }
}
async function serverDownload(fileId, onProg) {
  const parts = []; let total = 1;
  for (let i = 0; i < total; i++) {
    let r = null;
    for (let at = 0; at < 4; at++) { try { r = await callApi('mergeGetPart', { password: getTeacherPassword(), fileId: fileId, part: i, partSize: 1500000 }); break; } catch (e) { if (at === 3) throw e; await new Promise(res => setTimeout(res, 1500 * (at + 1))); } }
    if (!r || !r.ok) throw new Error((r && r.error) || '내려받기 실패');
    total = r.total; const bin = atob(r.base64), u = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k); parts.push(u);
    if (onProg) onProg(i + 1, total);
  }
  return new Blob(parts, { type: 'application/pdf' });
}

let SERVER = []; try { SERVER = JSON.parse(localStorage.getItem('merge_srv_cache') || '[]'); } catch (e) { SERVER = []; }
async function srvDelete(id, kind) { const r = await callApi('mergeDelete', { password: getTeacherPassword(), id: id, kind: kind }); if (!r || !r.ok) throw new Error((r && r.error) || '서버에서 지우지 못했어요(앱스스크립트를 새 버전으로 다시 배포해야 할 수 있어요)'); return r; }
async function srvList() { const r = await callApi('mergeList', { password: getTeacherPassword() }); if (r && r.ok) { SERVER = r.merges || []; try { localStorage.setItem('merge_srv_cache', JSON.stringify(SERVER)); } catch (e) {} } return SERVER; }
const pickPdf = () => new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = 'application/pdf'; i.onchange = () => res(i.files[0] || null); i.click(); });
const mb = n => (n / 1048576).toFixed(0) + 'MB';
let SERVER_LOADED = false, SERVER_ERR = '';
async function renderList(fresh) {
  let local = []; try { local = await mergeDbAll(); } catch (e) {}
  // 서버 목록(구글 서버라 몇 초 걸려요)은 기다리지 않고, 이 기기 목록을 먼저 보여 준 뒤 도착하면 다시 그린다
  if (fresh || !SERVER_LOADED) {
    const loadSrv = async () => { try { const r = await callApi('mergeList', { password: getTeacherPassword() }); if (r && r.ok) { SERVER = r.merges || []; SERVER_ERR = ''; try { localStorage.setItem('merge_srv_cache', JSON.stringify(SERVER)); } catch (e) {} callApi('mergeCleanup', { password: getTeacherPassword() }).catch(() => {}); } else SERVER_ERR = (r && r.error) || '서버 목록을 불러오지 못했어요'; } catch (e) { SERVER_ERR = '서버 목록을 불러오지 못했어요(' + e.message + ')'; } SERVER_LOADED = true; };
    if (!SERVER_LOADED) { loadSrv().then(() => renderList()); } else await loadSrv();
  }
  let srvErr = SERVER_ERR;
  const by = {};
  const origSrv = {};
  SERVER.forEach(m => { if (/_orig$/.test(m.id)) { origSrv[m.id.replace(/_orig$/, '')] = m.teacher; return; } by[m.id] = { id: m.id, name: m.name, date: m.date, sT: m.teacher, sS: m.student }; });
  local.forEach(m => { const r = by[m.id] = by[m.id] || { id: m.id, name: m.name, date: m.date }; r.rec = m; });
  Object.keys(by).forEach(k => { by[k].sO = origSrv[k]; });

function paint() {
  const cv = $('pv'); if (!COV) return;
  cv.width = COV.canvas.width; cv.height = COV.canvas.height; cv.getContext('2d').drawImage(COV.canvas, 0, 0);
  const stage = $('stage'), k = stage.clientWidth / COV.pw;
  let el = $('badge'); if (!el) { el = document.createElement('img'); el.id = 'badge'; el.className = 'ce-badge'; stage.appendChild(el); bindDrag(el); }
  el.src = BD[KIND].toDataURL('image/png');
  el.style.width = ST.wd * k + 'px'; el.style.left = ST.x * k + 'px'; el.style.top = ST.top * k + 'px';
  $('ce-szv').textContent = Math.round(ST.wd); $('ce-sz').value = ST.wd;
}
function bindDrag(el) {
  let drag = null;
  el.onpointerdown = e => { drag = { sx: e.clientX, sy: e.clientY, x: ST.x, top: ST.top }; el.setPointerCapture(e.pointerId); e.preventDefault(); };
  el.onpointermove = e => { if (!drag) return; const k = $('stage').clientWidth / COV.pw, hh = ST.wd * 150 / 440; ST.x = Math.max(0, Math.min(COV.pw - ST.wd, drag.x + (e.clientX - drag.sx) / k)); ST.top = Math.max(0, Math.min(COV.ph - hh, drag.top + (e.clientY - drag.sy) / k)); paint(); };
  el.onpointerup = el.onpointercancel = () => { drag = null; };
}
function setAuto(a) { AUTO = a; }
function applyAuto() {
  if (AUTO && AUTO.x + 72 <= COV.pw - 12) { ST.wd = Math.min(ST.wd, COV.pw - 12 - AUTO.x); const hh = ST.wd * 150 / 440; ST.x = AUTO.x; ST.top = AUTO.cy - hh / 2; }      // 자리가 모자라면 표시를 줄여서 제목 옆에 맞춘다
  else { ST.x = 20; ST.top = 14; }
  paint();
}

async function coverFromPdfDoc(doc) {
  const pg = await doc.getPage(1), vp1 = pg.getViewport({ scale: 1 }), vp = pg.getViewport({ scale: 3 });
  const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
  const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); await pg.render({ canvasContext: cx, viewport: vp }).promise;
  let auto = null;

    const tc = await pg.getTextContent(), its = tc.items.filter(it => (it.str || '').trim() && (it.height || 0) >= 30), hmax = Math.max.apply(null, its.map(it => it.height).concat([0])), row = its.filter(it => it.height >= hmax * 0.9);
    if (row.length) auto = { x: Math.max.apply(null, row.map(it => it.transform[4] + it.width)) + 16, cy: vp1.height - (row[0].transform[5] + row[0].height * 0.33) };
    else { const ps = await BankCore.coverTitleSpotByPixels(doc); if (ps) auto = { x: ps.right + 16, cy: vp1.height - ps.cy }; }
  } catch (e) {}
  return { canvas: cv, pw: vp1.width, ph: vp1.height, auto: auto };
}

  document.querySelectorAll('input[name=pv-kind]').forEach(r => r.addEventListener('change', () => { KIND = r.value; paint(); }));
  ['ce-name', 'ce-design', 'ce-color'].forEach(id => { const e = $(id); const f = () => { if (document.querySelector('input[name=src]:checked').value === 'gen') { const x0 = ST.x, t0 = ST.top; setSource('gen'); } }; e.addEventListener('input', f); e.addEventListener('change', f); });
  ['ce-cfs', 'ce-crow', 'ce-cdy'].forEach(id => $(id).addEventListener('input', regenGen)); $('ce-ccols').addEventListener('change', regenGen);
  const LOGO0 = { main: '이은정 과학', sub: 'MIDDLE SCHOOL SCIENCE · EXAM PREP', chip: '' };
  const setLogo = l => { $('ce-lmain').value = l.main; $('ce-lsub').value = l.sub; $('ce-lchip').value = l.chip || ''; };
  setLogo(Object.assign({}, LOGO0, savedCoverLogo() || {}));
  ['ce-lmain', 'ce-lsub', 'ce-lchip'].forEach(id => $(id).addEventListener('input', regenGen));
  $('ce-lsave').onclick = () => { try { localStorage.setItem('cover_logo', JSON.stringify({ main: $('ce-lmain').value, sub: $('ce-lsub').value, chip: $('ce-lchip').value })); $('ce-lmsg').textContent = '✅ 저장했어요. 새로 만드는 표지에도 이 로고가 쓰여요.'; } catch (e) { $('ce-lmsg').textContent = '저장하지 못했어요(브라우저 저장 공간 문제)'; } };
  $('ce-lreset').onclick = () => { try { localStorage.removeItem('cover_logo'); } catch (e) {} setLogo(LOGO0); regenGen(); $('ce-lmsg').textContent = '↩ 원래 로고로 되돌렸어요.'; };
  $('ce-creset').onclick = () => { $('ce-cfs').value = 100; $('ce-crow').value = 100; $('ce-cdy').value = 0; $('ce-ccols').value = '0'; regenGen(); };
  $('ce-sz').addEventListener('input', e => { ST.wd = +e.target.value; paint(); });
  $('ce-auto').onclick = applyAuto; $('ce-tl').onclick = () => { ST.x = 20; ST.top = 14; paint(); };
  $('ce-close').onclick = () => { $('editor').style.display = 'none'; };
  $('srv-clean').onclick = async () => {
    if (!confirm('서버에 남은 임시 조각 파일을 모두 지울까요?\n(올리는 중인 것이 있다면 실패하니, 모두 끝난 뒤에 눌러 주세요. 보관된 합본 파일은 지워지지 않아요)')) return;
    const b = $('srv-clean'), m = $('srv-clean-msg'); b.disabled = true; m.textContent = '정리하는 중...';
    let bar = $('srv-clean-bar'); if (!bar) { bar = document.createElement('div'); bar.id = 'srv-clean-bar'; bar.style.cssText = 'height:14px;background:#e6e1d6;border-radius:8px;overflow:hidden;margin:8px 0;max-width:520px;'; bar.innerHTML = '<div style="height:100%;width:0;background:#1f6f4a;transition:width .4s linear;"></div>'; m.parentNode.parentNode.insertBefore(bar, m.parentNode.nextSibling); }
    const fill = bar.firstChild; bar.style.display = ''; fill.style.width = '0';
    try {
      let tot = 0, all = 0;
      try { const c = await callApi('mergeCleanup', { password: getTeacherPassword(), all: true, count: true }); if (c && c.ok && c.total != null) all = c.total; } catch (e) {}
      const T0 = Date.now(); const etaTxt = () => { if (tot < 5 || all <= tot) return ''; const sec = Math.round((all - tot) / (tot / ((Date.now() - T0) / 1000))); return ' · 예상 남은 시간 ' + (sec >= 60 ? Math.floor(sec / 60) + '분 ' + (sec % 60) + '초' : sec + '초'); };
      const show = () => { if (all > 0) { const pct = Math.min(100, Math.round(tot / all * 100)); fill.style.width = pct + '%'; m.textContent = '정리하는 중... ' + tot + ' / ' + all + '개 (' + pct + '%) · 남은 것 ' + Math.max(0, all - tot) + '개' + etaTxt(); } else { fill.style.width = '30%'; m.textContent = '정리하는 중... ' + tot + '개 삭제'; } };
      show();
      let rate = 0;      // 초당 삭제 개수(직전 요청 기준) — 응답을 기다리는 동안 바를 이 속도로 미리 채워 부드럽게 보이게 한다
      for (let k = 0; k < 400; k++) {
        const t0 = Date.now(); let est = 6000;
        if (all > 0 && rate > 0) { const pred = Math.min(all * 0.995, tot + rate * est / 1000); fill.style.transitionDuration = (est / 1000) + 's'; fill.style.width = Math.round(pred / all * 100) + '%'; }
        const r = await callApi('mergeCleanup', { password: getTeacherPassword(), all: true }); if (!r || !r.ok) throw new Error((r && r.error) || '서버를 새 버전으로 배포했는지 확인해 주세요');
        const dt = Math.max(0.5, (Date.now() - t0) / 1000); rate = (r.removed || 0) / dt; tot += r.removed || 0; if (all && tot > all) all = tot; fill.style.transitionDuration = '.4s'; show(); if (!r.removed) break;
      }
      fill.style.width = '100%'; m.textContent = '✅ 임시 조각 ' + tot + '개를 정리했어요.'; setTimeout(() => { bar.style.display = 'none'; }, 4000);
    } catch (e) { bar.style.display = 'none'; m.innerHTML = '<span style="color:#C1392B;">정리하지 못했어요: ' + esc(e.message || e) + '</span>'; }
    b.disabled = false;
  };
  $('ce-ok').onclick = applyEdit;
  $('ce-file').addEventListener('change', e => { const f = e.target.files[0]; if (f) loadOriginal(f); });
  window.addEventListener('resize', paint);
})();
</script>
</body>
