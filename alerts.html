<body>
<style>#as-exam,#as-names,#st-email{display:block; width:100%; max-width:100%; box-sizing:border-box; margin-top:4px;} #as-names{resize:vertical;}</style>
<template id="page-content">
  <span class="backlink"><a href="index.html">← 홈으로</a></span>
  <h1>⏰ 시험 예약·알림</h1>
  <p class="muted">학생에게 시험을 <b>언제까지</b> 내라고 예약해 두면, 학생이 제출할 때와 기한이 지났는데 안 냈을 때 알려 드려요.</p>

  <div class="card" id="al-box"><b>🔔 알림</b><div id="al-body" class="hint" style="margin-top:8px;">불러오는 중...</div></div>

  <div class="card" id="fx-box" style="border:2px solid #1f6f4a;"><b id="fx-title">🔎 학생 이름으로 기록 찾기 · 오답노트/다시풀기 받기</b>
    <input id="fx-q" list="fx-names" placeholder="학생 이름 (일부만 써도 돼요)" autocomplete="off" style="display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:9px 10px;font-size:15px;"><datalist id="fx-names"></datalist>
    <div id="fx-body" class="hint" style="margin-top:8px;">이름을 쓰면 그 학생의 시험 기록만 나와요. 거기서 여러 시험을 골라 한꺼번에 받을 수 있어요.</div></div>

  <div class="card" id="wn-box">
    <b>📓 오답노트 · 🔁 오답문제 다시풀기</b>
    <div class="hint" style="margin:4px 0 8px;">위 「새로 제출한 기록」에서 학생 기록을 <b>체크</b>하고 아래 버튼을 누르면, 그 학생의 틀린 문제를 <b>한 PDF로 합쳐</b> 인쇄할 수 있게 만들어요. (기록 옆 버튼은 그 한 건만 만들어요. 여러 학생을 체크하면 학생마다 따로 만들어요.)</div>
    <div style="margin:6px 0;"><b style="font-size:14px;">받을 파일</b><br>
      <label style="margin-right:14px;font-weight:400;"><input type="checkbox" id="wn-f-student" checked> 학생용</label>
      <label style="margin-right:14px;font-weight:400;"><input type="checkbox" id="wn-f-answers" checked> 정답·해설지 <span class="hint" style="margin:0;">(다시풀기만 따로 · 오답노트는 학생용 뒤쪽에 들어가요)</span></label>
      <label style="font-weight:400;"><input type="checkbox" id="wn-f-teacher" checked> 강사용</label></div>
    <div style="margin:6px 0;"><label style="margin-right:14px;font-weight:400;"><input type="checkbox" id="wn-expl" checked> 오답노트 학생용에 해설 포함</label>
      <label style="font-weight:400;">다시 풀 빈칸 <select id="wn-blank"><option value="0">없음</option><option value="60">작게</option><option value="110" selected>보통</option><option value="170">넓게</option></select></label></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
      <button type="button" class="btn primary" id="wn-go-note" style="padding:8px 14px;">📓 선택한 기록 오답노트로 합쳐 받기</button>
      <button type="button" class="btn primary" id="wn-go-retry" style="padding:8px 14px;">🔁 선택한 기록 오답문제 다시풀기로 합쳐 받기</button>
      <button type="button" class="btn outline" id="wn-clear" style="padding:8px 14px;">선택 해제</button></div>
    <div id="wn-bar" style="display:none;height:14px;background:#e6e1d6;border-radius:8px;overflow:hidden;margin:10px 0 4px;"><div id="wn-fill" style="height:100%;width:0;background:#1f6f4a;transition:width .5s linear;"></div></div>
    <div id="wn-msg" class="hint" style="margin-top:6px;"></div>
    <div class="hint" style="margin-top:6px;">📓 오답노트 = 틀린 문제 + 내가 쓴 답(정답은 맨 뒤) · 🔁 다시풀기 = 틀린 문제만(내 답·정답 표시 없음), 정답·해설은 따로 · 강사용 = 문제마다 정답(오답노트는 내 답도) + 해설</div>
  </div>

  <div class="card" id="assign">
    <b>➕ 시험 예약하기</b>
    <label style="display:block; margin-top:8px;">시험지 <select id="as-exam"><option value="">불러오는 중...</option></select></label>
    <div style="margin-top:10px;"><b style="font-size:14px;">학생 선택</b> <span class="hint" style="margin:0;">(반 이름을 누르면 반 전체, 학생 이름을 누르면 한 명씩 골라져요)</span>
      <div id="as-rosters" style="display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;"><span class="hint">불러오는 중...</span></div>
      <details id="ro-wrap" style="margin-top:8px;"><summary style="cursor:pointer; font-size:13px; color:#1F3A6B;">👥 반 명단 만들기·고치기 (알림장 학생은 자동으로 들어와요)</summary>
        <div id="ro-edit" style="margin-top:8px;"></div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;"><button type="button" class="btn outline" id="ro-add" style="padding:6px 12px;">+ 반 추가</button><button type="button" class="btn primary" id="ro-save" style="padding:6px 14px;">명단 저장</button></div>
        <div id="ro-msg" class="hint" style="margin-top:4px;"></div>
      </details></div>
    <label style="display:block; margin-top:8px;">추가로 예약할 학생 이름 <span class="hint" style="margin:0;">(눌러서 고르는 대신 직접 적어도 돼요. 여러 명이면 줄을 바꾸거나 쉼표로 나눠 적으세요)</span>
      <textarea id="as-names" rows="3" placeholder="윤태현&#10;김철수"></textarea></label>
    <div class="hint" style="margin:4px 0 0;">학생이 시험 화면에서 적는 이름과 <b>똑같이</b> 적어야 제출로 인식돼요. (띄어쓰기는 달라도 돼요)</div>
    <div style="margin-top:8px;"><b style="font-size:14px;">제출 기한</b>
      <div style="display:flex; gap:8px; margin-top:4px;"><input type="date" id="as-date" style="flex:1 1 50%; min-width:0; box-sizing:border-box;"><input type="text" id="as-time" placeholder="🕒 시간 고르기" style="flex:1 1 50%; min-width:0; box-sizing:border-box;"></div></div>
    <div id="as-dl-txt" class="hint" style="margin:2px 0 0;"></div>
    <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;" id="as-quick"></div>
    <button type="button" class="btn primary" id="as-go" style="width:100%; margin-top:10px;">예약하기</button>
    <div id="as-msg" class="hint" style="margin-top:6px;"></div>
  </div>

  <div class="card"><b>📋 학생에게 등록한 시험 목록</b> <span class="hint" style="margin:0;">(학생 앱에도 똑같이 보여요)</span><input type="text" id="as-q" placeholder="학생 이름·시험 이름으로 찾기" style="margin-top:8px;"><div id="as-list" style="margin-top:8px;"></div></div>

  <div class="card">
    <b>⚙️ 알림 설정</b>
    <label style="display:block; margin-top:8px;">알림 받을 이메일 <input type="email" id="st-email" placeholder="example@naver.com"></label>
    <label style="display:block; font-weight:400; margin-top:6px;"><input type="checkbox" id="st-sub"> 학생이 제출할 때마다 메일 받기</label>
    <label style="display:block; font-weight:400; margin-top:4px;"><input type="checkbox" id="st-miss"> 기한이 지났는데 안 낸 학생이 있으면 메일 받기</label>
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;"><button type="button" class="btn primary" id="st-save">저장</button><button type="button" class="btn outline" id="st-test">테스트 메일 보내기</button><button type="button" class="btn outline" id="st-resend">미제출 메일 다시 보내기</button></div>
    <div id="st-miss-res" class="hint" style="margin-top:6px;"></div>
    <div id="st-msg" class="hint" style="margin-top:6px;"></div>
    <div id="st-trig" class="hint" style="margin-top:10px;"></div>
    <div id="st-bk" class="hint" style="margin-top:6px;"></div>
    <div style="margin-top:14px; border-top:1px solid var(--line); padding-top:10px;"><b>💬 카톡 안내 문구</b>
      <div class="hint" style="margin:4px 0;">미제출 학생 옆 「카톡 문구 복사」를 누르면 이 문구가 복사돼요. <b>{이름}</b> <b>{시험}</b> <b>{기한}</b>은 학생마다 자동으로 바뀌어요.</div>
      <textarea id="kt-tpl" rows="4" style="display:block; width:100%; box-sizing:border-box;"></textarea>
      <div style="display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;"><button type="button" class="btn primary" id="kt-save" style="padding:6px 14px;">문구 저장</button><button type="button" class="btn outline" id="kt-reset" style="padding:6px 14px;">기본 문구로</button></div>
      <div id="kt-msg" class="hint" style="margin-top:4px;"></div></div>
    <div class="hint" style="margin-top:6px;">※ 구글 계정은 하루에 보낼 수 있는 메일 수가 정해져 있어요(보통 100통). 학생이 아주 많이 제출하는 날은 일부 메일이 안 갈 수 있어요. 앱 안 알림은 그대로 보여요.</div>
  </div>
</template>
<script src="js/config.js?v=202611181200"></script>
<script src="js/api.js?v=202611181200"></script>
<script src="js/common.js?v=202611181200"></script>
<script src="js/vendor/pdf.min.js?v=202611181200"></script>
<script src="js/vendor/pdf-lib.min.js?v=202611181200"></script>
<script src="js/vendor/qrcode.min.js?v=202611181200"></script>
<script src="js/bankcore.js?v=202611181200"></script>
<script src="js/wrongnote.js?v=202611181200"></script>
<script src="js/pdfui.js?v=202611181200"></script>
<script src="js/clockpicker.js?v=202611181200"></script>
<script>
requireLogin();
renderHeader({});
setupPdfJs();
const $ = id => document.getElementById(id);
const pw = () => getTeacherPassword();
const e = escapeHtml;
const SEEN = 'alertSeen';
const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
function fmt(iso) { const d = new Date(iso); if (isNaN(d)) return String(iso); const p = n => String(n).padStart(2, '0'); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + DAYS[d.getDay()] + ') ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
const KT_KEY = 'kakaoTpl', KT_DEF = '{이름} 학생, 「{시험}」 제출 기한({기한})이 지났어요. 아직 제출하지 못했다면 시험지의 QR로 지금 제출하고, 카카오톡으로 알려 주세요.';
function ktTpl() { try { return localStorage.getItem(KT_KEY) || KT_DEF; } catch (x) { return KT_DEF; } }
function kakaoText(name, title, deadline) { return ktTpl().split('{이름}').join(name).split('{시험}').join(title).split('{기한}').join(fmt(deadline)); }
function copy(text, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = '✅ 복사됨'; setTimeout(() => { btn.textContent = o; }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => { prompt('아래 문구를 복사하세요', text); });
  else prompt('아래 문구를 복사하세요', text);
}
let ALERT_NOW = '', RECENT = [];
const WN_SEL = {}, wnKey = s => [s.examId, s.studentName, s.submittedAt].join('|');
async function loadAlerts() {
  const body = $('al-body');
  let since = ''; try { since = localStorage.getItem(SEEN) || ''; } catch (x) {}
  try {
    await callApiSWR('listAlerts', { password: pw(), since: since }, r => {
    if (!r.ok) throw new Error(r.error || '알림을 불러오지 못했어요');
    ALERT_NOW = r.now;
    setAppBadgeCount(r.missed.length);
    let h = '';
    if (r.missed.length) {
      h += '<div style="color:#C1392B; font-weight:700; margin-bottom:4px;">⚠️ 기한 안에 제출하지 않은 학생 ' + r.missed.length + '명</div>';
      h += '<button type="button" class="btn primary" id="al-nudge" style="margin:4px 0 6px;padding:7px 14px;">🔔 미제출 학생 ' + r.missed.length + '명에게 독촉 알림 보내기</button>';
      h += r.missed.map(m => '<div style="border-top:1px solid var(--line); padding:8px 0;"><b>' + e(m.studentName) + '</b> — ' + e(m.examTitle) + ' <span class="hint" style="margin:0;">(기한 ' + fmt(m.deadline) + ')</span><div style="display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;"><button type="button" class="btn outline al-copy" data-t="' + e(kakaoText(m.studentName, m.examTitle, m.deadline)) + '" style="padding:5px 10px;">💬 카톡 문구 복사</button></div></div>').join('');
    } else h += '<div>기한이 지났는데 안 낸 학생은 없어요.</div>';
    h += '<div style="font-weight:700; margin:12px 0 4px;">📥 새로 제출한 기록 ' + r.recent.length + '건' + (since ? '' : ' <span class="hint" style="margin:0;">(최근 기록)</span>') + '</div>';
    RECENT = r.recent;
    h += r.recent.length ? r.recent.map(s => { const k = wnKey(s), bad = Number(s.score) < Number(s.total); return '<div style="border-top:1px solid var(--line); padding:6px 0; display:flex; gap:8px; align-items:center; flex-wrap:wrap;"><input type="checkbox" class="wn-chk" data-k="' + e(k) + '"' + (WN_SEL[k] ? ' checked' : '') + (bad ? '' : ' disabled title="틀린 문항이 없어요"') + ' style="width:18px;height:18px;"><div style="flex:1; min-width:210px;"><b>' + e(s.studentName) + '</b> — ' + e(s.examTitle) + ' · ' + s.score100 + '점 <span class="hint" style="margin:0;">(' + fmt(s.submittedAt) + ')</span></div>' + (bad ? '<button type="button" class="btn outline wn-one" data-k="' + e(k) + '" data-kind="note" style="padding:4px 10px;">📓 오답노트</button><button type="button" class="btn outline wn-one" data-k="' + e(k) + '" data-kind="retry" style="padding:4px 10px;">🔁 다시풀기</button>' : '') + '</div>'; }).join('') : '<div class="hint">새로 제출한 기록이 없어요.</div>';
    h += '<button type="button" class="btn outline" id="al-seen" style="margin-top:10px;">확인했어요 (새 제출 목록 비우기)</button>';
    body.innerHTML = h;
    body.querySelectorAll('.al-copy').forEach(b => b.addEventListener('click', () => copy(b.dataset.t, b)));
    body.querySelectorAll('.wn-chk').forEach(c => c.addEventListener('change', () => { if (c.checked) WN_SEL[c.dataset.k] = 1; else delete WN_SEL[c.dataset.k]; }));
    body.querySelectorAll('.wn-one').forEach(b => b.addEventListener('click', () => runWn(b.dataset.kind, [b.dataset.k])));
    const ng = $('al-nudge'); if (ng) ng.addEventListener('click', async () => {
      if (!confirm('기한이 지났는데 안 낸 학생 전체에게 "아직 제출하지 않은 시험이 있어요" 알림을 보낼까요?')) return;
      ng.disabled = true; ng.textContent = '보내는 중...';
      try { const x = await callApi('nudgeMissing', { password: pw() }); if (!x.ok) throw new Error(x.error || '실패'); alert('미제출 ' + x.targets + '명 중 ' + x.sent + '명에게 알림을 보냈어요.' + (x.sent < x.targets ? '\n(나머지는 앱에 가입하지 않았거나 알림을 켜지 않은 학생이에요)' : '')); }
      catch (err) { alert('알림을 보내지 못했어요: ' + err.message + (/unknown/.test(err.message) ? ' (Apps Script를 새 버전으로 배포했는지 확인하세요)' : '')); }
      ng.disabled = false; ng.textContent = '🔔 다시 독촉 알림 보내기';
    });
    $('al-seen').addEventListener('click', () => { try { localStorage.setItem(SEEN, ALERT_NOW || new Date().toISOString()); } catch (x) {} loadAlerts(); });
  });
  } catch (err) { body.innerHTML = '<span style="color:#C1392B;">' + e(err.message) + '</span>'; }
}
const STAT = { wait: ['⏳ 대기', '#475569'], done: ['✅ 제출', '#145A32'], late: ['🕒 늦게 제출', '#9A5B00'], missed: ['⚠️ 미제출', '#C1392B'] };
let ASG = [], asT = null;
$('as-q').addEventListener('input', () => { clearTimeout(asT); asT = setTimeout(loadAssign, 250); });
async function loadAssign() {
  try {
    await callApiSWR('listAssignments', { password: pw() }, r => {
    if (!r.ok) throw new Error(r.error || '목록을 불러오지 못했어요');
    ASG = r.assignments; const qv = ($('as-q').value || '').replace(/\s+/g, '').toLowerCase();
    const L = ASG.filter(a => !qv || (a.studentName + a.examTitle).replace(/\s+/g, '').toLowerCase().includes(qv));
    $('as-list').innerHTML = L.length ? L.map(a => { const st = STAT[a.status] || STAT.wait;
      return '<div style="border-top:1px solid var(--line); padding:8px 0; display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap;"><div><b>' + e(a.studentName) + '</b> — ' + e(a.examTitle) + '<div class="hint" style="margin:2px 0 0;">기한 ' + fmt(a.deadline) + (a.submittedAt ? ' · 제출 ' + fmt(a.submittedAt) : '') + '</div></div><div style="display:flex; gap:6px; align-items:center;"><span style="font-weight:700; color:' + st[1] + ';">' + st[0] + '</span>' + (a.status === 'missed' || a.status === 'wait' ? '' : '') + '<button type="button" class="btn outline as-del" data-id="' + e(a.id) + '" style="padding:4px 10px; color:#C1392B;">삭제</button></div></div>'; }).join('') : '<div class="hint">예약한 시험이 없어요.</div>';
    $('as-list').querySelectorAll('.as-del').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('이 예약을 삭제할까요? (제출 기록은 지워지지 않아요)')) return;
      b.disabled = true; await callApi('deleteAssignment', { password: pw(), id: b.dataset.id }); loadAssign(); loadAlerts();
    }));
  });
  } catch (err) { $('as-list').innerHTML = '<span style="color:#C1392B;">' + e(err.message) + '</span>'; }
}
async function loadExams() {
  try {
    await callApiSWR('listExams', { password: pw() }, r => {
    if (!r.ok) throw new Error(r.error);
    $('as-exam').innerHTML = '<option value="">시험지를 고르세요</option>' + (r.exams || []).map(x => '<option value="' + e(x.id) + '">' + e(x.title) + '</option>').join('');
    const q = new URLSearchParams(location.search).get('exam'); if (q) $('as-exam').value = q;
  });
  } catch (err) { $('as-exam').innerHTML = '<option value="">시험지를 불러오지 못했어요</option>'; }
}
// 기한 빠른 선택 + 요일 표시
function pad(n) { return String(n).padStart(2, '0'); }
function dlValue() { const d = $('as-date').value, t = $('as-time').getTime(); return d && t ? d + 'T' + t : ''; }
function showDl() { const v = dlValue(); $('as-dl-txt').textContent = v ? '→ ' + fmt(new Date(v).toISOString()) + ' 까지' : ''; }
ClockPicker.attach($('as-time'), { onChange: showDl });
(function quick() {

let FULL = null, FULL_AT = 0, WN_BUSY = false;
async function fullSubs() {
  if (FULL && Date.now() - FULL_AT < 60000) return FULL;
  const res = await callApi('listSubmissions', { password: pw() }); if (!res.ok) throw new Error(res.error || '제출 기록을 불러오지 못했어요');
  FULL = wnHydrate(res); FULL_AT = Date.now(); return FULL;
}
async function runWn(kind, keys) {
  if (WN_BUSY) { alert('지금 만드는 중이에요. 끝난 뒤에 눌러 주세요.'); return; }
  const msg = $('wn-msg'), bar = $('wn-bar'), fill = $('wn-fill');
  const files = { student: $('wn-f-student').checked, answers: $('wn-f-answers').checked && kind === 'retry', teacher: $('wn-f-teacher').checked };
  if (!files.student && !files.answers && !files.teacher) { alert('받을 파일을 하나 이상 골라 주세요.'); return; }
  if (!keys.length) { alert('위에서 학생 기록을 먼저 체크해 주세요.'); return; }
  WN_BUSY = true; document.querySelectorAll('#wn-box button, .wn-one').forEach(b => b.disabled = true);
  bar.style.display = ''; fill.style.width = '0'; const T0 = Date.now(); let G = 1, gi = 0, frac = 0, last = '';
  const paint = () => { const f = (gi + frac) / G, el = (Date.now() - T0) / 1000; let eta = ''; if (f > 0.05 && el > 6) { const sec = Math.round(el * (1 - f) / f); eta = ' · 약 ' + (sec >= 60 ? Math.floor(sec / 60) + '분 ' + (sec % 60) + '초' : sec + '초') + ' 남음(대략)'; } fill.style.width = Math.min(100, Math.round(f * 100)) + '%'; msg.textContent = last + '  [' + Math.floor(f * 100) + '%' + eta + ']'; };
  const tick = setInterval(paint, 1000);
  try {
    last = '제출 기록을 불러오는 중...'; paint();
    const subs = await fullSubs(), recs = [];
    keys.forEach(k => { const hit = subs.find(x => wnKey(x) === k) || subs.find(x => String(x.examId) === k.split('|')[0] && x.studentName === k.split('|')[1] && Math.abs(new Date(x.submittedAt) - new Date(k.split('|')[2])) < 1000); if (hit) recs.push(hit); });
    if (!recs.length) throw new Error('선택한 기록을 찾지 못했어요. 화면을 새로고침한 뒤 다시 해 주세요.');
    const groups = {}; recs.forEach(x => { (groups[x.studentName] = groups[x.studentName] || []).push(x); });
    const names = Object.keys(groups); G = names.length; const done = [], notes = [];
    for (gi = 0; gi < names.length; gi++) {
      const gr = groups[names[gi]]; frac = 0;
      const out = await wnBuild(gr, kind, files, { withExpl: $('wn-expl').checked, blank: parseInt($('wn-blank').value, 10) || 0, subs: subs }, t => { last = names[gi] + ' · ' + t; paint(); }, f => { frac = f; paint(); });
      notes.push.apply(notes, out.notes);
      for (const f of ['student', 'answers', 'teacher']) if (out[f]) { wnDownload(out[f], wnFileName(kind, f, out.used)); done.push(wnFileName(kind, f, out.used)); await new Promise(r => setTimeout(r, 1300)); }
    }
    fill.style.width = '100%'; clearInterval(tick);
    msg.innerHTML = '✅ ' + done.length + '개 파일을 내려받았어요.<br>' + done.map(e).join('<br>') + (notes.length ? '<br><span style="color:#B45309;">참고: ' + notes.map(e).join(' / ') + '</span>' : '');
    setTimeout(() => { bar.style.display = 'none'; }, 3000);
  } catch (err) { clearInterval(tick); bar.style.display = 'none'; msg.innerHTML = '<span style="color:#C1392B;">⚠️ ' + e(err.message || err) + '</span>'; }
  WN_BUSY = false; document.querySelectorAll('#wn-box button, .wn-one').forEach(b => b.disabled = false);
}

  try {
    const all = await fullSubs(), hit = all.filter(x => nk(x.studentName).includes(nk(q)));
    const names = hit.map(x => x.studentName).filter((n, i, a) => a.indexOf(n) === i);
    if (!names.length) { body.textContent = '「' + q + '」 학생의 제출 기록을 찾지 못했어요.'; return; }
    const exact = names.find(n => nk(n) === nk(q));
    if (names.length > 1 && !exact) {
      body.innerHTML = '<div style="margin-bottom:6px;">여러 학생이 검색돼요. 누구인지 눌러 주세요.</div>' + names.map(n => '<button type="button" class="btn outline fx-pick" data-n="' + e(n) + '" style="padding:5px 12px;margin:0 6px 6px 0;">' + e(n) + '</button>').join('');
      body.querySelectorAll('.fx-pick').forEach(b => b.addEventListener('click', () => { $('fx-q').value = b.dataset.n; showStudent(b.dataset.n); })); return;
    }
    const who = exact || names[0], mine = hit.filter(x => x.studentName === who).sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));
    const cur = sub ? mine.find(x => String(x.examId) === sub) : null, rest = mine.filter(x => x !== cur);
    const row = (s, hl) => { const k = wnKey(s), bad = Number(s.score) < Number(s.total);
      return '<div style="border-top:1px solid var(--line);padding:6px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;' + (hl ? 'background:#f1f8f3;' : '') + '"><input type="checkbox" class="wn-chk" data-k="' + e(k) + '"' + (WN_SEL[k] ? ' checked' : '') + '><span style="flex:1;min-width:150px;"><b>' + e(s.examTitle) + '</b> · ' + s.score + '/' + s.total + '<span class="hint" style="margin:0 0 0 6px;">' + fmt(s.submittedAt) + '</span></span>' + (bad ? '<button type="button" class="btn outline wn-one" data-kind="note" data-k="' + e(k) + '" style="padding:4px 10px;">📓 오답노트</button><button type="button" class="btn outline wn-one" data-kind="retry" data-k="' + e(k) + '" style="padding:4px 10px;">🔁 다시풀기</button>' : '<span class="hint" style="margin:0;">만점</span>') + '</div>'; };
    body.innerHTML = '<div style="font-weight:700;margin-bottom:2px;">👤 ' + e(who) + ' · 시험 기록 ' + mine.length + '건</div>' +
      (cur ? '<div style="font-weight:700;color:#1f6f4a;margin-top:6px;">⬇️ 이번에 제출한 시험</div>' + row(cur, true) + '<div style="font-weight:700;margin:12px 0 2px;">🗂️ 이전 시험 기록 ' + rest.length + '건</div>' : '') +
      rest.map(s => row(s, false)).join('') +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;"><button type="button" class="btn outline" id="fx-all" style="padding:6px 12px;">틀린 기록 전부 선택</button><button type="button" class="btn primary" id="fx-note" style="padding:6px 12px;">📓 선택 오답노트 합쳐 받기</button><button type="button" class="btn primary" id="fx-retry" style="padding:6px 12px;">🔁 선택 다시풀기 합쳐 받기</button></div><div class="hint" style="margin-top:6px;">받을 파일(학생용·정답해설·강사용)과 옵션은 아래 「오답노트·다시풀기」 카드에서 고르세요.</div>';
    body.querySelectorAll('.wn-chk').forEach(c => c.addEventListener('change', () => { if (c.checked) WN_SEL[c.dataset.k] = 1; else delete WN_SEL[c.dataset.k]; }));
    body.querySelectorAll('.wn-one').forEach(b => b.addEventListener('click', () => runWn(b.dataset.kind, [b.dataset.k])));
    $('fx-all').addEventListener('click', () => body.querySelectorAll('.wn-chk').forEach(c => { c.checked = true; WN_SEL[c.dataset.k] = 1; }));
    $('fx-note').addEventListener('click', () => runWn('note', Object.keys(WN_SEL).filter(k => mine.some(x => wnKey(x) === k))));
    $('fx-retry').addEventListener('click', () => runWn('retry', Object.keys(WN_SEL).filter(k => mine.some(x => wnKey(x) === k))));
  } catch (err) { body.innerHTML = '<span style="color:#C1392B;">' + e(err.message || err) + '</span>'; }
}
let fxT = null, fxLoaded = false;
$('fx-q').addEventListener('input', () => { clearTimeout(fxT); fxT = setTimeout(() => showStudent($('fx-q').value), 400); });
$('fx-q').addEventListener('focus', async () => {
  if (fxLoaded) return; fxLoaded = true;
  try { const all = await fullSubs(); $('fx-names').innerHTML = all.map(x => x.studentName).filter((n, i, a) => n && a.indexOf(n) === i).sort().map(n => '<option value="' + e(n) + '">').join(''); } catch (x) { fxLoaded = false; }
});
(function () { const q = new URLSearchParams(location.search), stu = q.get('stu'); if (!stu) return; $('fx-q').value = stu; showStudent(stu, q.get('sub')).then(() => $('fx-box').scrollIntoView({ block: 'start' })); })();
loadExams(); loadRosters(); loadAlerts(); loadAssign(); loadSettings();
</script>
