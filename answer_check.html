// 뒤로 버튼: 시험지를 열어 둔 상태면 목록으로 먼저 돌아간다

function rangeInfo(q, picks) {
  const m = String(q.textPreview || '').match(/^\s*[\[(【]\s*(\d{1,2})\s*[~∼～\-–]\s*(\d{1,2})\s*(?:번)?\s*[\])】]/);
  if (!m) return null;
  const k = parseInt(m[2], 10) - parseInt(m[1], 10) + 1;
  if (!(k >= 2 && k <= 4)) return null;
  // 같은 시험의 뒷 번호 문항이 따로 들어 있으면(예: [25~26]의 25번·26번을 각각 고른 경우) 묶음 문항이 아니다. 25번의 정답 '4,5'(2개)를 두 문제의 정답으로 읽으면 안 된다.
  const a0 = parseInt(m[1], 10), b0 = parseInt(m[2], 10);
  if (picks && picks.some(o => o !== q && o.source === q.source && o.num > a0 && o.num <= b0)) return null;
  const ans = String(q.answer || '').trim();
  let parts = null;
  if (/^\d+$/.test(ans) && ans.length === k) parts = ans.split('');
  else if (/^[\d\-]+([,\s]+[\d\-]+)+$/.test(ans)) parts = ans.split(/[,\s]+/);
  return parts && parts.length === k ? { k: k, parts: parts } : null;
}
function buildSlots(picks) {
  let n = 1;
  return picks.map(q => {
    const ri = rangeInfo(q, picks), k = ri ? ri.k : 1, start = n;
    n += k;
    return { start: start, k: k, parts: ri ? ri.parts : null, label: k > 1 ? start + '~' + (start + k - 1) : String(start) };
  });
}
// ── 문항·해설 그림 가져오기: 5개씩 묶어 여러 묶음을 동시에 받는다 (한 묶음씩 차례로 받으면 서버 응답을 계속 기다려야 해서 느리다) ──
const _imgCache = new Map();
function prefetchImages(ids, conc) {
  const todo = Array.from(new Set(ids.filter(Boolean))).filter(id => !_imgCache.has(id));
  const batches = [];
  for (let s = 0; s < todo.length; s += 5) batches.push(todo.slice(s, s + 5));
  batches.forEach(b => {
    let res, rej; const bp = new Promise((a, r) => { res = a; rej = r; }); bp.catch(() => {});
    b.forEach(id => { const pr = bp.then(r => { const im = (r.images || []).find(x => x.fileId === id); if (!im) throw new Error('이미지를 불러오지 못했어요'); return im; }); pr.catch(() => {}); _imgCache.set(id, pr); });
    b._d = { res: res, rej: rej };
  });
  let next = 0;
  const worker = async () => {
    while (next < batches.length) {
      const b = batches[next++];
      try { const r = await callApi('getQuestionImages', { password: getTeacherPassword(), fileIds: b }); if (!r.ok) b._d.rej(new Error(r.error || '이미지를 불러오지 못했어요')); else b._d.res(r); }
      catch (e) { b._d.rej(e); }
    }
  };
  Array.from({ length: Math.min(conc || 5, batches.length) }, worker);
}
async function getImgs(ids) {
  const miss = ids.filter(id => !_imgCache.has(id));
  if (miss.length) prefetchImages(miss);
  return Promise.all(ids.map(id => _imgCache.get(id)));
}

// 시험지에 기록된 문항 id가 문제은행에 없으면(문항이 지워졌거나 다시 저장되면서 id가 바뀐 경우), 같은 교재·같은 단원 이름으로 저장된 문항을 번호 순으로 찾아 쓴다. 개수가 안 맞으면 만들지 않는다.
function resolveBankPicks(exam, all, byId) {
  const ids = exam.sourceQuestionIds || [], rc = exam.composeRecipe || {}, need = ids.length || (exam.answers || []).length;
  const direct = ids.map(id => byId[id] || null);
  if (ids.length && direct.every(Boolean)) return direct;
  if (rc.book && rc.bookTitle && rc.label) {
    // 같은 교재·같은 단원 이름으로 저장된 문항을 번호(1~n)별로 모은다. 같은 번호가 여러 개(교재를 여러 번 등록한 경우)면 가장 최근 것을 쓴다.
    const src = (rc.bookTitle + ' ' + rc.label).trim(), byNum = {};
    all.filter(q => String(q.source || '').trim() === src).forEach(q => { const k = Number(q.num) || 0; if (k && (!byNum[k] || String(q.createdAt || '') > String(byNum[k].createdAt || ''))) byNum[k] = q; });
    const out = [];
    for (let i = 0; i < need; i++) { const q = direct[i] || byNum[i + 1]; if (!q) break; out.push(q); }
    if (out.length === need) return out;
    const have = Object.keys(byNum).length;
    throw new Error('이 시험지의 문항 ' + (need - out.length) + '개를 문제은행에서 찾지 못했어요 (이 단원 문항 ' + have + '개 저장됨, 필요 ' + need + '개). 교재 QR 합본 만들기로 이 단원을 다시 저장해야 해요.');
  }
  throw new Error('이 시험지에 쓴 문항이 문제은행에서 삭제돼서 같은 시험지를 다시 만들 수 없어요.');
}

function pngSize(bytes) { const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength); return { width: dv.getUint32(16), height: dv.getUint32(20) }; }
const $ = id => document.getElementById(id);
let EXAMS = [], BANK = null;

// 1단계: 서버가 이미 알고 있는 숫자(문항 수·주관식 수)만으로 의심 정도를 매긴다
// 「검사해 보니 이상 없음」으로 확인한 시험지는 (문항 수·주관식 수가 그대로인 동안) 의심에서 뺀다. 이 브라우저에 기억
function okSet() { try { return JSON.parse(localStorage.getItem('ac_ok') || '{}') || {}; } catch (e) { return {}; } }
function markOk(ex, on) { try { callApi('markExam', { password: getTeacherPassword(), id: String(ex.id), ok: on ? new Date().toISOString().slice(0, 10) : '' }).catch(() => {}); } catch (e) {} try { const d = okSet(); if (on) d[String(ex.id)] = new Date().toISOString().slice(0, 10); else delete d[String(ex.id)]; localStorage.setItem('ac_ok', JSON.stringify(d)); } catch (e) {} }
function risk(ex) {
  const n = ex.answerCount || 0, s = ex.subjectiveCount || 0;
  if (okSet()[String(ex.id)]) return { lv: 'ok', label: '✔ 확인함 · 이상 없음', score: 0, checked: true };
  if (!s || !n) return { lv: 'ok', label: '주관식 없음', score: 0 };
  if (/서술형|서답형|논술형/.test(String(ex.title || '')) && s / n < 0.4) return { lv: 'lo', label: '서술형 포함 시험지', score: 1 };
  const r = s / n, pct = Math.round(r * 100);
  if (r >= 0.4) return { lv: 'hi', label: '정답 못 읽음 (주관식 ' + pct + '%)', score: 5 + r, unread: true };
  if (s >= 8 && r >= 0.08 || r >= 0.25) return { lv: 'hi', label: '의심 큼', score: 3 + r };
  if (s >= 3 && r >= 0.04) return { lv: 'mid', label: '의심', score: 2 + r };
  return { lv: 'lo', label: '주관식 조금', score: 1 + r };
}
// 확인함/수정함으로 표시한 시험지라도 검사에서 구체적인 이상이 나오면 알려준다
function checkedIssue(ex) {
  const sc = SCAN[String(ex.id)] || {}, a = [];
  if (sjMissing(ex)) a.push('서술형 ' + SJ[String(ex.id)].n + '개 안 잡힘');
  if (linkMissing(ex)) a.push('문제은행에 빠진 번호 ' + LINK[String(ex.id)].miss.length + '개');
  if (sc.sync && sc.sync.b) a.push('문제은행 정답 ‘-’ ' + sc.sync.b + '개');
  if (sc.n) a.push('주관식 후보 ' + sc.n + '문항');
  const n = ex.answerCount || 0, s = ex.subjectiveCount || 0; if (n && s / n >= 0.4 && !/서술형|서답형|논술형/.test(String(ex.title || ''))) a.push('주관식 비율 높음');
  return a.join(', ');
}
function scanBadge(x) {
  const sc = SCAN[String(x.ex.id)];
  if (x.r.checked) { const bad = checkedIssue(x.ex); return bad ? '<span class="ac-lv hi" title="확인함으로 표시했지만 검사에서 이상이 나왔어요">⚠️ 확인함인데 이상 있음: ' + bad + '</span>' : '<span class="ac-lv ok">✔ 확인함 · 이상 없음</span>'; }
  if (sjMissing(x.ex)) return '<span class="ac-lv hi" title="시험지 PDF에는 서술형이 있는데 정답 칸에 없어요: ' + SJ[String(x.ex.id)].nums.join(', ') + '번">📝 서술형 ' + SJ[String(x.ex.id)].n + '개 안 잡힘</span>';
  { const lk = LINK[String(x.ex.id)]; if (lk && lk.have > 0 && lk.miss.length) return '<span class="ac-lv hi" title="문제은행에 없는 번호: ' + lk.miss.join(', ') + '번">🔗 문제은행에 빠진 번호 ' + lk.miss.length + '개 (' + lk.miss.slice(0, 5).join(', ') + (lk.miss.length > 5 ? ' …' : '') + '번)</span>'; }      // 내가 확인 체크한 시험지는 검사 결과와 상관없이 이 표시를 먼저 보인다
  if (!sc) return '<span class="ac-lv ' + x.r.lv + '">' + x.r.label + '</span>';
  if (sc.unknown) return '<span class="ac-lv mid" title="' + escapeHtml(sc.unknown) + '">🔎 확인 불가 (직접 확인)</span>';
  if (sc.sync && sc.sync.b) return '<span class="ac-lv hi" title="시험지 정답은 있는데 문제은행 문항 정답이 -라서, 시험지 PDF를 만들 때 「서술형」 꼬리표가 붙을 수 있어요">📄 문제은행 정답 ‘-’ ' + sc.sync.b + '문항</span>';
  if (sc.err) return '<span class="ac-lv lo" title="' + escapeHtml(sc.err) + '">확인 못함</span>';
  if (sc.n) return '<span class="ac-lv hi">⚠️ 후보 ' + sc.n + '문항 (' + sc.nums.slice(0, 6).join(', ') + (sc.nums.length > 6 ? ' …' : '') + '번)</span>';
  if (x.r.unread) return '<span class="ac-lv hi">' + x.r.label + '</span>';
  if (sc.weak) return '<span class="ac-lv mid">약한 후보 ' + sc.weak + '문항 (' + sc.wnums.slice(0, 6).join(', ') + '번)</span>';
  return '<span class="ac-lv ok">보기 있는 주관식 없음</span>';
}
// 이 컴퓨터에 남은 등록 기록(시험지 등록 때 입력·확인한 정답)을 찾는다. 서버에 저장된 정답과 다르면 불러와 채울 수 있게 한다
async function localAnswers(exam) {
  try {
    const db = await new Promise((res, rej) => { const q = indexedDB.open('grader_review', 1); q.onupgradeneeded = () => q.result.createObjectStore('r'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    const list = await new Promise(res => { const t = db.transaction('r').objectStore('r').get('list'); t.onsuccess = () => res(t.result || []); t.onerror = () => res([]); });
    const nz = t => String(t || '').replace(/\s+/g, ' ').trim().toLowerCase();
    const hit = list.find(x => String(x.id) === String(exam.id)) || list.find(x => nz(x.title) === nz(exam.title));
    return hit && Array.isArray(hit.answers) ? hit.answers.map(String) : null;
  } catch (e) { return null; }
}
async function offerLocal(exam) {
  const host = $('ac-local'); if (!host) return;
  const loc = await localAnswers(exam); if (!loc || loc.length !== exam.answers.length) return;
  const diff = loc.map((a, i) => ({ n: i + 1, a: a, cur: exam.answers[i] })).filter(x => x.a && x.a !== '-' && x.a !== x.cur);
  if (!diff.length) return;
  host.innerHTML = '<div class="banner" style="text-align:left;">💾 이 컴퓨터에 남은 <b>등록 기록</b>에는 서버와 다른 정답이 <b>' + diff.length + '개</b> 있어요 (서버에 저장된 정답 ' + exam.answers.filter(a => a !== '-').length + '개). <button type="button" class="btn outline" id="ac-loadlocal" style="padding:5px 12px;margin-left:6px;">불러와서 칸에 채우기</button><div class="hint">채우기만 하고 저장하지는 않아요. 칸을 확인한 뒤 「저장」을 누르면 「이전 → 이후」를 보여 드려요.</div></div>';
  $('ac-loadlocal').onclick = () => {
    let n = 0; diff.forEach(x => { const i = document.querySelector('#ac-detail input.aa[data-n="' + x.n + '"]') || document.querySelector('#ac-detail input.ai[data-n="' + x.n + '"]'); if (i) { i.value = x.a; n++; const c = i.closest('.ac-q'); if (c) c.classList.add('chg'); } });
    host.querySelector('.hint').textContent = n + '개 칸을 채웠어요. 확인하고 저장해 주세요.' + (n < diff.length ? ' (' + (diff.length - n) + '개는 이 화면에 칸이 없어요)' : '');
  };
}
// 정답지 PDF(글자로 된 표)를 올려 정답을 읽어서 칸에 채운다. 저장은 하지 않는다 (확인 후 「저장」)
let ansFileObj = null;
// 수정한 시험지 표시 (이 브라우저에 기억): 저장하거나 PDF를 바꾸면 목록에 ✅가 붙는다
function doneSet() { try { return JSON.parse(localStorage.getItem('ac_done') || '{}') || {}; } catch (e) { return {}; } }
function markDone(id) { try { callApi('markExam', { password: getTeacherPassword(), id: String(id), done: new Date().toISOString().slice(0, 10) }).catch(() => {}); } catch (e) {} try { const d = doneSet(); d[String(id)] = new Date().toISOString().slice(0, 10); localStorage.setItem('ac_done', JSON.stringify(d)); } catch (e) {} }
// 정답지를 고르면 「저장」 버튼 하나로 정답 저장 + 정답지를 시험지 PDF 맨 뒤에 붙이기까지 한다 (문제지가 홀수 쪽으로 끝나면 빈 쪽을 넣어 정답지가 홀수 쪽에서 시작)
function offerReplace(exam, f) {
  const m = $('ac-ansmsg'); if (!m) return; ansFileObj = f;
  const fid = (String(exam.pdfUrl || '').match(/[?&]id=([^&]+)/) || [])[1];
  if (!fid) { ansFileObj = null; m.innerHTML += ' <span class="hint">(이 시험지에는 올려 둔 PDF가 없어서 PDF에 붙일 수는 없어요.)</span>'; return; }
  m.insertAdjacentHTML('beforeend', '<br><label><input type="checkbox" id="ac-attach" checked> 저장할 때 이 정답지를 시험지 PDF 맨 뒤에도 붙이기 <span class="hint">(이미 정답지가 붙어 있는 시험지면 체크를 끄세요)</span></label>');
}
async function attachAnswerPdf(exam, f) {
  const fid = (String(exam.pdfUrl || '').match(/[?&]id=([^&]+)/) || [])[1];
  const blob = await driveDirectBlob(fid); if (!blob) throw new Error('현재 PDF를 받지 못했어요.');
  const main = await PDFLib.PDFDocument.load(new Uint8Array(await blob.arrayBuffer()), { ignoreEncryption: true });
  const extra = await PDFLib.PDFDocument.load(new Uint8Array(await f.arrayBuffer()), { ignoreEncryption: true });
  const before = main.getPageCount();
  await BankCore.mergePdfs(PDFLib, main, extra);
  const res = await callApi('replaceExamPdf', { password: getTeacherPassword(), id: exam.id, pdfBase64: arrayBufferToBase64(await main.save()), filename: exam.title });
  if (!res.ok) throw new Error(res.error || '서버 오류');

    delete SCAN[String(exam.id)];
    const ex = EXAMS.find(x => String(x.id) === String(exam.id)); if (ex) { ex.subjectiveCount = Math.max(0, (ex.subjectiveCount || 0) - ch.filter(x => x.from === '-').length + ch.filter(x => x.to === '-').length); }
    setTimeout(() => { goBack(); renderList(); }, pdfNote.indexOf('⚠️') >= 0 ? 6000 : 1200);
  } catch (e) { msg.textContent = '⚠️ ' + (e.message || e); btn.disabled = false; }
}

(async function () {
  try {
    const r = await callApi('listExams', { password: getTeacherPassword() });
    if (!r.ok) { $('ac-sum').textContent = r.error || '불러오지 못했어요'; return; }
    EXAMS = r.exams || []; renderList();
    // 다른 컴퓨터에서 한 「확인함」「수정함」 표시를 서버에서 받아 합친다 (이 컴퓨터에만 있던 표시는 서버로 올린다)
    (async () => { try { const mk = await callApi('getExamMarks', { password: getTeacherPassword() }); if (!mk || !mk.ok) return; const o = okSet(), d = doneSet(), sv = mk.marks || {};
      Object.keys(sv).forEach(id => { if (sv[id].ok) o[id] = sv[id].ok; else delete o[id]; if (sv[id].done) d[id] = sv[id].done; });
      Object.keys(o).forEach(id => { if (!sv[id] || !sv[id].ok) { if (!sv[id]) callApi('markExam', { password: getTeacherPassword(), id: id, ok: o[id] }).catch(() => {}); else delete o[id]; } });
      Object.keys(d).forEach(id => { if (!sv[id] || !sv[id].done) callApi('markExam', { password: getTeacherPassword(), id: id, done: d[id] }).catch(() => {}); });
      localStorage.setItem('ac_ok', JSON.stringify(o)); localStorage.setItem('ac_done', JSON.stringify(d)); renderList(); } catch (e) {} })();
    // 문제은행을 한 번 불러와 모든 시험지의 「빠진 번호」를 미리 계산한다 (일부만 연결된 시험지가 목록 위로 올라온다)
    (async () => { try { if (!BANK) { const lq = await callApi('listQuestions', { password: getTeacherPassword(), fresh: 1 }); if (lq.ok) BANK = lq.questions; } if (BANK) { EXAMS.forEach(ex => { const n = Math.max(0, (ex.answerCount || 0) - (ex.subjectiveCount || 0)); linkScan({ id: ex.id, title: ex.title, answers: new Array(n).fill('3') }); }); renderList(); } } catch (e) {} })();
    $('ac-all').addEventListener('change', renderList); $('ac-flt').addEventListener('change', renderList); $('ac-scansj').addEventListener('click', scanSubjAll); $('ac-scanall').addEventListener('click', scanAll); $('ac-q').addEventListener('input', renderList);
    const u = new URLSearchParams(location.search).get('id'); if (u) inspect(u);
  } catch (e) { $('ac-sum').textContent = '서버에 연결할 수 없어요.'; }
})();
</script>
