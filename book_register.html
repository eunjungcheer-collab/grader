<body>
<template id="page-content">
  <span class="backlink"><a href="index.html">← 홈으로</a></span>
  <h1>📚 교재 QR 합본 만들기</h1>
  <p class="muted">교재 PDF 한 권을 올리면 목차대로 소단원(25문제씩)을 찾아 <b>정답을 읽고</b>, 단원마다 시험을 등록한 뒤 <b>각 단원 첫 쪽에 QR을 찍은 교재 합본 PDF</b> 한 개를 만들어 드려요. 그 PDF를 학생에게 나눠주면 풀다가 단원 QR을 찍어 답안을 입력해요.</p>
  <div id="error-banner"></div>

  <div class="card" id="saved-card" style="display:none;">
    <details id="saved-drawer">
      <summary style="cursor:pointer; font-weight:700; padding:2px 0;">📁 전에 만들어 둔 합본 PDF <span class="muted" id="saved-count" style="font-weight:400;"></span> <span class="muted" style="font-weight:400;">— 눌러서 열기 (강사용/학생용 따로 내려받아요)</span></summary>
      <div id="saved-list" style="margin-top:8px;"></div>
    </details>
  </div>

  <div class="card">
    <label>교재 PDF (문제편 + 정답편이 한 파일, 목차에 쪽수가 있는 교재)</label>
    <input type="file" id="book-file" accept="application/pdf">
    <label class="field-label-spaced">교재 이름 <span class="muted" style="font-weight:400;">(시험 이름 앞에 붙어요. 예: 중2)</span></label>
    <input type="text" id="book-name" placeholder="예: 중2">
    <button type="button" class="btn primary" id="read-btn" style="width:100%; margin-top:14px;" disabled>1단계 · 목차와 정답 읽기</button>
    <p class="hint" id="read-msg" style="margin:8px 0 0;"></p>
  </div>

  <div id="step2" style="display:none;">
    <h2>2단계 · 확인하고 고치기</h2>
    <p class="hint">정답 칸: <b>숫자</b>는 객관식 정답, <b>-</b> 는 주관식(서술형 — 자동 채점 안 함), <b>?</b> 는 못 읽은 것이에요. 틀린 게 보이면 칸에서 바로 고치세요. 번호 순서대로 띄어쓰기로 구분돼 있어요.</p>
    <div class="card" style="padding:8px; overflow-x:auto;">
      <table class="bk-table" id="bk-table"></table>
    </div>
    <div class="card" style="margin-top:12px;">
      <label>QR 크기 / 위치</label>
      <div style="display:flex; gap:8px; align-items:center;">
        <select id="qr-size" style="width:auto;"><option value="40">작게 (40)</option><option value="46" selected>보통 (46)</option><option value="56">크게 (56)</option></select>
        <select id="qr-corner" style="width:auto;"><option value="top-right" selected>맨 위 오른쪽</option><option value="top-left">맨 위 왼쪽</option></select>
      </div>
      <label class="field-label-spaced"><input type="checkbox" id="to-bank" checked> 문제도 <b>문제은행에 「내신교재」 문제로 저장</b> (오답노트·유사오답이 일반 시험지처럼 돼요. 시간이 더 걸려요)</label>
      <label class="field-label-spaced"><input type="checkbox" id="stu-ver" checked> <b>학생용 합본</b>도 따로 만들기 — 끄면 <b>강사용 전체 합본</b> 한 파일만 만들어요</label>
      <label class="field-label-spaced" for="teacher-mode"><b>강사용 합본 모양</b></label>
      <select id="teacher-mode" style="width:100%;">
        <option value="expl" selected>정답 동그라미 + 문제 바로 아래 해설 (다른 시험지 강사용 해설서처럼 · 시간이 더 걸려요)</option>
        <option value="circle">교재 원본 쪽에 정답 동그라미만 (해설은 뒤쪽 정답·해설 쪽 그대로 · 빨라요)</option>
        <option value="none">동그라미·해설 없이 교재 원본 그대로 + QR (가장 빨라요)</option>
      </select>
      <label class="field-label-spaced"><input type="checkbox" id="new-cover"> <b>표지를 새로 만들기</b> — 체크하면 교재의 첫 쪽(표지)을 학년 색깔의 새 표지로 바꿔요. 체크 안 하면 교재 표지를 그대로 써요</label>
      <label class="field-label-spaced"><input type="checkbox" id="new-toc"> <b>목차를 새로 만들기</b> — 체크하면 교재에 있던 목차 쪽을 지우고 새 목차(눌러서 이동)를 넣어요. 체크 안 하면 교재 목차를 그대로 써요(목차가 없는 교재는 자동으로 만들어요)</label>
      <label class="field-label-spaced"><input type="checkbox" id="multi-qr" checked> 목차 쪽에 「여러 단원 한꺼번에 채점」 QR도 찍기</label>
      <button type="button" class="btn primary" id="go-btn" style="width:100%; margin-top:14px;">3단계 · 등록하고 QR 합본 PDF 만들기</button>
      <p class="hint" id="go-msg" style="margin:8px 0 0;"></p>
      <div id="dl-box" style="margin-top:10px;"></div>
      <p class="hint" id="sync-msg" style="margin:4px 0 0;"></p>
    </div>
  </div>
</template>

<script>
requireLogin();
renderHeader({ wide: true, wider: true });
setupPdfJs();
const $ = id => document.getElementById(id);
const isEssay = s => /서술|논술/.test(String(s.name || '') + ' ' + String(s.tag || ''));

let bookFile = null, bookDoc = null, bookFileName = '', sections = [], tocPage = 0, bookId = '';

$('book-file').addEventListener('change', () => {
  const f = $('book-file').files[0];
  $('read-btn').disabled = !f;
  if (f && !$('book-name').value) { const m = f.name.match(/중\s*[123]|초\s*[3-6]|고\s*[123]/); if (m) $('book-name').value = m[0].replace(/\s+/g, ''); else if (/(공통|통합)\s*과학/.test(f.name)) $('book-name').value = '고1'; }
});

function hash36(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; return h.toString(36); }
const secTitle = s => ($('book-name').value.trim() ? $('book-name').value.trim() + ' ' : '') + s.name + (s.tag ? ' ' + s.tag + '공략' : '');

let genToc = false;
// 교재에 원래 찍혀 있는 쪽 번호(「- 12 -」 같은 가장자리의 숫자)의 위치를 쪽마다 찾는다 — 지우고 새 번호로 다시 쓰려고
async function detectPageNumBoxes(doc, onProgress) {
  const out = {};
  for (let p = 1; p <= doc.numPages; p++) {
    if (onProgress && p % 20 === 0) onProgress(p, doc.numPages);
    try {
      const pg = await doc.getPage(p), H = pg.getViewport({ scale: 1 }).height, tc = await pg.getTextContent();
      const its = tc.items.filter(it => String(it.str).trim()).map(it => ({ s: String(it.str).trim(), x: it.transform[4], y: it.transform[5], w: it.width, h: Math.max(it.height || 0, 7) }));
      const edge = it => it.y < H * 0.075 || it.y > H * 0.93;
      const boxes = [];
      its.forEach(it => {
        if (!edge(it) || !/^[-–—]?\s*\d{1,4}\s*[-–—]?$/.test(it.s)) return;
        let x0 = it.x, x1 = it.x + it.w, dash = /[-–—]/.test(it.s);
        its.forEach(o => { if (o !== it && /^[-–—]$/.test(o.s) && Math.abs(o.y - it.y) < 3 && Math.abs(o.x - it.x) < 28 && Math.abs(o.x + o.w - it.x) < 28) { x0 = Math.min(x0, o.x); x1 = Math.max(x1, o.x + o.w); dash = true; } });
        boxes.push({ x0: x0, x1: x1, y0: it.y - 1.5, y1: it.y + Math.max(it.h * 0.78, 6.5), dash: dash });
      });
      if (boxes.length) out[p - 1] = boxes.slice(0, 2);
    } catch (e) {}
  }
  return out;
}
// PDF 안에서 누르면 다른 쪽으로 가는 링크 (rect = [왼쪽, 아래, 오른쪽, 위], PDF 좌표)
function addPageLink(pdf, fromIdx, rect, toIdx) {
  if (toIdx == null || toIdx < 0 || toIdx >= pdf.getPageCount() || fromIdx < 0 || fromIdx >= pdf.getPageCount()) return;
  const target = pdf.getPage(toIdx), page = pdf.getPage(fromIdx);
  const annot = pdf.context.obj({ Type: 'Annot', Subtype: 'Link', Rect: rect, Border: [0, 0, 0], Dest: [target.ref, PDFLib.PDFName.of('Fit')] });
  page.node.addAnnot(pdf.context.register(annot));
}
// 목차가 없는 교재: 표지 바로 뒤(표지가 없으면 맨 앞)에 목차 쪽을 새로 만들어 끼운다 (단원 이름 · 문제 쪽 · 정답 쪽). 끼운 쪽 수를 돌려준다.
// at = 목차를 끼울 자리(0이면 맨 앞, 1이면 표지 뒤). 끼운 자리 뒤의 쪽 번호만 nIns만큼 밀린다.
// 학년별 색깔의 새 표지 (한 쪽, 그림으로 만들어 첫 쪽에 올린다)
function coverCanvas(bookName, secs, W, H) {
  const K = 3, cv = document.createElement('canvas'); cv.width = Math.round(W * K); cv.height = Math.round(H * K);
  const x = cv.getContext('2d'); x.scale(K, K);
  const pal = /중\s*1/.test(bookName) ? { main: '#E4566D', soft: '#FDEBEE', deep: '#B93A50', grade: '중학교 1학년' }
    : /중\s*2/.test(bookName) ? { main: '#2F7BC0', soft: '#E4F0FA', deep: '#1D5A93', grade: '중학교 2학년' }
    : /중\s*3/.test(bookName) ? { main: '#7A55C2', soft: '#EFE9FA', deep: '#59399A', grade: '중학교 3학년' }
    : /고\s*1|공통|통합/.test(bookName) ? { main: '#139186', soft: '#E0F4F1', deep: '#0C6B62', grade: '고등학교 1학년' }
    : { main: '#0B1F5C', soft: '#E6EAF6', deep: '#08153F', grade: '' };
  // 교재 종류(파일 이름에서 읽음): 종류마다 이름·색을 달리한다
  const typeMap = [[/보충/, '보충', { '중1': ['#F08A3C', '#FFF1E4', '#C2631F'], '중2': ['#14A3A3', '#E1F5F5', '#0B7A7A'], '중3': ['#C2459B', '#FBE9F4', '#97307A'], '고': ['#D9822B', '#FDF0E0', '#A8631A'] }], [/심화/, '심화', { '중1': ['#8A4FD0', '#F0E8FB', '#6A35AA'], '중2': ['#1F8F5F', '#E2F5EC', '#146C47'], '중3': ['#D6553A', '#FDEAE5', '#A83E27'], '고': ['#3B5BDB', '#E7ECFD', '#2742A8'] }], [/기출/, '기출', {}], [/개념|기본/, '개념', {}]];
  const tm = typeMap.find(m => m[0].test(bookName)), typeLabel = tm ? tm[1] : '내신대비';
  if (tm && tm[2]) { const gk = /중\s*1/.test(bookName) ? '중1' : /중\s*2/.test(bookName) ? '중2' : /중\s*3/.test(bookName) ? '중3' : /고\s*1|공통|통합/.test(bookName) ? '고' : ''; const c3 = tm[2][gk]; if (c3) { pal.main = c3[0]; pal.soft = c3[1]; pal.deep = c3[2]; } }
  const FONT = '"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, pal.soft); g.addColorStop(1, '#FFFFFF'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = pal.main; x.globalAlpha = 0.08; x.beginPath(); x.arc(W * 0.92, H * 0.12, 190, 0, 7); x.fill(); x.beginPath(); x.arc(W * 0.05, H * 0.62, 120, 0, 7); x.fill(); x.globalAlpha = 1;
  // 배경 무늬: 학년마다 다른 과학 그림 (선만 아주 연하게)
  const kind = /중\s*1/.test(bookName) ? 1 : /중\s*2/.test(bookName) ? 2 : /중\s*3/.test(bookName) ? 3 : /고\s*1|공통|통합/.test(bookName) ? 4 : 0;
  x.save(); x.strokeStyle = pal.main; x.fillStyle = pal.main; x.lineCap = 'round'; x.lineJoin = 'round';
  const hexP = (cx, cy, r) => { x.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i + Math.PI / 6; x[i ? 'lineTo' : 'moveTo'](cx + r * Math.cos(a), cy + r * Math.sin(a)); } x.closePath(); x.stroke(); };
  const dot = (cx, cy, r) => { x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); };
  const orbit = (cx, cy, rx, ry, rot) => { x.beginPath(); x.ellipse(cx, cy, rx, ry, rot, 0, 7); x.stroke(); };
  const atom = (cx, cy, s) => { x.globalAlpha = 0.2; x.lineWidth = 1.4; for (let k = 0; k < 3; k++) orbit(cx, cy, s, s * 0.36, Math.PI / 3 * k); x.globalAlpha = 0.3; dot(cx, cy, s * 0.1); [[0.9, 0.2], [-0.55, 0.65], [-0.3, -0.85]].forEach(e => dot(cx + e[0] * s * 0.95, cy + e[1] * s * 0.34, s * 0.055)); };
  const molecule = (cx, cy, r) => { x.globalAlpha = 0.2; x.lineWidth = 1.5; const dx = r * Math.sqrt(3); hexP(cx, cy, r); hexP(cx + dx, cy, r); hexP(cx + dx / 2, cy + r * 1.5, r); x.globalAlpha = 0.32; [[cx, cy - r], [cx + dx, cy - r], [cx + dx * 1.5, cy + r * 0.5], [cx - dx / 2, cy + r * 0.5], [cx + dx / 2, cy + r * 2.5]].forEach(q => dot(q[0], q[1], r * 0.14)); };
  const helix = (cx, y0, y1, amp, wl) => { x.globalAlpha = 0.2; x.lineWidth = 1.6; [0, Math.PI].forEach(ph => { x.beginPath(); for (let y = y0; y <= y1; y += 3) { const xx = cx + amp * Math.sin((y - y0) / wl * 2 * Math.PI + ph); x[y === y0 ? 'moveTo' : 'lineTo'](xx, y); } x.stroke(); }); x.lineWidth = 1; for (let y = y0; y <= y1; y += wl / 6) { const a1 = cx + amp * Math.sin((y - y0) / wl * 2 * Math.PI), a2 = cx - (a1 - cx); x.beginPath(); x.moveTo(a1, y); x.lineTo(a2, y); x.stroke(); } };
  const wave = (y0, amp, wl, x0, x1, n) => { for (let k = 0; k < n; k++) { x.globalAlpha = 0.2 - k * 0.04; x.lineWidth = 1.5; x.beginPath(); for (let xx = x0; xx <= x1; xx += 3) { const yy = y0 + k * 14 + amp * Math.sin((xx - x0) / wl * 2 * Math.PI + k * 0.6); x[xx === x0 ? 'moveTo' : 'lineTo'](xx, yy); } x.stroke(); } };
  const flask = (cx, cy, s) => { x.globalAlpha = 0.22; x.lineWidth = 1.6; x.beginPath(); x.moveTo(cx - s * 0.18, cy - s * 0.5); x.lineTo(cx - s * 0.18, cy - s * 0.1); x.lineTo(cx - s * 0.5, cy + s * 0.5); x.quadraticCurveTo(cx - s * 0.55, cy + s * 0.6, cx - s * 0.4, cy + s * 0.6); x.lineTo(cx + s * 0.4, cy + s * 0.6); x.quadraticCurveTo(cx + s * 0.55, cy + s * 0.6, cx + s * 0.5, cy + s * 0.5); x.lineTo(cx + s * 0.18, cy - s * 0.1); x.lineTo(cx + s * 0.18, cy - s * 0.5); x.stroke(); x.beginPath(); x.moveTo(cx - s * 0.26, cy - s * 0.5); x.lineTo(cx + s * 0.26, cy - s * 0.5); x.stroke(); x.beginPath(); x.moveTo(cx - s * 0.34, cy + s * 0.25); x.lineTo(cx + s * 0.34, cy + s * 0.25); x.stroke(); x.globalAlpha = 0.3; dot(cx - s * 0.1, cy + s * 0.4, s * 0.05); dot(cx + s * 0.12, cy + s * 0.33, s * 0.035); dot(cx + s * 0.02, cy + s * 0.5, s * 0.03); };
  const grid = (x0, y0, cols, rows, r) => { x.globalAlpha = 0.14; x.lineWidth = 1.2; const dx = r * Math.sqrt(3); for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) hexP(x0 + i * dx + (j % 2 ? dx / 2 : 0), y0 + j * r * 1.5, r); };
  const stars = (pts) => { x.globalAlpha = 0.3; pts.forEach(q => dot(q[0], q[1], q[2])); };
  if (kind === 1) { molecule(W * 0.64, H * 0.05, 34); flask(W * 0.86, H * 0.2, 90); wave(H * 0.9, 9, 120, 0, W, 3); stars([[W * 0.55, H * 0.2, 2.5], [W * 0.93, H * 0.08, 2], [W * 0.1, H * 0.78, 2.5]]); }
  else if (kind === 2) { atom(W * 0.78, H * 0.13, 110); atom(W * 0.12, H * 0.8, 62); wave(H * 0.92, 10, 150, 0, W, 3); stars([[W * 0.5, H * 0.08, 2.5], [W * 0.95, H * 0.3, 2], [W * 0.3, H * 0.74, 2]]); }
  else if (kind === 3) { helix(W * 0.86, 20, 240, 26, 110); helix(W * 0.12, H * 0.74, H * 0.74 + 150, 18, 80); wave(H * 0.9, 8, 130, 0, W, 3); stars([[W * 0.7, H * 0.06, 2.5], [W * 0.62, H * 0.2, 2], [W * 0.08, H * 0.7, 2.5]]); }
  else if (kind === 4) { grid(W * 0.55, 18, 6, 6, 26); atom(W * 0.14, H * 0.8, 66); stars([[W * 0.5, H * 0.18, 2.5], [W * 0.93, H * 0.34, 2], [W * 0.35, H * 0.72, 2]]); }
  else { grid(W * 0.5, 20, 6, 5, 28); atom(W * 0.86, H * 0.2, 70); }

      let cn = 0, ferr = null;
      await Promise.all(Array.from({ length: Math.min(4, chunks.length) }, async () => {
        while (!ferr) { const k = cn++; if (k >= chunks.length) return; let r = null; for (let at = 0; at < 4; at++) { try { r = await callApi('saveQuestions', { password: getTeacherPassword(), questions: chunks[k] }); break; } catch (e) { if (at === 3 || !/연결하지 못했어요|이상한 응답|서버 요청에 실패/.test(e.message)) throw e; await new Promise(res => setTimeout(res, 2000 * (at + 1))); } } if (!r.ok) ferr = new Error(r.error || '문제 저장 실패'); }
      }));
      if (ferr) throw ferr;
      bankQ += items.length;
      return items.map(x => ({ id: x.id, text: x.textPreview }));
    };
    { let pi = 0; for (const s of chosen) { pi++; msg('문제 쪽을 읽는 중... ' + pi + '/' + chosen.length + ' ' + secTitle(s)); try { await getSec(s); } catch (e) {} try { await bookDoc.cleanup(); } catch (e) {} } }
    const worker = async () => {
      while (!fail) {
        const k = next++; if (k >= regList.length) return;
        const s = regList[k], title = secTitle(s);
        if (byTitle[title]) { ids[s.order] = byTitle[title]; reused++; continue; }
        const id = genExamId();
        let saved = null;
        if (toBank) { msg('문제 저장 중... ' + secTitle(s) + ' (' + (made + reused) + '/' + regList.length + '개 단원 등록됨)'); try { saved = await bankSection(s, title); try { await bookDoc.cleanup(); } catch (e2) {} } catch (e) { fail = new Error(title + ': ' + e.message); return; } }
        const res = await callApi('createExam', {
          password: getTeacherPassword(), id: id, title: title, answers: s.answers, filename: title,
          sourceQuestionIds: saved ? saved.map(x => x.id) : undefined, questionTexts: saved ? saved.map(x => x.text) : undefined,
          composeRecipe: { book: bookId, bookTitle: ($('book-name').value.trim() || bookFileName.replace(/\.pdf$/i, '')), unit: s.unit, unitName: s.unitName, tag: s.tag, label: s.name + ' ' + s.tag, order: s.order },
        });
        if (!res.ok) { fail = new Error(title + ': ' + (res.error || '등록 실패')); return; }
        ids[s.order] = id; made++;
        msg('시험 등록 중... ' + (made + reused) + '/' + regList.length);
      }
    };
    await Promise.all(Array.from({ length: toBank ? 2 : 3 }, worker));
    if (fail) throw fail;

    try { await bookDoc.cleanup(); } catch (e) {}
    msg('교재 PDF에 QR을 찍는 중... (파일이 커서 1~2분 걸릴 수 있어요)');
    const size = parseInt($('qr-size').value, 10), corner = $('qr-corner').value;
    let i = 0;
    for (const s of regList) {
      msg('QR 찍는 중... ' + (++i) + '/' + regList.length);
      await stampQrOnPage(await getPdf(), s.qa - 1, studentLinkFor(ids[s.order]), { size: size, corner: corner, margin: 8, caption: 'QR코드로 답안 입력하세요' });
    }
    // 강사용 합본: 각 단원의 문제 쪽을 「문제 + 정답 동그라미 + 바로 아래 해설」 모양으로 새로 짜 둔다 (다른 시험지의 강사용 해설서와 같은 모양)
    const teacherSec = {};      // s.order → { doc: 새로 짠 PDF(pdf-lib) }
    try {
      let ci = 0;
      for (const s of ($('teacher-mode').value === 'expl' ? chosen : [])) {
        ci++; msg('강사용 해설서 만드는 중... ' + ci + '/' + chosen.length + ' ' + secTitle(s));
        try {
          const sc = await getSec(s); if (!sc.ok) { teacherSkip.push(secTitle(s)); continue; }
          const doc = sc.doc, qs = sc.qs;
          const pgs = []; for (let p = s.aa; p <= s.ab; p++) pgs.push(p);
          let exps = {}; try { exps = await BankCore.bookExplanations(bookDoc, pgs); } catch (e) {}
          const items = [];
          for (const q of qs) {
            const canvas = await BankCore.renderQuestion(doc, q, BankCore.CROP_SCALE, true);
            const it = { base64: BankCore.canvasToBase64(canvas), width: canvas.width, height: canvas.height, naturalW: canvas.width / BankCore.CROP_SCALE, num: q.num, noBadge: true, answer: s.answers[q.num - 1] || '' };
            const ex = exps[q.origNum !== undefined ? q.origNum : q.num + (s.base || 0)];
            if (ex && ex.segments.length) { try { const ec = await BankCore.renderExplanation(bookDoc, ex, 2.2); it.explBase64 = BankCore.canvasToBase64(ec); it.explW = ec.width; it.explH = ec.height; ec.width = ec.height = 0; } catch (e) {} }
            canvas.width = canvas.height = 0;      // 그림 메모리를 바로 돌려준다
            items.push(it);
          }
          teacherSec[s.order] = { doc: await BankCore.composeTeacherPdf(PDFLib, secTitle(s), items, { keepTitle: false }), withExpl: items.filter(x => x.explBase64).length, n: items.length };
          items.length = 0; try { await bookDoc.cleanup(); } catch (e2) {}
        } catch (e) {}
      }
    } catch (e) {}
    // 「정답 동그라미만」 모드: 교재 원본 문제 쪽 위에 정답(①~⑤, <보기>의 ㄱ·ㄴ…)에 빨간 동그라미를 그릴 위치를 찾아 둔다
    const circles = {};      // 원래 쪽 번호(0부터) → [{ x, y(위에서부터), rx, ry }]
    if ($('teacher-mode').value === 'circle') {
      let ci = 0;
      for (const s of chosen) {
        ci++; msg('정답 동그라미 위치 찾는 중... ' + ci + '/' + chosen.length + ' ' + secTitle(s));
        try {
          const sc = await getSec(s); if (!sc.ok) { teacherSkip.push(secTitle(s)); continue; }
          const doc = sc.doc, qs = sc.qs;
          const SC = BankCore.CROP_SCALE;
          for (const q of qs) {
            if ((q.pre && q.pre.length) || (q.extra && q.extra.length)) continue;
            const digs = String(s.answers[q.num - 1] == null ? '' : s.answers[q.num - 1]).replace(/[^0-9]/g, '').split('').map(Number).filter(n => n >= 1 && n <= 5);
            if (!digs.length) continue;
            const canvas = await BankCore.renderQuestion(doc, q, SC, true);
            const mk = BankCore.detectOptionMarkers(canvas);
            if (!mk || mk.length !== 5) continue;
            const key = s.qa - 1 + (q.page - 1), list = (circles[key] = circles[key] || []);
            const put = (cx, cy, rx, ry) => list.push({ x: q.rect[0] + cx / SC, y: q.rect[1] + cy / SC, rx: rx / SC, ry: ry / SC });
            const seen = {};
            digs.forEach(n => { if (seen[n]) return; seen[n] = 1; const m = mk[n - 1], rr = m.r * 1.25; put(m.cx, m.cy, rr, rr); });
            try { BankCore.detectBogiMarks(canvas, mk, Object.keys(seen).map(Number)).forEach(b => put(b.cx, b.cy, b.rx, b.ry)); } catch (e) {}
          }
        } catch (e) {}
      }
    }
    msg('교재에 원래 있던 쪽 번호를 찾는 중...');
    const numBoxes = await detectPageNumBoxes(bookDoc, (i, n) => msg('원래 쪽 번호 찾는 중... ' + i + '/' + n));
    // 메모리 절약: 단원별 임시 문서를 먼저 비우고, 그 다음에 원본을 연다
    for (const k of Object.keys(secCache)) { try { const c = await secCache[k]; if (c && c.doc && c.doc.destroy) await c.doc.destroy(); } catch (e) {} delete secCache[k]; }
    const stampedBytes = await (await getPdf()).save();
    pdf = null;
    for (const k of Object.keys(secCache)) { try { const c = await secCache[k]; if (c && c.doc && c.doc.destroy) await c.doc.destroy(); } catch (e) {} delete secCache[k]; }
    const stem = bookFileName.replace(/\.pdf$/i, '');
    const bookNm = $('book-name').value.trim() || stem;
    // 한 가지 버전 만들기: 정답·해설 쪽을 뺄지 정하고 → 원래 쪽 번호를 하얗게 지우고 → (목차가 없던 교재면) 목차 쪽을 표지 뒤에 끼우고 → 새 쪽 번호를 쓴다
    const makeVersion = async (withAns) => {
      const doc = await PDFLib.PDFDocument.load(stampedBytes, { ignoreEncryption: true, updateMetadata: false });
      const drop = new Set();
      const useGen = genToc || $('new-toc').checked;
      if ($('new-toc').checked && tocPage) {        // 교재의 원래 목차 쪽(목차 첫 쪽 ~ 첫 문제 바로 앞 쪽)을 지운다
        const fq = Math.min.apply(null, chosen.map(s => s.qa)); for (let p = tocPage; p < fq; p++) drop.add(p - 1);
      }
      let kept = doc.getPageIndices().filter(i => !drop.has(i));
      for (let i = doc.getPageCount() - 1; i >= 0; i--) if (drop.has(i)) doc.removePage(i);
      if ($('new-cover').checked) {      // 교재에 표지가 없으면(첫 쪽이 바로 문제) 맨 앞에 표지 쪽을 하나 끼워 둔다 (아래에서 새 표지로 채운다)
        const fq = Math.min.apply(null, chosen.map(s => s.qa - 1)), at0 = kept.indexOf(fq);
        if (at0 === 0) { const sz = doc.getPage(0).getSize(); doc.insertPage(0, [sz.width, sz.height]); kept.unshift(-1); }
      }
      if (withAns) {
        // 문제 쪽을 새로 짠 강사용 해설서 쪽으로 바꿔 끼운다 (kept: 원래 쪽 번호, 새 쪽은 1e6+원래 첫 쪽 / -1)
        const reps = chosen.filter(s => teacherSec[s.order]).sort((a, b) => b.qa - a.qa);
        for (const s of reps) {
          const t = teacherSec[s.order].doc, n = t.getPageCount(), at = kept.indexOf(s.qa - 1);
          if (at < 0) continue;
          const cnt = s.qb - s.qa + 1, copied = await doc.copyPages(t, t.getPageIndices());
          copied.forEach((pg, k) => doc.insertPage(at + k, pg));
          for (let k = 0; k < cnt; k++) doc.removePage(at + n);
          kept.splice(at, cnt, ...copied.map((_, k) => k === 0 ? 1e6 + s.qa - 1 : -1));
          if (ids[s.order]) await stampQrOnPage(doc, at, studentLinkFor(ids[s.order]), { size: size, corner: corner, margin: 8, caption: 'QR코드로 답안 입력하세요' });
        }
      }
      const white = PDFLib.rgb(1, 1, 1);
      kept.forEach((orig, j) => { const pgj = doc.getPage(j); (numBoxes[orig] || []).forEach(bx => pgj.drawRectangle({ x: bx.x0 - 2, y: bx.y0, width: bx.x1 - bx.x0 + 4, height: bx.y1 - bx.y0, color: white, borderWidth: 0 })); });
      if (withAns) kept.forEach((orig, j) => { const pgj = doc.getPage(j), H = pgj.getHeight(); (circles[orig] || []).forEach(c => pgj.drawEllipse({ x: c.x, y: H - c.y, xScale: c.rx, yScale: c.ry, borderColor: PDFLib.rgb(0.76, 0.22, 0.17), borderWidth: 1.5 })); });
      const posOf = p => { let i = kept.indexOf(p - 1); if (i < 0) i = kept.indexOf(1e6 + p - 1); return i + 1; };
      let nIns = 0;
      // 표지가 있으면(첫 단원이 1쪽부터 시작하지 않으면) 목차는 표지 바로 뒤에, 없으면 맨 앞에
      const firstQ = Math.min.apply(null, chosen.map(s => posOf(s.qa)).filter(n => n > 0));
      const tocAt = (isFinite(firstQ) && firstQ > 1) ? 1 : 0;
      if (useGen) nIns = await insertGeneratedToc(doc, chosen, bookNm, posOf, withAns, tocAt);
      if (!useGen) {
        // 교재에 원래 있던 목차: 각 줄(단원·문제 쪽)을 누르면 문제 첫 쪽, 정답 쪽 숫자를 누르면 정답 첫 쪽으로
        sections.forEach(s => {
          const L = s.tocLink; if (!L) return;
          const from = kept.indexOf(L.page - 1); if (from < 0) return;
          const q = posOf(s.qa) - 1, a = posOf(s.aa) - 1;
          if (L.ansX && a >= 0) { addPageLink(doc, from, [L.x0, L.y0, L.ansX, L.y1], q); addPageLink(doc, from, [L.ansX, L.y0, L.x1, L.y1], a); }
          else addPageLink(doc, from, [L.x0, L.y0, L.x1, L.y1], q);
        });
      }
      if ($('multi-qr').checked && (tocPage || useGen)) {
        const base = location.origin + location.pathname.replace(/[^/]*$/, '');
        const ti = useGen ? tocAt : kept.indexOf(tocPage - 1);
        if (ti >= 0) await stampQrOnPage(doc, ti, base + 'student_multi.html?book=' + bookId, { size: 56, corner: 'top-right', margin: 8, caption: '여러 단원 한꺼번에 채점 → QR' });
      }
      let coverDone = false;
      if ($('new-cover').checked && isFinite(firstQ) && firstQ > 1) {        // 첫 쪽(표지)을 새 표지로 바꾼다 (쪽 수는 그대로)
        try {
          const ref = doc.getPage(0).getSize(), cvs = coverCanvas(bookNm, chosen.slice().sort((a, b) => a.order - b.order), ref.width, ref.height);
          const png = await doc.embedPng(cvs.toDataURL('image/png')), np = doc.insertPage(0, [ref.width, ref.height]);
          np.drawImage(png, { x: 0, y: 0, width: ref.width, height: ref.height }); doc.removePage(1); coverDone = true;
        } catch (e) { console.warn('cover', e); }
      }
      // 표지에 '강사용' / '학생용' 표시를 찍는다 (기존 표지든 새 표지든)
      {   // 표지가 없는 교재도 첫 쪽에 찍는다
        try {
          const lab = withAns ? '강사용' : '학생용', col = withAns ? '#c8102e' : '#1f4e9c';
          const cv = document.createElement('canvas'); cv.width = 440; cv.height = 150;
          const cx2 = cv.getContext('2d');
          cx2.fillStyle = '#ffffff'; cx2.strokeStyle = col; cx2.lineWidth = 10;
          const rr = (x, y, w, h, r) => { cx2.beginPath(); cx2.moveTo(x + r, y); cx2.arcTo(x + w, y, x + w, y + h, r); cx2.arcTo(x + w, y + h, x, y + h, r); cx2.arcTo(x, y + h, x, y, r); cx2.arcTo(x, y, x + w, y, r); cx2.closePath(); };
          rr(8, 8, 424, 134, 36); cx2.fill(); cx2.stroke();
          cx2.fillStyle = col; cx2.font = 'bold 84px "Noto Sans CJK KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif'; cx2.textAlign = 'center'; cx2.textBaseline = 'middle';
          cx2.fillText(lab, 220, 80);
          const pg0 = doc.getPage(0), sz = pg0.getSize(), w = Math.min(150, sz.width * 0.28), h = w * 150 / 440;
          const bimg = await doc.embedPng(cv.toDataURL('image/png'));
          pg0.drawImage(bimg, { x: (sz.width - w) / 2, y: sz.height * 0.155 - h / 2, width: w, height: h });
        } catch (e) { console.warn('cover label', e); }
      }
      const font = await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);
      doc.getPages().forEach((pgj, j) => {
        if (coverDone && j === 0) return;
        const orig = j < tocAt ? kept[j] : (j - nIns >= tocAt ? kept[j - nIns] : -1), bx = (numBoxes[orig] || [])[0];
        const t = (bx && bx.dash ? '- ' + (j + 1) + ' -' : String(j + 1)), fs = 9.5, tw = font.widthOfTextAtSize(t, fs);
        const cx = bx ? (bx.x0 + bx.x1) / 2 : pgj.getWidth() / 2, y = bx ? bx.y0 + 1 : 16;
        pgj.drawText(t, { x: cx - tw / 2, y: y, size: fs, font: font, color: PDFLib.rgb(0.1, 0.1, 0.1) });
      });
      return await doc.save();
    };
    const dl = (bytes, name) => { const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' })); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000); };
    const wantStu = $('stu-ver').checked;
    msg('강사용 전체 합본을 만드는 중...');
    let teacherBytes = await makeVersion(true);
    const teacherBlob = new Blob([teacherBytes], { type: 'application/pdf' }); teacherBytes = null;
    let stuBytes = null;
    if (wantStu) { msg('학생용 합본을 만드는 중...'); stuBytes = await makeVersion(false); }
    const saveKey = 'm' + Date.now();
    const rec = { id: saveKey, name: stem, date: new Date().toISOString(), teacher: teacherBlob, student: stuBytes ? new Blob([stuBytes], { type: 'application/pdf' }) : null };
    let savedOk = true; try { await mergeDbPut(rec); } catch (e) { savedOk = false; }
    showDownloads(rec);
    renderSaved();
    syncToServer(rec);
    const base2 = location.origin + location.pathname.replace(/[^/]*$/, '');
    $('go-msg').innerHTML = '✅ 완료! 새로 등록 ' + made + '개' + (bankQ ? ' · 문제은행에 내신교재 문제 ' + bankQ + '개 저장' : '') + (reused ? ' · 이미 있던 시험 ' + reused + '개' : '') + '. ' + (savedOk ? '합본 PDF는 아래 버튼으로 내려받아요(이 기기에 저장돼 나중에도 받을 수 있어요).' : '합본 PDF는 아래 버튼으로 내려받아요. (이 기기에는 저장하지 못했어요)') + '<br>여러 단원 한꺼번에 채점 주소: <a href="student_multi.html?book=' + bookId + '" target="_blank">' + base2 + 'student_multi.html?book=' + bookId + '</a><br>등록된 시험은 <a href="teacher_list.html" target="_blank">시험지 목록</a>에서 볼 수 있어요.' + (teacherSkip.length ? '<br><b style="color:#C1392B;">강사용에 정답·해설을 못 붙인 단원(문항 번호와 정답이 안 맞음): ' + teacherSkip.map(escapeHtml).join(' / ') + '</b>' : '') + (bankWarn.length ? '<br><b style="color:#C1392B;">문제은행에는 못 넣은 단원(문항 수가 정답과 안 맞음): ' + bankWarn.map(escapeHtml).join(' / ') + '</b> — 시험(QR 채점)은 정상 등록됐어요.' : '');
  } catch (e) {
    err.innerHTML = '<div class="banner error">' + escapeHtml(e.message) + '</div>';
    $('go-msg').textContent = '';
  }
  $('go-btn').disabled = false;
});
</script>
