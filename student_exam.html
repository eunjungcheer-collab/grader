<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0B1F5C">
<title>답안 제출 - 자동 채점 시스템</title>
<link rel="stylesheet" href="css/style.css?v=202611250125">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#95D1DB">
<style>
.sx-prog{position:sticky;top:0;z-index:15;background:#fff;border-bottom:1.5px solid var(--ink);padding:8px 16px;margin:0 -20px 12px;display:none;}
.sx-prog .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:5px;}
.sx-prog .bar i{display:block;height:100%;width:0;background:var(--point);transition:width .2s;}
.sx-prog .row{display:flex;justify-content:space-between;font-size:13px;font-weight:800;}
.qrow{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:12px;border:1.5px solid transparent;margin-bottom:4px;transition:background .15s;}
.qrow.done{background:#EEF2FF;}
.qrow.miss{background:#FBEAE7;border-color:var(--red);animation:sxshake .3s;}
@keyframes sxshake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.qnum{min-width:30px;font-weight:900;font-size:17px;color:var(--point);text-align:right;}
.ans-btns{display:flex;gap:7px;flex:1;}
.qrow .ans-btn{flex:1;width:auto;height:50px;border-radius:12px;font-size:18px;}
.qrow .ans-btn.selected{box-shadow:0 2px 0 var(--point-dark);transform:translateY(-1px);}
.qrow{flex-wrap:wrap;}.multi-note{flex-basis:100%;margin:-2px 0 0 40px;font-size:11.5px;color:#B45309;font-weight:800;}
.qrow.is-sub{opacity:.55;}.sub-note{font-size:12.5px;color:var(--muted);}
.sx-submit{position:sticky;bottom:0;margin:20px -20px 0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,#F7F5EF 70%,rgba(247,245,239,0));}
.sx-ring{width:150px;height:150px;border-radius:50%;margin:8px auto 4px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;color:var(--point);}
.sx-ring span{font-size:18px;color:var(--muted);margin-left:2px;}
.sx-chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0;}
.sx-chip{border-radius:10px;padding:8px 0;text-align:center;font-weight:800;font-size:13px;border:1.5px solid var(--line);background:#fff;}
.sx-chip.ok{background:#e8f5ee;border-color:#1a7a4a;color:#145a32;}
.sx-chip.x{background:#FBEAE7;border-color:var(--red);color:var(--red-dark);}
.sx-chip.na{background:#F3F4F6;color:#9CA3AF;}
.sx-chip small{display:block;font-weight:600;font-size:11px;}
</style>
</head>
<body>
<template id="page-content">
  <div id="content-area" class="muted">불러오는 중...</div>
</template>

<script src="js/config.js?v=202611250125"></script>
<script src="js/api.js?v=202611250125"></script>
<script src="js/common.js?v=202611250125"></script>
<script src="js/confirmans.js?v=202611250125"></script>
<script>
renderHeader();  // 학생은 로그인 필요 없음 — requireLogin() 호출 안 함

const examId = new URLSearchParams(location.search).get('id');
function escapeHtml(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
let answerCount = 0;
let subjective = [];   // 주관식 문항 번호(1부터)
let nums = null;       // 교재 번호(시험지에 찍힌 번호). 없으면 1부터
const dn = i => (nums && nums[i] != null ? nums[i] : i + 1);
const dnOf = k => dn(k - 1);
let multi = [];        // 정답이 2개 이상인(복수 선택) 문항 번호(1부터)
const isMulti = i => multi.indexOf(i + 1) >= 0;
const isSub = i => subjective.indexOf(i + 1) >= 0;
let studentAnswers = [];
const FROM_APP = new URLSearchParams(location.search).get('app') === '1';
let STU_NAME = '';
try { STU_NAME = sessionStorage.getItem('stu_name') || ''; if (!STU_NAME) { const l = JSON.parse(localStorage.getItem('stu_login') || sessionStorage.getItem('stu_login') || 'null'); if (l && l.name) STU_NAME = l.name; } } catch (e) {}
function updateProgress() {
  const need = []; for (let i = 0; i < answerCount; i++) if (!isSub(i) && !skipSet.has(i + 1)) need.push(i);
  const done = need.filter(i => studentAnswers[i]).length;
  const t = document.getElementById('sx-ptxt'); if (!t) return;
  t.textContent = '답 입력 ' + done + ' / ' + need.length;
  document.getElementById('sx-pbar').style.width = (need.length ? done / need.length * 100 : 0) + '%';
  const left = need.length - done; document.getElementById('sx-pleft').textContent = left ? left + '문항 남았어요' : '✅ 다 입력했어요!';
  document.querySelectorAll('#answer-grid .qrow').forEach((r, i) => { r.classList.toggle('done', !!studentAnswers[i]); if (studentAnswers[i]) r.classList.remove('miss'); });
}
function advanceFrom(q) {
  // 한 문항을 고르면 다음에 풀 문항이 화면 가운데로 오게 부드럽게 이동
  const rows = document.querySelectorAll('#answer-grid .qrow');
  for (let i = q + 1; i < rows.length; i++) if (!isSub(i) && !skipSet.has(i + 1) && !studentAnswers[i]) { rows[i].scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
}

// ── 이어서 입력 / 답안 고치기 ──
// EDIT: 이전에 낸 기록을 고치는 중일 때 {mode:'fill'|'fix', submittedAt, answers, name}. 'fill'=비워 둔 문항만 채움(이미 입력한 답은 잠김), 'fix'=밀려 쓴 답을 한 번 고침
let EDIT = null; try { EDIT = JSON.parse(sessionStorage.getItem('sx_edit_' + examId) || 'null'); sessionStorage.removeItem('sx_edit_' + examId); } catch (e) {}
const oorQ = i => !!(EDIT && EDIT.oor && EDIT.oor.indexOf(i + 1) >= 0);      // 처음에 「시험 범위가 아니라서」 뺀 문항 — 이어서 입력해도 계속 빠진 채로 둔다
const lockedQ = i => !!(EDIT && (oorQ(i) || (EDIT.mode === 'fill' && EDIT.answers && EDIT.answers[i] && EDIT.answers[i] !== '~')));
let skipWhy = 'scope';      // 직접 적은 「안 푸는 문항」의 이유: scope=시험 범위가 아님(계속 빠짐) / later=나중에 풀 예정(이어서 입력 가능)
let chipOff = new Set();      // 30문항이 넘는 시험에서 「지금은 입력하지 않을」 구간(0부터)
const CHUNK = 30;
function rangeText(list) { const a = list.slice().sort((x, y) => x - y), out = []; let st = null, pv = null; a.forEach(k => { if (st === null) { st = pv = k; } else if (k === pv + 1) { pv = k; } else { out.push(st === pv ? dnOf(st) + '번' : dnOf(st) + '~' + dnOf(pv) + '번'); st = pv = k; } }); if (st !== null) out.push(st === pv ? dnOf(st) + '번' : dnOf(st) + '~' + dnOf(pv) + '번'); return out.join(', '); }
function goEdit(mode, subm, answers, name, shift, oor) { try { sessionStorage.setItem('sx_edit_' + examId, JSON.stringify({ mode: mode, submittedAt: subm, answers: answers, name: name, shift: !!shift, oor: oor || [] })); } catch (e) {} location.reload(); }

async function loadExam() {
  const area = document.getElementById('content-area');
  if (!examId) { area.innerHTML = '<div class="banner error">잘못된 링크예요.</div>'; return; }

  try {
    const res = await callApi('getExamPublic', { id: examId });
    if (!res.ok) { area.innerHTML = '<div class="banner error">' + res.error + '</div>'; return; }

    answerCount = res.answerCount;
    subjective = res.subjective || [];
    multi = res.multi || [];
    nums = (res.nums && res.nums.length === answerCount) ? res.nums : null;
    studentAnswers = new Array(answerCount).fill('');

    area.innerHTML = `
      <h1>${escapeHtml(res.title)}</h1>
      <p class="muted">이름과 정답을 입력하고 제출하면 바로 채점돼요.${multi.length ? '<br><b>복수 선택(' + multi.map(dnOf).join(', ') + '번)은 정답을 모두 골라야 해요.</b> 번호를 여러 개 눌러서 선택하고, 다시 누르면 취소돼요.' : ''}${subjective.length ? '<br><b>주관식(' + subjective.join(', ') + '번)은 회색으로 표시돼요.</b> 여기서 입력하지 않고 선생님이 따로 채점해요.' : ''}</p>
      ${res.book ? '<a class="btn outline" href="student_multi.html?book=' + encodeURIComponent(res.book) + '" style="width:100%; margin-bottom:10px;">📚 같은 교재의 다른 단원도 함께 채점하기</a>' : ''}
      <div class="sx-prog" id="sx-prog"><div class="row"><span id="sx-ptxt">답 입력 0 / 0</span><span id="sx-pleft" style="color:var(--muted);font-weight:600;"></span></div><div class="bar"><i id="sx-pbar"></i></div></div>
      <form id="answer-form" class="card">
        <div id="edit-banner" style="display:none; margin-bottom:10px; padding:10px 12px; border-radius:10px; font-size:14px; line-height:1.5;"></div>
        <label>이름</label>
        <input type="text" id="student-name" required autocomplete="off" value="${escapeHtml(STU_NAME)}">
        <div id="dl-box" style="display:none; margin-top:8px; padding:8px 10px; border-radius:8px; background:#FFF4E0; border:1px solid #F3D9A4; color:#7A4A00; font-size:14px;"></div>
        <label style="margin-top:12px;">안 푸는 문항 <span class="hint" style="font-weight:400;">(선택 · 예: 1-10 또는 1-10, 15 · 풀지 않는 번호는 채점에서 빠져요)</span></label>
        <input type="text" id="skip-input" placeholder="예: 1-10" inputmode="numeric" autocomplete="off">
        <div id="skip-why" style="display:none; margin-top:8px; font-size:14px;">
          <span class="hint" style="font-weight:700;">왜 안 푸나요?</span>
          <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;"><button type="button" class="btn primary" data-why="scope" style="padding:7px 12px;">시험 범위가 아니에요</button><button type="button" class="btn outline" data-why="later" style="padding:7px 12px;">나중에 풀 거예요</button></div>
          <div class="hint" id="skip-why-hint" style="margin-top:4px;"></div>
        </div>
        <div id="range-box" style="display:none; margin-top:12px; padding:10px 12px; border-radius:10px; background:#F0F6FF; border:1px solid #BBD3F5;"></div>
        <div id="answer-grid" style="margin-top:16px;"></div>
        <div class="sx-submit"><button type="submit" class="btn primary" style="width:100%; font-size:17px; padding:15px;">제출하고 채점받기</button></div>
      </form>
    `;

    const grid = document.getElementById('answer-grid');
    for (let i = 0; i < answerCount; i++) {
      const row = document.createElement('div');
      if (isSub(i)) {
        row.className = 'qrow is-sub';
        row.innerHTML = `<span class="qnum">${dn(i)}</span><span class="sub-note">주관식 · 입력하지 않아요 (선생님이 채점)</span>`;
        grid.appendChild(row);
        continue;
      }
      row.className = 'qrow';
      row.innerHTML = `
        <span class="qnum">${dn(i)}</span>
        <div class="ans-btns">
          ${[1, 2, 3, 4, 5].map(n => `<button type="button" class="ans-btn" data-q="${i}" data-v="${n}">${n}</button>`).join('')}
        </div>${isMulti(i) ? '<span class="multi-note">복수 선택</span>' : ''}`;
      grid.appendChild(row);
    }
    grid.querySelectorAll('.ans-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        const q = this.dataset.q, v = this.dataset.v;
        if (isMulti(parseInt(q, 10))) {
          // 복수 선택: 누르면 켜지고 다시 누르면 꺼진다. 고른 번호를 작은 것부터 이어붙여 "35"로 보관
          this.classList.toggle('selected');
          studentAnswers[q] = Array.from(grid.querySelectorAll(`.ans-btn[data-q="${q}"].selected`)).map(b => b.dataset.v).sort().join('');
          updateProgress(); return;
        }
        studentAnswers[q] = v;
        grid.querySelectorAll(`.ans-btn[data-q="${q}"]`).forEach(b => b.classList.remove('selected'));
        this.classList.add('selected');
        updateProgress(); advanceFrom(parseInt(q, 10));
      });
    });
    document.getElementById('sx-prog').style.display = 'block'; updateProgress();

    document.getElementById('skip-input').addEventListener('input', applySkip);
    const paintWhy = () => { document.querySelectorAll('#skip-why [data-why]').forEach(b => { const on = b.dataset.why === skipWhy; b.className = 'btn ' + (on ? 'primary' : 'outline'); }); document.getElementById('skip-why-hint').textContent = skipWhy === 'scope' ? '시험 범위가 아닌 문항은 계속 빠진 채로 두고, 점수에도 넣지 않아요.' : '나중에 「이어서 입력하기」로 풀 수 있어요. 풀기 전까지는 점수에 들어가지 않아요.'; };
    document.querySelectorAll('#skip-why [data-why]').forEach(b => b.addEventListener('click', () => { skipWhy = b.dataset.why; paintWhy(); }));
    paintWhy();
    // 문항이 30개를 넘으면: 지금 입력할 구간을 고르게 한다 (고르지 않은 구간은 채점에서 빠지고, 나중에 「이어서 입력」으로 채울 수 있다)
    if (answerCount > CHUNK) {
      const box = document.getElementById('range-box'), nC = Math.ceil(answerCount / CHUNK);
      const paint = () => {
        box.innerHTML = '<div style="font-weight:700; margin-bottom:6px;">📑 지금 입력할 구간 고르기 <span class="hint" style="font-weight:400;">(문항이 많아요 · 안 고른 구간은 나중에 이어서 입력할 수 있어요)</span></div><div style="display:flex; gap:6px; flex-wrap:wrap;">' +
          Array.from({ length: nC }, (_, c) => { const a = c * CHUNK, b = Math.min(answerCount, a + CHUNK) - 1, on = !chipOff.has(c); return '<button type="button" class="btn ' + (on ? 'primary' : 'outline') + '" data-c="' + c + '" style="padding:8px 14px;">' + (on ? '✅ ' : '') + dn(a) + '~' + dn(b) + '번</button>'; }).join('') + '</div>';
        box.querySelectorAll('button').forEach(bt => bt.addEventListener('click', () => { const c = +bt.dataset.c; if (chipOff.has(c)) chipOff.delete(c); else if (chipOff.size < nC - 1) chipOff.add(c); else return; paint(); applySkip(); }));
      };
      box.style.display = ''; paint();
    }
    // 이어서 입력/고치기 모드: 이전 답을 채워 넣는다
    if (EDIT && EDIT.answers) {
      const nm = document.getElementById('student-name'); nm.value = EDIT.name || nm.value; nm.readOnly = true;
      EDIT.answers.forEach((v, i) => {
        if (!v || v === '~' || isSub(i)) return;
        studentAnswers[i] = v;
        String(v).split('').forEach(d => { const b = grid.querySelector('.ans-btn[data-q="' + i + '"][data-v="' + d + '"]'); if (b) b.classList.add('selected'); });
      });
      const eb = document.getElementById('edit-banner'); eb.style.display = '';
      if (EDIT.mode === 'fill') { eb.style.background = '#EEF7F1'; eb.style.border = '1px solid #9AD3B0'; eb.innerHTML = '📝 <b>이어서 입력하는 중이에요.</b> 이미 낸 답은 잠겨 있고, 비워 둔 문항만 입력할 수 있어요. 오늘 안 풀 구간은 위에서 빼 두면 돼요.'; }
      else { eb.style.background = '#FDECEA'; eb.style.border = '1px solid #E8A8A0'; eb.innerHTML = EDIT.shift ? '✏️ <b>답안을 고치는 중이에요.</b> 밀려 쓴 답을 바르게 고쳐서 다시 제출해요. <b>한 번만</b> 고칠 수 있어요.' : '✏️ <b>답안을 고치는 중이에요.</b> 선생님이 승인해 준 <b>마킹 실수</b>를 고쳐요. <b>한 번만</b> 고칠 수 있고, 승인 후 하루 안에 제출해야 해요.'; }
      document.querySelector('#answer-form button[type=submit]').textContent = EDIT.mode === 'fill' ? '이어서 낸 답 제출하기' : '고친 답안 제출하기';
      applySkip();
    } else {
      // 며칠 안에 비워 둔 문항이 있는 기록이 이 기기에 있으면 이어서 입력하라고 알려 준다
      try {
        const last = JSON.parse(localStorage.getItem('sx_last_' + examId) || 'null');
        if (last && last.fixReq && last.submittedAt) {
          const eb = document.getElementById('edit-banner'); eb.style.display = ''; eb.style.background = '#FFF4E0'; eb.style.border = '1px solid #F3D9A4';
          eb.innerHTML = '✏️ <b>' + escapeHtml(last.name) + '</b>님이 보낸 수정 요청이 있어요. <button type="button" class="btn primary" id="fixchk-btn" style="padding:6px 12px; margin-left:6px;">승인 확인</button> <span id="fixchk-msg" class="hint"></span>';
          document.getElementById('fixchk-btn').addEventListener('click', () => sxCheckFix(examId, last.name, last.submittedAt, document.getElementById('fixchk-msg'), () => goEdit('fix', last.submittedAt, last.answers, last.name, false, last.oor)));
        } else if (last && last.skipped && last.skipped.length) {
          const eb = document.getElementById('edit-banner'); eb.style.display = ''; eb.style.background = '#FFF4E0'; eb.style.border = '1px solid #F3D9A4';
          eb.innerHTML = '📝 <b>' + escapeHtml(last.name) + '</b>님이 낸 답안 중 비워 둔 문항(' + escapeHtml(rangeText(last.skipped)) + ')이 있어요. <button type="button" class="btn primary" id="resume-btn" style="padding:6px 12px; margin-left:6px;">이어서 입력하기</button>';
          document.getElementById('resume-btn').addEventListener('click', () => goEdit('fill', last.submittedAt, last.answers, last.name, false, last.oor));
        } else if (last && last.wrong && last.wrong.length) {
          const eb = document.getElementById('edit-banner'); eb.style.display = ''; eb.style.background = '#FDECEA'; eb.style.border = '1px solid #E8A8A0';
          const u = 'student_retry.html?id=' + encodeURIComponent(examId) + '&n=' + last.wrong.join(',') + '&name=' + encodeURIComponent(last.name || '');
          eb.innerHTML = '🔁 <b>' + escapeHtml(last.name) + '</b>님이 틀린 문항(' + escapeHtml(rangeText(last.wrong)) + ')이 있어요. <a class="btn primary" href="' + u + '" style="padding:6px 12px; margin-left:6px; display:inline-block;">틀린 문제만 다시 풀기</a>';
        }
      } catch (e) {}
    }
    document.getElementById('answer-form').addEventListener('submit', submitAnswers);
    // 선생님이 예약해 둔 학생이면 이름을 적을 때 제출 기한을 보여 준다
    (function () {
      const inp = document.getElementById('student-name'), box = document.getElementById('dl-box');
      let timer = null, seq = 0;
      const DAYS = ['일', '월', '화', '수', '목', '금', '토'], pad = n => String(n).padStart(2, '0');
      function look() {
        const name = inp.value.trim(), my = ++seq;
        if (!name) { box.style.display = 'none'; return; }
        callApi('getDeadline', { examId: examId, studentName: name }).then(r => {
          if (my !== seq) return;
          if (!r || !r.ok || !r.deadline) { box.style.display = 'none'; return; }
          const d = new Date(r.deadline); if (isNaN(d)) { box.style.display = 'none'; return; }
          const t = (d.getMonth() + 1) + '/' + d.getDate() + '(' + DAYS[d.getDay()] + ') ' + (d.getHours() < 12 ? '오전 ' : '오후 ') + ((d.getHours() % 12) || 12) + ':' + pad(d.getMinutes());
          box.innerHTML = d.getTime() < Date.now() ? '⏰ 제출 기한은 <b>' + t + '</b>이었어요. 기한이 지났지만 지금 제출해도 기록돼요.' : '⏰ 제출 기한: <b>' + t + '</b>까지';
          box.style.display = '';
        }).catch(() => { if (my === seq) box.style.display = 'none'; });
      }
      // 이름을 잘못 적은 것 같으면(반 명단·예약과 한 글자 차이) 비슷한 이름을 추천한다
      const sug = document.createElement('div'); sug.style.cssText = 'display:none; margin-top:8px; padding:8px 10px; border-radius:8px; background:#EEF2FF; border:1px solid #C7D2FE; font-size:14px;';
      box.parentNode.insertBefore(sug, box);
      let sseq = 0;
      function suggest() {
        const name = inp.value.trim(), my = ++sseq;
        if (name.length < 2) { sug.style.display = 'none'; return; }
        callApi('suggestName', { examId: examId, name: name }).then(r => {
          if (my !== sseq || !r || !r.ok) return;
          if (r.exact && r.name && r.name !== name) { inp.value = r.name; sug.style.display = 'none'; look(); return; }
          if (r.exact || !r.suggestions || !r.suggestions.length) { sug.style.display = 'none'; return; }
          sug.innerHTML = '혹시 이 이름인가요? ' + r.suggestions.map(n => '<button type="button" class="btn outline" style="padding:4px 12px; margin-left:6px;" data-n="' + escapeHtml(n) + '">' + escapeHtml(n) + '</button>').join('');
          sug.style.display = '';
          sug.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { inp.value = b.dataset.n; sug.style.display = 'none'; look(); }));
        }).catch(() => {});
      }
      inp.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(look, 600); });
      inp.addEventListener('blur', () => { clearTimeout(timer); look(); suggest(); });
    })();
  } catch (err) {
    area.innerHTML = '<div class="banner error">서버에 연결할 수 없어요.</div>';
  }
}

// 안 푸는 문항: 그 번호의 답 버튼을 회색으로 막고, 이미 눌러 둔 답은 지운다
let skipSet = new Set();
function applySkip() {
  skipSet = parseNumSetLabeled(document.getElementById('skip-input').value, nums, answerCount);
  chipOff.forEach(c => { for (let i = c * CHUNK; i < Math.min(answerCount, (c + 1) * CHUNK); i++) skipSet.add(i + 1); });
  const typedSkip = new Set(skipSet);      // 학생이 직접 적은 번호(구간 칩 제외)
  for (let i = 0; i < answerCount; i++) if (lockedQ(i)) skipSet.delete(i + 1);
  for (let i = 0; i < answerCount; i++) if (oorQ(i)) skipSet.add(i + 1);
  window.__typedSkip = typedSkip; { const w = document.getElementById('skip-why'); if (w) w.style.display = typedSkip.size ? '' : 'none'; }
  const grid = document.getElementById('answer-grid');
  grid.querySelectorAll('.qrow').forEach((row, i) => {
    const off = skipSet.has(i + 1) && !isSub(i);
    row.style.opacity = off ? '0.35' : lockedQ(i) ? '0.75' : '';
    row.querySelectorAll('.ans-btn').forEach(b => { b.disabled = off || lockedQ(i); if (off) b.classList.remove('selected'); });
    if (off) studentAnswers[i] = '';
  });
  updateProgress();
}
async function submitAnswers(e) {
  e.preventDefault();
  const name = document.getElementById('student-name').value.trim();
  if (!name) return;
  const skipAll = Array.from({ length: answerCount }, (_, i) => (skipSet.has(i + 1) && !isSub(i) && !lockedQ(i)) || (oorQ(i) && !isSub(i)));
  const oorNew = skipWhy === 'scope' ? Array.from(window.__typedSkip || []).filter(n => !isSub(n - 1) && !lockedQ(n - 1)) : [];
  const miss = studentAnswers.findIndex((a, i) => !isSub(i) && !skipAll[i] && !a);
  if (miss >= 0) {
    const rows = document.querySelectorAll('#answer-grid .qrow');
    studentAnswers.forEach((a, i) => { if (!isSub(i) && !skipAll[i] && !a) rows[i].classList.add('miss'); });
    rows[miss].scrollIntoView({ behavior: 'smooth', block: 'center' });
    alert(dn(miss) + '번에 답을 선택해주세요. (빨갛게 표시된 문항이 아직 비어 있어요. 풀지 않는 문항은 위 「안 푸는 문항」에 번호를 적어 주세요)'); return;
  }
  if (skipAll.every((x, i) => x || isSub(i))) { alert('풀 문항이 하나도 없어요. 「안 푸는 문항」을 확인해 주세요.'); return; }

  { const ok = await confirmAnswers([{ items: studentAnswers.map((a, i) => ({ label: dn(i) + '번', ans: (isSub(i) || skipAll[i]) ? '' : fmtAnswer(a), skip: isSub(i) || skipAll[i] })) }]); if (!ok) return; }
  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true;
  btn.textContent = '채점 중...';

  try {
    const arr = studentAnswers.map((a, i) => skipAll[i] ? '~' : a);
    const res = EDIT ? await callApi('editSubmission', { id: examId, studentName: name, submittedAt: EDIT.submittedAt, answers: arr, outOfRange: oorNew })
                     : await callApi('submitAnswer', { defer: true, id: examId, studentName: name, answers: arr, outOfRange: oorNew });
    if (!res.ok) { alert(res.error || '제출에 실패했어요.'); btn.disabled = false; btn.textContent = '제출하고 채점받기'; return; }
    if (!EDIT) callApi('afterSubmit', { id: examId, studentName: name }).catch(() => {});
    try { localStorage.setItem('sx_last_' + examId, JSON.stringify({ name: name, submittedAt: res.submittedAt, t: Date.now(), skipped: res.skipped || [], oor: res.outOfRange || [], answers: res.studentAnswers, wrong: (res.results || []).map((r, i) => r === 'x' ? i + 1 : 0).filter(Boolean) })); } catch (e) {}      // 알림은 결과를 보여 준 뒤 따로 보낸다

    const sc100 = res.total ? to100(res.score, res.total) : null;
    const wrongN = res.results.filter(r => r === 'x').length;
    const ringCol = sc100 === null ? '#9CA3AF' : sc100 >= 90 ? '#1a7a4a' : sc100 >= 70 ? '#0B1F5C' : '#B45309';
    const pct = sc100 === null ? 0 : sc100;
    try { sessionStorage.setItem('stu_name', name); } catch (e) {}
    document.getElementById('content-area').innerHTML = `
      <h1 style="text-align:center;">채점 결과</h1>
      <p class="muted" style="text-align:center;margin:0;">${escapeHtml(name)}님 · ${sc100 === null ? '' : sc100 === 100 ? '만점이에요! 🎉' : wrongN ? '틀린 문제 ' + wrongN + '개를 복습해 봐요 💪' : ''}</p>
      <div class="sx-ring" style="background:conic-gradient(${ringCol} ${pct * 3.6}deg, #E5E1D6 0);"><div style="width:122px;height:122px;border-radius:50%;background:#F7F5EF;display:flex;align-items:center;justify-content:center;">${sc100 === null ? '<span style="font-size:15px;">객관식 없음</span>' : sc100 + '<span>점</span>'}</div></div>
      <p class="hint" style="text-align:center;">${res.total ? '객관식 ' + res.total + '문항 중 ' + res.score + '개 정답 · 100점 만점 환산' : ''}</p>
      ${(res.subjective && res.subjective.length) ? '<p class="hint" style="text-align:center;">주관식 ' + res.subjective.length + '문항(' + res.subjective.map(dnOf).join(', ') + '번)은 점수에 합산하지 않아요. 선생님이 따로 채점해요.</p>' : ''}
      <h2>문항별 결과</h2>
      <div class="sx-chips">
        ${res.results.map((rs, i) => rs === 'ok' ? '<div class="sx-chip ok">' + dn(i) + '번<small>⭕ ' + escapeHtml(fmtAnswer(res.studentAnswers[i])) + '</small></div>' : rs === 'x' ? '<div class="sx-chip x">' + dn(i) + '번<small>❌ ' + escapeHtml(fmtAnswer(res.studentAnswers[i])) + '</small></div>' : '<div class="sx-chip na">' + dn(i) + '번<small>' + (rs === 'subj' ? '주관식' : '안 품') + '</small></div>').join('')}
      </div>
      ${res.skipped && res.skipped.length ? '<div class="card" style="margin:14px 0; border:2px solid #F3D9A4; background:#FFF9EC;"><b>📝 아직 입력하지 않은 문항이 ' + res.skipped.length + '개 있어요</b> (' + escapeHtml(rangeText(res.skipped)) + ')<p class="hint" style="margin:4px 0 8px;">지금까지 입력한 답으로만 점수가 나왔어요. 나머지는 나중에 이어서 입력하면 점수가 합쳐져요. (기간 제한 없어요)</p><button type="button" class="btn primary" id="continue-btn" style="width:100%;">이어서 입력하기</button></div>' : ''}
      ${(EDIT && EDIT.mode === 'fix') ? '' : (res.shiftSuspect ? '<div class="card" style="margin:14px 0; border:2px solid #E8A8A0; background:#FFF5F4;"><b>⚠️ 답이 한 칸씩 밀려 입력된 것 같아요</b><p class="hint" style="margin:4px 0 8px;">번호를 잘못 맞춰 눌렀다면 제출한 지 30분 안에 <b>한 번만</b> 고칠 수 있어요. 헷갈려서 바꿔 찍는 용도는 아니에요.</p><button type="button" class="btn primary" id="fix-btn" style="width:100%;">✏️ 답안 수정하기</button></div>' : '<div class="card" style="margin:14px 0;"><b>✏️ 마킹을 잘못 눌렀나요?</b><p class="hint" style="margin:4px 0 8px;">선생님께 수정 요청을 보내고, <b>선생님이 승인하면</b> 한 번만 고칠 수 있어요. 헷갈려서 바꿔 찍는 용도는 아니에요.</p><button type="button" class="btn outline" id="fixreq-btn" style="width:100%;">✏️ 수정 요청하기</button><button type="button" class="btn primary" id="fixchk-btn" style="width:100%; margin-top:6px; display:none;">🔍 승인 확인</button><div id="fixreq-msg" class="hint" style="margin-top:6px; font-weight:700;"></div></div>')}
      ${wrongN ? '<div id="retry-card" class="card" style="margin:14px 0;"><h2 style="margin:0 0 4px;">❌ 틀린 문제 다시 입력하기</h2><p class="hint" style="margin:0 0 10px;">틀린 ' + wrongN + '문항만 다시 답을 골라 「다시 채점」을 누르세요. 정답은 알려 주지 않고 맞았는지만 알려 줘요. 이 연습은 점수에 들어가지 않아요.</p><div id="retry-grid"></div><div id="retry-msg" class="hint" style="margin:8px 0 0;font-weight:700;"></div><button type="button" id="retry-btn" class="btn primary" style="width:100%;margin-top:8px;">다시 채점</button></div>' : ''}
      <p class="hint">❌ 표시한 문항은 다시 풀어 보세요. ${FROM_APP ? '「오답 복습」에서 틀린 문제만 모아서 다시 풀 수 있어요.' : ''}</p>
      <div class="actions">
        ${FROM_APP || STU_NAME ? '<a class="btn primary" href="student_app.html' + (wrongN ? '#wrong' : '') + '" style="width:100%;">' + (wrongN ? '🔁 틀린 문제 복습하러 가기' : '🏠 내 시험 현황으로') + '</a>' : ''}
        ${FROM_APP || STU_NAME ? (wrongN ? '<a class="btn outline" href="student_app.html" style="width:100%;">🏠 내 시험 현황으로</a>' : '') : ''}
      </div>
    `;
    window.scrollTo(0, 0);
    { const cb = document.getElementById('continue-btn'); if (cb) cb.addEventListener('click', () => goEdit('fill', res.submittedAt, res.studentAnswers, name, false, res.outOfRange)); const fb = document.getElementById('fix-btn'); if (fb) fb.addEventListener('click', () => goEdit('fix', res.submittedAt, res.studentAnswers, name, true, res.outOfRange));
      const rq = document.getElementById('fixreq-btn'), ck = document.getElementById('fixchk-btn'), fm = document.getElementById('fixreq-msg');
      if (rq) { rq.addEventListener('click', async () => { if (await sxRequestFix(examId, name, res.submittedAt, fm, () => goEdit('fix', res.submittedAt, res.studentAnswers, name, false, res.outOfRange))) { rq.style.display = 'none'; ck.style.display = ''; } }); ck.addEventListener('click', () => sxCheckFix(examId, name, res.submittedAt, fm, () => goEdit('fix', res.submittedAt, res.studentAnswers, name, false))); } }
    if (wrongN) setupRetry(res);
  } catch (err) {
    alert('오류가 발생했어요: ' + err.message);
    btn.disabled = false;
    btn.textContent = '제출하고 채점받기';
  }
}

// ── 틀린 문제만 다시 입력해서 맞는지 확인 (점수에는 안 들어가고, 정답은 알려 주지 않는다) ──
function setupRetry(res) {
  const wrong = []; res.results.forEach((r, i) => { if (r === 'x') wrong.push(i); });
  const pending = new Set(wrong), picked = {};
  const grid = document.getElementById('retry-grid'), msg = document.getElementById('retry-msg'), btn = document.getElementById('retry-btn');
  wrong.forEach(i => {
    const row = document.createElement('div'); row.className = 'qrow'; row.id = 'rq' + i;
    row.innerHTML = '<span class="qnum">' + (i + 1) + '</span><div class="ans-btns">' + [1, 2, 3, 4, 5].map(n => '<button type="button" class="ans-btn" data-q="' + i + '" data-v="' + n + '">' + n + '</button>').join('') + '</div>' + (isMulti(i) ? '<span class="multi-note">복수 선택</span>' : '') + '<span class="rq-st" style="margin-left:8px;font-weight:800;"></span>';
    grid.appendChild(row);
  });
  grid.querySelectorAll('.ans-btn').forEach(b => b.addEventListener('click', function () {
    const q = +this.dataset.q, v = this.dataset.v; if (!pending.has(q)) return;
    if (isMulti(q)) { this.classList.toggle('selected'); picked[q] = Array.from(grid.querySelectorAll('.ans-btn[data-q="' + q + '"].selected')).map(x => x.dataset.v).sort().join(''); }
    else { picked[q] = v; grid.querySelectorAll('.ans-btn[data-q="' + q + '"]').forEach(x => x.classList.remove('selected')); this.classList.add('selected'); }
    document.querySelector('#rq' + q + ' .rq-st').textContent = '';
  }));
  let tries = 0;
  btn.addEventListener('click', async () => {
    const todo = Array.from(pending), empty = todo.filter(q => !picked[q]);
    if (empty.length) { msg.style.color = '#B45309'; msg.textContent = (empty[0] + 1) + '번에 답을 골라 주세요.'; return; }
    btn.disabled = true; btn.textContent = '채점 중...';
    try {
      const arr = new Array(answerCount).fill(''); todo.forEach(q => { arr[q] = picked[q]; });
      const r = await callApi('retryCheck', { id: examId, answers: arr });
      if (!r.ok) throw new Error(r.error || '채점하지 못했어요.');
      tries++;
      todo.forEach(q => {
        const st = document.querySelector('#rq' + q + ' .rq-st');
        if (r.results[q] === 'ok') {
          pending.delete(q); st.style.color = '#1a7a4a'; st.textContent = '⭕ 맞았어요!';
          grid.querySelectorAll('.ans-btn[data-q="' + q + '"]').forEach(x => { x.disabled = true; });
        } else {
          st.style.color = '#C1392B'; st.textContent = '❌ 아니에요. 다시 골라 보세요';
          grid.querySelectorAll('.ans-btn[data-q="' + q + '"]').forEach(x => x.classList.remove('selected')); delete picked[q];
        }
      });
      if (!pending.size) { msg.style.color = '#1a7a4a'; msg.textContent = '🎉 틀렸던 문제를 모두 맞혔어요! (' + tries + '번 만에)'; btn.style.display = 'none'; }
      else { msg.style.color = '#C1392B'; msg.textContent = '아직 ' + pending.size + '문항이 남았어요. 다시 골라서 「다시 채점」을 눌러요.'; }
    } catch (e) { msg.style.color = '#C1392B'; msg.textContent = e.message; }
    btn.disabled = false; btn.textContent = '다시 채점';
  });
}

loadExam();
