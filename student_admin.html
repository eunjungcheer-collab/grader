<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0B1F5C">
<title>학생용 앱 관리 - 자동 채점 시스템</title>
<link rel="stylesheet" href="css/style.css?v=202611150520">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<template id="page-content">
  <span class="backlink"><a href="index.html">← 홈으로</a></span>
  <h1>📱 학생용 앱 관리</h1>
  <p class="muted">학생은 <b>이름 + 비밀번호</b>(과학 대시보드·면접앱과 같은 계정)로 들어와서 내 시험 기한·기록·오답 복습을 볼 수 있어요. 반 명단(「시험 예약·알림」)에 있는 이름만 가입할 수 있어요.</p>

  <div class="card">
    <b>학생에게 알려 줄 주소</b>
    <div class="hint" style="margin-top:6px;">학생 스마트폰에서 열고 「홈 화면에 추가」하면 앱처럼 쓸 수 있어요. 안 낸 시험 수가 아이콘에 숫자로 떠요.</div>
    <input type="text" id="sa-url" readonly style="margin-top:8px;">
    <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
      <button type="button" class="btn primary" id="sa-copy">주소 복사</button>
      <a class="btn outline" id="sa-open" target="_blank" rel="noopener">학생 화면 열어 보기</a>
    </div>
    <div style="text-align:center; margin-top:14px;"><img id="sa-qr" alt="학생 앱 QR" style="width:180px;height:180px;" class="qr-img"><div class="hint">QR을 찍어도 들어가요</div></div>
  </div>

  <div class="card" id="sa-pend-card" style="display:none; border-color:#C1392B;">
    <b style="color:#C1392B;">✋ 승인을 기다리는 학생</b>
    <div class="hint" style="margin-top:6px;">반 명단에 있는 이름인지 확인하고 승인해 주세요. 내 이름을 다른 친구가 먼저 가입한 것 같으면 「거절」을 누르면 돼요.</div>
    <div id="sa-pend"></div>
    <button type="button" class="btn primary" id="sa-all" style="margin-top:10px;">모두 승인</button>
  </div>

  <div class="card">
    <b>오답 복습 정답 공개 시점</b>
    <div class="hint" style="margin-top:6px;">학생끼리 정답을 공유하는 게 걱정되면 「기한이 끝난 뒤」로 두세요. 그 시험에 아직 기한이 안 지난 예약이 있는 동안은 정답과 해설이 가려져요.</div>
    <label style="display:flex; gap:8px; align-items:center; font-weight:600; margin-top:8px;"><input type="radio" name="rv" value="always"> 항상 (제출하면 바로 정답 확인)</label>
    <label style="display:flex; gap:8px; align-items:center; font-weight:600; margin-top:6px;"><input type="radio" name="rv" value="after"> 기한이 끝난 뒤에만</label>
    <div id="rv-msg" class="hint"></div>
  </div>

  <div class="card">
    <b>가입한 학생</b>
    <div class="hint" style="margin-top:6px;">비밀번호를 잊은 학생은 「초기화」를 누르면 다음에 다시 새로 정할 수 있어요.</div>
    <div id="sa-list" class="hint" style="margin-top:8px;">불러오는 중...</div>
  </div>

  <div class="card">
    <b>🔔 학생 폰 알림(푸시) 설정</b>
    <div class="hint" style="margin-top:6px;">앱이 닫혀 있어도 학생 폰에 「새 시험 예약」「곧 제출 기한(3시간 전)」「기한이 지났어요」 알림이 가요. 한 번만 설정하면 돼요. (무료)</div>
    <details style="margin-top:8px;"><summary style="font-weight:700; cursor:pointer;">설정 방법 보기 (처음 한 번만)</summary>
      <ol class="hint" style="line-height:1.8; padding-left:18px;">
        <li><b>console.firebase.google.com</b> 접속 → 구글 계정으로 로그인 → 「프로젝트 추가」 → 이름 아무거나 → 계속(애널리틱스는 꺼도 돼요).</li>
        <li>프로젝트 화면 왼쪽 위 톱니바퀴 → 「프로젝트 설정」 → 「일반」 아래쪽 「내 앱」에서 <b>웹(&lt;/&gt;) 아이콘</b> → 앱 닉네임 입력 → 등록. 나오는 <b>firebaseConfig 내용</b>을 아래 ①칸에 붙여넣어요.</li>
        <li>「클라우드 메시징」 탭 → 아래쪽 「웹 구성」 → 「웹 푸시 인증서」에서 <b>키 쌍 생성</b> → 나온 긴 키를 아래 ②칸에 붙여넣어요.</li>
        <li>「서비스 계정」 탭 → 「새 비공개 키 생성」 → 받은 <b>JSON 파일을 메모장으로 열어</b> 내용 전체를 아래 ③칸에 붙여넣어요. (「클라우드 메시징」에서 「Firebase Cloud Messaging API」가 사용 설정이 아니면 켜 주세요.)</li>
        <li>아래 「저장」 → 학생이 앱에서 「알림 받기」를 누르면 끝! 「테스트 알림 보내기」로 확인해 보세요.</li>
      </ol>
    </details>
    <label>① firebaseConfig (웹 앱 설정)</label>
    <textarea id="pc-web" rows="4" placeholder='const firebaseConfig = { apiKey: "...", authDomain: "...", projectId: "...", messagingSenderId: "...", appId: "..." };' style="width:100%; box-sizing:border-box;"></textarea>
    <label>② 웹 푸시 인증서 키 (VAPID 키)</label>
    <input type="text" id="pc-vapid" placeholder="B로 시작하는 긴 키" style="width:100%; box-sizing:border-box;">
    <label>③ 서비스 계정 JSON (비밀 키예요. 남에게 보여 주지 마세요)</label>
    <textarea id="pc-sa" rows="4" placeholder='{ "type": "service_account", ... }' style="width:100%; box-sizing:border-box;"></textarea>
    <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;"><button type="button" class="btn primary" id="pc-save">저장</button></div>
    <div id="pc-msg" class="hint" style="margin-top:6px;"></div>
    <div style="margin-top:10px; border-top:1px solid var(--line); padding-top:10px;">
      <label style="margin-top:0;">테스트 알림 보낼 학생 (알림을 켠 학생만 받아요)</label>
      <div style="display:flex; gap:8px;"><input type="text" id="pc-tname" placeholder="학생 이름" style="flex:1;"><button type="button" class="btn outline" id="pc-test">테스트 알림 보내기</button></div>
    </div>
  </div>
</template>
<script src="js/vendor/qrcode.min.js?v=202611150520"></script>
<script src="js/config.js?v=202611150520"></script>
<script src="js/api.js?v=202611150520"></script>
<script src="js/common.js?v=202611150520"></script>
<script>
requireLogin();
renderHeader({});
const $ = id => document.getElementById(id);
const e = escapeHtml;
const url = new URL('student_app.html', location.href).href;
$('sa-url').value = url; $('sa-open').href = url;
$('sa-copy').addEventListener('click', () => { const b = $('sa-copy'); const ok = () => { b.textContent = '✅ 복사됨'; setTimeout(() => b.textContent = '주소 복사', 1500); }; if (navigator.clipboard) navigator.clipboard.writeText(url).then(ok, () => prompt('복사하세요', url)); else prompt('복사하세요', url); });
try { QRCode.toDataURL(url, { width: 360, margin: 1 }).then(d => { $('sa-qr').src = d; }); } catch (x) {}
const p2 = n => String(n).padStart(2, '0');
function fmt(iso) { const d = new Date(iso); return isNaN(d) ? '' : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
async function load() {
  try {
    await callApiSWR('listStudents', { password: getTeacherPassword() }, r => {
    if (!r.ok) throw new Error(r.error);
    document.querySelectorAll('input[name=rv]').forEach(x => { x.checked = x.value === (r.reveal || 'always'); });
    const pend = r.students.filter(s => s.pending), ok = r.students.filter(s => !s.pending);
    $('sa-pend-card').style.display = pend.length ? '' : 'none';
    $('sa-pend').innerHTML = pend.map(s => '<div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:8px 0;"><b style="font-size:15px;">' + e(s.name) + '</b>' + (s.offRoster ? ' <span style="color:#B45309;font-weight:800;font-size:12.5px;">⚠️ 명단에 없는 이름</span>' : '') + '<span><button type="button" class="btn primary sa-ok" data-n="' + e(s.name) + '" style="padding:6px 12px;">승인</button> <button type="button" class="btn outline sa-reset" data-n="' + e(s.name) + '" data-rej="1" style="padding:6px 12px;">거절</button></span></div>').join('');
    $('sa-list').innerHTML = ok.length ? ok.map(s => '<div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:8px 0;"><div><b style="font-size:15px;color:var(--ink);">' + e(s.name) + '</b> <span class="hint" style="margin:0;">' + (s.push ? '🔔 알림 켬' : '알림 꺼짐') + '</span><div class="hint" style="margin:0;">최근 접속 ' + fmt(s.lastLogin) + '</div></div><button type="button" class="btn outline sa-reset" data-n="' + e(s.name) + '" style="padding:6px 12px;">초기화</button></div>').join('') : '아직 승인된 학생이 없어요.';
    document.querySelectorAll('.sa-reset').forEach(b => b.addEventListener('click', async () => {
      if (!confirm(b.dataset.n + (b.dataset.rej ? ' 학생의 가입 신청을 거절할까요?' : ' 학생의 숫자를 초기화할까요? (학생이 다시 가입 신청을 해요)'))) return;
      b.disabled = true; const x = await callApi('resetStudentPin', { password: getTeacherPassword(), name: b.dataset.n });
      if (!x.ok) alert(x.error); load();
    }));
    document.querySelectorAll('.sa-ok').forEach(b => b.addEventListener('click', async () => { b.disabled = true; const x = await callApi('approveStudent', { password: getTeacherPassword(), name: b.dataset.n }); if (!x.ok) alert(x.error); load(); }));
  });
  } catch (err) { $('sa-list').innerHTML = '<span style="color:#C1392B;">' + e(err.message) + ' (Apps Script를 새 버전으로 배포했는지 확인하세요)</span>'; }
}
document.querySelectorAll('input[name=rv]').forEach(x => x.addEventListener('change', async () => { const r = await callApi('setStuOptions', { password: getTeacherPassword(), reveal: x.value }); $('rv-msg').textContent = r.ok ? '✅ 저장했어요' : '⚠️ ' + (r.error || '저장하지 못했어요'); }));
$('sa-all').addEventListener('click', async () => { const x = await callApi('approveStudent', { password: getTeacherPassword(), all: true }); if (!x.ok) alert(x.error); load(); });
$('pc-save').addEventListener('click', async () => {
  const msg = $('pc-msg'); msg.textContent = '저장 중...';
  try {
    const par = { password: getTeacherPassword() };
    if ($('pc-web').value.trim()) { par.webConfig = $('pc-web').value; par.vapidKey = $('pc-vapid').value; }
    if ($('pc-sa').value.trim()) par.serviceAccount = $('pc-sa').value;
    if (!par.webConfig && !par.serviceAccount) { msg.textContent = '붙여넣은 내용이 없어요.'; return; }
    const r = await callApi('setPushConfig', par);
    if (!r.ok) throw new Error(r.error);
    msg.innerHTML = '✅ 저장했어요. ' + (r.enabled && r.webOk ? '이제 학생이 앱에서 「알림 받기」를 누르면 알림이 가요.' : (r.enabled ? '아직 ①②(웹 앱 설정·VAPID 키)가 필요해요.' : '아직 ③(서비스 계정 JSON)이 필요해요.'));
    $('pc-sa').value = '';
  } catch (err) { msg.innerHTML = '<span style="color:#C1392B;">⚠️ ' + e(err.message) + '</span>'; }
});
$('pc-test').addEventListener('click', async () => {
  const msg = $('pc-msg'); msg.textContent = '테스트 알림을 보내는 중...';
  try { const r = await callApi('setPushConfig', { password: getTeacherPassword(), testName: $('pc-tname').value.trim() }); if (!r.ok) throw new Error(r.error); msg.innerHTML = r.tested ? '✅ 보냈어요. 학생 폰을 확인해 보세요.' : '⚠️ ' + e(r.error || '보내지 못했어요'); }
  catch (err) { msg.innerHTML = '<span style="color:#C1392B;">⚠️ ' + e(err.message) + '</span>'; }
});
load();
</script>
</body>
</html>
