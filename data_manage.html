<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0B1F5C">
<title>데이터 관리 - 자동 채점 시스템</title>
<link rel="stylesheet" href="css/style.css?v=202611200145">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<template id="page-content">
  <span class="backlink"><a href="index.html">← 홈으로</a></span>
  <h1>🗄️ 데이터 관리</h1>
  <p class="muted">학생 기록 백업과 드라이브 정리를 한곳에서 해요. 백업은 <b>구글 시트(글자 기록)만</b> 복사해 두는 거라 용량이 아주 작아요. 교재·시험지 PDF는 백업 대상이 아니에요.</p>
  <div class="card"><b>💾 기록 백업</b>
    <div id="bk-badge"></div><div id="bk-info" class="hint" style="margin-top:8px;">불러오는 중...</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
      <button type="button" class="btn primary" id="bk-now" style="padding:8px 14px;">지금 백업하기</button>
      <button type="button" class="btn outline" id="bk-auto" style="padding:8px 14px;">자동 백업 켜기 (매주 일요일 새벽)</button>
      <button type="button" class="btn outline" id="bk-trim" style="padding:8px 14px;">자동 백업 최근 4개만 남기기</button>
    </div>
    <div id="bk-msg" class="hint" style="margin-top:6px;"></div>
  </div>
  <div class="card" id="rq-card">
      <b>🔗 삭제 후 다시 등록한 시험지의 예전 QR 이어붙이기</b>
      <p class="hint" style="margin:6px 0 8px;">시험지를 삭제하고 같은 단원으로 다시 등록하면, 이미 나눠 준 교재의 그 단원 QR은 「존재하지 않는 시험」이 돼요. 먼저 후보를 찾아 보여 드리고, <b>체크한 것만</b> 이어 줘요. (휴지통 30일 이내의 삭제된 시험지만 찾을 수 있어요)</p>
      <button type="button" class="btn primary" id="rq-find">🔍 이어 줄 후보 찾기</button>
      <div id="rq-list" style="margin-top:10px;"></div>
      <div class="hint" id="rq-msg" style="margin-top:8px;"></div>
      <hr style="border:0;border-top:1px solid #ddd;margin:12px 0;">
      <button type="button" class="btn outline" id="rq-clear" style="font-size:13px;">이어붙인 것 전부 해제</button>
      <span class="hint">(한 시험지씩 해제하려면 그 시험지 화면에서 해제하세요)</span>
    </div>
    <div class="card" id="pc-card">
      <b>💾 인쇄용 PDF 보관 (이 컴퓨터)</b>
      <p class="hint" id="pc-info" style="margin:6px 0;"></p>
      <p class="hint" style="margin:0 0 8px;">같은 시험지를 다시 인쇄할 때 빨라져요. 최근 10개만 이 컴퓨터(브라우저)에 두고, 구글 드라이브·서버 용량은 쓰지 않아요.</p>
      <label style="display:block;margin:6px 0;"><input type="checkbox" id="pc-on"> 인쇄한 PDF를 이 컴퓨터에 보관하기</label>
      <button type="button" class="btn outline" id="pc-clear">🗑️ 보관한 PDF 지우기</button>
      <span class="hint" id="pc-msg"></span>
    </div>
    <div class="card" id="pm-card">
      <b>🖨️ 인쇄 방식</b>
      <label style="display:block; margin:6px 0;"><input type="radio" name="pm" value="fast"> <b>빠른 인쇄</b> (기본) — PDF를 그대로 보내요. 더 빠르고 선명해요. 안 되면 자동으로 예전 방식으로 인쇄해요.</label>
      <label style="display:block; margin:6px 0;"><input type="radio" name="pm" value="raster"> <b>예전 방식</b> — 쪽마다 그림으로 바꿔서 인쇄해요. 느리지만 어디서나 돼요.</label>
      <p class="hint" id="pm-msg" style="margin:6px 0 0;"></p>
    </div>
    <div class="card"><b>☁️ 구글 드라이브 용량</b>
    <div id="du-info" class="hint" style="margin-top:8px;">불러오는 중... (폴더가 크면 20~40초 걸려요)</div>
    <div id="du-bar" style="display:none;height:16px;background:#e6e1d6;border-radius:9px;overflow:hidden;margin:10px 0 4px;"><div id="du-fill" style="height:100%;width:0;background:#1f6f4a;"></div></div>
    <div id="du-list" style="margin-top:8px;font-size:14px;"></div>
    <div style="margin-top:10px;"><button type="button" class="btn outline" id="du-reload" style="padding:8px 14px;">다시 계산하기</button></div>
  </div>
  <div class="card"><b>📦 드라이브에 쌓인 교재 PDF</b>
    <div id="dv-info" class="hint" style="margin-top:8px;">불러오는 중...</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;"><button type="button" class="btn outline" id="dv-clean" style="padding:8px 14px;">올리다 남은 임시 조각 지우기</button><a class="btn outline" href="cover_edit.html" style="padding:8px 14px;text-decoration:none;">🎨 교재 관리에서 안 쓰는 교재 지우기</a></div>
    <div id="dv-msg" class="hint" style="margin-top:6px;"></div>
  </div>
  <div class="card"><b>👥 학생 이름 합치기</b>
    <div class="hint" style="margin-top:4px;">같은 학생인데 이름이 다르게 저장됐다면(예: 「홍 길동」, 「홍길동」) 합쳐요. <b>합칠 이름을 체크</b>하고, <b>통일할 이름 하나에 ●</b>를 눌러 주세요. 합치기 전에 자동으로 백업해 둬요.</div>
    <div id="nm-sim" class="hint" style="margin-top:8px;"></div>
    <div id="nm-list" style="margin-top:8px;max-height:320px;overflow:auto;"></div>
    <div style="margin-top:10px;"><button type="button" class="btn primary" id="nm-go" style="padding:8px 14px;">체크한 이름을 ●한 이름으로 합치기</button></div>
    <div id="nm-msg" class="hint" style="margin-top:6px;"></div>
  </div>
</template>
<script src="js/config.js?v=202611200145"></script>
<script src="js/api.js?v=202611200145"></script>
<script src="js/common.js?v=202611200145"></script>
<script src="js/pdfui.js?v=202611200145"></script>
<script>
requireLogin();
renderHeader({});
const $ = id => document.getElementById(id), e = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const D = iso => { const d = new Date(iso); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const MB = b => b >= 1073741824 ? (b / 1073741824).toFixed(1) + 'GB' : (b / 1048576).toFixed(b >= 10485760 ? 0 : 1) + 'MB';
async function loadUsage() {
  $('du-info').textContent = '계산하는 중... (폴더가 크면 20~40초 걸려요)'; $('du-list').innerHTML = ''; $('du-bar').style.display = 'none';
  try {
    const r = await callApi('driveUsage', { password: getTeacherPassword() });
    if (!r.ok) { $('du-info').textContent = r.error || '불러오지 못했어요'; return; }
    if (r.used != null && r.limit) {
      const pct = Math.min(100, r.used / r.limit * 100);
      $('du-info').innerHTML = '구글 계정 전체 <b style="font-size:17px;">' + MB(r.used) + '</b> / ' + MB(r.limit) + ' 사용 중 (' + pct.toFixed(1) + '%)<br><span style="font-size:12px;">드라이브·Gmail·사진을 모두 합친 값이에요.</span>';
      if (pct >= 80) $('du-info').insertAdjacentHTML('beforeend', '<div style="margin-top:8px;padding:10px 12px;border-radius:8px;background:#FDECEA;color:#C1392B;font-weight:800;border:1px solid #C1392B;">⚠️ 구글 용량이 ' + pct.toFixed(0) + '%예요. 곧 가득 찰 수 있으니 오래된 시험지 PDF나 필요 없는 파일을 정리해 주세요. (가득 차면 시험지·백업이 저장되지 않아요)</div>');
      $('du-bar').style.display = ''; $('du-fill').style.width = Math.max(1, pct) + '%'; $('du-fill').style.background = pct > 85 ? '#C1392B' : pct > 65 ? '#D97706' : '#1f6f4a';
    } else $('du-info').textContent = '계정 전체 용량은 읽을 수 없었어요.';
    const tot = r.folders.reduce((a, f) => a + f.bytes, 0);
    $('du-list').innerHTML = '<div style="font-weight:700;margin-bottom:4px;">이 앱이 쓰는 폴더 (합계 ' + MB(tot) + ')</div>' + r.folders.map(f => '<div style="display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:5px 0;"><span>' + e(f.name) + (f.partial ? ' <span class="hint" style="margin:0;">(일부만 센 값)</span>' : '') + '</span><span><b>' + MB(f.bytes) + '</b> · ' + f.count + '개</span></div>').join('');
  } catch (x) { $('du-info').textContent = '서버에 연결할 수 없어요. (서버를 새 버전으로 배포했는지 확인하세요)'; }
}
$('du-reload').addEventListener('click', loadUsage);
async function load() {
  try {
    const r = await callApi('dataStatus', { password: getTeacherPassword() });
    if (!r.ok) { $('bk-info').textContent = r.error || '불러오지 못했어요'; return; }
    const auto = r.backups.filter(b => b.auto), last = r.backups[0];
    { const hrs = last ? (Date.now() - new Date(last.at).getTime()) / 3600000 : null, badge = $('bk-badge');
      if (badge) { const bad = !last || (r.autoOn && hrs > 36) || !r.autoOn; badge.style.cssText = 'margin:0 0 8px;padding:10px 12px;border-radius:8px;font-weight:800;font-size:15px;' + (bad ? 'background:#FDECEA;color:#C1392B;border:1px solid #C1392B;' : 'background:#E8F5EE;color:#1f6f4a;border:1px solid #1f6f4a;');
        badge.textContent = !last ? '⚠️ 아직 백업이 없어요' : !r.autoOn ? '⚠️ 자동 백업이 꺼져 있어요 (마지막 백업 ' + (hrs < 48 ? Math.round(hrs) + '시간' : Math.round(hrs / 24) + '일') + ' 전)' : hrs > 36 ? '⚠️ 마지막 자동 백업이 ' + (hrs < 72 ? Math.round(hrs) + '시간' : Math.round(hrs / 24) + '일') + ' 전이에요. 자동 백업이 멈췄을 수 있어요' : '✅ 백업 정상 · 마지막 백업 ' + (hrs < 1 ? '방금' : Math.round(hrs) + '시간 전'); } }
    $('bk-info').innerHTML = '기록 ' + r.rows.toLocaleString() + '줄 · 시트 ' + r.sheetCount + '개<br>자동 백업: <b style="color:' + (r.autoOn ? '#1f7a4d' : '#C1392B') + ';">' + (r.autoOn ? '켜져 있어요' : '꺼져 있어요 (아래 버튼으로 켜세요)') + '</b><br>보관 중인 백업 ' + r.backups.length + '개 (자동 ' + auto.length + '개)' + (last ? ' · 가장 최근 ' + D(last.at) + ' ' + e(last.name.replace('자동채점 백업 ', '')) : ' · 아직 없어요');
    $('dv-info').innerHTML = '교재 PDF ' + r.pdfCount + '개 · 합계 <b>' + MB(r.pdfBytes) + '</b>' + (r.partial ? ' (일부만 센 값)' : '') + '<br>올리다 남은 임시 조각 ' + r.chunks + '개' + (r.chunks ? ' — 지워도 돼요' : '');
  } catch (err) { $('bk-info').textContent = '서버에 연결할 수 없어요. (서버를 새 버전으로 배포했는지 확인하세요)'; }
}
$('bk-now').addEventListener('click', async () => { $('bk-msg').textContent = '백업 중...'; try { const r = await callApi('backupNow', { password: getTeacherPassword(), label: '수동' }); $('bk-msg').textContent = r.ok ? '✅ 백업했어요: ' + r.backup.name : '⚠️ ' + r.error; load(); } catch (x) { $('bk-msg').textContent = '⚠️ ' + x.message; } });
$('bk-auto').addEventListener('click', async () => { try { const r = await callApi('installBackup', { password: getTeacherPassword() }); $('bk-msg').textContent = r.ok ? '✅ 자동 백업을 켰어요' : '⚠️ ' + r.error; load(); } catch (x) { $('bk-msg').textContent = '⚠️ ' + x.message; } });
$('bk-trim').addEventListener('click', async () => { if (!confirm('자동 백업을 최근 4개만 남기고 오래된 것은 휴지통으로 보낼까요?')) return; try { const r = await callApi('dataTrim', { password: getTeacherPassword(), keep: 4 }); $('bk-msg').textContent = r.ok ? '✅ 오래된 자동 백업 ' + r.removed + '개를 정리했어요' : '⚠️ ' + r.error; load(); } catch (x) { $('bk-msg').textContent = '⚠️ ' + x.message; } });
$('dv-clean').addEventListener('click', async () => { if (!confirm('올리다 남은 임시 조각을 지울까요?\n(지금 올리는 중인 교재가 있다면 끝난 뒤에 눌러 주세요)')) return; $('dv-msg').textContent = '지우는 중...'; let tot = 0; try { for (let i = 0; i < 40; i++) { const r = await callApi('mergeCleanup', { password: getTeacherPassword(), all: true }); if (!r.ok) throw new Error(r.error); tot += r.removed; $('dv-msg').textContent = '지우는 중... ' + tot + '개'; if (!r.removed) break; } $('dv-msg').textContent = '✅ 임시 조각 ' + tot + '개를 정리했어요'; load(); } catch (x) { $('dv-msg').textContent = '⚠️ ' + x.message; } });
let NM = { names: [], similar: [] };
async function loadNames() {
  try {
    const r = await callApi('nameGroups', { password: getTeacherPassword() }); if (!r.ok) { $('nm-list').textContent = r.error || '불러오지 못했어요'; return; }
    NM = r; const simSet = {}; r.similar.forEach(p => { simSet[p[0]] = 1; simSet[p[1]] = 1; });
    $('nm-sim').innerHTML = r.similar.length ? '⚠️ 비슷한 이름 ' + r.similar.length + '쌍: ' + r.similar.map(p => '<b>' + e(p[0]) + '</b> ↔ <b>' + e(p[1]) + '</b>').join(' · ') + '<br><span style="font-size:12px;">서로 다른 학생일 수도 있으니 직접 확인하고 합쳐 주세요.</span>' : '비슷한 이름이 없어요 👍';
    $('nm-list').innerHTML = r.names.map(n => '<label style="display:flex;gap:8px;align-items:center;padding:6px 4px;border-top:1px solid var(--line);' + (simSet[n.name] ? 'background:#fff8e1;' : '') + '"><input type="checkbox" class="nm-chk" value="' + e(n.name) + '"><input type="radio" name="nm-to" class="nm-to" value="' + e(n.name) + '"><span style="flex:1;"><b>' + e(n.name) + '</b> <span class="hint" style="margin:0;">기록 ' + n.count + '건</span></span></label>').join('') || '<span class="hint">기록이 없어요.</span>';
  } catch (x) { $('nm-list').textContent = '서버에 연결할 수 없어요. (서버를 새 버전으로 배포했는지 확인하세요)'; }
}
$('nm-go').addEventListener('click', async () => {
  const to = (document.querySelector('.nm-to:checked') || {}).value, from = Array.from(document.querySelectorAll('.nm-chk:checked')).map(c => c.value).filter(v => v !== to);
  if (!to) { $('nm-msg').textContent = '통일할 이름 하나를 ●로 골라 주세요.'; return; } if (!from.length) { $('nm-msg').textContent = '합칠 이름을 체크해 주세요.'; return; }
  if (!confirm('「' + from.join(', ') + '」 기록을 모두 「' + to + '」로 바꿀까요?\n(합치기 전에 자동 백업해요. 되돌리려면 백업을 사용해야 해요.)')) return;
  $('nm-msg').textContent = '합치는 중...'; try { const r = await callApi('mergeNames', { password: getTeacherPassword(), from: from, to: to }); $('nm-msg').textContent = r.ok ? '✅ ' + r.changed + '곳을 「' + to + '」로 통일했어요' : '⚠️ ' + r.error; loadNames(); } catch (x) { $('nm-msg').textContent = '⚠️ ' + x.message; }
});
load();
(function () { let m = 'fast'; try { m = localStorage.getItem('printMode') === 'raster' ? 'raster' : 'fast'; } catch (e) {} document.querySelectorAll('input[name=pm]').forEach(r => { r.checked = r.value === m; r.addEventListener('change', () => { try { localStorage.setItem('printMode', r.value); document.getElementById('pm-msg').textContent = '✅ 저장했어요 (이 브라우저에서만 적용돼요).'; } catch (e) { document.getElementById('pm-msg').textContent = '⚠️ 저장하지 못했어요.'; } }); }); })();
(async function () { const on = $('pc-on'); try { on.checked = localStorage.getItem('pdfCache') !== 'off'; } catch (e) { on.checked = true; }
  const show = async () => { const i = await pdfCacheInfo(); $('pc-info').textContent = '보관 중: ' + i.count + '개 · ' + MB(i.bytes); };
  on.addEventListener('change', () => { try { localStorage.setItem('pdfCache', on.checked ? 'on' : 'off'); } catch (e) {} $('pc-msg').textContent = on.checked ? '켰어요.' : '껐어요 (이미 보관한 PDF는 그대로예요).'; });
  $('pc-clear').addEventListener('click', async () => { const n = await pdfCacheClear(); $('pc-msg').textContent = n + '개를 지웠어요.'; show(); });
  show(); })();
let rqC = [];
$('rq-find').addEventListener('click', async () => {
  const b = $('rq-find'), m = $('rq-msg'), L = $('rq-list'); b.disabled = true; m.textContent = '찾는 중...'; L.innerHTML = '';
  try {
    const r = await callApi('relinkOldQr', { password: getTeacherPassword() });
    if (!r.ok) { m.textContent = r.error || '실패했어요'; b.disabled = false; return; }
    rqC = r.candidates;
    if (!rqC.length) { m.textContent = '새로 이어 줄 후보가 없어요.' + (r.noneCount ? ' (삭제만 하고 다시 등록하지 않은 시험지 ' + r.noneCount + '개는 이을 곳이 없어요)' : ''); b.disabled = false; return; }
    m.textContent = '이어 줄 후보 ' + rqC.length + '개 (체크한 것만 이어요)' + (r.noneCount ? ' · 다시 등록하지 않은 삭제 시험지 ' + r.noneCount + '개는 이을 곳이 없어 빠졌어요' : '');
    L.innerHTML = '<label style="font-weight:700;display:block;margin-bottom:6px;"><input type="checkbox" id="rq-all"> 전체 선택</label>' + rqC.map((c, i) => '<label style="display:block;padding:6px 0;border-top:1px solid #eee;"><input type="checkbox" class="rq-c" data-i="' + i + '"> <b>' + e(c.label) + '</b><br><span style="font-size:12px;color:#555;">삭제한 시험지: ' + e(c.oldTitle) + ' (' + e(D(c.deletedAt)) + ')<br>이어 줄 새 시험지: ' + e(c.newTitle) + '</span></label>').join('') + '<button type="button" class="btn primary" id="rq-apply" style="margin-top:10px;">선택한 것 이어붙이기</button>';
    $('rq-all').addEventListener('change', ev => document.querySelectorAll('.rq-c').forEach(c => { c.checked = ev.target.checked; }));
    $('rq-apply').addEventListener('click', async () => {
      const pick = Array.from(document.querySelectorAll('.rq-c')).filter(c => c.checked).map(c => rqC[+c.dataset.i]);
      if (!pick.length) { m.textContent = '체크한 것이 없어요.'; return; }
      $('rq-apply').disabled = true; m.textContent = '이어 주는 중...';
      try { const r2 = await callApi('relinkOldQr', { password: getTeacherPassword(), apply: pick.map(c => ({ oldId: c.oldId, newId: c.newId })) }); m.textContent = r2.ok ? '✅ ' + r2.linked + '개를 이어 줬어요.' : (r2.error || '실패했어요'); if (r2.ok) L.innerHTML = ''; } catch (x) { m.textContent = '서버에 연결할 수 없어요.'; }
    });
  } catch (x) { m.textContent = '서버에 연결할 수 없어요. (서버를 새 버전으로 배포했는지 확인하세요)'; }
  b.disabled = false;
});
$('rq-clear').addEventListener('click', async () => {
  const m = $('rq-msg'); if (!confirm('이어붙인 예전 QR을 모두 해제할까요? 해제하면 그 QR들은 다시 「존재하지 않는 시험」이 돼요. (새 시험지와 제출 기록은 그대로예요)')) return;
  try { const r = await callApi('unlinkOldQr', { password: getTeacherPassword(), all: true }); m.textContent = r.ok ? '예전 QR ' + r.removed + '개의 이어붙임을 모두 해제했어요.' : (r.error || '실패했어요'); } catch (x) { m.textContent = '서버에 연결할 수 없어요.'; }
});
loadUsage(); loadNames();
</script>
