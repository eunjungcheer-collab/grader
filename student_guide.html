<title>학생용 사용법 - 자동 채점 시스템</title>

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
#paper{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-top:12px;line-height:1.7;font-size:15px;}
#paper h2{margin:0 0 6px;font-size:22px;}
#paper h3{margin:16px 0 4px;font-size:17px;color:var(--point);}
#paper ul{margin:4px 0 0;padding-left:20px;}
#paper li{margin:3px 0;}
@media print{ .no-print{display:none !important;} body *{visibility:hidden;} #paper,#paper *{visibility:visible;} #paper{position:absolute;left:0;top:0;width:100%;border:0;font-size:13px;padding:0 6px;} #paper h3{margin:10px 0 2px;} }
</style>
</head>
<body>
<template id="page-content">
  <span class="backlink no-print"><a href="index.html">← 홈으로</a></span>
  <h1 class="no-print">📖 학생용 사용법</h1>
  <p class="muted no-print">학생들에게 나눠 주거나 PDF로 보낼 수 있는 한 장짜리 안내문이에요.</p>
  <button type="button" class="btn primary no-print" id="print" style="padding:8px 14px;">🖨️ 인쇄 / PDF 저장</button>
  <div id="paper">
    <h2>답안 입력 사용법</h2>
    <h3>1. 제출하기 전에</h3>
    <ul>
      <li>이름을 쓰고 문항마다 답을 고른다.</li>
      <li>제출 버튼을 누르면 입력한 답이 번호별로 한 번 더 나온다. 번호와 답이 맞는지 확인한다.</li>
      <li>틀린 곳이 있으면 「고치러 돌아가기」, 맞으면 「이대로 제출」을 누른다.</li>
      <li>제출하면 바로 채점되고, 그 뒤에는 마음대로 고칠 수 없다.</li>
    </ul>
    <h3>2. 풀지 않는 문항이 있을 때</h3>
    <ul>
      <li>「안 푸는 문항」 칸에 번호를 적는다. (예: 1-10 또는 1-10, 15) 번호를 적으면 이유를 고르는 버튼이 나온다.</li>
      <li><b>시험 범위가 아니에요</b>: 시험 범위가 아니라서 빼는 문항. 점수에 들어가지 않고, 나중에도 입력하지 않는다.</li>
      <li><b>나중에 풀 거예요</b>: 오늘은 풀지 않고 나중에 풀 문항. 풀기 전까지는 점수에 들어가지 않고, 나중에 「이어서 입력하기」로 채운다.</li>
    </ul>
    <h3>3. 문항이 30개를 넘을 때</h3>
    <ul>
      <li>화면 위에 「1~30번」「31~60번」처럼 구간 버튼이 나온다. 처음에는 모두 켜져 있다.</li>
      <li>한 번에 다 풀면 그대로 입력한다. 오늘 풀 구간만 남기고 나머지를 끄면 그 구간만 입력해서 제출할 수 있다.</li>
      <li>끈 구간은 나중에 이어서 입력한다.</li>
    </ul>
    <h3>4. 이어서 입력하기</h3>
    <ul>
      <li>결과 화면의 「이어서 입력하기」를 누르거나, 같은 기기에서 시험지를 다시 열면 나오는 안내를 누른다.</li>
      <li>이미 낸 답은 잠겨 있고, 비워 둔 문항만 입력할 수 있다. 기간 제한은 없다.</li>
      <li>입력하면 점수가 합쳐서 다시 계산된다.</li>
    </ul>
    <h3>5. 답을 잘못 입력했을 때</h3>
    <ul>
      <li><b>답이 한 칸씩 밀려 입력된 경우</b>: 결과 화면에 안내가 나온다. 제출한 지 30분 안에 「답안 수정하기」로 한 번 고칠 수 있다.</li>
      <li><b>마킹을 잘못 누른 경우</b>: 「수정 요청하기」를 누르면 선생님께 요청이 간다. 선생님이 승인하면 하루 안에 한 번 고칠 수 있다. 화면을 열어 두면 승인되는 대로 수정 화면으로 넘어간다.</li>
      <li>헷갈려서 답을 바꿔 찍는 용도로는 쓸 수 없다. 고친 기록에는 처음 점수가 남아서 선생님이 볼 수 있다.</li>
    </ul>
  </div>
</template>
