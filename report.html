<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0B1F5C">
<title>학생 리포트 - 자동 채점 시스템</title>
<link rel="stylesheet" href="css/style.css?v=202611121939">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
#paper{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:12px;}
#paper h2{margin:0 0 2px;font-size:22px;}
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;}
.kpi div{flex:1 1 110px;background:#F4F6FB;border-radius:10px;padding:10px 12px;text-align:center;}
.kpi b{display:block;font-size:22px;color:var(--point);}
.sec{margin-top:16px;font-weight:800;}
.row{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #eee;padding:6px 0;font-size:14px;}
@media print{ body *{visibility:hidden;} #paper,#paper *{visibility:visible;} #paper{position:absolute;left:0;top:0;width:100%;border:0;} }
</style>
</head>
<body>
<template id="page-content">
  <span class="backlink"><a href="index.html">← 홈으로</a></span>
  <h1>🧾 학생 리포트</h1>
  <p class="muted">학생 한 명의 점수 변화와 약점 단원을 한 장으로 정리해요. 상담·학부모 안내용으로 인쇄하거나 이미지처럼 저장할 수 있어요.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
    <select id="who" style="padding:8px;min-width:180px;"><option value="">학생을 고르세요</option></select>
    <select id="rng" style="padding:8px;"><option value="5">최근 5회</option><option value="10" selected>최근 10회</option><option value="30">최근 30회</option></select>
    <button type="button" class="btn primary" id="print" style="padding:8px 14px;" disabled>🖨️ 인쇄 / PDF 저장</button>
    <button type="button" class="btn outline" id="copy" style="padding:8px 14px;" disabled>📋 요약 문구 복사</button>
  </div>
  <div id="st" class="hint">불러오는 중...</div>
  <div id="paper" style="display:none;"></div>
</template>
<script src="js/config.js?v=202611121939"></script>
<script src="js/api.js?v=202611121939"></script>
<script src="js/common.js?v=202611121939"></script>
<script>
requireLogin();
renderHeader({});
const $ = id => document.getElementById(id), e = escapeHtml, nk = s => String(s || '').replace(/\s+/g, '');
let SUBS = {}, WEAK = {}, SUMMARY = '';
function chart(pts) {
  if (pts.length < 2) return '<div class="hint">점수 변화를 그리려면 2회 이상의 기록이 필요해요.</div>';
  const W = 560, H = 170, L = 30, R = 10, T = 12, B = 26, n = pts.length;
  const x = i => L + (W - L - R) * (n === 1 ? 0 : i / (n - 1)), y = v => T + (H - T - B) * (1 - v / 100);
  let g = [0, 50, 100].map(v => '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#e5e7eb"/><text x="2" y="' + (y(v) + 4) + '" font-size="10" fill="#9ca3af">' + v + '</text>').join('');
  const path = pts.map((p, i) => (i ? 'L' : 'M') + x(i) + ' ' + y(p.s)).join(' ');
  const dots = pts.map((p, i) => '<circle cx="' + x(i) + '" cy="' + y(p.s) + '" r="4" fill="#1F3A6B"/><text x="' + x(i) + '" y="' + (y(p.s) - 8) + '" font-size="11" text-anchor="middle" fill="#1F3A6B">' + p.s + '</text><text x="' + x(i) + '" y="' + (H - 8) + '" font-size="10" text-anchor="middle" fill="#6b7280">' + p.d + '</text>').join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;">' + g + '<path d="' + path + '" fill="none" stroke="#1F3A6B" stroke-width="2.5"/>' + dots + '</svg>';
}
function render() {
  const k = $('who').value; if (!k) { $('paper').style.display = 'none'; $('print').disabled = $('copy').disabled = true; return; }
  const list = (SUBS[k].list || []).slice().sort((a, b) => a.t - b.t), N = +$('rng').value, last = list.slice(-N);
  const pts = last.map(s => ({ s: Math.round(s.s), d: (new Date(s.t).getMonth() + 1) + '/' + new Date(s.t).getDate() }));
  const avg = last.length ? Math.round(last.reduce((a, s) => a + s.s, 0) / last.length) : 0;
  const prev = list.slice(-N * 2, -N), pavg = prev.length ? Math.round(prev.reduce((a, s) => a + s.s, 0) / prev.length) : null;
  const best = last.length ? Math.round(Math.max.apply(null, last.map(s => s.s))) : 0;
  const w = WEAK[k] || { repeatQ: [], weakUnits: [] };
  const diff = pavg === null ? '' : (avg - pavg >= 0 ? '▲ ' : '▼ ') + Math.abs(avg - pavg) + '점';
  const name = SUBS[k].shown, today = new Date();
  let h = '<h2>' + e(name) + ' 학생 학습 리포트</h2><div class="muted">' + today.getFullYear() + '.' + (today.getMonth() + 1) + '.' + today.getDate() + ' 기준 · 최근 ' + last.length + '회 시험</div>';
  h += '<div class="kpi"><div><b>' + avg + '점</b>평균</div><div><b>' + best + '점</b>최고</div><div><b>' + (diff || '-') + '</b>이전 ' + N + '회 대비</div></div>';
  h += '<div class="sec">📈 점수 변화</div>' + chart(pts);
  h += '<div class="sec">🎯 보완이 필요한 단원</div>' + (w.weakUnits.length ? w.weakUnits.map(u => '<div class="row"><span>' + e(u.unit) + '</span><span>평균 정답률 ' + u.avg + '%</span></div>').join('') : '<div class="hint">반복해서 약한 단원은 아직 없어요. 👍</div>');
  h += '<div class="sec">🔁 반복해서 틀린 문제</div>' + (w.repeatQ.length ? w.repeatQ.slice(0, 6).map(q => '<div class="row"><span>' + e(q.title || q.examTitle || '') + ' ' + e(q.n) + '번</span><span>' + (q.times ? q.times + '회 오답' : '') + '</span></div>').join('') : '<div class="hint">반복 오답이 없어요.</div>');
  h += '<div class="sec">📝 최근 시험</div>' + last.slice().reverse().slice(0, 8).map(s => '<div class="row"><span>' + e(s.title) + '</span><span><b>' + Math.round(s.s) + '점</b></span></div>').join('');
  $('paper').innerHTML = h; $('paper').style.display = 'block'; $('print').disabled = $('copy').disabled = false;
  SUMMARY = name + ' 학생 리포트 (최근 ' + last.length + '회)\n평균 ' + avg + '점' + (diff ? ' (이전 대비 ' + diff + ')' : '') + ' · 최고 ' + best + '점'
    + (w.weakUnits.length ? '\n보완 단원: ' + w.weakUnits.map(u => u.unit + ' ' + u.avg + '%').join(', ') : '\n보완이 필요한 단원은 아직 없어요')
    + (w.repeatQ.length ? '\n반복 오답: ' + w.repeatQ.slice(0, 4).map(q => (q.title || q.examTitle || '') + ' ' + q.n + '번').join(', ') : '');
}
async function load() {
  try {
    const [subs, wk] = await Promise.all([callApi('listSubmissions', { password: getTeacherPassword() }), callApi('weakReport', { password: getTeacherPassword(), minRate: 50, minTried: 3 })]);
    if (!subs.ok) throw new Error(subs.error || '불러오지 못했어요');
    (subs.submissions || []).forEach(s => {
      const k = nk(s.studentName); if (!k || k === '이름없음' || !Number(s.total)) return;
      const sc = Number(s.score100); if (!isFinite(sc)) return;
      const o = SUBS[k] || (SUBS[k] = { shown: String(s.studentName).trim(), list: [] });
      o.list.push({ s: sc, t: new Date(s.submittedAt).getTime(), title: s.examTitle || '' });
    });
    ((wk && wk.ok) ? wk.students : []).forEach(st => { WEAK[nk(st.name)] = st; });
    const keys = Object.keys(SUBS).sort((a, b) => SUBS[a].shown.localeCompare(SUBS[b].shown, 'ko'));
    $('who').innerHTML = '<option value="">학생을 고르세요</option>' + keys.map(k => '<option value="' + e(k) + '">' + e(SUBS[k].shown) + ' (' + SUBS[k].list.length + '회)</option>').join('');
    $('st').textContent = keys.length ? '' : '아직 제출 기록이 없어요.';
  } catch (err) { $('st').innerHTML = '<span style="color:#C1392B;">' + e(err.message) + '</span>'; }
}
$('who').addEventListener('change', render); $('rng').addEventListener('change', render);
$('print').addEventListener('click', () => window.print());
$('copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(SUMMARY); $('copy').textContent = '✅ 복사됨'; setTimeout(() => $('copy').textContent = '📋 요약 문구 복사', 1500); } catch (x) { prompt('복사해 주세요', SUMMARY); } });
load();
</script>
</body>
</html>
