<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0B1F5C">
<title>새 시험지 등록 - 자동 채점 시스템</title>
<link rel="stylesheet" href="css/style.css?v=202610150090">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#95D1DB">
</head>
<body>
<template id="page-content">
  <span class="backlink"><a href="index.html">← 홈으로</a></span>
  <h1>새 시험지 등록</h1>
  <p class="muted">시험지 PDF를 올리면 문항 수를 찾고, <b>왼쪽에 PDF를 띄워놓고 오른쪽에 정답을 입력</b>할 수 있어요.</p>
  <div id="error-banner"></div>

  <form id="new-exam-form">
    <div class="card">
      <label>시험지 PDF (문제 + 정답 페이지가 같이 있어도 돼요 · 여러 개를 한꺼번에 골라도 돼요)</label>
      <input type="file" id="pdf-file" accept="application/pdf" multiple required>
      <div id="queue-note" class="banner" style="display:none; margin:8px 0 0;"></div>
      <label class="bank-include-label" style="margin-top:10px;"><input type="checkbox" id="auto-reg" checked> ⚡ <b>확인 없이 자동 등록</b> — 여러 시험지를 한꺼번에 고르면 기다릴 필요 없이 정답 읽기·단원 추정·QR 찍기·등록·문제은행 저장까지 알아서 해요. 못 읽은 정답은 비워 두고 등록한 뒤, 끝나면 나오는 결과 화면에서 문제 있는 것만 모아서 고치면 돼요. 같은 이름·내용의 시험지는 건너뛰어요. (시험지를 1개만 고르면 이 설정과 상관없이 하나씩 확인하며 등록해요) (단원·소단원은 확신 있는 것만 채우고 🤖 표시가 붙어요)</label>
      <div style="margin:4px 0 0 24px; font-size:13px;">동시에 처리할 시험지 수 <select id="auto-pool" style="width:auto; display:inline-block; margin:0; padding:4px 8px;"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option><option>8</option></select> <span class="hint" style="margin:0;">많을수록 서버 저장을 더 많이 겹치지만, 컴퓨터가 느려지고 구글 서버가 거부할 수 있어요. 막히면 줄이세요.</span></div>
      <label class="field-label-spaced">정답지 PDF <span class="muted" style="font-weight:400;">(문제지와 따로 있을 때만 · 없으면 비워두세요)</span></label>
      <input type="file" id="pdf-answer-file" accept="application/pdf">
      <label class="field-label-spaced">시험지 이름</label>
      <input type="text" id="title" required>
      <div id="scan-summary" class="banner" style="margin:14px 0 0; display:none;"></div>
    </div>

    <div id="scan-result" style="display:none;">
      <div class="split">
        <!-- 왼쪽: PDF -->
        <div class="pane-left">
          <div class="vhead">
            <b>PDF</b>
            <input type="number" id="go-page" min="1" placeholder="쪽">
            <button type="button" class="btn ghost" id="go-btn">이동</button>
            <button type="button" class="btn outline" id="go-answer">정답 쪽으로</button>
            <button type="button" class="btn ghost" id="go-last">마지막 쪽</button>
            <button type="button" class="btn ghost" id="zoom-out">−</button>
            <button type="button" class="btn ghost" id="zoom-in">＋</button>
          </div>
          <details id="tools-details" style="border-top:1px solid var(--line);"><summary class="hint" style="cursor:pointer; padding:8px 10px; margin:0;">✂️ 워터마크·이름칸 지우기 도구 (필요할 때만 펼치세요)</summary>
          <div class="vhead" style="border-top:1px solid var(--line);">
            <button type="button" class="btn outline" id="redact-toggle">✂️ 지우기 모드</button>
            <span class="hint" id="redact-hint" style="margin:0;">PDF 위에서 드래그하면 그 자리를 흰색으로 지워요 (출처 워터마크, 기존 QR, 이름칸 등)</span>
          </div>
          <div class="vhead" id="wm-phrase-row" style="border-top:1px solid var(--line); gap:6px;">
            <input type="text" id="wm-phrase" placeholder="지울 문구 (예: 족보닷컴, 교육지대)" style="margin:0; flex:1; min-width:150px; padding:7px 10px;">
            <button type="button" class="btn outline" id="wm-phrase-btn" style="padding:7px 12px;">문구 찾아서 지우기</button>
          </div>
          <div class="hint" id="wm-phrase-msg" style="padding:0 10px 6px; margin:0;">모든 쪽에서 찾아요. <b>꼬리말(쪽 맨 아래)</b>에 있으면 그 글자만이 아니라 <b>그 문단 전체</b>를 지우고, 다른 곳이면 그 문구만 지워요.</div>
          </details>
          <div id="watermark-candidates" style="display:none; padding:8px 10px; background:#FFF7ED; border-bottom:1px solid var(--line);"></div>
          <div id="redact-list" style="display:none; padding:8px 10px; background:#F3F4F6; border-bottom:1px solid var(--line); font-size:13px;"></div>
          <div class="vscroll" id="vscroll"></div>
        </div>

        <!-- 오른쪽: 정답 입력 -->
        <div class="pane-right">
          <div class="card">
            <div id="review-box" class="banner" style="margin:0 0 12px; display:none;"></div>
            <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;">
              <div style="width:110px;"><label>문항 수</label><input type="number" id="question-count" min="1" max="200" style="margin:0;"></div>
              <button type="button" id="regen-btn" class="btn ghost" style="padding:10px 12px;">칸 다시 만들기</button>
            </div>
            <div class="entry-panel" id="entry-panel">
              <div class="entry-head">지금 입력할 문항: <b id="cur-n">1</b>번 <span class="muted" id="cur-total"></span></div>
              <div class="entry-snip" id="cur-snip"></div>
            </div>
            <p class="hint">💡 왼쪽 PDF를 보면서 숫자를 치면 자동으로 오른쪽 칸으로 넘어가요. (← → 방향키, Backspace로 되돌리기)<br>
              ✍️ <b>주관식 문항</b>은 칸 아래 <b>「주」</b> 버튼을 누르거나 <b>-</b>를 입력하세요. 회색으로 비활성화되고, 답 입력에서 건너뛰며, 학생 화면·자동 채점에서 빠져요.<br>
              ☑️ <b>정답이 2개 이상</b>(예: 3번과 5번 모두)인 문항은 칸 아래 <b>「복」</b> 버튼을 누르거나 그 칸에서 <b>+</b> 키를 누른 뒤 <b>3 → 5</b>를 차례로 치세요. 칸에 <b>35</b>로 들어가고, 다음 칸으로는 <b>Enter</b>(또는 Space)로 넘어가요. 학생은 둘 다 골라야 정답이에요.</p>
            <div class="box-row" id="boxes"></div>
            <div class="hint" id="sub-note" style="margin-top:6px;"></div>

            <label class="field-label-spaced">정답 붙여넣기 (선택)</label>
            <textarea id="bulk-input" rows="3" placeholder="예: 31425... / 1③ 2① 3④ ... / 1. 3 (줄마다) — 주관식은 -  (예: -3142-5). 붙여넣으면 위 칸이 한 번에 채워져요" style="width:100%; padding:10px; border:1.5px solid var(--line); border-radius:8px; font-family:inherit;"></textarea>
            <div class="hint" id="bulk-msg"></div>

            <details id="pages-details" class="card" style="margin-top:14px; padding:12px 14px;"><summary style="cursor:pointer; font-size:14px; font-weight:700;">정답·해설 페이지 범위 <span class="muted" id="pages-sum" style="font-weight:400;"></span></summary>
              <p class="hint" id="answer-page-auto">자동으로는 못 찾았어요.</p>
              <p class="hint">자동으로 못 찾았거나 틀렸으면, 왼쪽 PDF에서 정답·해설이 있는 쪽을 확인하고 직접 입력하세요.</p>
              <div class="date-row">
                <div><input type="text" id="manual-ans-from" placeholder="시작 쪽"></div>
                <span class="date-sep">~</span>
                <div><input type="text" id="manual-ans-to" placeholder="끝 쪽"></div>
                <button type="button" class="btn outline" id="manual-ans-apply" style="padding:10px 14px;">이 범위로 적용</button>
              </div>
              <p class="hint" id="answer-page-status"></p>
            </details>
            <label class="bank-include-label" id="strip-answer-label" style="margin-top:10px; display:none;">
              <input type="checkbox" id="strip-answer" checked> 정답·해설 페이지는 빼고 QR 찍은 학생용 PDF 만들고, 뺀 페이지는 해설지로 저장
            </label>
            <details class="qr-opt"><summary style="cursor:pointer; font-weight:700; font-size:14px;">QR 코드 크기·위치 <span class="muted" style="font-weight:400;">(기본: 보통 · 오른쪽 위)</span></summary>
              <label style="margin:6px 0 0;">QR 코드 크기·위치</label>
              <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;">
                <select id="qr-size"><option value="40">아주 작게</option><option value="50">작게</option><option value="60" selected>보통</option><option value="80">크게</option></select>
                <select id="qr-corner"><option value="top-right" selected>오른쪽 위</option><option value="top-left">왼쪽 위</option><option value="bottom-right">오른쪽 아래</option><option value="bottom-left">왼쪽 아래</option></select>
              </div>
              <div class="qr-prev" id="qr-prev"><canvas id="qr-prev-canvas" width="10" height="10"></canvas><div class="qr-box" id="qr-prev-box"></div></div>
              <p class="hint">빨간 네모가 QR이 찍힐 자리예요(첫 페이지 미리보기). <b>지문이나 그림을 가리면</b> 크기를 줄이거나 다른 모서리로 바꾸세요.</p>
            </details>
            <label class="bank-include-label" style="margin-top:8px;">
              <input type="checkbox" id="save-to-bank" checked> 이 시험 문항도 문제은행에 저장하기
            </label>
            <div id="bank-unit-row" style="margin-top:8px;">
              <p class="hint" style="margin:0 0 6px;">📚 문제은행에 저장할 때의 분류 — 학년·단원은 파일 이름에서 추정했어요. 학교 기출문제라면 구분을 「기출문제」로 바꾸고 학교·시험 이름을 적으세요.</p>
              <div id="bank-cls"></div>
              <div id="bank-qunits-wrap" style="margin-top:10px;">
                <label style="margin:0;">📌 문항 번호별 단원 <span class="hint" style="margin:0; font-weight:400;">추정해서 미리 골라 뒀어요. 틀린 건 눌러서 목록에서 고르세요 (노란 칸은 확신이 낮은 추정)</span></label>
                <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:6px 0;">
                  <span class="hint" style="margin:0; font-weight:700;">⚡ 한꺼번에 지정</span>
                  <select id="qunit-all" style="max-width:260px;"></select>
                  <select id="qsub-all" style="max-width:260px;" title="소단원 (비워 두면 대단원 전체 — 문제 글자로 추정)"><option value="">소단원: 선택 안 함</option></select>
                  <button type="button" class="btn outline" id="qunit-all-btn" style="padding:6px 12px;">전체 문항을 이 단원으로</button>
                  <button type="button" class="btn ghost" id="qunit-empty-btn" style="padding:6px 12px;">비어 있는 문항만 이 단원으로</button>
                </div>
                <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:6px 0;">
                  <span class="hint" style="margin:0; font-weight:700;">📏 번호 구간으로 지정</span>
                  <input type="number" id="qrange-from" min="1" placeholder="시작" style="width:70px;"> <span>번 ~</span>
                  <input type="number" id="qrange-to" min="1" placeholder="끝" style="width:70px;"> <span>번</span>
                  <button type="button" class="btn outline" id="qrange-btn" style="padding:6px 12px;">위에서 고른 단원을 이 구간에 적용</button>
                </div>
                <div class="hint" style="margin:0 0 4px;">사용법: 위 목록에서 단원을 고르고 → 구간(예: 1~10번)을 적고 → 적용. 다음 구간(11~20번)은 단원만 바꿔 또 적용하세요. 아래 번호별 칸에서 한 문제씩 고치는 것도 그대로 돼요.</div>
                <div class="hint" id="qunit-summary" style="margin:0 0 6px; font-weight:700;"></div>
                <div class="hint" id="qunit-hint-msg" style="margin:0 0 6px;"></div>
                <div id="bank-qunits" class="qunits-grid"></div>
              </div>
              <details id="bank-ranges-wrap" style="margin-top:8px;"><summary class="hint" style="cursor:pointer;">번호 범위로 한꺼번에 입력하기 (예: 1-8 물질의 상태 변화)</summary>
                <label style="margin:0;">📌 문항 번호별 단원 <span class="hint" style="margin:0; font-weight:400;">(선택) 한 시험에 여러 단원이 섞인 <b>학교 기출문제</b>일 때 — 줄마다 「번호 범위 + 단원」</span></label>
                <textarea id="bank-ranges" rows="3" placeholder="1-8 물질의 상태 변화&#10;9-15 여러 가지 힘" style="width:100%; padding:8px; border:1.5px solid var(--line); border-radius:8px; font-family:inherit; box-sizing:border-box;"></textarea>
                <p class="hint" style="margin:2px 0 0;">여기 적지 않은 번호는 위의 「단원」 칸 값으로 저장돼요(비어 있으면 「(단원 미지정)」 — 나중에 문제은행에서 고칠 수 있어요).</p>
                <div class="hint" id="bank-range-msg" style="margin:4px 0 0;"></div>
                <button type="button" class="btn outline" id="bank-ranges-apply" style="padding:7px 12px; margin-top:6px;">위 범위를 번호별 칸에 적용</button>
              </details>
              
                <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:6px;">
                  <button type="button" class="btn outline" id="bank-guess-btn" style="padding:7px 12px;">🤖 문제 내용으로 단원 추정해서 채우기</button>
                  <label class="bank-include-label" style="margin:0; font-size:12px;"><input type="checkbox" id="bank-guess-low"> 확신이 낮은 것도 채우기</label>
                </div>
<div class="hint" id="bank-guess-msg2" style="margin:4px 0 0;"></div>
            </div>
            <button type="button" class="btn outline" style="width:100%; margin-top:16px;" id="teacher-btn" disabled>📘 강사용 시험지 PDF 만들어 받기 (정답 동그라미 + 문제 밑 정답·해설 · 시험지 등록과는 별개)</button>
            <button type="button" class="btn outline" style="width:100%; margin-top:8px;" id="merge-btn" disabled>📎 문제지 + 정답지 합친 PDF 받기 (따로 올린 정답지를 문제지 뒤에 붙여요 · 시험지 등록과는 별개)</button>
            <button type="submit" class="btn primary" style="width:100%; margin-top:10px;" id="submit-btn" disabled>시험지 등록하고 QR 만들기</button>
          </div>
        </div>
      </div>
    </div>
  </form>
</template>

<script>
requireLogin();
ensureToc();
renderHeader({ wide: true, wider: true });
setupPdfJs();

let loadSeq = 0;      // 파일을 연달아 바꿔 고를 때 앞 파일의 늦은 결과가 섞이지 않게 하는 번호표
let ansExtra = null;   // 따로 올린 정답지 { doc, scan, name }
let titleManual = false;
let curFileName = '', titleHasUnits = false, unitHint = { nums: [] };
let scanned = null, pdfInfo = null, answerInputs = [], snipUrls = {}, pane = null, answerStartPage = 1;
const $ = id => document.getElementById(id);

// ── 여러 시험지를 한꺼번에 고르면: 한 장씩 차례로 열어 준다 (정답은 시험지마다 확인해야 하니 자동 등록은 하지 않아요) ──
let fileQueue = [], queueTotal = 0, queueDoneTitles = [], queueDoneIds = [];
const ANS_NAME_RE = /정답|해설|답지|답안|answer/i;
function normName(n) { return String(n).replace(/\.pdf$/i, '').replace(/정답\s*및\s*해설|정답과\s*해설|정답|해설|답지|답안|문제지|문제|answers?|[\s_\-()\[\].,+]/gi, '').toLowerCase(); }
function commonLen(a, b) { let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++; return i; }
// 파일 이름으로 문제지와 정답지를 짝짓는다: [{file, ans}]  (isAnsOverride: 이름만으로는 몰라도 내용을 보고 정답지로 판단한 것)
function pairByName(files, isAnsOverride) {
  const isA = files.map((f, i) => ANS_NAME_RE.test(f.name) || !!(isAnsOverride && isAnsOverride[i]));
  if (isA.every(x => x)) return files.map(f => ({ file: f, ans: null }));
  const qs = files.filter((f, i) => !isA[i]).map(f => ({ file: f, ans: null }));
  files.filter((f, i) => isA[i]).forEach(af => {
    let best = null, bs = -Infinity;
    qs.forEach((q, k) => { const sc = commonLen(normName(q.file.name), normName(af.name)) * 10 - (q.ans ? 1000 : 0) - Math.abs(files.indexOf(q.file) - files.indexOf(af)); if (sc > bs) { bs = sc; best = q; } });
    if (best) best.ans = af;
  });
  return qs;
}
// 이름에 "정답"이 없어도 내용으로 정답지인지 본다: 1~4쪽짜리 사진(글자 거의 없음) 또는 「정답/배점」 표 머리글이 있는 PDF
async function looksLikeAnswerSheet(file) {
  try {
    const info = await loadPdfDoc(file), n = info.doc.numPages;
    if (n > 4) return false;
    let chars = 0, txt = '';
    for (let p = 1; p <= n; p++) { const tc = await (await info.doc.getPage(p)).getTextContent(); const t = tc.items.map(i => i.str).join(' '); chars += t.replace(/\s/g, '').length; txt += t + ' '; }
    if (/정답\s*\/?\s*배점|교과목별\s*정답|정\s*답\s*표/.test(txt)) return true;
    return chars < 60 * n;
  } catch (e) { return false; }
}
function showQueueNote() {
  const el = $('queue-note'); if (!el) return;

async function mergeQuestionAnswer(qFile, aFile) {
  const out = await PDFLib.PDFDocument.create();
  let appended = 0;
  const q = await PDFLib.PDFDocument.load(await qFile.arrayBuffer(), { ignoreEncryption: true });
  (await out.copyPages(q, q.getPageIndices())).forEach(p => out.addPage(p));
  const a = await PDFLib.PDFDocument.load(await aFile.arrayBuffer(), { ignoreEncryption: true });
  (await out.copyPages(a, a.getPageIndices())).forEach(p => { out.addPage(p); appended++; });
  const bytes = await out.save();
  return { file: new File([bytes], qFile.name, { type: 'application/pdf' }), appended: appended };
}

function fmtPages(list) {
  const ps = Array.from(new Set(list)).sort((a, b) => a - b), out = [];
  for (let i = 0; i < ps.length;) {
    let j = i; while (j + 1 < ps.length && ps[j + 1] === ps[j] + 1) j++;
    if (j - i >= 2) out.push(ps[i] + '~' + ps[j]); else for (let k = i; k <= j; k++) out.push(String(ps[k]));
    i = j + 1;
  }
  return out.join(', ');
}

  let dupOf = null, stat = { cands: cands.length, withText: 0, noText: 0 };

  cands.sort((a, b) => (dupKey(String(b.title)).slice(0, 8) === myTitle.slice(0, 8)) - (dupKey(String(a.title)).slice(0, 8) === myTitle.slice(0, 8)));

let _subTimer = null, _qTextCache = {};
function scheduleSubs() { clearTimeout(_subTimer); _subTimer = setTimeout(() => { autoSubsNew().catch(() => {}); }, 80); }
async function autoSubsNew() {
  if (!scanned || !pdfInfo) return;
  await ensureToc();
  const grade = readClassify(document, 'bk').grade;
  const groups = new Map();
  for (const sel of Array.from(document.querySelectorAll('.qsub-sel'))) {
    const n = parseInt(sel.dataset.n, 10);
    const us = document.querySelector('.qunit-sel[data-n="' + n + '"]'); if (!us) continue;
    const v = unitSelectValue(us), entry = tocEntryFor(v.grade || grade, us.value);
    const cur = sel.dataset.cur !== undefined ? sel.dataset.cur : sel.value;
    const valid = entry && (entry.subs || []).some(sb => sb.name === cur) ? cur : '';
    refreshSubSelect(sel, entry, valid); delete sel.dataset.cur;
    if (sel.value || sel.dataset.manual || !entry || !(entry.subs || []).length) continue;
    if (!groups.has(entry.id)) groups.set(entry.id, { entry: entry, list: [] });
    groups.get(entry.id).list.push({ n: n, sel: sel });
  }
  for (const g of groups.values()) {
    const texts = [];
    for (const it of g.list) {
      if (_qTextCache[it.n] === undefined) { const q = scanned.questions.find(x => x.num === it.n); _qTextCache[it.n] = q ? await BankCore.textPreviewQ(pdfInfo.doc, q, 240) : ''; }
      texts.push({ text: _qTextCache[it.n] });
    }
    const res = BankCore.estimateSubs(texts, g.entry);
    g.list.forEach((it, k) => { if (res[k]) { it.sel.value = res[k]; it.sel.classList.add('low'); it.sel.title = '🤖 추정 — 틀리면 바꿔 주세요'; } });
  }
}

async function buildBoxes() {
  const count = parseInt($('question-count').value, 10) || 0;
  $('cur-total').textContent = '/ 총 ' + count + '문항';
  const wrap = $('boxes');
  wrap.innerHTML = '';
  for (let n = 1; n <= count; n++) {
    const a = scanned && scanned.answers[n];
    const cell = document.createElement('div');
    cell.className = 'abox';
    cell.innerHTML = '<span>' + n + '</span><input type="text" class="ans-input" inputmode="numeric" data-n="' + n + '" value="' + (a && a.text ? a.text : '') + '"><div class="abox-btns"><button type="button" class="sub-tog" title="주관식(자동 채점 제외)">주</button><button type="button" class="multi-tog" title="복수정답: 정답이 2개 이상일 때(예: 3번과 5번 모두)">복</button></div>';
    wrap.appendChild(cell);
  }
  answerInputs = attachAnswerAdvance(wrap);
  answerInputs.forEach(inp => {
    const n = parseInt(inp.dataset.n, 10);
    const cell = inp.closest('.abox');
    inp.addEventListener('focus', () => showCurrent(n));
    inp.addEventListener('input', () => {
      if (inp.value === '-') setSubjective(inp, true, cell);      // '-' 를 치면 주관식
      inp.classList.toggle('filled', !!inp.value);
      updateSubNote();
    });
    cell.querySelector('.sub-tog').addEventListener('click', () => {
      const on = !inp.disabled;
      setSubjective(inp, on, cell);
      if (!on) inp.focus();
      updateSubNote();
    });
    // 「복」: 정답이 2개 이상인 문항 — 켜면 이 칸에 숫자를 여러 개 넣을 수 있다 (예: 3 → 5 를 치면 "35")
    cell.querySelector('.multi-tog').addEventListener('click', () => {
      if (inp.disabled) setSubjective(inp, false, cell);
      const on = inp.dataset.multi !== '1';
      setMulti(inp, on, cell);
      inp.classList.toggle('filled', !!inp.value);
      inp.focus();
      if (on) { const k = inp.value.length; try { inp.setSelectionRange(k, k); } catch (e) {} }
      updateSubNote();
    });
    inp.classList.toggle('filled', !!inp.value);
    if (scanned && scanned.answers[n] && (scanned.answers[n].multi || /^[1-5]{2,}$/.test(String(inp.value))) && String(inp.value).length > 1) setMulti(inp, true, cell);   // 정답표에 두 개 모두(AND)로 적힌 문항
    if (scanned && scanned.subj && scanned.subj[n]) setSubjective(inp, true, cell);   // 문제 글자로 추정한 주관식
  });
  $('submit-btn').disabled = false; $('teacher-btn').disabled = false; $('merge-btn').disabled = false;
  updateSubNote(scanned && scanned.subj ? Object.keys(scanned.subj).filter(k => scanned.subj[k] && k <= count).length : 0);
  const firstOpen = answerInputs.find(i => !i.disabled);
  if (firstOpen) { showCurrent(parseInt(firstOpen.dataset.n, 10)); firstOpen.focus({ preventScroll: true }); }

  // 정답이 그림이라 글자로 못 읽는 경우, 그 부분을 크게 잘라서 미리 만들어 둔다
  snipUrls = {};
  if (scanned) {
    for (let n = 1; n <= count; n++) {
      const a = scanned.answers[n];
      if (!a || a.text || !a.rect) continue;
      try {
        const c = await BankCore.renderRect(pdfInfo.doc, a.page, a.rect, 5, false);
        snipUrls[n] = c.toDataURL('image/png');
        if ($('cur-n').textContent === String(n)) showCurrent(n);
      } catch (e) {}
    }
  }
}

// 등록한 시험의 문항들을 문제은행에도 저장한다 (원본 PDF에서 각 문항을 다시 잘라서 저장 — 등록한
// 시험지(QR·지우기 반영본)가 아니라 깨끗한 원본 기준이라, 문제은행 그림에는 QR이 안 찍혀 있다)
let lastBankSkipped = 0;
async function saveToBank(cls, source, onProgress, ranges) {
  // 번호 범위로 지정한 단원이 있으면 그걸, 없으면 위의 단원 칸 값을 쓴다 (기출문제는 단원이 비어 있을 수 있다)
  const gradeFor = n => { let g = ''; (ranges || []).forEach(r => { if (n >= r.from && n <= r.to && r.grade) g = r.grade; }); return g || cls.grade; };
  const subFor = n => { const el = document.querySelector('.qsub-sel[data-n="' + n + '"]'); return el ? el.value : ''; };
  const subIsAuto = n => { const el = document.querySelector('.qsub-sel[data-n="' + n + '"]'), us = document.querySelector('.qunit-sel[data-n="' + n + '"]'); return ((el && el.value && el.classList.contains('low') && !el.dataset.manual) ? 1 : 0) | ((us && us.value && us.dataset.auto === '1') ? 2 : 0); };
  const unitFor = n => { let u = ''; (ranges || []).forEach(r => { if (n >= r.from && n <= r.to) u = r.unit; }); return u || cls.unit || '(단원 미지정)'; };
  let dScores = {};
  try { dScores = await BankCore.difficultyScores(pdfInfo.doc, scanned); } catch (e) {}
  // 1단계: 글자·분류만 먼저 모아서(빠름) 중복을 거른다 → 이미 있는 문항은 그림을 만들지도 않는다
  const picks = [];
  for (const q of scanned.questions) {
    const inp = answerInputs[q.num - 1];
    picks.push({
      id: 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), _q: q,
      unit: unitFor(q.num), sub: subFor(q.num), auto: subIsAuto(q.num), grade: gradeFor(q.num), kind: cls.kind, school: cls.school, year: cls.year, answer: inp ? inp.value : '', source: source,
      textPreview: await BankCore.textPreviewQ(pdfInfo.doc, q, 240), num: q.num,
      difficulty: '', diffScore: (dScores[q.num] === undefined ? null : dScores[q.num]),
    });
  }
  { const hm = BankCore.linkHeads(picks.map(p => ({ num: p.num, text: p.textPreview }))); picks.forEach(p => { if (hm[p.num]) p.head = hm[p.num]; }); }   // 연관 문제 표시
  // 같은 PDF를 또 올렸을 때 중복 저장하지 않는다 (이미 문제은행에 있는 글자와 같은 문항은 뺀다)
  const keys = await existingPreviewKeys();
  const kept = picks.filter(p => !isDupPreview(p.textPreview, keys));
  lastBankSkipped = picks.length - kept.length;
  picks.length = 0; kept.forEach(p => picks.push(p));
  window.__bankIds = {}; picks.forEach(p => { window.__bankIds[p.num] = p.id; });
  unassignedCount += picks.filter(p => p.unit === '(단원 미지정)').length;
  // 2단계: 그림을 만들면서 바로바로 서버로 보낸다 (그림 만들기와 서버 저장이 겹쳐서 빠르다). 문항마다 드라이브 파일을 만드느라 서버가 느려서 작게 묶어 많이 동시에 보낸다.
  const BATCH = 5, PARALLEL = 4;
  const chunks = [];
  for (let s2 = 0; s2 < picks.length; s2 += BATCH) chunks.push(picks.slice(s2, s2 + BATCH));
  let next = 0, done = 0, failure = null;
  const worker = async () => {
    while (!failure) {
      const k = next++;
      if (k >= chunks.length) return;
      const tChunk0 = performance.now();
      try {
        for (const p of chunks[k]) {
          const q = p._q;
          const canvas = await rcBankQ(q);
          if (IS_CHILD) { try { (window.__qthumb = window.__qthumb || {})[q.num] = thumbOf(canvas); } catch (e) {} }       // 결과 화면에서 단원을 확인할 때 문제를 보여 주려고 작은 그림을 남긴다
          const ex = scanned.explanations && scanned.explanations[q.num];
          let explCanvas = null;
          try { explCanvas = await rcExpl(q.num, ex); } catch (e) {}
          p.imageBase64 = BankCore.canvasToBase64(canvas);
          p.explBase64 = explCanvas ? BankCore.canvasToBase64(explCanvas) : '';
          p.numRect = relNum(q, canvas);
          p.explNumRect = (ex && ex.numRect) ? relRect(ex.numRect, ex.segments[0].rect) : null;
        }
        const payload = chunks[k].map(p => { const o = Object.assign({}, p); delete o._q; return o; });
        const BS = (window.__bankStat = window.__bankStat || { chunks: 0, kb: 0, rend: 0, req: 0, up: 0, lock: 0, sheet: 0, srv: false });
        BS.rend += Math.round(performance.now() - tChunk0);
        BS.kb += Math.round(payload.reduce((a, o) => a + (o.imageBase64 || '').length + (o.explBase64 || '').length, 0) * 0.75 / 1024);
        const tReq = performance.now();
        const res = await callApi('saveQuestions', { password: getTeacherPassword(), questions: payload });
        BS.req += Math.round(performance.now() - tReq); BS.chunks++;
        if (res && res.ms) { BS.srv = true; BS.fast = (BS.fast || 0) + (res.ms.fast || 0); BS.slow = (BS.slow || 0) + (res.ms.slow || 0); if (res.ms.code) { BS.code = res.ms.code; BS.msg = res.ms.msg || BS.msg || ''; } BS.up += res.ms.up || 0; BS.lock += res.ms.lock || 0; BS.sheet += res.ms.sheet || 0; }
        if (!res.ok) { failure = new Error(res.error || '저장 실패'); return; }
        chunks[k].forEach(p => { p.imageBase64 = p.explBase64 = ''; });          // 보낸 그림은 메모리에서 비운다
        done += chunks[k].length;
        if (onProgress) onProgress(done);
      } catch (e) { failure = e; return; }
    }
  };
  await Promise.all(Array.from({ length: Math.min(PARALLEL, chunks.length) }, worker));
  if (failure) throw failure;
  return picks.length;
}

// 강사용 시험지: 원본 PDF에서 문항·해설을 다시 잘라, 문제 밑에 정답·해설을 붙여 내려받는다
async function buildTeacherBytes(title, answers) {
  if (!scanned.questions.length) {
    // 스캔(사진) PDF라 글자가 없어서 문제를 하나씩 잘라낼 수 없다 → 원본 쪽 그대로 + 맨 뒤에 정답표
    const src = await PDFLib.PDFDocument.load(pdfInfo.bytes.slice(0), { ignoreEncryption: true });
    const back = await BankCore.answerSheetDoc(PDFLib, title, answers.map(a => ({ answer: a })), null);
    const merged = await BankCore.mergePdfs(PDFLib, src, back);
    await BankCore.addPageNumbers(PDFLib, merged);
    return { bytes: await merged.save(), fallback: true };
  }
  const items = [];
  const cls = readClassify(document, 'bk');
  const tag = cls.kind === '기출' ? BankCore.pastTagText({ kind: '기출', school: cls.school, year: cls.year, grade: cls.grade, source: title }) : '';
  const qs = scanned.questions.slice().sort((a, b) => a.num - b.num);
  for (const q of qs) {
    let canvas;
    try { const bq = await rcBankQ(q); canvas = bq._p ? await BankCore.renderQuestion(pdfInfo.doc, q, BankCore.CROP_SCALE, true) : bq; }      // 문제은행에 저장하려고 이미 만든 그림을 다시 만들지 않고 쓴다 (연관 문제 머리글을 가린 문항만 새로 만든다)
    catch (e) { canvas = await BankCore.renderQuestion(pdfInfo.doc, q, BankCore.CROP_SCALE, true); }
    const ex = scanned.explanations && scanned.explanations[q.num];
    let ec = null;
    try { ec = await rcExpl(q.num, ex); } catch (e) {}
    const it = { base64: BankCore.canvasToBase64(canvas), width: canvas.width, height: canvas.height, naturalW: canvas.width / BankCore.CROP_SCALE, num: q.num, noBadge: true, answer: answers[q.num - 1] || '', tag: tag };
    if (ec) { it.explBase64 = BankCore.canvasToBase64(ec); it.explW = ec.width; it.explH = ec.height; it.explNumRect = (ex && ex.numRect && ex.segments && ex.segments[0]) ? relRect(ex.numRect, ex.segments[0].rect) : null; }
    items.push(it);
  }
  // 번호를 못 찾아 앞 문항 그림에 같이 들어간 문항(번호가 건너뛴 곳)도 정답이 빠지지 않게, 앞 문항 정답 줄에 함께 적는다
  { const found = new Set(items.map(x => x.num)), last = Math.max.apply(null, answers.map((a, i) => i + 1).concat([0]));
    items.forEach((it, i) => {
      const nextNum = i + 1 < items.length ? items[i + 1].num : last + 1, gaps = [];
      for (let n = it.num + 1; n < nextNum; n++) if (!found.has(n)) gaps.push(n);
      if (gaps.length) { it.subAnswers = [it.num].concat(gaps).map(n => answers[n - 1] || ''); it.numStart = it.num; }
    });
  }
  let keepT = false; try { keepT = readClassify(document, 'bk').kind === '기출'; } catch (e) {}
  const tdoc = await BankCore.composeTeacherPdf(PDFLib, title, items, { keepTitle: keepT });
  // 뒤쪽에 정답표 → 해설을 한 번 더 붙인다
  const explImgs = items.filter(it => it.explBase64).map(it => ({ base64: it.explBase64, width: it.explW, height: it.explH, naturalW: it.explW / 2.2, numRect: it.explNumRect || null, tag: tag, num: it.num }));
  let explDoc = null;
  if (explImgs.length) explDoc = await BankCore.composeExamPdf(PDFLib, title + ' 해설', explImgs, { subtitle: explImgs.every(x => x.numRect) ? '※ 정답 옆의 진한 파란 원 번호가 시험지의 문항 번호예요.' : '※ 왼쪽 진한 파란 원 번호가 시험지의 문항 번호예요. (해설 안에 다른 번호가 보여도 무시하세요)', centerLine: false });
  const back = await BankCore.answerSheetDoc(PDFLib, title, answers.map(a => ({ answer: a })), explDoc);
  const merged = await BankCore.mergePdfs(PDFLib, tdoc, back);
  await BankCore.addPageNumbers(PDFLib, merged);
  return { bytes: await merged.save(), fallback: false };
}
async function downloadTeacherPdf(title, answers) {
  let r; try { r = await buildTeacherBytes(title, answers); } finally { rcClear(); }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([r.bytes], { type: 'application/pdf' }));
  a.download = title.replace(/[\\/:*?"<>|]/g, '_') + ' 강사용.pdf';
  document.body.appendChild(a); a.click(); a.remove();
  await new Promise(r2 => setTimeout(r2, 600));
  if (r.fallback) alert('이 PDF는 사진(스캔)으로 된 파일이라 글자가 없어서, 문제를 하나씩 잘라 정답·해설을 문제 밑에 붙일 수 없어요.\n\n대신 원본 쪽 그대로 두고, 맨 뒤에 입력해 둔 정답표를 붙여서 내려받았어요.\n(정답 동그라미·문제 밑 정답은 글자가 있는 PDF에서만 돼요. 한글 파일을 PDF로 저장한 것은 글자가 살아 있어요.)');
}

    const same = ex && ex.ok ? (ex.exams || []).filter(x => String(x.title).trim() === title).length : 0;
    if (same && window.__auto) { await autoSkip(title + ' (같은 이름이 이미 있어요)'); return; }
    if (same && !confirm('"' + title + '" 이름의 시험지가 이미 ' + same + '개 있어요.\n같은 PDF를 또 올리는 거라면 중복이에요. 그래도 새로 등록할까요?\n(취소하면 이 시험지는 건너뛰고 다음 시험지로 넘어가요)')) { if (queueTotal > 1) await skipToNext(title + ' (중복)'); return; }
  } catch (e) {}
  const answers = answerInputs.map(i => i.value);
  const missing = answers.map((a, i) => a ? null : i + 1).filter(Boolean);
  if (!answers.length) { errorBox.innerHTML = '<div class="banner error">정답 칸이 없어요. PDF를 먼저 올려주세요.</div>'; return; }
  if (missing.length) {
    errorBox.innerHTML = '<div class="banner error">정답이 비어있는 문항이 있어요: ' + missing.slice(0, 15).join(', ') + (missing.length > 15 ? ' ...' : '') + '번</div>';
    window.scrollTo(0, 0);
    return;
  }
  // 제목이 달라도 내용(문항 글자·정답)이 같은 시험지가 이미 있으면 중복으로 보고 막는다
  try {
    showSpinner('이미 등록된 시험지와 비교하는 중...');
    const dupOf = await findDupExam(answers);
    hideSpinner();
    if (dupOf && window.__auto) { await autoSkip(title + ' (「' + dupOf.title + '」와 내용이 같아요)'); return; }
    if (dupOf && !confirm('이미 등록된 「' + dupOf.title + '」와 내용이 같은 시험지예요' + (dupOf.hit ? ' (문항 ' + dupOf.hit + '/' + dupOf.n + '개 일치)' : ' (정답이 모두 같아요)') + '.\n제목만 다르게 또 올리는 거라면 중복이에요.\n\n그래도 새로 등록할까요?\n(취소하면 이 시험지는 건너뛰고 다음 시험지로 넘어가요)')) { if (queueTotal > 1) await skipToNext(title + ' (중복)'); return; }
  } catch (e) { hideSpinner(); console.warn('중복 비교 실패', e); }
  $('submit-btn').disabled = true;
  showSpinner('QR 만들고 PDF에 찍는 중...');
  try {
    const examId = genExamId();
    const redactions = pane ? pane.redactions : [];
    const hasAnswerPages = $('strip-answer').checked && scanned.answerPages.length;

    // 복사방지(암호)가 걸린 PDF는 빈 비밀번호로 열어서 원래 글자·그림을 그대로 살린다(화질이 좋음).
    // 그걸로도 안 열리는 아주 드문 경우에만, pdf.js가 화면에 그린 모습을 사진처럼 떠서 새 PDF를
    // 만든다(글자 선택은 안 되지만 확실하게는 열린다).
    let pdfDoc, explDoc = null;
    try {
      pdfDoc = await PDFLib.PDFDocument.load(pdfInfo.bytes.slice(0), { password: '' });
      explDoc = hasAnswerPages ? await PDFLib.PDFDocument.load(pdfInfo.bytes.slice(0), { password: '' }) : null;
      if (explDoc) for (let p = explDoc.getPageCount(); p >= 1; p--) if (!scanned.answerPages.includes(p)) explDoc.removePage(p - 1);
      if (hasAnswerPages) scanned.answerPages.slice().sort((a, b) => b - a).forEach(p => pdfDoc.removePage(p - 1));
    } catch (e) {
      updateSpinner('이 PDF는 속 내용을 직접 못 읽어요 — 이미지로 다시 만드는 중...');
      pdfDoc = await BankCore.rasterizeToPdf(PDFLib, pdfInfo.doc, hasAnswerPages ? scanned.answerPages : [], 2.2);
      explDoc = hasAnswerPages ? await BankCore.rasterizeToPdf(PDFLib, pdfInfo.doc, [], 2.2, scanned.answerPages) : null;
    }
    try { await BankCore.stripYellowHighlights(PDFLib, pdfDoc); } catch (e) {}       // 정답에 칠해진 노란 형광펜은 학생용 시험지에서 지운다
    BankCore.applyRedactions(PDFLib, pdfDoc, redactions.filter(r => !hasAnswerPages || !scanned.answerPages.includes(r.page)));
    if (explDoc) {            // 해설 문서는 해설 쪽만 남아 있어서 쪽 번호가 달라진다 → 원래 쪽 번호를 해설 문서 안 번호로 바꾼다
      const sortedAns = scanned.answerPages.slice().sort((a, b) => a - b);
      BankCore.applyRedactions(PDFLib, explDoc, redactions.filter(r => sortedAns.includes(r.page)).map(r => Object.assign({}, r, { page: sortedAns.indexOf(r.page) + 1 })));
    }
    // 기출문제가 아니면 첫 쪽 제목 칸의 "○○중 대비" 같은 특정 학교 이름 제목을 시험지 제목으로 바꾼다 (기출문제는 학교 이름을 그대로 둔다)
    try { if (readClassify(document, 'bk').kind !== '기출') { const f1 = pdfDoc.getPages()[0], pl = qrPlacement(f1.getWidth(), f1.getHeight(), qrOpts()), qr = { x0: pl.x - 6, top: f1.getHeight() - pl.y - pl.size - 6, bottom: f1.getHeight() - pl.y + 6 }; let tb = await BankCore.findTitleBox(pdfInfo.doc); if (!tb) { try { tb = await BankCore.findHeaderCluster(pdfInfo.doc); } catch (e) {} } if (tb) await BankCore.replaceTitleBox(PDFLib, pdfDoc, tb, title, qr); else await BankCore.stampTitleHeader(PDFLib, pdfDoc, pdfInfo.doc, title, qr); } } catch (e) { console.warn('제목 바꾸기 실패', e); }
    await stampQrOnDoc(pdfDoc, studentLinkFor(examId), qrOpts());
    const merged = await BankCore.mergePdfs(PDFLib, pdfDoc, explDoc);
    await BankCore.addPageNumbers(PDFLib, merged, { logoSize: 10, logoTop: 14 });
    mark('stampDone');
    const pdfBase64 = arrayBufferToBase64(await merged.save());
    // 틀린 문항과 비슷한 문제를 나중에 찾을 때 PDF를 다시 읽지 않아도 되게, 문항별 글자를 같이 저장한다
    const questionTexts = [];
    try {
      for (let n = 1; n <= answers.length; n++) {
        const q = scanned.questions.find(x => x.num === n);
        questionTexts.push(q ? await BankCore.textPreview(pdfInfo.doc, q.page, q.rect, 120) : '');
      }
    } catch (e) {}
    updateSpinner('서버에 저장하는 중...');
    const teacherP = buildTeacherBytes(title, answers).catch(e => { console.warn('강사용 PDF 보관 실패', e); return null; });      // 서버 저장을 기다리는 동안 강사용 PDF를 같이 만든다
    // 서버에 시험을 등록하는 동안 문제은행 저장도 같이 진행한다 (둘은 서로 기다릴 필요가 없다)
    const runBank = async () => {
      let bankWarning = '';
      { // 이름에 학교가 있는데 구분이 「일반」으로 남아 있으면(직접 바꾸지 않았다면) 기출문제로 저장한다
        const kd = $('bk-kind'), fx = extractSchoolYear(curFileName + ' ' + title);
        if (kd && fx.school && !fx.mock && kd.value !== '기출' && !kd.dataset.touched) {
          kd.value = '기출'; kd.dispatchEvent(new Event('change', { bubbles: true }));
          const sc = $('bk-school'), yr = $('bk-year');
          if (sc && !sc.value) sc.value = fx.school;
          if (yr && !yr.value && fx.year) yr.value = fx.year.slice(0, 4);
        }
      }
      { const kd2 = $('bk-kind'), sc2 = $('bk-school');          // 저장 직전: 기출인데 학교 칸에 학교 이름이 빠져 있으면 시험지 이름·파일 이름에서 찾아 붙인다
        if (kd2 && kd2.value === '기출' && sc2) { const nm2 = extractSchoolYear(title + ' ' + curFileName).school; if (nm2) sc2.value = withSchoolName(sc2.value, nm2); } }
      const cls = readClassify(document, 'bk');
      // 단원을 못 정한 문항은 제목이 아니라 「(단원 미지정)」으로 둔다 (제목이 단원으로 들어가면 문제은행에 이상한 단원이 생긴다)
      const ranges = collectQUnits();
      try {
        mark('bank0'); updateSpinner('문제은행에 저장하는 중... 0/' + scanned.questions.length);
        await saveToBank(cls, title, n => updateSpinner('문제은행에 저장하는 중... ' + n + '/' + scanned.questions.length), ranges);
        if (lastBankSkipped) bankWarning = '이미 문제은행에 있는 문항 ' + lastBankSkipped + '개는 중복이라 다시 저장하지 않았어요.';
      } catch (e) {
        bankWarning = '시험 등록은 됐지만, 문제은행 저장 중 오류가 났어요: ' + e.message;
      }
    
      mark('bank1');
      return bankWarning;
    };
    mark('exam0');
    const bankP = $('save-to-bank').checked ? runBank() : null;
    if (bankP) bankP.catch(() => {});
    const res = await callApi('createExam', {
      password: getTeacherPassword(), id: examId, title: title, answers: answers,
      pdfBase64: pdfBase64, filename: title, questionTexts: questionTexts,
    });
    mark('exam1');
    if (res.ok) {      // 강사용 PDF도 같이 만들어 이 브라우저에 보관 → 등록 완료 화면에서 학생용을 받을 때 함께 받아진다
      try { updateSpinner('강사용 시험지 정리하는 중...'); const tr = await teacherP; if (tr) await teacherPdfSave(examId, title + ' 강사용.pdf', tr.bytes); }
      catch (e) { console.warn('강사용 PDF 보관 실패', e); }
    }
    let bankWarning = '';
    if (bankP) {
      try { bankWarning = await bankP; } catch (e) { bankWarning = '시험 등록은 됐지만, 문제은행 저장 중 오류가 났어요: ' + e.message; }
      if (!res.ok) {     // 시험 등록이 실패했으면 방금 저장한 문제도 지운다 (주인 없는 문제가 남지 않게)
        try { const ids = Object.keys(window.__bankIds || {}).map(k => window.__bankIds[k]); for (let i2 = 0; i2 < ids.length; i2 += 40) await callApi('deleteQuestions', { password: getTeacherPassword(), ids: ids.slice(i2, i2 + 40) }); } catch (e) {}
        bankWarning = '';
      }
    }
    mark('end'); rcClear(); hideSpinner();
    if (res.ok && queueTotal > 1) {
      if (bankWarning) { if (window.__auto) queueNotes.push(title + ': ' + bankWarning); else alert(bankWarning); }
      queueDoneTitles.push(title); queueDoneIds.push(examId);
      if (fileQueue.length) {
        const nx = fileQueue.shift();
        $('submit-btn').disabled = false; window.scrollTo(0, 0);
        await loadExamFile(nx.file, nx.ans);
      } else if (window.__auto) { await autoFinishQueue(); }
      else {
        alert('시험지 ' + queueDoneIds.length + '개를 모두 등록했어요. 시험지 목록으로 이동합니다.');
        location.href = 'teacher_list.html';
      }
    }
    else if (res.ok && IS_CHILD) { childReport({ type: 'done', title: title, examId: examId, answers: answers.slice(), unread: (window.__unread || []).slice(), dash: (window.__dash || []).slice(), dashImg: window.__dashImg || {}, bankIds: window.__bankIds || {}, warning: bankWarning, unassigned: unassignedCount, units: Array.from(new Set(Array.from(document.querySelectorAll('.qunit-sel')).map(x => x.value || '(단원 미지정)'))), autoUnits: document.querySelectorAll('.qunit-sel[data-auto="1"]').length, tm: Object.assign({}, TM, { bs: window.__bankStat || null }), qthumb: window.__qthumb || {}, unreadImg: window.__unreadImg || {}, qinfo: Array.from(document.querySelectorAll('.qunit-sel')).map(el => { const v = unitSelectValue(el), sb = document.querySelector('.qsub-sel[data-n="' + el.dataset.n + '"]'); return { n: +el.dataset.n, unit: v.unit, grade: v.grade, sub: sb ? sb.value : '' }; }) }); }
    else if (res.ok) { if (bankWarning) alert(bankWarning); location.href = (window.__auto && unassignedCount && confirm('단원을 못 정한 문항이 ' + unassignedCount + '개 있어요. 「확인」을 누르면 그 문항만 문제은행에서 바로 열어요.')) ? 'bank_list.html?unassigned=1' : 'teacher_exam.html?id=' + examId; }
    else { window.__auto = false; if (IS_CHILD) childReport({ type: 'error', title: title, msg: res.error || '등록 실패' }); errorBox.innerHTML = '<div class="banner error">' + escapeHtml(res.error || '등록에 실패했어요.') + '</div>'; $('submit-btn').disabled = false; window.scrollTo(0, 0); }
  } catch (err) {
    rcClear(); hideSpinner(); window.__auto = false; if (IS_CHILD) childReport({ type: 'error', title: title, msg: err.message });
    errorBox.innerHTML = '<div class="banner error">오류가 발생했어요: ' + escapeHtml(err.message) + '</div>';
    $('submit-btn').disabled = false;
    window.scrollTo(0, 0);
  }
});
handoffInto('pdf-file', el => el.dispatchEvent(new Event('change')));       // 단원 판별 화면에서 넘어온 파일
</script>
</body>
</html>
