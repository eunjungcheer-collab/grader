<body>
<template id="page-content">

       <button type="button" class="btn primary" id="ac-scanall" style="padding:8px 14px;">🔍 전체 검사 (후보 찾기)</button><input type="search" id="ac-q" placeholder="이름 검색" style="flex:1 1 150px;min-width:120px;">
    </div>

<script src="js/config.js?v=202611191340"></script>

<script>
requireLogin();
renderHeader();

function rangeInfo(q, picks) {
  const m = String(q.textPreview || '').match(/^\s*[\[(【]\s*(\d{1,2})\s*[~∼～\-–]\s*(\d{1,2})\s*(?:번)?\s*[\])】]/);
  if (!m) return null;
  const k = parseInt(m[2], 10) - parseInt(m[1], 10) + 1;
  if (!(k >= 2 && k <= 4)) return null;
  // 같은 시험의 뒷 번호 문항이 따로 들어 있으면(예: [25~26]의 25번·26번을 각각 고른 경우) 묶음 문항이 아니다. 25번의 정답 '4,5'(2개)를 두 문제의 정답으로 읽으면 안 된다.
  const a0 = parseInt(m[1], 10), b0 = parseInt(m[2], 10);
  if (picks && picks.some(o => o !== q && o.source === q.source && o.num > a0 && o.num <= b0)) return null;
  const ans = String(q.answer || '').trim();
  let parts = null;
  if (/^\d+$/.test(ans) && ans.length === k) parts = ans.split('');
  else if (/^[\d\-]+([,\s]+[\d\-]+)+$/.test(ans)) parts = ans.split(/[,\s]+/);
  return parts && parts.length === k ? { k: k, parts: parts } : null;
}
function buildSlots(picks) {
  let n = 1;
  return picks.map(q => {
    const ri = rangeInfo(q, picks), k = ri ? ri.k : 1, start = n;
    n += k;
    return { start: start, k: k, parts: ri ? ri.parts : null, label: k > 1 ? start + '~' + (start + k - 1) : String(start) };
  });
}
// ── 문항·해설 그림 가져오기: 5개씩 묶어 여러 묶음을 동시에 받는다 (한 묶음씩 차례로 받으면 서버 응답을 계속 기다려야 해서 느리다) ──
const _imgCache = new Map();
function prefetchImages(ids, conc) {
  const todo = Array.from(new Set(ids.filter(Boolean))).filter(id => !_imgCache.has(id));
  const batches = [];
  for (let s = 0; s < todo.length; s += 5) batches.push(todo.slice(s, s + 5));
  batches.forEach(b => {
    let res, rej; const bp = new Promise((a, r) => { res = a; rej = r; }); bp.catch(() => {});
    b.forEach(id => { const pr = bp.then(r => { const im = (r.images || []).find(x => x.fileId === id); if (!im) throw new Error('이미지를 불러오지 못했어요'); return im; }); pr.catch(() => {}); _imgCache.set(id, pr); });
    b._d = { res: res, rej: rej };
  });
  let next = 0;
  const worker = async () => {
    while (next < batches.length) {
      const b = batches[next++];
      try { const r = await callApi('getQuestionImages', { password: getTeacherPassword(), fileIds: b }); if (!r.ok) b._d.rej(new Error(r.error || '이미지를 불러오지 못했어요')); else b._d.res(r); }
      catch (e) { b._d.rej(e); }
    }
  };
  Array.from({ length: Math.min(conc || 5, batches.length) }, worker);
}
async function getImgs(ids) {
  const miss = ids.filter(id => !_imgCache.has(id));
  if (miss.length) prefetchImages(miss);
  return Promise.all(ids.map(id => _imgCache.get(id)));
}

// 시험지에 기록된 문항 id가 문제은행에 없으면(문항이 지워졌거나 다시 저장되면서 id가 바뀐 경우), 같은 교재·같은 단원 이름으로 저장된 문항을 번호 순으로 찾아 쓴다. 개수가 안 맞으면 만들지 않는다.
function resolveBankPicks(exam, all, byId) {
  const ids = exam.sourceQuestionIds || [], rc = exam.composeRecipe || {}, need = ids.length || (exam.answers || []).length;
  const direct = ids.map(id => byId[id] || null);
  if (ids.length && direct.every(Boolean)) return direct;
  if (rc.book && rc.bookTitle && rc.label) {
    // 같은 교재·같은 단원 이름으로 저장된 문항을 번호(1~n)별로 모은다. 같은 번호가 여러 개(교재를 여러 번 등록한 경우)면 가장 최근 것을 쓴다.
    const src = (rc.bookTitle + ' ' + rc.label).trim(), byNum = {};
    all.filter(q => String(q.source || '').trim() === src).forEach(q => { const k = Number(q.num) || 0; if (k && (!byNum[k] || String(q.createdAt || '') > String(byNum[k].createdAt || ''))) byNum[k] = q; });
    const out = [];
    for (let i = 0; i < need; i++) { const q = direct[i] || byNum[i + 1]; if (!q) break; out.push(q); }
    if (out.length === need) return out;
    const have = Object.keys(byNum).length;
    throw new Error('이 시험지의 문항 ' + (need - out.length) + '개를 문제은행에서 찾지 못했어요 (이 단원 문항 ' + have + '개 저장됨, 필요 ' + need + '개). 교재 QR 합본 만들기로 이 단원을 다시 저장해야 해요.');
  }
  throw new Error('이 시험지에 쓴 문항이 문제은행에서 삭제돼서 같은 시험지를 다시 만들 수 없어요.');
}

function pngSize(bytes) { const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength); return { width: dv.getUint32(16), height: dv.getUint32(20) }; }
const $ = id => document.getElementById(id);
let EXAMS = [], BANK = null;

// 1단계: 서버가 이미 알고 있는 숫자(문항 수·주관식 수)만으로 의심 정도를 매긴다
function risk(ex) {
  const n = ex.answerCount || 0, s = ex.subjectiveCount || 0;
  if (!s || !n) return { lv: 'ok', label: '주관식 없음', score: 0 };
  const r = s / n;
  if (s >= 8 && r >= 0.08 || r >= 0.25) return { lv: 'hi', label: '의심 큼', score: 3 + r };
  if (s >= 3 && r >= 0.04) return { lv: 'mid', label: '의심', score: 2 + r };
  return { lv: 'lo', label: '주관식 조금', score: 1 + r };
}
function scanBadge(x) {
  const sc = SCAN[String(x.ex.id)];
  if (!sc) return '<span class="ac-lv ' + x.r.lv + '">' + x.r.label + '</span>';
  if (sc.unknown) return '<span class="ac-lv mid" title="' + escapeHtml(sc.unknown) + '">🔎 확인 불가 (직접 확인)</span>';
  if (sc.err) return '<span class="ac-lv lo" title="' + escapeHtml(sc.err) + '">확인 못함</span>';
  if (sc.n) return '<span class="ac-lv hi">⚠️ 후보 ' + sc.n + '문항 (' + sc.nums.slice(0, 6).join(', ') + (sc.nums.length > 6 ? ' …' : '') + '번)</span>';
  if (sc.weak) return '<span class="ac-lv mid">약한 후보 ' + sc.weak + '문항 (' + sc.wnums.slice(0, 6).join(', ') + '번)</span>';
  return '<span class="ac-lv ok">보기 있는 주관식 없음</span>';
}
function renderList() {
  const showAll = $('ac-all').checked, kw = $('ac-q').value.trim().toLowerCase();
  const rows = EXAMS.map(ex => ({ ex: ex, r: risk(ex) })).filter(x => (showAll || x.r.score > 0) && (!kw || String(x.ex.title).toLowerCase().includes(kw)));
  rows.sort((a, b) => (((SCAN[String(b.ex.id)] || {}).n || 0) * 10 + ((SCAN[String(b.ex.id)] || {}).weak || 0)) - (((SCAN[String(a.ex.id)] || {}).n || 0) * 10 + ((SCAN[String(a.ex.id)] || {}).weak || 0)) || b.r.score - a.r.score || String(b.ex.createdAt).localeCompare(String(a.ex.createdAt)));
  const susp = EXAMS.filter(ex => risk(ex).score >= 2).length;
  $('ac-sum').innerHTML = '시험지 ' + EXAMS.length + '개 중 <b>주관식이 있는 것 ' + EXAMS.filter(ex => ex.subjectiveCount > 0).length + '개</b>, 그중 <b style="color:#B91C1C">의심 ' + susp + '개</b>예요. 「검사」를 누르면 문제 그림에서 보기 ①~⑤가 있는지 직접 확인해요.';
  $('ac-list').innerHTML = rows.length ? rows.map(x => '<div class="ac-row"><div class="t">' + escapeHtml(x.ex.title) + '<div class="m">' + x.ex.answerCount + '문항 · 주관식 ' + (x.ex.subjectiveCount || 0) + ' · 제출 ' + (x.ex.submissionCount || 0) + '건</div></div>' + scanBadge(x) + '<button type="button" class="btn ' + (x.r.score >= 2 ? 'primary' : 'outline') + '" data-id="' + escapeHtml(String(x.ex.id)) + '" style="padding:7px 14px;">검사</button></div>').join('') : '<p class="muted" style="padding:12px 0;">해당하는 시험지가 없어요.</p>';
  $('ac-list').querySelectorAll('button[data-id]').forEach(b => b.addEventListener('click', () => inspect(b.getAttribute('data-id'))));
}

const SCAN = {};   // 시험지 id -> {n: 보기 있는 주관식 문항 수, nums: [번호], err}
async function scanExam(id, say) {
  say = say || function () {};
  const exam = await callApi('getExamDetail', { password: getTeacherPassword(), id: id });
  if (!exam.ok) throw new Error(exam.error || '시험지를 불러오지 못했어요');
  const subj = exam.answers.map((a, i) => a === '-' ? i : -1).filter(i => i >= 0);
  if (!subj.length) return { exam: exam, found: null, none: true };
  if (!BANK) { const lq = await callApi('listQuestions', { password: getTeacherPassword() }); if (!lq.ok) throw new Error(lq.error || '문제은행을 불러오지 못했어요'); BANK = lq.questions; }
  const byId = {}; BANK.forEach(q => { byId[q.id] = q; });
  const unk = m => { SCAN[String(id)] = { n: 0, weak: 0, nums: [], unknown: m }; return { exam: exam, found: null, noimg: m }; };
  let picks; try { picks = resolveBankPicks(exam, BANK, byId); } catch (e) { return unk(e.message); }
  const slots = buildSlots(picks), need = [];
  // 안전 검사: 문항 그림의 번호가 시험지 정답표 번호와 어긋나면(묶음 문항 등) 엉뚱한 그림을 보여 줄 수 있으니 그림 검사를 하지 않는다
  const total = slots.reduce((a, x) => a + x.k, 0);
  if (total !== exam.answers.length) return unk('문항 그림 ' + picks.length + '개의 번호가 시험지 정답표(' + exam.answers.length + '문항)와 맞지 않아요 (묶음 문항이 있는 시험지). 그림이 어긋날 수 있어 자동 검사를 하지 않았어요.');
  for (let k = 0; k < slots.length; k++) { const sl = slots[k]; if (sl.k === 1 && (exam.answers[sl.start - 1] === '-') !== (String(picks[k].answer || '').trim() === '-')) return unk('문제은행 문항과 시험지 정답이 서로 달라요 (' + sl.start + '번). 그림이 어긋날 수 있어 자동 검사를 하지 않았어요.'); }
  slots.forEach((s, k) => { for (let j = s.start - 1; j < s.start - 1 + s.k; j++) if (exam.answers[j] === '-') { need.push(k); break; } });
  prefetchImages(need.map(k => picks[k].fileId));
  const found = [];
  for (let t = 0; t < need.length; t++) {
    say('문항 그림을 확인하는 중... ' + (t + 1) + '/' + need.length);
    const k = need[t], q = picks[k];
    const im = (await getImgs([q.fileId]))[0];
    let mk = null; try { mk = await BankCore.detectOptionMarkersB64(im.base64); } catch (e) {}
    found.push({ k: k, q: q, slot: slots[k], b64: im.base64, mc: !!(mk && mk.length === 5), weak: !!(mk && mk.length >= 3 && mk.length < 5) });
  }
  const mcs = found.filter(f => f.mc), wk = found.filter(f => f.weak);
  SCAN[String(id)] = { n: mcs.length, weak: wk.length, nums: mcs.map(f => f.slot.start), wnums: wk.map(f => f.slot.start) };
  return { exam: exam, found: found };
}
async function scanAll() {
  const btn = $('ac-scanall'), targets = EXAMS.filter(ex => ex.subjectiveCount > 0);
  btn.disabled = true; let done = 0;
  for (const ex of targets) {
    btn.textContent = '검사 중... ' + (done + 1) + '/' + targets.length;
    try { _imgCache.clear(); await scanExam(ex.id); } catch (e) { SCAN[String(ex.id)] = { n: 0, nums: [], err: e.message }; }
    done++; renderList();
  }
  btn.disabled = false; btn.textContent = '🔍 전체 다시 검사';
}
async function inspect(id) {
  const box = $('ac-detail'); box.style.display = 'block'; $('ac-list').style.display = 'none';
  const say = m => { box.innerHTML = '<div class="card"><p class="muted">' + escapeHtml(m) + '</p></div>'; };
  const back = '<p><a href="#" id="ac-back">← 목록으로</a></p>';
  const fail = m => { box.innerHTML = back + '<div class="banner error">' + escapeHtml(m) + '</div>'; $('ac-back').onclick = goBack; };
  say('시험지를 불러오는 중...');
  try {
    _imgCache.clear();
    const r = await scanExam(id, say);
    if (r.none) { box.innerHTML = back + '<div class="banner">이 시험지에는 주관식으로 저장된 문항이 없어요.</div>'; $('ac-back').onclick = goBack; return; }
    if (r.noimg) return renderNoImages(r.exam, r.noimg);
    const exam = r.exam, found = r.found;
    renderExam(exam, found);
  } catch (e) { fail(e.message || String(e)); }
}
function goBack(ev) { if (ev) ev.preventDefault(); $('ac-detail').style.display = 'none'; $('ac-list').style.display = 'block'; }

// 문제은행에서 그림을 못 찾는 시험지(PDF로만 올린 것 등): 번호별로 정답만 고치게 한다
function renderNoImages(exam, why) {
  const box = $('ac-detail');
  box.innerHTML = '<p><a href="#" id="ac-back">← 목록으로</a></p><h2>' + escapeHtml(exam.title) + '</h2><div class="banner" style="text-align:left;">이 시험지는 문제 그림을 문제은행에서 찾지 못해 보기 표시를 자동으로 확인할 수 없어요.<br><span class="hint">' + escapeHtml(why) + '</span><br>' + (exam.pdfUrl ? '<a href="' + escapeHtml(exam.pdfUrl) + '" target="_blank" rel="noopener">📄 학생용 시험지 PDF 열어 보기</a><br>' : '') + '시험지(또는 교재)를 보면서 아래 번호의 정답을 직접 적어 주세요. 정답이 이미 있는 문항은 바뀌지 않아요.</div><div id="ac-qs"></div><div id="ac-save-bar"></div>';
  $('ac-back').onclick = goBack;
  const items = exam.answers.map((a, i) => a === '-' ? { slot: { start: i + 1, k: 1 }, q: null, b64: '', mc: false, idx: i } : null).filter(Boolean);
  drawCards(exam, items.map(x => ({ k: x.idx, q: null, slot: x.slot, b64: '', mc: false })));
}
function renderExam(exam, found) {
  const box = $('ac-detail'), mcN = found.filter(f => f.mc || f.weak).length;
  box.innerHTML = '<p><a href="#" id="ac-back">← 목록으로</a></p><h2>' + escapeHtml(exam.title) + '</h2>'
    + '<div class="banner' + (mcN ? '' : '') + '" style="text-align:left;">주관식으로 저장된 문항 <b>' + found.length + '개</b> 중 <b style="color:#B45309">보기 ①~⑤가 있는 문항 ' + mcN + '개</b>가 있어요. ' + (mcN ? '노란 칸은 <b>객관식인데 주관식으로 저장된 것</b>일 가능성이 커요. 해설(정답) 그림을 보고 번호를 적어 주세요. 진짜 서술형이면 비워 두세요.' : '객관식처럼 보이는 문항은 없어요. 그래도 아래에서 직접 확인할 수 있어요.') + '</div>'
    + '<div style="margin:8px 0;"><label class="bank-include-label"><input type="checkbox" id="ac-onlysus"' + (mcN ? ' checked' : '') + '> 보기가 있는 문항만 보기</label></div><div id="ac-qs"></div><div id="ac-save-bar"></div>';
  $('ac-back').onclick = goBack;
  const draw = () => drawCards(exam, found, $('ac-onlysus').checked);
  $('ac-onlysus').addEventListener('change', draw); draw();
}
function drawCards(exam, found, onlySus) {
  const qs = $('ac-qs'), shown = found.filter(f => !onlySus || f.mc || f.weak);
  qs.innerHTML = shown.length ? shown.map(f => {
    const nums = []; for (let j = f.slot.start - 1; j < f.slot.start - 1 + f.slot.k; j++) if (exam.answers[j] === '-') nums.push(j + 1);
    return '<div class="ac-q' + (f.mc || f.weak ? ' sus' : '') + '" data-k="' + f.k + '"><div class="hd"><b style="font-size:17px;">' + nums.join('·') + '번</b>' + (f.mc ? '<span class="ac-lv hi">보기 ①~⑤ 있음</span>' : f.weak ? '<span class="ac-lv mid">보기 일부만 읽힘 (약한 후보)</span>' : '<span class="ac-lv lo">보기 없음</span>')
      + nums.map(n => '<label>정답 <input class="ai" data-n="' + n + '" placeholder="-" inputmode="numeric"></label>').join('')
      + (f.q && f.q.explFileId ? '<button type="button" class="btn outline ex-btn" style="padding:5px 10px;font-size:13px;">해설 보기</button>' : '') + '</div>'
      + (f.b64 ? '<img alt="" src="data:image/png;base64,' + f.b64 + '">' : '') + '<div class="ex-box"></div></div>';
  }).join('') : '<p class="muted">표시할 문항이 없어요.</p>';
  qs.querySelectorAll('.ex-btn').forEach(b => b.addEventListener('click', async () => {
    const card = b.closest('.ac-q'), f = found.find(x => String(x.k) === card.getAttribute('data-k')), ex = card.querySelector('.ex-box');
    if (ex.innerHTML) { ex.innerHTML = ''; return; }
    ex.innerHTML = '<span class="hint">해설을 불러오는 중...</span>';
    try { const im = (await getImgs([f.q.explFileId]))[0]; ex.innerHTML = '<img alt="해설" src="data:image/png;base64,' + im.base64 + '">'; } catch (e) { ex.innerHTML = '<span class="hint">해설을 불러오지 못했어요</span>'; }
  }));
  qs.querySelectorAll('input.ai').forEach(i => i.addEventListener('input', () => i.closest('.ac-q').classList.toggle('chg', !!i.value.trim())));
  $('ac-save-bar').innerHTML = '<div class="card" style="position:sticky;bottom:8px;"><button type="button" class="btn primary" id="ac-save" style="padding:10px 18px;">💾 입력한 정답 저장하고 다시 채점</button> <span class="hint" id="ac-msg"></span><div class="hint">정답은 한 개는 <b>3</b>, 모두 맞아야 하는 복수정답은 <b>35</b>, 둘 중 하나만 맞아도 되면 <b>3/5</b> 로 적어요. 비워 둔 칸은 그대로 주관식이에요.</div></div>';
  $('ac-save').addEventListener('click', () => save(exam, found));
}
async function save(exam, found) {
  const msg = $('ac-msg'), next = exam.answers.slice(), changed = [];
  document.querySelectorAll('#ac-qs input.ai').forEach(i => { const v = i.value.trim(); if (!v) return; const n = Number(i.getAttribute('data-n')); next[n - 1] = v; changed.push(n); });
  if (!changed.length) { msg.textContent = '입력한 정답이 없어요.'; return; }
  const bad = changed.filter(n => !/^[1-5]+(\/[1-5]+)*$/.test(String(next[n - 1]).replace(/\s/g, '')));
  if (bad.length) { msg.textContent = '⚠️ ' + bad.join(', ') + '번 정답은 1~5 숫자로 적어 주세요 (예: 3, 35, 3/5).'; return; }
  changed.forEach(n => { next[n - 1] = String(next[n - 1]).replace(/\s/g, ''); });
  if (!confirm('주관식 ' + changed.length + '문항을 객관식으로 바꿔요:\n' + changed.map(n => n + '번 → ' + next[n - 1]).join('\n') + '\n\n이미 제출한 학생 기록은 다시 채점돼요. 저장할까요?')) return;
  const btn = $('ac-save'); btn.disabled = true; msg.textContent = '최신 정답표를 확인하는 중...';
  try {
    // 저장 직전에 서버의 정답표를 다시 받아, 이미 정답이 있는 문항은 그대로 두고 주관식('-')이던 칸만 바꾼다 (다른 기기에서 고친 내용을 덮어쓰지 않도록)
    const fresh = await callApi('getExamDetail', { password: getTeacherPassword(), id: exam.id });
    if (!fresh.ok || !fresh.answers || fresh.answers.length !== exam.answers.length) { msg.textContent = '⚠️ 시험지를 다시 확인하지 못했어요. 새로고침 후 다시 해 주세요.'; btn.disabled = false; return; }
    const stale = changed.filter(n => fresh.answers[n - 1] !== '-');
    if (stale.length) { msg.textContent = '⚠️ ' + stale.join(', ') + '번은 그 사이에 정답이 이미 바뀌었어요. 새로고침 후 다시 해 주세요. (아무것도 저장하지 않았어요)'; btn.disabled = false; return; }
    const finalAns = fresh.answers.slice(); changed.forEach(n => { finalAns[n - 1] = next[n - 1]; });
    msg.textContent = '저장하고 다시 채점하는 중...';
    const r = await callApi('updateExamAnswers', { password: getTeacherPassword(), id: exam.id, answers: finalAns });
    if (!r.ok) { msg.textContent = '⚠️ ' + (r.error || '저장하지 못했어요'); btn.disabled = false; return; }
    // 문제은행의 같은 문항도 고쳐 둔다 (다음에 이 문항으로 시험지를 만들 때 또 주관식이 되지 않도록). 묶음 문항(여러 번호가 한 그림)은 건드리지 않는다
    const ups = [];
    found.forEach(f => { if (f.q && f.slot.k === 1 && changed.indexOf(f.slot.start) >= 0) ups.push({ id: f.q.id, answer: next[f.slot.start - 1] }); });
    let bankNote = '';
    if (ups.length) { try { const b = await callApi('updateQuestions', { password: getTeacherPassword(), updates: ups }); bankNote = b.ok ? ' · 문제은행 ' + ups.length + '문항도 고쳤어요' : ' · 문제은행은 고치지 못했어요'; if (b.ok) { BANK = null; } } catch (e) { bankNote = ' · 문제은행은 고치지 못했어요'; } }
    msg.textContent = '✅ 저장했어요 (다시 채점한 기록 ' + (r.regraded || 0) + '건)' + bankNote;
    delete SCAN[String(exam.id)];
    const ex = EXAMS.find(x => String(x.id) === String(exam.id)); if (ex) { ex.subjectiveCount = Math.max(0, (ex.subjectiveCount || 0) - changed.length); }
    setTimeout(() => { goBack(); renderList(); }, 1200);
  } catch (e) { msg.textContent = '⚠️ ' + (e.message || e); btn.disabled = false; }
}

(async function () {
  try {
    const r = await callApi('listExams', { password: getTeacherPassword() });
    if (!r.ok) { $('ac-sum').textContent = r.error || '불러오지 못했어요'; return; }
    EXAMS = r.exams || []; renderList();
    $('ac-all').addEventListener('change', renderList); $('ac-scanall').addEventListener('click', scanAll); $('ac-q').addEventListener('input', renderList);
    const u = new URLSearchParams(location.search).get('id'); if (u) inspect(u);
  } catch (e) { $('ac-sum').textContent = '서버에 연결할 수 없어요.'; }
})();
</script>
