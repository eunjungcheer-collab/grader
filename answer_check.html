<script>
requireLogin();
renderHeader({ wider: true });
// 뒤로 버튼: 시험지를 열어 둔 상태면 목록으로 먼저 돌아간다
document.addEventListener('app:back', e => { const d = document.getElementById('ac-detail'); if (d && d.style.display === 'block') { e.preventDefault(); goBack(); } });

function rangeInfo(q, picks) {
  const m = String(q.textPreview || '').match(/^\s*[\[(【]\s*(\d{1,2})\s*[~∼～\-–]\s*(\d{1,2})\s*(?:번)?\s*[\])】]/);
  if (!m) return null;
  const k = parseInt(m[2], 10) - parseInt(m[1], 10) + 1;
  if (!(k >= 2 && k <= 4)) return null;
  // 같은 시험의 뒷 번호 문항이 따로 들어 있으면(예: [25~26]의 25번·26번을 각각 고른 경우) 묶음 문항이 아니다. 25번의 정답 '4,5'(2개)를 두 문제의 정답으로 읽으면 안 된다.
  const a0 = parseInt(m[1], 10), b0 = parseInt(m[2], 10);
  if (picks && picks.some(o => o !== q && o.source === q.source && o.num > a0 && o.num <= b0)) return null;
  const ans = String(q.answer || '').trim();
  let parts = null;
  if (/^\d+$/.test(ans) && ans.length === k) parts = ans.split('');
  else if (/^[\d\-]+([,\s]+[\d\-]+)+$/.test(ans)) parts = ans.split(/[,\s]+/);
  return parts && parts.length === k ? { k: k, parts: parts } : null;
}
function buildSlots(picks) {
  let n = 1;
  return picks.map(q => {
    const ri = rangeInfo(q, picks), k = ri ? ri.k : 1, start = n;
    n += k;
    return { start: start, k: k, parts: ri ? ri.parts : null, label: k > 1 ? start + '~' + (start + k - 1) : String(start) };
  });
}
// ── 문항·해설 그림 가져오기: 5개씩 묶어 여러 묶음을 동시에 받는다 (한 묶음씩 차례로 받으면 서버 응답을 계속 기다려야 해서 느리다) ──
const _imgCache = new Map();
function prefetchImages(ids, conc) {
  const todo = Array.from(new Set(ids.filter(Boolean))).filter(id => !_imgCache.has(id));
  const batches = [];
  for (let s = 0; s < todo.length; s += 5) batches.push(todo.slice(s, s + 5));
  batches.forEach(b => {
    let res, rej; const bp = new Promise((a, r) => { res = a; rej = r; }); bp.catch(() => {});
    b.forEach(id => { const pr = bp.then(r => { const im = (r.images || []).find(x => x.fileId === id); if (!im) throw new Error('이미지를 불러오지 못했어요'); return im; }); pr.catch(() => {}); _imgCache.set(id, pr); });
    b._d = { res: res, rej: rej };
  });
  let next = 0;
  const worker = async () => {
    while (next < batches.length) {
      const b = batches[next++];
      try { const r = await callApi('getQuestionImages', { password: getTeacherPassword(), fileIds: b }); if (!r.ok) b._d.rej(new Error(r.error || '이미지를 불러오지 못했어요')); else b._d.res(r); }
      catch (e) { b._d.rej(e); }
    }
  };
  Array.from({ length: Math.min(conc || 5, batches.length) }, worker);
}
async function getImgs(ids) {
  const miss = ids.filter(id => !_imgCache.has(id));
  if (miss.length) prefetchImages(miss);
  return Promise.all(ids.map(id => _imgCache.get(id)));
}

// 시험지에 기록된 문항 id가 문제은행에 없으면(문항이 지워졌거나 다시 저장되면서 id가 바뀐 경우), 같은 교재·같은 단원 이름으로 저장된 문항을 번호 순으로 찾아 쓴다. 개수가 안 맞으면 만들지 않는다.
function resolveBankPicks(exam, all, byId) {
  const ids = exam.sourceQuestionIds || [], rc = exam.composeRecipe || {}, need = ids.length || (exam.answers || []).length;
  const direct = ids.map(id => byId[id] || null);
  if (ids.length && direct.every(Boolean)) return direct;
  if (rc.book && rc.bookTitle && rc.label) {
    // 같은 교재·같은 단원 이름으로 저장된 문항을 번호(1~n)별로 모은다. 같은 번호가 여러 개(교재를 여러 번 등록한 경우)면 가장 최근 것을 쓴다.
    const src = (rc.bookTitle + ' ' + rc.label).trim(), byNum = {};
    all.filter(q => String(q.source || '').trim() === src).forEach(q => { const k = Number(q.num) || 0; if (k && (!byNum[k] || String(q.createdAt || '') > String(byNum[k].createdAt || ''))) byNum[k] = q; });
    const out = [];
    for (let i = 0; i < need; i++) { const q = direct[i] || byNum[i + 1]; if (!q) break; out.push(q); }
    if (out.length === need) return out;
    const have = Object.keys(byNum).length;
    throw new Error('이 시험지의 문항 ' + (need - out.length) + '개를 문제은행에서 찾지 못했어요 (이 단원 문항 ' + have + '개 저장됨, 필요 ' + need + '개). 교재 QR 합본 만들기로 이 단원을 다시 저장해야 해요.');
  }
  throw new Error('이 시험지에 쓴 문항이 문제은행에서 삭제돼서 같은 시험지를 다시 만들 수 없어요.');
}

function pngSize(bytes) { const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength); return { width: dv.getUint32(16), height: dv.getUint32(20) }; }
const $ = id => document.getElementById(id);
let EXAMS = [], BANK = null;

// 1단계: 서버가 이미 알고 있는 숫자(문항 수·주관식 수)만으로 의심 정도를 매긴다
function risk(ex) {
  const n = ex.answerCount || 0, s = ex.subjectiveCount || 0;
  if (!s || !n) return { lv: 'ok', label: '주관식 없음', score: 0 };
  const r = s / n, pct = Math.round(r * 100);
  if (r >= 0.4) return { lv: 'hi', label: '정답 못 읽음 (주관식 ' + pct + '%)', score: 5 + r, unread: true };
  if (s >= 8 && r >= 0.08 || r >= 0.25) return { lv: 'hi', label: '의심 큼', score: 3 + r };
  if (s >= 3 && r >= 0.04) return { lv: 'mid', label: '의심', score: 2 + r };
  return { lv: 'lo', label: '주관식 조금', score: 1 + r };
}
function scanBadge(x) {
  const sc = SCAN[String(x.ex.id)];
  if (!sc) return '<span class="ac-lv ' + x.r.lv + '">' + x.r.label + '</span>';
  if (sc.unknown) return '<span class="ac-lv mid" title="' + escapeHtml(sc.unknown) + '">🔎 확인 불가 (직접 확인)</span>';
  if (sc.sync && sc.sync.b) return '<span class="ac-lv hi" title="시험지 정답은 있는데 문제은행 문항 정답이 -라서, 시험지 PDF를 만들 때 「서술형」 꼬리표가 붙을 수 있어요">📄 문제은행 정답 ‘-’ ' + sc.sync.b + '문항</span>';
  if (sc.err) return '<span class="ac-lv lo" title="' + escapeHtml(sc.err) + '">확인 못함</span>';
  if (sc.n) return '<span class="ac-lv hi">⚠️ 후보 ' + sc.n + '문항 (' + sc.nums.slice(0, 6).join(', ') + (sc.nums.length > 6 ? ' …' : '') + '번)</span>';
  if (x.r.unread) return '<span class="ac-lv hi">' + x.r.label + '</span>';
  if (sc.weak) return '<span class="ac-lv mid">약한 후보 ' + sc.weak + '문항 (' + sc.wnums.slice(0, 6).join(', ') + '번)</span>';
  return '<span class="ac-lv ok">보기 있는 주관식 없음</span>';
}
// 이 컴퓨터에 남은 등록 기록(시험지 등록 때 입력·확인한 정답)을 찾는다. 서버에 저장된 정답과 다르면 불러와 채울 수 있게 한다
async function localAnswers(exam) {
  try {
    const db = await new Promise((res, rej) => { const q = indexedDB.open('grader_review', 1); q.onupgradeneeded = () => q.result.createObjectStore('r'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    const list = await new Promise(res => { const t = db.transaction('r').objectStore('r').get('list'); t.onsuccess = () => res(t.result || []); t.onerror = () => res([]); });
    const nz = t => String(t || '').replace(/\s+/g, ' ').trim().toLowerCase();
    const hit = list.find(x => String(x.id) === String(exam.id)) || list.find(x => nz(x.title) === nz(exam.title));
    return hit && Array.isArray(hit.answers) ? hit.answers.map(String) : null;
  } catch (e) { return null; }
}
async function offerLocal(exam) {
  const host = $('ac-local'); if (!host) return;
  const loc = await localAnswers(exam); if (!loc || loc.length !== exam.answers.length) return;
  const diff = loc.map((a, i) => ({ n: i + 1, a: a, cur: exam.answers[i] })).filter(x => x.a && x.a !== '-' && x.a !== x.cur);
  if (!diff.length) return;
  host.innerHTML = '<div class="banner" style="text-align:left;">💾 이 컴퓨터에 남은 <b>등록 기록</b>에는 서버와 다른 정답이 <b>' + diff.length + '개</b> 있어요 (서버에 저장된 정답 ' + exam.answers.filter(a => a !== '-').length + '개). <button type="button" class="btn outline" id="ac-loadlocal" style="padding:5px 12px;margin-left:6px;">불러와서 칸에 채우기</button><div class="hint">채우기만 하고 저장하지는 않아요. 칸을 확인한 뒤 「저장」을 누르면 「이전 → 이후」를 보여 드려요.</div></div>';
  $('ac-loadlocal').onclick = () => {
    let n = 0; diff.forEach(x => { const i = document.querySelector('#ac-detail input.aa[data-n="' + x.n + '"]') || document.querySelector('#ac-detail input.ai[data-n="' + x.n + '"]'); if (i) { i.value = x.a; n++; const c = i.closest('.ac-q'); if (c) c.classList.add('chg'); } });
    host.querySelector('.hint').textContent = n + '개 칸을 채웠어요. 확인하고 저장해 주세요.' + (n < diff.length ? ' (' + (diff.length - n) + '개는 이 화면에 칸이 없어요)' : '');
  };
}
// 정답지 PDF(글자로 된 표)를 올려 정답을 읽어서 칸에 채운다. 저장은 하지 않는다 (확인 후 「저장」)
let ansFileObj = null;
// 수정한 시험지 표시 (이 브라우저에 기억): 저장하거나 PDF를 바꾸면 목록에 ✅가 붙는다
function doneSet() { try { return JSON.parse(localStorage.getItem('ac_done') || '{}') || {}; } catch (e) { return {}; } }
function markDone(id) { try { const d = doneSet(); d[String(id)] = new Date().toISOString().slice(0, 10); localStorage.setItem('ac_done', JSON.stringify(d)); } catch (e) {} }
// 정답지를 고르면 「저장」 버튼 하나로 정답 저장 + 정답지를 시험지 PDF 맨 뒤에 붙이기까지 한다 (문제지가 홀수 쪽으로 끝나면 빈 쪽을 넣어 정답지가 홀수 쪽에서 시작)
function offerReplace(exam, f) {
  const m = $('ac-ansmsg'); if (!m) return; ansFileObj = f;
  const fid = (String(exam.pdfUrl || '').match(/[?&]id=([^&]+)/) || [])[1];
  if (!fid) { ansFileObj = null; m.innerHTML += ' <span class="hint">(이 시험지에는 올려 둔 PDF가 없어서 PDF에 붙일 수는 없어요.)</span>'; return; }
  m.insertAdjacentHTML('beforeend', '<br><label><input type="checkbox" id="ac-attach" checked> 저장할 때 이 정답지를 시험지 PDF 맨 뒤에도 붙이기 <span class="hint">(이미 정답지가 붙어 있는 시험지면 체크를 끄세요)</span></label>');
}
async function attachAnswerPdf(exam, f) {
  const fid = (String(exam.pdfUrl || '').match(/[?&]id=([^&]+)/) || [])[1];
  const blob = await driveDirectBlob(fid); if (!blob) throw new Error('현재 PDF를 받지 못했어요.');
  const main = await PDFLib.PDFDocument.load(new Uint8Array(await blob.arrayBuffer()), { ignoreEncryption: true });
  const extra = await PDFLib.PDFDocument.load(new Uint8Array(await f.arrayBuffer()), { ignoreEncryption: true });
  const before = main.getPageCount();
  await BankCore.mergePdfs(PDFLib, main, extra);
  const res = await callApi('replaceExamPdf', { password: getTeacherPassword(), id: exam.id, pdfBase64: arrayBufferToBase64(await main.save()), filename: exam.title });
  if (!res.ok) throw new Error(res.error || '서버 오류');
  exam.pdfUrl = res.pdfUrl; return before + '쪽 → ' + main.getPageCount() + '쪽';
}
function ansFileUi(exam) {
  ansFileObj = null;
  const host = $('ac-ansfile'); if (!host) return;
  host.innerHTML = '<div class="card" style="padding:10px 14px;"><b>📎 정답지 PDF로 칸 채우기</b> <input type="file" id="ac-ansin" accept="application/pdf" style="margin-left:8px;"><div class="hint" id="ac-ansmsg">시험지와 따로 있는 정답지 PDF(글자로 된 정답표)를 고르면 정답을 읽어 칸에 채워요. 스캔(사진) 정답지는 읽지 못해요. 채우기만 하고 저장하지는 않아요.</div></div>';
  $('ac-ansin').addEventListener('change', async ev => {
    const f = ev.target.files && ev.target.files[0], m = $('ac-ansmsg'); if (!f) return;
    m.textContent = '정답지를 읽는 중...';
    try {
      setupPdfJs();
      const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise;
      const sc = await BankCore.scanPdf(doc), ans = {};
      try { const t = await BankCore.parseAnswerTable(doc, sc); if (t) Object.keys(t.answers).forEach(n => { ans[n] = String(t.answers[n]); }); } catch (e) {}
      try { await BankCore.readCircledAnswers(doc, sc); Object.keys(sc.answers || {}).forEach(n => { if (!ans[n] && sc.answers[n] && sc.answers[n].text) ans[n] = String(sc.answers[n].text); }); } catch (e) {}
      const nums = Object.keys(ans).map(Number).filter(n => n >= 1 && n <= exam.answers.length);
      if (!nums.length) { m.innerHTML = '⚠️ 이 PDF에서 정답을 읽지 못했어요 (스캔본이거나 정답표 모양이 달라요). 정답 PDF를 보면서 직접 적어 주세요.'; offerReplace(exam, f); return; }
      let filled = 0, same = 0;
      nums.forEach(n => { const v = ans[n].replace(/\s/g, ''); const i = document.querySelector('#ac-detail input.aa[data-n="' + n + '"]') || document.querySelector('#ac-detail input.ai[data-n="' + n + '"]'); if (!i) return; if (i.classList.contains('aa') && i.getAttribute('data-orig') === v) { same++; return; } i.value = v; const c = i.closest('.ac-q'); if (c) c.classList.add('chg'); filled++; });
      m.innerHTML = '✅ 정답 ' + nums.length + '개를 읽었어요 → 칸 ' + filled + '개를 채웠고, 이미 같은 정답인 칸 ' + same + '개는 그대로예요. ' + (nums.length !== exam.answers.length ? '<b style="color:#B91C1C">⚠️ 시험지는 ' + exam.answers.length + '문항인데 ' + nums.length + '개만 읽었어요. 번호가 맞는지 꼭 확인하세요.</b> ' : '') + '확인하고 「저장」을 눌러 주세요.';
      ansFileObj = f; offerReplace(exam, f);
    } catch (e) { m.textContent = '⚠️ 정답지를 읽지 못했어요: ' + (e.message || e); }
  });
}
function reviewUrl(id) { return 'teacher_new.html?review=' + encodeURIComponent(String(id)); }
function reviewBtn(id) { return '<a class="btn primary" href="' + reviewUrl(id) + '" style="padding:8px 14px;text-decoration:none;">✏️ PDF 보며 정답 고치기 (등록 화면으로 열기)</a>'; }
function renderList() {
  const flt = $('ac-flt').value, showAll = $('ac-all').checked && !flt, kw = $('ac-q').value.trim().toLowerCase();
  const rows = EXAMS.map(ex => ({ ex: ex, r: risk(ex) })).filter(x => (showAll || x.r.score > 0 || doneSet()[String(x.ex.id)] || ((SCAN[String(x.ex.id)] || {}).sync || {}).b) && (!flt || (flt === 'unread' ? x.r.unread : x.r.score >= 2)) && (!kw || String(x.ex.title).toLowerCase().includes(kw)));

  box.innerHTML = '<p><a href="#" id="ac-back">← 목록으로</a></p><h2>' + escapeHtml(exam.title) + '</h2><p>' + reviewBtn(exam.id) + '</p><div id="ac-sync"></div><div id="ac-local"></div><div id="ac-ansfile"></div>'
    + (found.length ? '' : '<div class="banner" style="text-align:left;">이 시험지는 주관식으로 저장된 문항이 없어요.</div>')
    + (found.length ? '<div class="banner' + (mcN ? '' : '') + '" style="text-align:left;">주관식으로 저장된 문항 <b>' + found.length + '개</b> 중 <b style="color:#B45309">보기 ①~⑤가 있는 문항 ' + mcN + '개</b>가 있어요. ' + (mcN ? '노란 칸은 <b>객관식인데 주관식으로 저장된 것</b>일 가능성이 커요. 해설(정답) 그림을 보고 번호를 적어 주세요. 진짜 서술형이면 비워 두세요.' : '객관식처럼 보이는 문항은 없어요. 그래도 아래에서 직접 확인할 수 있어요.') + '</div>' : '')
    + '<div style="margin:8px 0;"><label class="bank-include-label"><input type="checkbox" id="ac-onlysus"' + (mcN ? ' checked' : '') + '> 보기가 있는 문항만 보기</label></div><div style="margin:8px 0;"><button type="button" class="btn outline" id="ac-crop" style="padding:7px 14px;">✂️ 잘린 문항 확인 (이 시험지 전체)</button> <span class="hint" id="ac-crop-msg"></span></div><div id="ac-crop-out"></div><details style="margin:8px 0;"><summary class="hint" style="cursor:pointer;">📋 이미 입력된 정답 보기·고치기 (펼치기)</summary><div class="card" style="line-height:2.3;"><div style="display:flex;flex-wrap:wrap;gap:6px 12px;">' + gridHtml(exam, false) + '</div></div></details><div id="ac-qs"></div><div id="ac-save-bar"></div>';
  $('ac-back').onclick = goBack;
  $('ac-crop').onclick = () => cropCheck(exam);
  const draw = () => drawCards(exam, found, $('ac-onlysus') ? $('ac-onlysus').checked : false);
  if ($('ac-onlysus')) $('ac-onlysus').addEventListener('change', draw); draw(); offerLocal(exam); syncBanner(exam, sync); ansFileUi(exam);
}
// 시험지 정답과 문제은행 문항 정답이 어긋난 곳: 시험지 PDF의 「서술형」 꼬리표·문제은행 출제는 문제은행 정답을 쓴다
function syncBanner(exam, sync) {
  const host = $('ac-sync'); if (!host || !sync) return;
  const nums = a => a.slice(0, 12).map(x => x.n).join(', ') + (a.length > 12 ? ' …' : '');
  let h = '';
  if (sync.toBank.length) h += '<div class="banner" style="text-align:left;">📄 시험지에는 정답이 있는데 <b>문제은행 문항의 정답은 「-」(서술형)</b>인 문항이 <b>' + sync.toBank.length + '개</b>예요 (' + nums(sync.toBank) + '번). 이 상태에서는 시험지 PDF를 새로 만들면 「서술형」 꼬리표가 붙고, 문제은행으로 시험지를 만들 때도 서술형으로 취급돼요. <button type="button" class="btn primary" id="ac-tobank" style="padding:6px 14px;margin-left:6px;">문제은행 정답을 시험지 정답으로 맞추기</button><div class="hint" id="ac-tobank-msg">이미 만들어 둔 PDF 파일은 바뀌지 않아요. 시험지 정답은 건드리지 않고, 문제은행 쪽 「-」만 채워요.</div></div>';
  if (sync.toExam.length) h += '<div class="banner" style="text-align:left;">🗃️ 문제은행에는 정답이 있는데 <b>시험지는 「-」</b>인 문항이 <b>' + sync.toExam.length + '개</b>예요 (' + nums(sync.toExam) + '번). <button type="button" class="btn outline" id="ac-toexam" style="padding:5px 12px;margin-left:6px;">문제은행 정답을 칸에 채우기</button><div class="hint">채우기만 하고 저장하지는 않아요. 확인하고 아래 「저장」을 눌러 주세요.</div></div>';
  if (sync.differ.length) h += '<div class="banner" style="text-align:left;">⚠️ 시험지와 문제은행의 정답이 <b>서로 다른</b> 문항이 ' + sync.differ.length + '개 있어요 (' + sync.differ.slice(0, 8).map(x => x.n + '번 시험지 ' + x.exam + ' / 문제은행 ' + x.bank).join(', ') + (sync.differ.length > 8 ? ' …' : '') + '). 어느 쪽이 맞는지 PDF를 보고 확인해 주세요. 자동으로 바꾸지 않아요.</div>';
  host.innerHTML = h;
  const tb = $('ac-tobank');
  if (tb) tb.onclick = async () => {
    if (!confirm('문제은행 문항 ' + sync.toBank.length + '개의 정답을 시험지 정답으로 맞춰요:\n' + sync.toBank.slice(0, 40).map(x => x.n + '번  - → ' + x.ans).join('\n') + (sync.toBank.length > 40 ? '\n...' : '') + '\n\n시험지 정답은 바뀌지 않아요. 진행할까요?')) return;
    tb.disabled = true; const m = $('ac-tobank-msg'); m.textContent = '문제은행을 고치는 중...';
    try {
      for (let i = 0; i < sync.toBank.length; i += 40) { const r = await callApi('updateQuestions', { password: getTeacherPassword(), updates: sync.toBank.slice(i, i + 40).map(x => ({ id: x.id, answer: x.ans })) }); if (!r.ok) throw new Error(r.error || '저장 실패'); }
      BANK = null; delete SCAN[String(exam.id)]; m.textContent = '✅ 문제은행 ' + sync.toBank.length + '문항의 정답을 맞췄어요. 이미 만들어 둔 PDF는 그대로예요.'; tb.style.display = 'none';
    } catch (e) { m.textContent = '⚠️ ' + (e.message || e); tb.disabled = false; }
  };
  const te = $('ac-toexam');
  if (te) te.onclick = () => { let n = 0; sync.toExam.forEach(x => { const i = document.querySelector('#ac-detail input.aa[data-n="' + x.n + '"]') || document.querySelector('#ac-detail input.ai[data-n="' + x.n + '"]'); if (i) { i.value = x.ans; n++; const c = i.closest('.ac-q'); if (c) c.classList.add('chg'); } }); te.textContent = n + '개 칸을 채웠어요'; te.disabled = true; };
}
// 현재 정답표: 이미 입력된 정답을 보여 주고 필요하면 바로 고친다. editDash=true면 주관식(-)도 여기서 입력한다
function gridHtml(exam, editDash) {
  return exam.answers.map((a, i) => {
    const n = i + 1;
    if (a === '-' && !editDash) return '<span style="display:inline-block;min-width:78px;color:#9CA3AF;"><b>' + n + '</b>번 <span class="tag-sub">주관식</span></span>';
    return '<label style="display:inline-flex;align-items:center;gap:4px;' + (a === '-' ? 'background:#FEF3C7;border-radius:8px;padding:2px 6px;' : '') + '"><b style="min-width:26px;text-align:right;">' + n + '</b><input type="text" class="aa" data-n="' + n + '" data-orig="' + escapeHtml(a) + '" value="' + (a === '-' ? '' : escapeHtml(a)) + '" placeholder="-" style="width:54px;text-align:center;font-size:16px;padding:4px;"></label>';
  }).join('');
}
function saveBar(exam, found) {
  $('ac-save-bar').innerHTML = '<div class="card" style="position:sticky;bottom:8px;"><button type="button" class="btn primary" id="ac-save" style="padding:10px 18px;">💾 저장</button> <span class="hint" id="ac-msg"></span><div class="hint">정답은 한 개는 <b>3</b>, 모두 맞아야 하는 복수정답은 <b>35</b>, 둘 중 하나만 맞아도 되면 <b>3/5</b> 로 적어요. 비워 둔 칸은 그대로 주관식이에요.</div></div>';
  $('ac-save').addEventListener('click', () => save(exam, found));
}
function drawGrid(exam) {
  $('ac-qs').innerHTML = '<div class="card" style="line-height:2.3;"><h3 style="margin:0 0 6px;">현재 정답표</h3><div style="display:flex;flex-wrap:wrap;gap:6px 12px;">' + gridHtml(exam, true) + '</div></div>';
  saveBar(exam, []);
}
function drawCards(exam, found, onlySus) {
  const qs = $('ac-qs'), shown = found.filter(f => !onlySus || f.mc || f.weak);
  qs.innerHTML = shown.length ? shown.map(f => {
    const nums = []; for (let j = f.slot.start - 1; j < f.slot.start - 1 + f.slot.k; j++) if (exam.answers[j] === '-') nums.push(j + 1);
    return '<div class="ac-q' + (f.mc || f.weak ? ' sus' : '') + '" data-k="' + f.k + '"><div class="hd"><b style="font-size:17px;">' + nums.join('·') + '번</b>' + (f.mc ? '<span class="ac-lv hi">보기 ①~⑤ 있음</span>' : f.weak ? '<span class="ac-lv mid">보기 일부만 읽힘 (약한 후보)</span>' : '<span class="ac-lv lo">보기 없음</span>')
      + nums.map(n => '<label>정답 <input class="ai" data-n="' + n + '" placeholder="-" inputmode="numeric"></label>').join('')
      + (f.q && f.q.explFileId ? '<button type="button" class="btn outline ex-btn" style="padding:5px 10px;font-size:13px;">해설 보기</button>' : '') + '</div>'
      + (f.b64 ? '<img alt="" src="data:image/png;base64,' + f.b64 + '">' : '') + '<div class="ex-box"></div></div>';
  }).join('') : '<p class="muted">표시할 문항이 없어요.</p>';
  qs.querySelectorAll('.ex-btn').forEach(b => b.addEventListener('click', async () => {
    const card = b.closest('.ac-q'), f = found.find(x => String(x.k) === card.getAttribute('data-k')), ex = card.querySelector('.ex-box');
    if (ex.innerHTML) { ex.innerHTML = ''; return; }
    ex.innerHTML = '<span class="hint">해설을 불러오는 중...</span>';
    try { const im = (await getImgs([f.q.explFileId]))[0]; ex.innerHTML = '<img alt="해설" src="data:image/png;base64,' + im.base64 + '">'; } catch (e) { ex.innerHTML = '<span class="hint">해설을 불러오지 못했어요</span>'; }
  }));
  qs.querySelectorAll('input.ai').forEach(i => i.addEventListener('input', () => i.closest('.ac-q').classList.toggle('chg', !!i.value.trim())));
  saveBar(exam, found);
}
async function save(exam, found) {
  const msg = $('ac-msg'), ch = [];   // ch: {n, from, to}
  document.querySelectorAll('#ac-detail input.ai, #ac-detail input.aa').forEach(i => {
    const v = i.value.trim().replace(/\s/g, ''), n = Number(i.getAttribute('data-n')), from = i.classList.contains('aa') ? i.getAttribute('data-orig') : '-';
    if (!v || v === from) return; ch.push({ n: n, from: from, to: v });
  });
  const attach = !!(ansFileObj && $('ac-attach') && $('ac-attach').checked);
  if (!ch.length && !attach) { msg.textContent = '바꾼 정답이 없어요.'; return; }
  const bad = ch.filter(x => !(/^[1-5]+(\/[1-5]+)*$/.test(x.to) || (x.to === '-' && x.from !== '-')));
  if (bad.length) { msg.textContent = '⚠️ ' + bad.map(x => x.n).join(', ') + '번 정답은 1~5 숫자로 적어 주세요 (예: 3, 35, 3/5). 주관식으로 되돌리려면 - 만 적어요.'; return; }
  const show = v => v === '-' ? '주관식' : v;
  if (!confirm((ch.length ? '정답 ' + ch.length + '개를 바꿔요:\n' + ch.map(x => x.n + '번  ' + show(x.from) + ' → ' + show(x.to)).join('\n') + '\n\n이미 제출한 학생 기록은 다시 채점돼요.' : '정답은 그대로 두고') + (attach ? '\n\n정답지(' + ansFileObj.name + ')를 저장된 시험지 PDF 맨 뒤에 붙여 PDF도 바꿔요. 학생이 받는 PDF 맨 뒤에 정답이 보이고, 예전 PDF는 드라이브 휴지통으로 가요.' : '') + '\n\n저장할까요?')) return;
  const btn = $('ac-save'); btn.disabled = true; msg.textContent = '최신 정답표를 확인하는 중...';
  let r = { regraded: 0 }, bankNote = '';
  try {
    if (ch.length) {
    // 저장 직전에 서버의 정답표를 다시 받아, 내가 본 정답과 같을 때만 바꾼다 (다른 기기에서 고친 내용을 덮어쓰지 않도록). 바꾸지 않은 번호는 서버 값을 그대로 둔다
    const fresh = await callApi('getExamDetail', { password: getTeacherPassword(), id: exam.id });
    if (!fresh.ok || !fresh.answers || fresh.answers.length !== exam.answers.length) { msg.textContent = '⚠️ 시험지를 다시 확인하지 못했어요. 새로고침 후 다시 해 주세요.'; btn.disabled = false; return; }
    const stale = ch.filter(x => fresh.answers[x.n - 1] !== x.from);
    if (stale.length) { msg.textContent = '⚠️ ' + stale.map(x => x.n).join(', ') + '번은 그 사이에 정답이 이미 바뀌었어요. 새로고침 후 다시 해 주세요. (아무것도 저장하지 않았어요)'; btn.disabled = false; return; }
    const finalAns = fresh.answers.slice(); ch.forEach(x => { finalAns[x.n - 1] = x.to; });
    msg.textContent = '저장하고 다시 채점하는 중...';
    r = await callApi('updateExamAnswers', { password: getTeacherPassword(), id: exam.id, answers: finalAns });
    if (!r.ok) { msg.textContent = '⚠️ ' + (r.error || '저장하지 못했어요'); btn.disabled = false; return; }
    // 문제은행의 같은 문항도 고쳐 둔다 (다음에 이 문항으로 시험지를 만들 때 또 틀리지 않도록). 묶음 문항(여러 번호가 한 그림)과 주관식으로 되돌린 문항은 건드리지 않는다
    const ups = [], toMap = {}; ch.forEach(x => { toMap[x.n] = x.to; });
    (found || []).forEach(f => { if (f.q && f.slot.k === 1 && toMap[f.slot.start] && toMap[f.slot.start] !== '-') ups.push({ id: f.q.id, answer: toMap[f.slot.start] }); });
    if (ups.length) { try { const b = await callApi('updateQuestions', { password: getTeacherPassword(), updates: ups }); bankNote = b.ok ? ' · 문제은행 ' + ups.length + '문항도 고쳤어요' : ' · 문제은행은 고치지 못했어요'; if (b.ok) { BANK = null; } } catch (e) { bankNote = ' · 문제은행은 고치지 못했어요'; } }
    }
    let pdfNote = '';
    if (attach) { msg.textContent = '정답지를 시험지 PDF 뒤에 붙이는 중...'; try { pdfNote = ' · PDF에 정답지를 붙였어요(' + await attachAnswerPdf(exam, ansFileObj) + ')'; } catch (e) { pdfNote = ' · ⚠️ PDF는 바꾸지 못했어요(' + (e.message || e) + ') — 기존 PDF는 그대로예요'; } }
    markDone(exam.id);
    msg.textContent = '✅ 저장했어요' + (ch.length ? ' (다시 채점한 기록 ' + (r.regraded || 0) + '건)' : '') + bankNote + pdfNote;
    delete SCAN[String(exam.id)];
    const ex = EXAMS.find(x => String(x.id) === String(exam.id)); if (ex) { ex.subjectiveCount = Math.max(0, (ex.subjectiveCount || 0) - ch.filter(x => x.from === '-').length + ch.filter(x => x.to === '-').length); }
    setTimeout(() => { goBack(); renderList(); }, pdfNote.indexOf('⚠️') >= 0 ? 6000 : 1200);
  } catch (e) { msg.textContent = '⚠️ ' + (e.message || e); btn.disabled = false; }
}

(async function () {
  try {
    const r = await callApi('listExams', { password: getTeacherPassword() });
    if (!r.ok) { $('ac-sum').textContent = r.error || '불러오지 못했어요'; return; }
    EXAMS = r.exams || []; renderList();
    $('ac-all').addEventListener('change', renderList); $('ac-flt').addEventListener('change', renderList); $('ac-scanall').addEventListener('click', scanAll); $('ac-q').addEventListener('input', renderList);
    const u = new URLSearchParams(location.search).get('id'); if (u) inspect(u);
  } catch (e) { $('ac-sum').textContent = '서버에 연결할 수 없어요.'; }
})();
</script>
