<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0B1F5C">
<title>저장된 교재 수정&관리 - 자동 채점 시스템</title>
<link rel="stylesheet" href="css/style.css?v=202611180220">
<style>
  .ce-row { padding:10px 0; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; }
  .ce-row:first-child { border-top:0; }
  .ce-grid { display:grid; gap:16px; }
  @media (min-width: 860px) { .ce-grid { grid-template-columns: minmax(300px, 440px) 1fr; align-items:start; } }
  .ce-stage { position:relative; display:inline-block; border:1px solid #d6dbe6; border-radius:10px; box-shadow:0 2px 10px rgba(20,30,60,.12); overflow:hidden; touch-action:none; background:#fff; }
  .ce-stage canvas { display:block; width:100%; height:auto; }
  .ce-badge { position:absolute; cursor:move; user-select:none; -webkit-user-drag:none; outline:2px dashed rgba(0,0,0,.25); outline-offset:2px; }
  .ce-opt { display:block; margin:6px 0; font-weight:600; }
  .ce-sub { margin:4px 0 8px 22px; }
</style>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<template id="page-content">
  <span class="backlink"><a href="index.html">← 홈으로</a></span>
  <h1>🎨 저장된 교재 수정&관리</h1>
  <p class="muted">이 기기에 저장된 교재(QR 합본)의 <b>표지만</b> 바꿔서 다시 저장해요. 표지 도안·색을 고르고, <b>강사용/학생용 표시</b>를 화면에서 끌어 옮기며 결과를 미리 보세요. 시험지·QR·문제은행은 건드리지 않아요.</p>
  <div id="list-card" class="card"><div id="list" class="muted">불러오는 중...</div></div>

  <div id="editor" class="card" style="display:none;">
    <h3 id="ed-title" style="margin:0 0 8px;"></h3>
    <div class="ce-grid">
      <div>
        <div class="ce-stage" id="stage"><canvas id="pv"></canvas></div>
        <div class="muted" style="margin-top:6px;">미리보기 (실제 교재 표지와 같은 모습이에요). 표시를 끌어서 옮기세요.</div>
      </div>
      <div>
        <b>1. 표지 그림</b>
        <label class="ce-opt"><input type="radio" name="src" value="stored" id="src-stored"> 저장된 표지 그대로 <span class="muted" id="stored-note" style="font-weight:400;"></span></label>
        <label class="ce-opt"><input type="radio" name="src" value="gen" id="src-gen"> 새 표지 만들기 <span class="muted" id="gen-note" style="font-weight:400;"></span></label>
        <div class="ce-sub" id="gen-box" style="display:none;">책 이름 <input type="text" id="ce-name" style="max-width:280px;"><br>도안 <select id="ce-design"><option value="auto">자동 (학년·종류에 맞춰)</option><option value="mol">분자 · 플라스크</option><option value="atom">원자</option><option value="dna">DNA</option><option value="hex">육각 격자</option><option value="tubes">시험관</option><option value="circuit">전기 회로</option><option value="planet">행성</option><option value="ripple">물결 · 별자리</option><option value="star">별자리</option></select><br>색 <select id="ce-color"><option value="">자동 (학년색)</option><option value="pink">분홍</option><option value="blue">파랑</option><option value="purple">보라</option><option value="teal">청록</option><option value="orange">주황</option><option value="green">초록</option><option value="navy">남색</option><option value="red">빨강</option></select><br><b>목차 칸</b> (표지의 CONTENTS 상자 — 표지 밖으로 넘치지 않는 범위에서만 커져요)<br>글자 크기 <input type="range" id="ce-cfs" min="60" max="150" value="100" style="width:150px;"> <span id="ce-cfsv">100</span>%<br>줄 간격 <input type="range" id="ce-crow" min="60" max="160" value="100" style="width:150px;"> <span id="ce-crowv">100</span>%<br>열 <select id="ce-ccols"><option value="0">자동</option><option value="1">1열</option><option value="2">2열</option></select><br>칸 위치 <input type="range" id="ce-cdy" min="-60" max="60" value="0" style="width:150px;"> <span id="ce-cdyv">0</span><br><button type="button" class="btn" id="ce-creset">목차 칸 기본값</button><br><b>로고</b> (표지 아래쪽 「이은정 과학」)<br>로고 글자 <input type="text" id="ce-lmain" style="max-width:200px;"><br>작은 글자 <input type="text" id="ce-lsub" style="max-width:280px;"><br>오른쪽 칩 <input type="text" id="ce-lchip" style="max-width:140px;"> <span class="muted">(비우면 학년 자동)</span><br><button type="button" class="btn" id="ce-lsave">💾 이 로고 저장 (다음 새 표지에도 사용)</button> <button type="button" class="btn" id="ce-lreset">↩ 원래 로고로 되돌리기</button> <span class="muted" id="ce-lmsg"></span></div>
        <label class="ce-opt"><input type="radio" name="src" value="file" id="src-file"> 원본 교재 PDF에서 표지 가져오기</label>
        <div class="ce-sub" id="file-box" style="display:none;"><input type="file" id="ce-file" accept="application/pdf"><div class="muted">교재 PDF의 첫 쪽(표지)만 읽어요.</div></div>

        <div style="margin-top:12px;"><b>2. 강사용 / 학생용 표시</b></div>
        <div style="margin:6px 0;">미리보기 <label style="display:inline-block;margin-right:10px;"><input type="radio" name="pv-kind" value="t" checked> 강사용(빨강)</label> <label style="display:inline-block;"><input type="radio" name="pv-kind" value="s"> 학생용(파랑)</label></div>
        <div style="margin:6px 0;">크기 <input type="range" id="ce-sz" min="50" max="320" value="150" style="width:200px;"> <span id="ce-szv"></span>pt</div>
        <div style="margin:6px 0;">위치: 표시를 <b>끌어서</b> 옮기세요. <button type="button" class="btn" id="ce-auto">제목 오른쪽으로 자동 배치</button> <button type="button" class="btn" id="ce-tl">왼쪽 위로</button></div>

        <div id="ce-msg" class="muted" style="margin:10px 0;"></div>
        <button type="button" class="btn primary" id="ce-ok">✔ 이 표지로 바꿔서 다시 저장하고 내려받기</button>
        <button type="button" class="btn" id="ce-close">닫기</button>
      </div>
    </div>
  </div>
</template>
<script src="js/vendor/pdf.min.js?v=202611180220"></script>
<script src="js/vendor/pdf-lib.min.js?v=202611180220"></script>
<script src="js/config.js?v=202611180220"></script>
<script src="js/api.js?v=202611180220"></script>
<script src="js/common.js?v=202611180220"></script>
<script src="js/bankcore.js?v=202611180220"></script>
<script src="js/coverdesign.js?v=202611180220"></script>
<script>
requireLogin();
renderHeader({ wide: true });
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mergeDb = () => new Promise((res, rej) => { const rq = indexedDB.open('qr_merges_db', 1); rq.onupgradeneeded = () => rq.result.createObjectStore('m', { keyPath: 'id' }); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });
const mergeDbOp = async (mode, fn) => { const db = await mergeDb(); return new Promise((res, rej) => { const tx = db.transaction('m', mode), st = tx.objectStore('m'), rq = fn(st); tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); };
const mergeDbPut = rec => mergeDbOp('readwrite', st => st.put(rec));
const mergeDbAll = () => mergeDbOp('readonly', st => st.getAll());
const blobDl = (blob, name) => { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000); };

function badgeCanvas(lab, col) {
  const cv = document.createElement('canvas'); cv.width = 440; cv.height = 150; const c = cv.getContext('2d');
  c.fillStyle = '#ffffff'; c.strokeStyle = col; c.lineWidth = 10;
  c.beginPath(); const x = 8, y = 8, w = 424, h = 134, r = 36; c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = col; c.font = 'bold 84px "Noto Sans CJK KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(lab, 220, 80);
  return cv;
}
const BD = { t: null, s: null };
let REC = null, COV = null /* { canvas: 표지 그림, pw, ph } */, ST = { x: 20, top: 20, wd: 150 }, KIND = 't', AUTO = null /* 제목 오른쪽 자리 */;

const u8ToB64 = u8 => { let bin = ''; for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(bin); };
async function serverUpload(rec, kind, blob, onProg) {
  const CH = 900000, total = Math.max(1, Math.ceil(blob.size / CH));      // 조각마다 파일에서 잘라 읽는다(큰 파일을 통째로 메모리에 올리지 않음)
  for (let i = 0; i < total; i++) {
    let r = null;
    for (let at = 0; at < 4; at++) { try { r = await callApi('mergeUpload', { password: getTeacherPassword(), id: rec.id, kind: kind, name: rec.name, idx: i, total: total, data: u8ToB64(new Uint8Array(await blob.slice(i * CH, (i + 1) * CH).arrayBuffer())) }); break; } catch (e) { if (at === 3) throw e; await new Promise(res => setTimeout(res, 1500 * (at + 1))); } }
    if (!r || !r.ok) throw new Error((r && r.error) || '서버 보관 실패');
    if (onProg) onProg(i + 1, total);
  }
}
async function serverDownload(fileId, onProg) {
  const parts = []; let total = 1;
  for (let i = 0; i < total; i++) {
    let r = null;
    for (let at = 0; at < 4; at++) { try { r = await callApi('mergeGetPart', { password: getTeacherPassword(), fileId: fileId, part: i, partSize: 1500000 }); break; } catch (e) { if (at === 3) throw e; await new Promise(res => setTimeout(res, 1500 * (at + 1))); } }
    if (!r || !r.ok) throw new Error((r && r.error) || '내려받기 실패');
    total = r.total; const bin = atob(r.base64), u = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k); parts.push(u);
    if (onProg) onProg(i + 1, total);
  }
  return new Blob(parts, { type: 'application/pdf' });
}

let SERVER = [];
const mb = n => (n / 1048576).toFixed(0) + 'MB';
let SERVER_LOADED = false, SERVER_ERR = '';
async function renderList(fresh) {
  let local = []; try { local = await mergeDbAll(); } catch (e) {}
  // 서버 목록(구글 서버라 몇 초 걸려요)은 기다리지 않고, 이 기기 목록을 먼저 보여 준 뒤 도착하면 다시 그린다
  if (fresh || !SERVER_LOADED) {
    const loadSrv = async () => { try { const r = await callApi('mergeList', { password: getTeacherPassword() }); if (r && r.ok) { SERVER = r.merges || []; SERVER_ERR = ''; } else SERVER_ERR = (r && r.error) || '서버 목록을 불러오지 못했어요'; } catch (e) { SERVER_ERR = '서버 목록을 불러오지 못했어요(' + e.message + ')'; } SERVER_LOADED = true; };
    if (!SERVER_LOADED) { loadSrv().then(() => renderList()); } else await loadSrv();
  }
  let srvErr = SERVER_ERR;
  const by = {};
  SERVER.forEach(m => { by[m.id] = { id: m.id, name: m.name, date: m.date, sT: m.teacher, sS: m.student }; });
  local.forEach(m => { const r = by[m.id] = by[m.id] || { id: m.id, name: m.name, date: m.date }; r.rec = m; });
  const all = Object.keys(by).map(k => by[k]).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const box = $('list');
  if (!all.length) { box.className = 'muted'; box.innerHTML = '저장된 교재가 없어요. 「교재 한 권 QR 합본 만들기」에서 교재를 만들면 여기에 나타나요.' + (srvErr ? '<br>' + esc(srvErr) : ''); return; }
  box.className = ''; box.innerHTML = !SERVER_LOADED ? '<div class="muted">☁ 서버 보관 상태를 확인하는 중...</div>' : srvErr ? '<div class="muted" style="color:#B45309;">⚠ ' + esc(srvErr) + ' — 이 기기에 저장된 교재만 보여요.</div>' : '';
  all.forEach(it => {
    const rec = it.rec, d = new Date(it.date), ds = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    const row = document.createElement('div'); row.className = 'ce-row'; row.style.display = 'block';
    const kinds = [['teacher', '강사용', rec && rec.teacher, it.sT], ['student', '학생용', rec && rec.student, it.sS]].filter(k => k[2] || k[3]);
    const st = kinds.map(k => '<div style="margin:3px 0;">' + k[1] + ' ' + mb(k[2] ? k[2].size : k[3].size) + ' &nbsp; ' + (k[2] ? '<span style="color:#145A32;font-weight:700;">📱 이 기기 저장됨</span>' : '<span class="muted">이 기기 없음</span>') + ' &nbsp; ' + (k[3] ? '<span style="color:#145A32;font-weight:700;">☁ 서버 보관됨</span>' : '<span style="color:#B45309;font-weight:700;">☁ 서버 보관 안 됨</span>') + '</div>').join('');
    row.innerHTML = '<div><b>' + esc(it.name) + '</b> <span class="muted">' + ds + (rec && rec.cover ? ' · 표지 정보 저장됨' : '') + '</span></div>' + st;
    const bar = document.createElement('div'); bar.style.cssText = 'margin-top:6px;';
    if (rec) { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn primary'; b.style.marginRight = '6px'; b.textContent = '🎨 표지 수정'; b.onclick = () => openEditor(rec); bar.appendChild(b); }
    kinds.forEach(k => {
      if (k[2] && !k[3]) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.style.marginRight = '6px'; b.textContent = '☁ ' + k[1] + ' 서버에 보관';
        b.onclick = async () => {
          if (k[2].size > 150e6) { alert(k[1] + ' 파일이 150MB를 넘어서 서버에 보관할 수 없어요.'); return; }
          b.disabled = true;
          try { await serverUpload({ id: it.id, name: it.name }, k[0], k[2], (i, n) => { b.textContent = '☁ 올리는 중... ' + i + '/' + n; }); alert(k[1] + ' 서버 보관 완료'); } catch (e) { alert('서버 보관을 못 했어요: ' + e.message); }
          renderList(true);
        };
        bar.appendChild(b);
      }
      if (!k[2] && k[3]) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.style.marginRight = '6px'; b.textContent = '📱 ' + k[1] + ' 이 기기로 내려받아 저장';
        b.onclick = async () => {
          b.disabled = true;
          try { const blob = await serverDownload(k[3].fileId, (i, n) => { b.textContent = '받는 중... ' + i + '/' + n; }); const cur = (await mergeDbAll()).find(x => x.id === it.id) || { id: it.id, name: it.name, date: it.date }; cur[k[0]] = blob; await mergeDbPut(cur); blobDl(blob, it.name + ' (QR ' + (k[0] === 'teacher' ? '강사용 전체' : '학생용') + ').pdf'); } catch (e) { alert('내려받지 못했어요: ' + e.message); }
          renderList();
        };
        bar.appendChild(b);
      }
    });
    row.appendChild(bar); box.appendChild(row);
  });
  const want = new URLSearchParams(location.search).get('id'); if (want && !REC) { const r = local.find(x => x.id === want); if (r) openEditor(r); }
}

function paint() {
  const cv = $('pv'); if (!COV) return;
  cv.width = COV.canvas.width; cv.height = COV.canvas.height; cv.getContext('2d').drawImage(COV.canvas, 0, 0);
  const stage = $('stage'), k = stage.clientWidth / COV.pw;
  let el = $('badge'); if (!el) { el = document.createElement('img'); el.id = 'badge'; el.className = 'ce-badge'; stage.appendChild(el); bindDrag(el); }
  el.src = BD[KIND].toDataURL('image/png');
  el.style.width = ST.wd * k + 'px'; el.style.left = ST.x * k + 'px'; el.style.top = ST.top * k + 'px';
  $('ce-szv').textContent = Math.round(ST.wd); $('ce-sz').value = ST.wd;
}
function bindDrag(el) {
  let drag = null;
  el.onpointerdown = e => { drag = { sx: e.clientX, sy: e.clientY, x: ST.x, top: ST.top }; el.setPointerCapture(e.pointerId); e.preventDefault(); };
  el.onpointermove = e => { if (!drag) return; const k = $('stage').clientWidth / COV.pw, hh = ST.wd * 150 / 440; ST.x = Math.max(0, Math.min(COV.pw - ST.wd, drag.x + (e.clientX - drag.sx) / k)); ST.top = Math.max(0, Math.min(COV.ph - hh, drag.top + (e.clientY - drag.sy) / k)); paint(); };
  el.onpointerup = el.onpointercancel = () => { drag = null; };
}
function setAuto(a) { AUTO = a; }
function applyAuto() {
  if (AUTO && AUTO.x + 72 <= COV.pw - 12) { ST.wd = Math.min(ST.wd, COV.pw - 12 - AUTO.x); const hh = ST.wd * 150 / 440; ST.x = AUTO.x; ST.top = AUTO.cy - hh / 2; }      // 자리가 모자라면 표시를 줄여서 제목 옆에 맞춘다
  else { ST.x = 20; ST.top = 14; }
  paint();
}

// 원본 PDF의 첫 쪽 → 표지 그림 + 제목 오른쪽 자리
async function coverFromPdfDoc(doc) {
  const pg = await doc.getPage(1), vp1 = pg.getViewport({ scale: 1 }), vp = pg.getViewport({ scale: 3 });
  const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
  const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); await pg.render({ canvasContext: cx, viewport: vp }).promise;
  let auto = null;
  try {
    const tc = await pg.getTextContent(), its = tc.items.filter(it => (it.str || '').trim() && (it.height || 0) >= 30), hmax = Math.max.apply(null, its.map(it => it.height).concat([0])), row = its.filter(it => it.height >= hmax * 0.9);
    if (row.length) auto = { x: Math.max.apply(null, row.map(it => it.transform[4] + it.width)) + 16, cy: vp1.height - (row[0].transform[5] + row[0].height * 0.33) };
    else { const ps = await BankCore.coverTitleSpotByPixels(doc); if (ps) auto = { x: ps.right + 16, cy: vp1.height - ps.cy }; }
  } catch (e) {}
  return { canvas: cv, pw: vp1.width, ph: vp1.height, auto: auto };
}
function loadImg(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('표지 그림을 읽지 못했어요')); im.src = src; }); }

function copts() { const c = +$('ce-ccols').value; return { fs: +$('ce-cfs').value / 100, row: +$('ce-crow').value / 100, cols: c || 0, dy: +$('ce-cdy').value, logo: { main: $('ce-lmain').value, sub: $('ce-lsub').value, chip: $('ce-lchip').value } }; }
function regenGen() {      // 목차 칸만 바꿀 때: 표지를 다시 그리되 표시 위치는 그대로 둔다
  if (!REC || !REC.cover || !COV) return; const c = REC.cover;
  $('ce-cfsv').textContent = $('ce-cfs').value; $('ce-crowv').textContent = $('ce-crow').value; $('ce-cdyv').textContent = $('ce-cdy').value;
  COV.canvas = coverCanvas($('ce-name').value.trim() || REC.name, c.secs, COV.pw, COV.ph, $('ce-design').value, $('ce-color').value, copts()); paint();
}
async function setSource(kind) {
  const m = $('ce-msg'); m.textContent = '';
  $('gen-box').style.display = kind === 'gen' ? '' : 'none'; $('file-box').style.display = kind === 'file' ? '' : 'none';
  try {
    if (kind === 'stored') {
      const c = REC.cover; const im = await loadImg(c.png), cv = document.createElement('canvas'); cv.width = im.width; cv.height = im.height; cv.getContext('2d').drawImage(im, 0, 0);
      COV = { canvas: cv, pw: c.pw, ph: c.ph };
      setAuto(c.auto || null); ST.wd = (c.spot && c.spot.wd) || 150;
      if (c.spot) { ST.x = c.spot.x; ST.top = c.spot.top; paint(); } else applyAuto();
    } else if (kind === 'gen') {
      const c = REC.cover, W = c.pw, H = c.ph;
      const cv = coverCanvas($('ce-name').value.trim() || REC.name, c.secs, W, H, $('ce-design').value, $('ce-color').value, copts()), T = window._coverTitle;
      COV = { canvas: cv, pw: W, ph: H }; ST.wd = Math.min(150, W * 0.28);
      setAuto(T ? { x: T.right + 16, cy: T.baseline - T.size * 0.33 } : null); applyAuto();
    } else if (kind === 'file') { if (COV && COV._file) { paint(); return; } m.textContent = '위 칸에서 원본 교재 PDF를 골라 주세요.'; }
  } catch (e) { m.innerHTML = '<span style="color:#C1392B;">' + esc(e.message || e) + '</span>'; }
}

async function openEditor(rec) {
  REC = rec; $('editor').style.display = ''; $('ed-title').textContent = '🎨 ' + rec.name; COV = null;
  BD.t = badgeCanvas('강사용', '#c8102e'); BD.s = badgeCanvas('학생용', '#1f4e9c');
  const has = !!(rec.cover && rec.cover.png), canGen = !!(rec.cover && rec.cover.secs && rec.cover.secs.length);
  $('src-stored').disabled = !has; $('stored-note').textContent = has ? '' : '(이 교재는 표지를 따로 저장해 두지 않았어요 — 아래에서 원본 교재 PDF를 골라 주세요)';
  $('src-gen').disabled = !canGen; $('gen-note').textContent = canGen ? '' : '(이 교재는 단원 정보가 없어 새로 만들 수 없어요)';
  $('ce-name').value = rec.name.replace(/\s*\(?(문제편|정답편|최신판|초판).*$/, '').trim() || rec.name;
  const first = has ? 'stored' : 'file'; document.querySelector('input[name=src][value=' + first + ']').checked = true;
  await setSource(first); $('editor').scrollIntoView({ behavior: 'smooth' });
}

async function applyEdit() {
  const ok = $('ce-ok'), m = $('ce-msg'); if (!COV || !REC) return; ok.disabled = true;
  try {
    const png = COV.canvas.toDataURL('image/png'), out = {};
    for (const kind of ['teacher', 'student']) {
      if (!REC[kind]) continue;
      m.textContent = (kind === 'teacher' ? '강사용' : '학생용') + ' 교재의 표지를 바꾸는 중... (큰 파일은 1분 정도 걸려요)';
      const d = await PDFLib.PDFDocument.load(await REC[kind].arrayBuffer(), { ignoreEncryption: true });
      const sz0 = d.getPage(0).getSize(), np = d.insertPage(0, [sz0.width, sz0.height]);
      np.drawImage(await d.embedPng(png), { x: 0, y: 0, width: sz0.width, height: sz0.height }); d.removePage(1);
      const hh = ST.wd * 150 / 440, sx = sz0.width / COV.pw, sy = sz0.height / COV.ph;
      np.drawImage(await d.embedPng((kind === 'teacher' ? BD.t : BD.s).toDataURL('image/png')), { x: ST.x * sx, y: sz0.height - (ST.top + hh) * sy, width: ST.wd * sx, height: hh * sy });
      out[kind] = new Blob([await d.save()], { type: 'application/pdf' });
    }
    const cover = Object.assign({}, REC.cover || {}, { png: png, pw: COV.pw, ph: COV.ph, spot: { x: ST.x, top: ST.top, wd: ST.wd }, auto: AUTO });
    const nrec = Object.assign({}, REC, { teacher: out.teacher || REC.teacher, student: out.student || REC.student, cover: cover });
    await mergeDbPut(nrec); REC = nrec;
    if (out.teacher) blobDl(out.teacher, REC.name + ' (QR 강사용 전체).pdf');
    if (out.student) setTimeout(() => blobDl(out.student, REC.name + ' (QR 학생용).pdf'), 1200);
    m.innerHTML = '✅ 표지를 바꿔서 이 기기의 저장본도 새로 저장했고, 내려받았어요. <span class="muted">(서버에 보관해 둔 파일은 그대로예요. 표지를 고친 뒤 「교재 QR 합본 만들기」의 저장 목록에서 다시 서버에 보관해 주세요)</span>';
    renderList();
  } catch (e) { m.innerHTML = '<span style="color:#C1392B;">표지를 바꾸지 못했어요: ' + esc(e.message || e) + '</span>'; }
  ok.disabled = false;
}

(() => {
  pdfjsLib.GlobalWorkerOptions.workerSrc = new URL('js/vendor/pdf.worker.min.js', location.href).href;
  renderList();
  document.querySelectorAll('input[name=src]').forEach(r => r.addEventListener('change', () => setSource(r.value)));
  document.querySelectorAll('input[name=pv-kind]').forEach(r => r.addEventListener('change', () => { KIND = r.value; paint(); }));
  ['ce-name', 'ce-design', 'ce-color'].forEach(id => { const e = $(id); const f = () => { if (document.querySelector('input[name=src]:checked').value === 'gen') { const x0 = ST.x, t0 = ST.top; setSource('gen'); } }; e.addEventListener('input', f); e.addEventListener('change', f); });
  ['ce-cfs', 'ce-crow', 'ce-cdy'].forEach(id => $(id).addEventListener('input', regenGen)); $('ce-ccols').addEventListener('change', regenGen);
  const LOGO0 = { main: '이은정 과학', sub: 'MIDDLE SCHOOL SCIENCE · EXAM PREP', chip: '' };
  const setLogo = l => { $('ce-lmain').value = l.main; $('ce-lsub').value = l.sub; $('ce-lchip').value = l.chip || ''; };
  setLogo(Object.assign({}, LOGO0, savedCoverLogo() || {}));
  ['ce-lmain', 'ce-lsub', 'ce-lchip'].forEach(id => $(id).addEventListener('input', regenGen));
  $('ce-lsave').onclick = () => { try { localStorage.setItem('cover_logo', JSON.stringify({ main: $('ce-lmain').value, sub: $('ce-lsub').value, chip: $('ce-lchip').value })); $('ce-lmsg').textContent = '✅ 저장했어요. 새로 만드는 표지에도 이 로고가 쓰여요.'; } catch (e) { $('ce-lmsg').textContent = '저장하지 못했어요(브라우저 저장 공간 문제)'; } };
  $('ce-lreset').onclick = () => { try { localStorage.removeItem('cover_logo'); } catch (e) {} setLogo(LOGO0); regenGen(); $('ce-lmsg').textContent = '↩ 원래 로고로 되돌렸어요.'; };
  $('ce-creset').onclick = () => { $('ce-cfs').value = 100; $('ce-crow').value = 100; $('ce-cdy').value = 0; $('ce-ccols').value = '0'; regenGen(); };
  $('ce-sz').addEventListener('input', e => { ST.wd = +e.target.value; paint(); });
  $('ce-auto').onclick = applyAuto; $('ce-tl').onclick = () => { ST.x = 20; ST.top = 14; paint(); };
  $('ce-close').onclick = () => { $('editor').style.display = 'none'; };
  $('ce-ok').onclick = applyEdit;
  $('ce-file').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return; const m = $('ce-msg'); m.textContent = '표지를 읽는 중...';
    try {
      const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise, c = await coverFromPdfDoc(doc);
      COV = { canvas: c.canvas, pw: c.pw, ph: c.ph, _file: true }; ST.wd = Math.min(150, c.pw * 0.28); setAuto(c.auto); applyAuto(); m.textContent = '';
      // 원본 목차에서 단원 정보도 읽어 둔다 → 이미 만든 교재도 「새 표지 만들기」(목차 칸·로고 포함)를 쓸 수 있다
      try {
        m.textContent = '원본 목차에서 단원 정보를 읽는 중...';
        const toc = await BankCore.parseBookToc(doc, 8), raw = (toc && toc.sections) || [];
        const secs = raw.filter(x => raw.filter(o => o !== x && o.qa >= x.qa && o.qb <= x.qb && o.aa >= x.aa && o.ab <= x.ab).length < 2).map((x, i) => ({ name: x.name, tag: x.tag, unit: x.unit, unitName: x.unitName, order: i + 1, qa: x.qa, qb: x.qb, aa: x.aa, ab: x.ab }));
        REC.cover = Object.assign({}, REC.cover || {}, { pw: c.pw, ph: c.ph, secs: secs.length ? secs : (REC.cover && REC.cover.secs) || [] });
        const ok = REC.cover.secs.length > 0; $('src-gen').disabled = !ok; $('gen-note').textContent = ok ? '(원본 목차에서 단원 ' + REC.cover.secs.length + '개를 읽었어요)' : '(원본에서 목차를 찾지 못해 새로 만들 수 없어요)';
        m.textContent = '';
      } catch (e2) { m.textContent = ''; }
    } catch (er) { m.innerHTML = '<span style="color:#C1392B;">표지를 읽지 못했어요: ' + esc(er.message || er) + '</span>'; }
  });
  window.addEventListener('resize', paint);
})();
</script>
